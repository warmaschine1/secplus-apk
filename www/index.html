ostępne narzędzia pozwalają przeprowadzić ARP poisoning bez dużej wiedzy, ale „unskilled attacker” opisuje poziom umiejętności, a nie relację sprawcy z organizacją. Kontekst wewnętrznego hosta i lokalnego celu mocniej wskazuje C.","options":[{"letter":"A","text":"Unskilled attacker"},{"letter":"B","text":"Shadow IT"},{"letter":"C","text":"Insider threat"},{"letter":"D","text":"Nation-state"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":566,"question":"A user needs to complete training at https://comptiatraining.com. After manually entering the URL, the user sees that the accessed website is noticeably different from the standard company website. Which of the following is the most likely explanation for the difference?","keyword":"A manually mistyped domain leads to a look-alike website -> Typosquatting","correct_raw":"C. Typosquatting","explanation":"Typosquatting polega na rejestrowaniu domen podobnych do prawidłowej nazwy, wykorzystujących typowe literówki, zamianę znaków albo pominięcie litery. Użytkownik ręcznie wpisujący adres może trafić na fałszywą stronę, która wygląda inaczej lub próbuje wyłudzić dane. XSS jest wstrzyknięciem skryptu do strony, pretexting tworzy fałszywą historię, a vishing odbywa się przez rozmowę głosową.","options":[{"letter":"A","text":"Cross-site scripting"},{"letter":"B","text":"Pretexting"},{"letter":"C","text":"Typosquatting"},{"letter":"D","text":"Vishing"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":567,"question":"A company has yearly engagements with a service provider. The general terms and conditions are the same for all engagements. The company wants to simplify the process and revisit the general terms every three years. Which of the following documents would provide the best way to set the general terms?","keyword":"Set reusable overarching terms for multiple future engagements -> MSA","correct_raw":"A. MSA","explanation":"Master Service Agreement ustanawia ogólne warunki współpracy obowiązujące przy wielu kolejnych zleceniach, np. odpowiedzialność, płatności, poufność, własność intelektualną i rozwiązywanie sporów. Poszczególne roczne prace można później opisywać w osobnych SOW bez ponownego negocjowania całej podstawy umownej. NDA dotyczy poufności, MOU ogólnego porozumienia stron, a SLA poziomów i parametrów świadczenia usługi.","options":[{"letter":"A","text":"MSA"},{"letter":"B","text":"NDA"},{"letter":"C","text":"MOU"},{"letter":"D","text":"SLA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":568,"question":"While updating the security awareness training, a security analyst wants to address issues created if vendors' email accounts are compromised. Which of the following recommendations should the security analyst include in the training?","keyword":"A compromised vendor account makes a malicious message appear to come from a trusted sender -> Unexpected familiar requests","correct_raw":"D. Be alert to unexpected requests from familiar email addresses","explanation":"Po przejęciu skrzynki dostawcy napastnik wysyła wiadomości z prawdziwego, znanego adresu i może odwoływać się do wcześniejszej korespondencji. Sam fakt, że nadawca jest znajomy, nie potwierdza więc autentyczności żądania. Pracownicy powinni zwracać uwagę na nietypowe prośby o płatność, zmianę rachunku, przesłanie danych albo pilne działanie i potwierdzać je innym kanałem. Wymuszanie załączników może wręcz zwiększyć ryzyko, a pozostałe odpowiedzi nie rozwiązują problemu przejętego, legalnego konta dostawcy.","options":[{"letter":"A","text":"Refrain from clicking on images included in emails from new vendors"},{"letter":"B","text":"Delete emails from unknown service provider partners."},{"letter":"C","text":"Require that invoices be sent as attachments"},{"letter":"D","text":"Be alert to unexpected requests from familiar email addresses"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":569,"question":"A new corporate policy requires all staff to use multifactor authentication to access company resources. Which of the following can be utilized to set up this form of identity and access management? (Choose two.)","keyword":"Combine possession and inherence factors -> Authentication tokens and biometrics","correct_raw":"A. Authentication tokens oraz C. Biometrics","explanation":"Authentication token reprezentuje coś, co użytkownik posiada, a biometria coś, czym użytkownik jest. Połączenie tych mechanizmów z hasłem lub ze sobą może zapewnić co najmniej dwa różne czynniki uwierzytelniania. Least privilege dotyczy autoryzacji, LDAP jest protokołem katalogowym, password vaulting służy do bezpiecznego przechowywania i zarządzania poświadczeniami, a SAML jest mechanizmem federacji i przekazywania asercji. Same LDAP, vaulting lub SAML nie stanowią automatycznie drugiego czynnika.","options":[{"letter":"A","text":"Authentication tokens"},{"letter":"B","text":"Least privilege"},{"letter":"C","text":"Biometrics"},{"letter":"D","text":"LDAP"},{"letter":"E","text":"Password vaulting"},{"letter":"F","text":"SAML"}],"correctLetters":["A","C"],"isPBQ":false,"multiSelect":true},{"id":570,"question":"A help desk employee receives a call from someone impersonating the Chief Executive Officer. The caller asks for assistance with resetting a password. Which of the following best describes this event?","keyword":"Use a voice call and impersonation to manipulate the help desk -> Vishing","correct_raw":"A. Vishing","explanation":"Vishing jest phishingiem realizowanym przez komunikację głosową. Napastnik dzwoni do help desku, podszywa się pod CEO i próbuje nakłonić pracownika do resetu hasła. Impersonation jest elementem techniki, ale nie znajduje się wśród odpowiedzi; kanałem i najbardziej trafną kategorią zdarzenia jest vishing. Hacktivism opisuje motywację polityczną lub społeczną, blackmail wymuszenie groźbą, a misinformation rozpowszechnianie fałszywych informacji.","options":[{"letter":"A","text":"Vishing"},{"letter":"B","text":"Hacktivism"},{"letter":"C","text":"Blackmail"},{"letter":"D","text":"Misinformation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":571,"question":"The number of tickets the help desk has been receiving has increased recently due to numerous false-positive phishing reports. Which of the following would be best to help to reduce the false positives?","keyword":"Teach users how to distinguish suspicious messages from legitimate communication -> Security awareness training","correct_raw":"B. Improving security awareness training","explanation":"Problemem nie jest brak możliwości zgłaszania wiadomości, lecz duża liczba błędnych zgłoszeń. Lepsze szkolenie powinno nauczyć pracowników rozpoznawać rzeczywiste oznaki phishingu, sprawdzać nadawcę, domenę, treść żądania, linki i kontekst biznesowy. Więcej kampanii bez wcześniejszego uzupełnienia wiedzy może jedynie zwiększyć liczbę zgłoszeń. Zatrudnienie dodatkowych pracowników help desku lub utworzenie strony zgłoszeniowej usprawni obsługę, ale nie zmniejszy liczby fałszywych alarmów.","options":[{"letter":"A","text":"Performing more phishing simulation campaigns"},{"letter":"B","text":"Improving security awareness training"},{"letter":"C","text":"Hiring more help desk staff"},{"letter":"D","text":"Implementing an incident reporting web page"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":572,"question":"An organization that handles sensitive information wants to protect the information by using a reversible technology. Which of the following best satisfies this requirement?","keyword":"Replace sensitive data with a token that can be mapped back to the original value -> Tokenization","correct_raw":"C. Tokenization","explanation":"Tokenization zastępuje dane wrażliwe losowym lub nieznaczącym tokenem. Oryginalna wartość jest przechowywana w bezpiecznym token vault, dzięki czemu uprawniony system może odwrócić proces i odzyskać dane. Hashing jest z założenia jednokierunkowy. HSM bezpiecznie przechowuje i wykorzystuje klucze kryptograficzne, ale sam nie jest technologią zastępowania danych. Steganografia ukrywa istnienie danych, lecz nie jest najlepszym mechanizmem ochrony danych w tym scenariuszu.","options":[{"letter":"A","text":"Hardware security module"},{"letter":"B","text":"Hashing algorithm"},{"letter":"C","text":"Tokenization"},{"letter":"D","text":"Steganography"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":573,"question":"A systems administrator needs to encrypt all data on employee laptops. Which of the following encryption levels should be implemented?","keyword":"Protect the entire laptop storage, including all partitions and files -> Full-disk encryption","correct_raw":"C. Full disk","explanation":"Full-disk encryption zabezpiecza cały nośnik laptopa, a nie tylko wybrany plik, katalog, partycję lub wolumin. Po wyłączeniu urządzenia dane na dysku pozostają nieczytelne bez właściwego klucza lub uwierzytelnienia. Szyfrowanie plików, partycji albo pojedynczych woluminów może pozostawić inne obszary nośnika bez ochrony.","options":[{"letter":"A","text":"Volume"},{"letter":"B","text":"Partition"},{"letter":"C","text":"Full disk"},{"letter":"D","text":"File"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":574,"question":"Which of the following actions best addresses a vulnerability found on a company's web server?","keyword":"Remove the underlying flaw by applying the vendor fix -> Patching","correct_raw":"A. Patching","explanation":"Jeżeli producent udostępnił poprawkę, patching usuwa lub naprawia samą podatność i jest najbardziej bezpośrednią remediacją. Segmentacja może ograniczyć zakres skutków, a monitoring pomóc wykrywać próby wykorzystania, lecz nie usuwają luki. Decommissioning byłby właściwy tylko wtedy, gdy serwer jest zbędny albo nie można go bezpiecznie utrzymać.","options":[{"letter":"A","text":"Patching"},{"letter":"B","text":"Segmentation"},{"letter":"C","text":"Decommissioning"},{"letter":"D","text":"Monitoring"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":575,"question":"A company is changing its mobile device policy. The company has the following requirements:\n\n• Company-owned devices\n• Ability to harden the devices\n• Reduced security risk\n• Compatibility with company resources\n\nWhich of the following would best meet these requirements?","keyword":"Company owns and fully controls devices used only for business -> COBO","correct_raw":"D. COBO","explanation":"COBO oznacza Corporate-Owned, Business-Only. Organizacja kupuje urządzenie, wybiera zgodny model, wprowadza pełny hardening i ogranicza jego użycie do celów służbowych. Daje to największą kontrolę oraz najniższe ryzyko spośród podanych modeli. COPE również oznacza urządzenie firmowe, ale dopuszcza użycie prywatne, co zwiększa powierzchnię ryzyka. BYOD dotyczy urządzeń prywatnych, a CYOD pozwala użytkownikowi wybrać urządzenie z zatwierdzonej listy.","options":[{"letter":"A","text":"BYOD"},{"letter":"B","text":"CYOD"},{"letter":"C","text":"COPE"},{"letter":"D","text":"COBO"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":576,"question":"A company is concerned about employees unintentionally introducing malware into the network. The company identified fifty employees who clicked on a link embedded in an email sent by the internal IT department. Which of the following should the company implement to best improve its security posture?","keyword":"Users already failed an internal phishing-style test and need corrective education -> Social engineering training","correct_raw":"A. Social engineering training","explanation":"Wiadomość wysłana przez wewnętrzny dział IT z osadzonym linkiem pełniła funkcję testu zachowania pracowników. Wynik wskazał konkretną lukę: użytkownicy klikają podejrzane odnośniki. Najlepszym następnym krokiem jest szkolenie z rozpoznawania socjotechniki i phishingu. Kolejna symulacja może później zmierzyć skuteczność szkolenia, ale sama nie usuwa wykazanego braku wiedzy. SPF chroni przed częścią podszywania się pod domeny pocztowe, lecz wiadomość została wysłana przez wewnętrzny dział IT. Insider threat awareness dotyczy zagrożeń pochodzących od osób wewnętrznych, a nie przede wszystkim nieświadomego kliknięcia.","options":[{"letter":"A","text":"Social engineering training"},{"letter":"B","text":"SPF configuration"},{"letter":"C","text":"Simulated phishing campaign"},{"letter":"D","text":"Insider threat awareness"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":577,"question":"A penetration test identifies that an SMBv1 is enabled on multiple servers across an organization. The organization wants to remediate this vulnerability in the most efficient way possible. Which of the following should the organization use for this purpose?","keyword":"Centrally disable a legacy Windows protocol across many domain systems -> GPO","correct_raw":"A. GPO","explanation":"Group Policy Object pozwala centralnie wdrożyć ustawienie wyłączające SMBv1 na wielu systemach Windows należących do domeny. Jest to znacznie bardziej efektywne i spójne niż ręczna zmiana każdego serwera. ACL kontroluje dostęp do zasobów, SFTP jest bezpiecznym protokołem przesyłania plików, a DLP ogranicza wycieki danych.","options":[{"letter":"A","text":"GPO"},{"letter":"B","text":"ACL"},{"letter":"C","text":"SFTP"},{"letter":"D","text":"DLP"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":578,"question":"Which of the following best protects sensitive data in transit across a geographically dispersed infrastructure?","keyword":"Protect data while it crosses untrusted or distant networks -> Encryption","correct_raw":"A. Encryption","explanation":"Szyfrowanie chroni poufność danych przesyłanych pomiędzy rozproszonymi lokalizacjami, np. za pomocą TLS, IPSec lub szyfrowanego VPN. Nawet jeżeli ruch zostanie przechwycony, bez klucza powinien pozostać nieczytelny. Masking ukrywa część prezentowanej wartości, tokenization zastępuje dane tokenami, a obfuscation utrudnia zrozumienie kodu lub informacji, lecz nie są podstawową ochroną transmisji.","options":[{"letter":"A","text":"Encryption"},{"letter":"B","text":"Masking"},{"letter":"C","text":"Tokenization"},{"letter":"D","text":"Obfuscation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":579,"question":"As part of new compliance audit requirements, multiple servers need to be segmented on different networks and should be reachable only from authorized internal systems. Which of the following would meet the requirements?","keyword":"Force administrative access through one controlled internal gateway -> Jump server","correct_raw":"D. Deploy an internal jump server to access resources.","explanation":"Serwery mają znajdować się w odseparowanych sieciach i być osiągalne wyłącznie z autoryzowanych systemów wewnętrznych. Jump server, czyli bastion host, stanowi jeden kontrolowany punkt dostępu do chronionych segmentów. Reguły sieciowe mogą pozwolić na połączenia do serwerów tylko z adresu jump servera, a użytkownicy najpierw uwierzytelniają się na nim. Ułatwia to stosowanie MFA, rejestrowanie sesji i ograniczenie bezpośredniego dostępu. Odpowiedź A blokuje jedynie dostęp zewnętrzny; nie zapewnia, że spośród systemów wewnętrznych tylko uprawnione hosty będą mogły łączyć się z serwerami. W pełnej architekturze jump server powinien być wsparty firewallami lub ACL między segmentami, ale spośród podanych odpowiedzi D najlepiej realizuje wymaganie dostępu tylko z autoryzowanego systemu wewnętrznego.","options":[{"letter":"A","text":"Configure firewall rules to block external access to Internal resources."},{"letter":"B","text":"Set up a WAP to allow internal access from public networks."},{"letter":"C","text":"Implement a new IPSec tunnel from internal resources."},{"letter":"D","text":"Deploy an internal jump server to access resources."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":580,"question":"Which of the following activities should be performed first to compile a list of vulnerabilities in an environment?","keyword":"Build an initial inventory of known weaknesses across many systems -> Automated vulnerability scanning","correct_raw":"A. Automated scanning","explanation":"Automatyczne skanowanie podatności jest najszybszym i najbardziej skalowalnym pierwszym krokiem do utworzenia listy znanych luk w środowisku. Skaner identyfikuje hosty, usługi, wersje, brakujące poprawki i konfiguracje powiązane ze znanymi podatnościami. Penetration testing i adversarial emulation próbują wykorzystać lub odtworzyć ataki i zwykle następują po podstawowej identyfikacji podatności. Threat hunting szuka oznak aktywnego lub ukrytego zagrożenia, a log aggregation centralizuje dane, lecz sama nie tworzy kompletnej listy podatności.","options":[{"letter":"A","text":"Automated scanning"},{"letter":"B","text":"Penetration testing"},{"letter":"C","text":"Threat hunting"},{"letter":"D","text":"Log aggregation"},{"letter":"E","text":"Adversarial emulation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":581,"question":"Which of the following can be used to mitigate attacks from high-risk regions?","keyword":"Identify and filter traffic based on the geographic origin of IP addresses -> IP geolocation","correct_raw":"C. IP geolocation","explanation":"IP geolocation pozwala określić przybliżony kraj lub region pochodzenia adresu IP i wykorzystać tę informację w regułach firewalla, WAF lub innych systemów bezpieczeństwa. Organizacja może blokować albo dodatkowo kontrolować ruch z regionów uznanych za wysokiego ryzyka. Mechanizm nie jest całkowicie niezawodny, ponieważ napastnik może korzystać z VPN, proxy lub przejętej infrastruktury w innym kraju, ale spośród podanych odpowiedzi najlepiej odpowiada wymaganiu. Data sovereignty dotyczy miejsca przechowywania i przetwarzania danych, a encryption oraz obfuscation nie filtrują ruchu według regionu.","options":[{"letter":"A","text":"Obfuscation"},{"letter":"B","text":"Data sovereignty"},{"letter":"C","text":"IP geolocation"},{"letter":"D","text":"Encryption"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":582,"question":"A program manager wants to ensure contract employees can only access the company's computers Monday through Friday from 9 a m. to 5 p.m. Which of the following would best enforce this access control?","keyword":"Centrally restrict domain logon hours for a defined group of users -> GPO time-of-day restrictions","correct_raw":"A. Creating a GPO for all contract employees and setting time-of-day log-in restrictions","explanation":"GPO pozwala centralnie wdrożyć ograniczenia godzin logowania dla kont kontraktorów, tak aby dostęp był dozwolony wyłącznie od poniedziałku do piątku w godzinach 9:00-17:00. Pozostałe odpowiedzi mogą wspierać uwierzytelnianie, federację lub ograniczenie uprawnień, ale nie realizują bezpośrednio wymaganego harmonogramu dostępu.","options":[{"letter":"A","text":"Creating a GPO for all contract employees and setting time-of-day log-in restrictions"},{"letter":"B","text":"Creating a discretionary access policy and setting rule-based access for contract employees"},{"letter":"C","text":"Implementing an OAuth server and then setting least privilege for contract employees"},{"letter":"D","text":"Implementing SAML with federation to the contract employees’ authentication server"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":583,"question":"A recent power outage halted operations at a company's only data center. Which of the following solutions would best prevent an event like this one in the future?","keyword":"Provide alternate power during a utility outage -> Generator","correct_raw":"B. Generator","explanation":"Generator zapewnia alternatywne źródło zasilania podczas dłuższej awarii sieci energetycznej i pozwala utrzymać działanie centrum danych po wyczerpaniu lub przejęciu obciążenia z UPS. Platform diversity, snapshots i load balancing nie rozwiązują przyczyny incydentu, którą był brak zasilania w jedynym centrum danych.","options":[{"letter":"A","text":"Platform diversity"},{"letter":"B","text":"Generator"},{"letter":"C","text":"Snapshots"},{"letter":"D","text":"Load balancing"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":584,"question":"Which of the following analysis methods allows an organization to measure the exposure factor associated with organizational assets?","keyword":"Express asset loss as a measurable percentage or monetary value -> Quantitative analysis","correct_raw":"B. Quantitative","explanation":"Exposure factor określa procent wartości zasobu, który prawdopodobnie zostanie utracony w wyniku pojedynczego zdarzenia. Jest wykorzystywany w analizie ilościowej, np. przy obliczaniu SLE: Asset Value x Exposure Factor. Metody heurystyczne, użytkowe i trendowe nie są podstawowym sposobem wyrażania EF jako mierzalnej wartości.","options":[{"letter":"A","text":"Heuristic"},{"letter":"B","text":"Quantitative"},{"letter":"C","text":"User-driven"},{"letter":"D","text":"Trend-based"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":585,"question":"A security analyst notices an increase in port scans on the edge of the corporate network. Which of the following logs should the analyst check to obtain the attacker’s source IP address?","keyword":"Inspect edge connection attempts and their source addresses -> Firewall logs","correct_raw":"B. Firewall","explanation":"Firewall na brzegu sieci rejestruje próby połączeń, w tym źródłowy adres IP, docelowy adres, port, protokół i decyzję allow lub deny. Jest więc najlepszym źródłem do ustalenia adresu skanującego. Logi systemu operacyjnego, aplikacji i endpointu mogą zawierać część zdarzeń, ale nie zapewniają tak pełnego obrazu skanowania na granicy całej sieci.","options":[{"letter":"A","text":"OS security"},{"letter":"B","text":"Firewall"},{"letter":"C","text":"Application"},{"letter":"D","text":"Endpoint"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":586,"question":"A security team receives reports about high latency and complete network unavailability throughout most of the office building. Flow logs from the campus switches show high traffic on TCP 445. Which of the following is most likely the root cause of this incident?","keyword":"Rapid self-propagation over SMB creates large amounts of TCP 445 traffic -> Worm","correct_raw":"C. Worm","explanation":"TCP 445 jest używany przez SMB. Bardzo duży ruch na tym porcie w wielu częściach sieci, połączony z opóźnieniami i niedostępnością, wskazuje na robaka próbującego automatycznie rozprzestrzeniać się między hostami przez SMB. Skutkiem może być efekt podobny do DoS, ale root cause jest bardziej konkretny: samoreplikujący się worm. NTP amplification wykorzystuje zwykle UDP 123, a buffer overflow jest klasą podatności, nie opisem wzorca masowego ruchu na TCP 445.","options":[{"letter":"A","text":"Buffer overflow"},{"letter":"B","text":"NTP amplification attack"},{"letter":"C","text":"Worm"},{"letter":"D","text":"DoS attack"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":587,"question":"A security analyst is examining a penetration test report and notices that the tester pivoted to critical internal systems with the same local user ID and password. Which of the following would help prevent this in the future?","keyword":"Eliminate reused local credentials by managing identities and password policy centrally -> Centralized authentication","correct_raw":"A. Implement centralized authentication with proper password policies","explanation":"Tester wykorzystał te same lokalne poświadczenia na wielu systemach, co umożliwiło lateral movement. Scentralizowane uwierzytelnianie pozwala zarządzać kontami, hasłami, blokadami i dostępem z jednego miejsca oraz ogranicza potrzebę utrzymywania identycznych lokalnych kont na wielu hostach. Sama złożoność i historia haseł nie zapobiegną ponownemu użyciu tego samego silnego hasła. Zewnętrzny serwer uwierzytelniania jest mniej precyzyjnym opisem i nie gwarantuje właściwych zasad. Ograniczenie zmiany haseł pogorszyłoby sytuację.","options":[{"letter":"A","text":"Implement centralized authentication with proper password policies"},{"letter":"B","text":"Add password complexity rules and increase password history limits"},{"letter":"C","text":"Connect the systems to an external authentication server"},{"letter":"D","text":"Limit the ability of user accounts to change passwords"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":588,"question":"When used with an access control vestibule which of the following would provide the best prevention against tailgating?","keyword":"A human verifies that only one authorized person passes through the vestibule -> Security guard","correct_raw":"C. Security guard","explanation":"Access control vestibule ogranicza przejście do jednej osoby, ale najlepiej przeciwdziała tailgatingowi, gdy pracownik ochrony nadzoruje wejście, potwierdza tożsamość i reaguje na próbę przejścia kilku osób. PIN i karta potwierdzają poświadczenie, lecz użytkownik może wpuścić kogoś za sobą. CCTV głównie rejestruje zdarzenie i jest kontrolą detektywistyczną.","options":[{"letter":"A","text":"PIN"},{"letter":"B","text":"Access card"},{"letter":"C","text":"Security guard"},{"letter":"D","text":"CCTV"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":589,"question":"A security professional discovers a folder that contains an employee's personal information located on the enterprise’s shared drive. Which of the following best describes the data type the security professional should use to identify organizational policies and standards concerning the storage of employees' personal information?","keyword":"Employee personal information is governed by privacy requirements -> Privacy data","correct_raw":"C. Privacy","explanation":"Dane osobowe pracowników, takie jak adresy, numery identyfikacyjne, dane kontaktowe lub informacje kadrowe, należą do kategorii privacy data. To właśnie polityki i standardy prywatności określają sposób ich przechowywania, dostępu, retencji i ochrony. Dane mogą jednocześnie podlegać obowiązkom prawnym, ale najlepszą kategorią opisującą ich charakter jest privacy.","options":[{"letter":"A","text":"Legal"},{"letter":"B","text":"Financial"},{"letter":"C","text":"Privacy"},{"letter":"D","text":"Intellectual property"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":590,"question":"A site reliability engineer is designing a recovery strategy that requires quick failover to an identical site if the primary facility goes down. Which of the following types of sites should the engineer consider?","keyword":"Fail over quickly to a fully equipped and current duplicate environment -> Hot site","correct_raw":"B. Hot site","explanation":"Hot site jest wyposażony, skonfigurowany i utrzymywany w stanie umożliwiającym szybkie przejęcie działania po awarii ośrodka podstawowego. Zawiera działającą infrastrukturę, sieć, systemy i aktualne lub regularnie replikowane dane. Warm site wymaga dodatkowego przygotowania, a cold site zapewnia głównie przestrzeń i podstawową infrastrukturę. Recovery site jest terminem ogólnym, natomiast hot site najlepiej spełnia wymaganie szybkiego failover do identycznego środowiska.","options":[{"letter":"A","text":"Recovery site"},{"letter":"B","text":"Hot site"},{"letter":"C","text":"Cold site"},{"letter":"D","text":"Warm site"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":591,"question":"Which of the following would an organization most likely use to minimize the loss of data on a file server in the event data needs to be restored?","keyword":"Restore a recent point-in-time copy with minimal data loss -> Snapshots","correct_raw":"A. Snapshots","explanation":"Snapshot zapisuje stan danych lub systemu plików z określonego momentu. Jeżeli pliki zostaną usunięte, nadpisane albo uszkodzone, administrator może odtworzyć je z ostatniego punktu w czasie, ograniczając utratę do zmian wykonanych po utworzeniu snapshotu. Journaling zapisuje operacje na systemie plików i pomaga przywrócić jego spójność po awarii, ale nie jest pełną kopią danych przeznaczoną do odtwarzania wersji plików. Obfuscation i tokenization nie są mechanizmami odzyskiwania danych.","options":[{"letter":"A","text":"Snapshots"},{"letter":"B","text":"Journaling"},{"letter":"C","text":"Obfuscation"},{"letter":"D","text":"Tokenization"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":592,"question":"Which of the following solutions would most likely be used in the financial industry to mask sensitive data?","keyword":"Replace financial data with non-sensitive surrogate values -> Tokenization","correct_raw":"A. Tokenization","explanation":"Tokenization zastępuje wrażliwe dane finansowe, np. numer karty płatniczej, nieznaczącym tokenem. Oryginał pozostaje w zabezpieczonym token vault, a systemy biznesowe mogą przetwarzać token zamiast rzeczywistej wartości. Hashing jest jednokierunkowy, salting wzmacnia hashowanie przez dodanie losowej wartości, a steganography ukrywa istnienie danych. W pytaniu słowo mask oznacza ogólnie ukrycie właściwej wartości, ale techniką oczekiwaną w finansach jest tokenization.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Salting"},{"letter":"D","text":"Steganography"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":593,"question":"Which of the following is a type of vulnerability that may result from outdated algorithms or keys?","keyword":"Weak or obsolete algorithms and keys undermine cryptographic protection -> Cryptographic vulnerability","correct_raw":"B. Cryptographic","explanation":"Przestarzałe algorytmy, zbyt krótkie klucze, niewłaściwa rotacja kluczy lub słabe parametry kryptograficzne tworzą podatności kryptograficzne. Hash collision jest jednym konkretnym problemem funkcji skrótu, lecz pytanie obejmuje szerzej zarówno algorytmy, jak i klucze. Buffer overflow wynika z błędów zarządzania pamięcią, a input validation z niewłaściwej obsługi danych wejściowych.","options":[{"letter":"A","text":"Hash collision"},{"letter":"B","text":"Cryptographic"},{"letter":"C","text":"Buffer overflow"},{"letter":"D","text":"Input validation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":594,"question":"A company wants to prevent proprietary and confidential company information from being shared to outsiders. Which of the following would this best describe?","keyword":"Contractually prohibit disclosure of confidential information to outside parties -> NDA","correct_raw":"D. NDA","explanation":"NDA, czyli Non-Disclosure Agreement, zobowiązuje strony do zachowania poufności i niewyjawiania określonych informacji osobom nieuprawnionym. MOA opisuje porozumienie i obowiązki stron, SLA poziomy świadczenia usług, a MSA ogólne warunki długoterminowej współpracy. To NDA bezpośrednio dotyczy zakazu ujawniania informacji poufnych i własnościowych.","options":[{"letter":"A","text":"MOA"},{"letter":"B","text":"SLA"},{"letter":"C","text":"MSA"},{"letter":"D","text":"NDA"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":595,"question":"A security administrator needs to reduce the attack surface in the company's data centers. Which of the following should the security administrator do to complete this task?","keyword":"Remove unsupported systems that no longer receive security fixes -> Upgrade end-of-support operating systems","correct_raw":"D. Upgrade end-of-support operating systems.","explanation":"Systemy po zakończeniu wsparcia nie otrzymują regularnych poprawek bezpieczeństwa i z czasem gromadzą znane, nieremediowane podatności. Ich aktualizacja lub migracja do wspieranej wersji usuwa znaczną część powierzchni ataku. Honeynet służy do wabienia i obserwowania napastników, high availability zwiększa dostępność, a samo zdefiniowanie GPO jest zbyt ogólne i nie gwarantuje redukcji powierzchni ataku.","options":[{"letter":"A","text":"Implement a honeynet."},{"letter":"B","text":"Define Group Policy on the servers."},{"letter":"C","text":"Configure the servers for high availability."},{"letter":"D","text":"Upgrade end-of-support operating systems."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":596,"question":"Which of the following is a prerequisite for a DLP solution?","keyword":"Identify which information is sensitive before creating prevention rules -> Data classification","correct_raw":"C. Data classification","explanation":"DLP musi wiedzieć, które dane są wrażliwe i jakiego poziomu ochrony wymagają. Klasyfikacja danych pozwala oznaczyć informacje np. jako publiczne, wewnętrzne, poufne lub ściśle tajne, a następnie budować reguły wykrywania i blokowania ich przesyłania. Destruction i sanitization dotyczą bezpiecznego usuwania danych, a masking ukrywa ich prezentowaną wartość.","options":[{"letter":"A","text":"Data destruction"},{"letter":"B","text":"Data sanitization"},{"letter":"C","text":"Data classification"},{"letter":"D","text":"Data masking"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":597,"question":"A business provides long-term cold storage services to banks that are required to follow regulator-imposed data retention guidelines. Banks that use these services require that data is disposed of in a specific manner at the conclusion of the regulatory threshold for data retention. Which of the following aspects of data management is the most important to the bank in the destruction of this data?","keyword":"Obtain formal proof that retained data was destroyed as required -> Certification","correct_raw":"C. Certification","explanation":"Bank korzysta z zewnętrznej usługi przechowywania i musi wykazać regulatorowi, że po zakończeniu okresu retencji dane zostały zniszczone w wymagany sposób. Najważniejszy jest więc certyfikat zniszczenia, który formalnie potwierdza wykonanie procesu, wskazuje zakres danych, metodę, datę i odpowiedzialną stronę. Klasyfikacja pomaga wcześniej ustalić wymagania ochrony i retencji, ale przy samym zakończeniu procesu bank potrzebuje dowodu wykonania. Encryption chroni dane przed odczytem, a procurement dotyczy zakupów.","options":[{"letter":"A","text":"Encryption"},{"letter":"B","text":"Classification"},{"letter":"C","text":"Certification"},{"letter":"D","text":"Procurement"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":598,"question":"The physical security team at a company receives reports that employees are not displaying their badges. The team also observes employees tailgating at controlled entrances. Which of the following topics will the security team most likely emphasize in upcoming security training?","keyword":"Notice surroundings, display identification, and challenge unauthorized entry -> Situational awareness","correct_raw":"B. Situational awareness","explanation":"Situational awareness oznacza świadome obserwowanie otoczenia i reagowanie na nietypowe zachowania. Szkolenie powinno przypominać pracownikom o widocznym noszeniu identyfikatorów, niewpuszczaniu innych osób na własną kartę oraz zgłaszaniu osób bez badge'a. Tailgating może wykorzystywać socjotechnikę, ale opisany problem obejmuje szerzej codzienną czujność fizyczną. Phishing dotyczy fałszywych wiadomości, a AUP korzystania z zasobów informatycznych.","options":[{"letter":"A","text":"Social engineering"},{"letter":"B","text":"Situational awareness"},{"letter":"C","text":"Phishing"},{"letter":"D","text":"Acceptable use policy"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":599,"question":"Which of the following would most likely be a hacktivist's motive?","keyword":"Use cyber activity to advance an ideological or social cause -> Philosophical beliefs","correct_raw":"C. Philosophical beliefs","explanation":"Hacktywiści prowadzą działania cybernetyczne w celu promowania przekonań politycznych, społecznych, etycznych lub ideologicznych. Mogą wykonywać defacement, wycieki danych lub ataki DDoS, aby nagłośnić sprawę. Financial gain jest typowy dla cyberprzestępców, espionage dla grup państwowych lub szpiegowskich, a revenge może motywować niezadowolonego insidera.","options":[{"letter":"A","text":"Financial gain"},{"letter":"B","text":"Espionage"},{"letter":"C","text":"Philosophical beliefs"},{"letter":"D","text":"Revenge"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":600,"question":"During a recent log review, an analyst discovers evidence of successful injection attacks. Which of the following will best address this issue?","keyword":"Reject or safely handle untrusted input before it reaches an interpreter -> Input validation","correct_raw":"D. Input validation","explanation":"Injection powstaje, gdy aplikacja traktuje dane kontrolowane przez użytkownika jako część polecenia, zapytania lub kodu. Właściwa walidacja wejścia, połączona z parametryzowanymi zapytaniami i bezpiecznymi interfejsami API, ogranicza możliwość przekazania złośliwego payloadu. Authentication potwierdza tożsamość, secure cookies chronią dane sesyjne, a static code analysis może znaleźć podatny kod, lecz bezpośrednią kontrolą adresującą niebezpieczne dane wejściowe jest input validation.","options":[{"letter":"A","text":"Authentication"},{"letter":"B","text":"Secure cookies"},{"letter":"C","text":"Static code analysis"},{"letter":"D","text":"Input validation"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":601,"question":"Which of the following is the first step to secure a newly deployed server?","keyword":"First step to secure a newly deployed server ➡️ Reduce attack surface","correct_raw":"A. Close unnecessary service ports.","explanation":"Pierwszym krokiem zabezpieczania nowo wdrożonego serwera jest ograniczenie jego powierzchni ataku przez zamknięcie niepotrzebnych portów oraz wyłączenie zbędnych usług. Zmniejsza to liczbę dostępnych punktów wejścia i ogranicza potencjalne dojście do serwera jeszcze przed wykonaniem kolejnych czynności, takich jak aktualizowanie oprogramowania, wdrażanie reguł ACL i stosowanie pełnego baseline’u bezpieczeństwa. Aktualizacje są obowiązkowe, ale spośród podanych odpowiedzi pierwszym bezpośrednim działaniem hardeningowym jest zamknięcie zbędnych portów.","options":[{"letter":"A","text":"Close unnecessary service ports."},{"letter":"B","text":"Update the current version of the software."},{"letter":"C","text":"Add the device to the ACL."},{"letter":"D","text":"Upgrade the OS version."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":602,"question":"A security analyst receives an alert that there was an attempt to download known malware. Which of the following actions would allow the best chance to analyze the malware?","keyword":"Best chance to analyze malware ➡️ Sandbox execution and packet capture","correct_raw":"D. Obtain and execute the malware in a sandbox environment and perform packet captures.","explanation":"Uruchomienie próbki w odizolowanym środowisku sandbox pozwala bezpiecznie obserwować jej rzeczywiste zachowanie: tworzone procesy i pliki, zmiany rejestru, mechanizmy persistence oraz komunikację sieciową. Packet capture ujawnia m.in. zapytania DNS, połączenia z infrastrukturą C2 i sposób przesyłania danych. Pozostałe działania dostarczają tylko fragmentarycznych informacji albo oceniają podatność środowiska, lecz nie analizują bezpośrednio próbki malware.","options":[{"letter":"A","text":"Review the IPS logs and determine which command-and-control IPs were blocked."},{"letter":"B","text":"Analyze application logs to see how the malware attempted to maintain persistence."},{"letter":"C","text":"Run vulnerability scans to check for systems and applications that are vulnerable to the malware."},{"letter":"D","text":"Obtain and execute the malware in a sandbox environment and perform packet captures."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":603,"question":"Which of the following should be used to ensure a user has the permissions needed to effectively do an assigned job role?","keyword":"Permissions needed for an assigned job role ➡️ Least privilege","correct_raw":"B. Implementing least privilege","explanation":"Zasada najmniejszych uprawnień (least privilege) przyznaje użytkownikowi dokładnie taki zakres dostępu, jaki jest niezbędny do wykonywania obowiązków służbowych — bez uprawnień nadmiarowych. Ogranicza to skutki błędów, nadużyć oraz przejęcia konta. Pozostałe odpowiedzi dotyczą zabezpieczania haseł, standaryzacji konfiguracji i izolacji sieci, a nie dopasowania uprawnień do roli.","options":[{"letter":"A","text":"Changing default passwords"},{"letter":"B","text":"Implementing least privilege"},{"letter":"C","text":"Enforcing baseline configurations"},{"letter":"D","text":"Applying network segmentation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":604,"question":"An employee receives a text message from an unrecognized number claiming to be the Chief Executive Officer and asking the employee to purchase gift cards. Which of the following types of attacks describes this example?","keyword":"Unrecognized number claiming to be the CEO ➡️ Impersonation","correct_raw":"D. Impersonation","explanation":"Atakujący podszywa się pod konkretną osobę posiadającą autorytet — dyrektora generalnego — aby nakłonić pracownika do zakupu kart podarunkowych. Jest to impersonation. Ponieważ atak przeprowadzono przez SMS, można go również określić jako smishing, ale takiej odpowiedzi nie podano. Phishing jest pojęciem szerszym, natomiast elementem najbardziej jednoznacznie opisanym w pytaniu jest podszycie się pod CEO.","options":[{"letter":"A","text":"Watering-hole"},{"letter":"B","text":"Disinformation"},{"letter":"C","text":"Phishing"},{"letter":"D","text":"Impersonation"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":605,"question":"An unexpected and out-of-character email message from a Chief Executive Officer's corporate account asked an employee to provide financial information and to change the recipient's contact number. Which of the following attack vectors is most likely being used?","keyword":"Out-of-character email from CEO corporate account / Financial request ➡️ Business email compromise","correct_raw":"A. Business email compromise","explanation":"Business Email Compromise (BEC) wykorzystuje przejęte lub wiarygodnie podszyte konto biznesowe osoby decyzyjnej, aby skłonić pracownika do przekazania informacji finansowych, zmiany danych odbiorcy lub wykonania płatności. Wiadomość pochodzi z firmowego konta CEO i dotyczy finansów, co odpowiada klasycznemu scenariuszowi BEC.","options":[{"letter":"A","text":"Business email compromise"},{"letter":"B","text":"Phishing"},{"letter":"C","text":"Brand impersonation"},{"letter":"D","text":"Pretexting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":606,"question":"Which of the following should an organization use to ensure that it can review the controls and performance of a service provider or vendor?","keyword":"Review vendor controls and performance ➡️ Right-to-audit clause","correct_raw":"C. Right-to-audit clause","explanation":"Klauzula prawa do audytu (right-to-audit clause) zapewnia organizacji formalne uprawnienie do sprawdzania zabezpieczeń, procedur, zgodności oraz realizacji zobowiązań przez dostawcę. SLA określa wymagane poziomy usług i mierniki, ale samo w sobie nie musi przyznawać klientowi prawa do przeprowadzenia audytu.","options":[{"letter":"A","text":"Service-level agreement"},{"letter":"B","text":"Memorandum of agreement"},{"letter":"C","text":"Right-to-audit clause"},{"letter":"D","text":"Supply chain analysis"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":607,"question":"Which of the following is used to calculate the impact to an organization per cybersecurity incident?","keyword":"Impact per cybersecurity incident ➡️ SLE","correct_raw":"A. SLE","explanation":"SLE (Single Loss Expectancy) określa oczekiwaną stratę finansową wynikającą z pojedynczego zdarzenia. Oblicza się ją jako Asset Value × Exposure Factor. ALE oznacza przewidywaną stratę roczną, ARO — roczną częstotliwość występowania zdarzenia, a SLA jest umową o poziomie świadczenia usług.","options":[{"letter":"A","text":"SLE"},{"letter":"B","text":"ALE"},{"letter":"C","text":"ARO"},{"letter":"D","text":"SLA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":608,"question":"A retail company receives a request to remove a customer's data. Which of the following is the retail company considered under GDPR legislation?","keyword":"Retail company receives customer deletion request under GDPR ➡️ Data controller","correct_raw":"B. Data controller","explanation":"Administrator danych (data controller) ustala cele i sposoby przetwarzania danych osobowych oraz odpowiada za realizację praw osoby, której dane dotyczą, w tym żądania usunięcia danych. Klient jest data subject. Data processor przetwarza dane w imieniu administratora, natomiast data custodian jest rolą operacyjną stosowaną w zarządzaniu danymi, a nie podstawową rolą GDPR w tym scenariuszu.","options":[{"letter":"A","text":"Data processor"},{"letter":"B","text":"Data controller"},{"letter":"C","text":"Data subject"},{"letter":"D","text":"Data custodian"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":609,"question":"An administrator implements web-filtering products but still sees that users are visiting malicious links. Which of the following configuration items does the security administrator need to review?","keyword":"Web filter still allows malicious links ➡️ Content categorization","correct_raw":"B. Content categorization","explanation":"Web filter podejmuje decyzje na podstawie klasyfikacji adresów URL i domen, np. jako malware, phishing, gambling lub social media. Jeżeli złośliwe linki nadal są dostępne, administrator powinien sprawdzić kategorie treści, ich aktualność oraz przypisane akcje allow/block. IPS i DNS są odrębnymi mechanizmami, a samo szyfrowanie nie określa, które kategorie stron mają być blokowane.","options":[{"letter":"A","text":"Intrusion prevention system"},{"letter":"B","text":"Content categorization"},{"letter":"C","text":"Encryption"},{"letter":"D","text":"DNS service"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":610,"question":"A security analyst is reviewing the following logs about a suspicious activity alert for a user's VPN log-ins. Which of the following malicious activity indicators triggered the alert?\n\nVPN LOGS:\nDate | Time | Action | SourceIP | City-State-Country\n2023-01-23 | 08:21:41 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-24 | 08:23:41 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-25 | 08:29:39 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-26 | 08:27:44 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-27 | 08:22:24 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-27 | 09:45:35 | Success | 185.17.106.237 | Rome-Italy\n2023-01-27 | 09:47:55 | Success | 188.17.105.137 | Rome-Italy\n2023-01-27 | 09:55:36 | Success | 207.414.201.19 | Chicago-IL-USA\n2023-01-27 | 16:28:15 | Success | 207.414.201.19 | Chicago-IL-USA","keyword":"Successful VPN log-ins from Chicago and Rome within minutes ➡️ Impossible travel","correct_raw":"A. Impossible travel","explanation":"Logi pokazują udane logowania z Chicago, następnie z Rzymu około 1 godziny i 23 minut później, a po kolejnych około 10 minutach ponownie z Chicago. Fizyczne przemieszczenie się użytkownika pomiędzy tymi lokalizacjami w tak krótkim czasie jest niemożliwe, dlatego alert został wyzwolony przez wskaźnik impossible travel. Nie ma wpisów o blokadzie konta ani zablokowanej treści, a same znaczniki logowania nie potwierdzają równoczesnego utrzymywania dwóch sesji.","options":[{"letter":"A","text":"Impossible travel"},{"letter":"B","text":"Account lockout"},{"letter":"C","text":"Blocked content"},{"letter":"D","text":"Concurrent session usage"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":611,"question":"Which of the following phases of the incident response process attempts to minimize disruption?","keyword":"Minimize disruption during incident response ➡️ Containment","correct_raw":"B. Containment","explanation":"Faza containment ma ograniczyć zasięg incydentu, zatrzymać jego rozprzestrzenianie i zmniejszyć szkody, jednocześnie możliwie ograniczając wpływ działań reagowania na działalność organizacji. Stosuje się m.in. izolację zainfekowanych hostów, blokowanie złośliwych adresów i segmentację. Recovery następuje później i polega na bezpiecznym przywróceniu systemów do normalnego działania. Preparation przygotowuje ludzi, procedury i narzędzia przed incydentem, a analysis służy rozpoznaniu charakteru, zakresu i przyczyny zdarzenia.","options":[{"letter":"A","text":"Recovery"},{"letter":"B","text":"Containment"},{"letter":"C","text":"Preparation"},{"letter":"D","text":"Analysis"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false}];
const N=Q.length, KEY='comptia-secplus-progress';
const byId=new Map(Q.map(q=>[q.id,q]));
const st={mode:null,q:null,done:false,studyId:1,quiz:[],idx:0,ok:0,wrong:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.last>=1&&s.last<=N)st.studyId=s.last}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({last:st.studyId,at:new Date().toISOString()}))}catch(e){}}
window.addEventListener('pagehide',()=>{if(st.mode==='study'&&st.q)st.studyId=st.q.id;save()});
const app=document.getElementById('app');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,fn,c){const b=el('button',c||'',txt);b.onclick=fn;return b}
function clear(){app.replaceChildren();window.scrollTo(0,0)}

function home(){
  st.mode=null;clear();
  const h=el('div','home');
  h.append(el('div','logo','S+'),el('h1','','CompTIA Security+'),el('div','sub','LEARNING'));
  const b=el('div','btns');
  b.append(btn('Nauka',startStudy),btn('Quiz — 10 pytań',startQuiz,'sec'));
  h.append(b);
  if(st.studyId>1)h.append(el('div','muted','Wznów naukę od pytania '+st.studyId+' z '+N));
  app.append(h,el('div','credit','Created by Konrad Kaczmarski'));
}

function showQ(q){
  st.q=q;st.done=false;clear();
  const multi=q.multiSelect||q.correctLetters.length>1;
  const study=st.mode==='study';
  const top=el('div','top');
  top.append(btn('Ekran główny',()=>{if(study){st.studyId=q.id;save()}home()},'sec'));
  top.append(el('div','grow'));
  if(study){
    const j=el('div','jump');j.append('Idź do:');
    const inp=el('input');inp.type='number';inp.inputMode='numeric';inp.min=1;inp.max=N;inp.value=q.id;
    const go=()=>{const n=parseInt(inp.value,10);if(!(n>=1&&n<=N)){msg.textContent='Wpisz numer pytania od 1 do '+N+'.';return}st.studyId=n;save();showQ(byId.get(n))};
    inp.onkeydown=e=>{if(e.key==='Enter')go()};
    j.append(inp,btn('Idź',go,'sec'));top.append(j);
  }
  app.append(top);
  const info=el('div','top');
  info.append(el('span','mode',study?'Nauka':'Quiz'),el('span','muted',study?'Pytanie '+q.id+' z '+N:'Pytanie '+(st.idx+1)+' z 10'));
  app.append(info);
  const card=el('div','card');
  card.append(el('span','badge','PYTANIE '+q.id),el('div','qt',q.question));
  const opts=[];
  if(q.isPBQ){
    card.append(el('div','ins','PBQ / symulacja — w materiale źródłowym nie ma standardowego zestawu odpowiedzi A–D. Kliknij „Pokaż rozwiązanie”.'));
    card.append(el('div','pbq',q.options.length?q.options[0].text:'To pytanie wymaga wykonania zadania praktycznego lub analizy elementów graficznych.'));
  }else{
    const n=q.correctLetters.length;
    card.append(el('div','ins',multi?'Wybierz '+n+' odpowiedzi.':'Wybierz jedną odpowiedź.'));
    q.options.forEach(o=>{
      const l=el('label','opt');const i=el('input');i.type=multi?'checkbox':'radio';i.name='opt';i.value=o.letter;
      l.append(i,el('span','l',o.letter+'.'),el('span','t',o.text));opts.push({l,i,letter:o.letter});card.append(l);
    });
  }
  app.append(card);
  const fb=el('div','card fb');fb.hidden=true;app.append(fb);
  const msg=el('div','msg');app.append(msg);
  const bar=el('div','bar');
  const check=btn(q.isPBQ?'Pokaż rozwiązanie':'Sprawdź',()=>{
    if(st.done)return;
    let isOk=false;
    if(!q.isPBQ){
      const sel=opts.filter(o=>o.i.checked).map(o=>o.letter).sort();
      if(!sel.length){msg.textContent='Najpierw zaznacz odpowiedź.';return}
      const cor=[...q.correctLetters].sort();
      isOk=sel.join()===cor.join();
      opts.forEach(o=>{o.i.disabled=true;if(cor.includes(o.letter))o.l.classList.add('ok');else if(o.i.checked)o.l.classList.add('bad')});
      if(!study){if(isOk)st.ok++;else st.wrong.push(q.id)}
    }
    msg.textContent='';
    const r=el('div','res '+(q.isPBQ?'pbq':isOk?'ok':'bad'),q.isPBQ?'Rozwiązanie PBQ / symulacji':isOk?'Prawidłowa odpowiedź':'Nieprawidłowa odpowiedź');
    fb.replaceChildren(r,el('p','',(q.isPBQ?'Opracowanie: ':'Poprawna odpowiedź: ')+q.correct_raw),el('p','','Słowo klucz: '+q.keyword),el('p','','Uzasadnienie: '+q.explanation));
    fb.hidden=false;st.done=true;check.disabled=true;next.hidden=false;
    next.scrollIntoView({block:'nearest'});
  });
  const last=study?q.id>=N:st.idx>=9;
  const next=btn(last?(study?'Zakończ':'Podsumowanie'):'Dalej',advance,'sec');next.hidden=true;
  if(study&&q.id>1)bar.append(btn('‹',()=>{st.studyId=q.id-1;save();showQ(byId.get(q.id-1))},'sec'));
  bar.append(check,next);app.append(bar);
}

function advance(){
  if(!st.done)return;
  if(st.mode==='study'){
    const id=st.q.id;
    if(id>=N){st.studyId=N;save();home();return}
    st.studyId=id+1;save();showQ(byId.get(id+1));
  }else{
    if(st.idx>=9){summary();return}
    st.idx++;showQ(st.quiz[st.idx]);
  }
}
function startStudy(){st.mode='study';showQ(byId.get(st.studyId))}
function startQuiz(){
  const pool=Q.filter(q=>!q.isPBQ&&q.options.length>=2&&q.correctLetters.length>=1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  Object.assign(st,{mode:'quiz',quiz:pool.slice(0,10),idx:0,ok:0,wrong:[]});
  showQ(st.quiz[0]);
}
function summary(){
  clear();
  const s=el('div','sum');
  s.append(el('h1','','Podsumowanie quizu'),el('div','score',st.ok+' / 10'),el('div','',Math.round(st.ok*10)+'% poprawnych odpowiedzi'));
  s.append(el('div','muted',st.wrong.length?'Pytania wymagające powtórki: '+[...st.wrong].sort((a,b)=>a-b).join(', '):'Komplet punktów. Wszystkie odpowiedzi były prawidłowe.'));
  const b=el('div','btns');b.append(btn('Nowy quiz',startQuiz),btn('Ekran główny',home,'sec'));s.append(b);
  app.append(s);
}
home();
</script>
</body>
</html>
