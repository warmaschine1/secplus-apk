 /docs/salaries"},{"letter":"B","text":"Setting weak passwords in /etc/shadow"},{"letter":"C","text":"Scheduling vulnerable jobs in /etc/crontab"},{"letter":"D","text":"Adding a fake account to /etc/passwd"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":335,"question":"An organization maintains intellectual property that it wants to protect. Which of the following concepts would be most beneficial to add to the company’s security awareness training program?","keyword":"Protect intellectual property from misuse by authorized personnel ➡️ Insider threat detection","correct_raw":"A. Insider threat detection","explanation":"Własność intelektualna jest często dostępna dla pracowników, wykonawców i partnerów posiadających legalny dostęp. Szkolenie z rozpoznawania sygnałów zagrożeń wewnętrznych, zasad zgłaszania oraz ochrony poufnych materiałów pomaga ograniczyć kradzież lub nieuprawnione wynoszenie informacji. Phishing jest ważny, ale nie odnosi się tak bezpośrednio do ryzyka wykorzystania uprawnionego dostępu do IP.","options":[{"letter":"A","text":"Insider threat detection"},{"letter":"B","text":"Simulated threats"},{"letter":"C","text":"Phishing awareness"},{"letter":"D","text":"Business continuity planning"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":336,"question":"An organization plans to expand its operations internationally and needs to keep data at the new location secure. The organization wants to use the most secure architecture model possible. Which of the following models offers the highest level of security?","keyword":"Maximum direct control over infrastructure and data ➡️ On-premises","correct_raw":"C. On-premises","explanation":"W logice egzaminacyjnej architektura on-premises daje organizacji pełną kontrolę nad fizyczną infrastrukturą, siecią, dostępem, konfiguracją i miejscem przechowywania danych. Nie występuje dodatkowa warstwa współdzielonej odpowiedzialności z dostawcą chmury. W praktyce model on-premises nie jest automatycznie bezpieczniejszy — poziom ochrony zależy od projektu, kompetencji, budżetu i utrzymania — ale spośród podanych odpowiedzi zapewnia największy bezpośredni poziom kontroli.","options":[{"letter":"A","text":"Cloud-based"},{"letter":"B","text":"Peer-to-peer"},{"letter":"C","text":"On-premises"},{"letter":"D","text":"Hybrid"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":337,"question":"Which of the following is the most relevant reason a DPO would develop a data inventory?","keyword":"DPO data inventory / Know what personal data could be exposed ➡️ Determine breach impact","correct_raw":"B. To determine the impact in the event of a breach","explanation":"Data Protection Officer potrzebuje wiedzieć, jakie dane osobowe organizacja posiada, gdzie są przechowywane, kto ma do nich dostęp i jak są przetwarzane. Taka inwentaryzacja pozwala szybko ocenić zakres oraz skutki naruszenia i ustalić obowiązki zgłoszeniowe. Zarządzanie pojemnością, deduplikacja i wydłużanie retencji nie są głównym celem DPO.","options":[{"letter":"A","text":"To manage data storage requirements better"},{"letter":"B","text":"To determine the impact in the event of a breach"},{"letter":"C","text":"To extend the length of time data can be retained"},{"letter":"D","text":"To automate the reduction of duplicated data"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":338,"question":"Which of the following cryptographic solutions protects data at rest?","keyword":"Protect stored data on a powered-off or stolen drive ➡️ Full disk encryption","correct_raw":"B. Full disk encryption","explanation":"Full Disk Encryption szyfruje zawartość całego dysku i chroni dane zapisane na urządzeniu, zwłaszcza po jego kradzieży lub fizycznym przejęciu. Podpis cyfrowy zapewnia integralność i autentyczność, klucz prywatny jest składnikiem kryptografii asymetrycznej, a steganografia ukrywa istnienie informacji, lecz nie stanowi typowego zabezpieczenia danych w spoczynku.","options":[{"letter":"A","text":"Digital signatures"},{"letter":"B","text":"Full disk encryption"},{"letter":"C","text":"Private key"},{"letter":"D","text":"Steganography"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":339,"question":"Which of the following should an organization use to protect its environment from external attacks conducted by an unauthorized hacker?","keyword":"Detect and actively block external network attacks ➡️ NIPS","correct_raw":"D. NIPS","explanation":"Network Intrusion Prevention System działa w torze ruchu sieciowego, analizuje pakiety i może automatycznie blokować złośliwe połączenia z zewnątrz. IDS głównie wykrywa i alarmuje, HIDS monitoruje pojedynczy host, a ACL filtruje ruch według statycznych adresów, portów i protokołów bez zaawansowanej analizy sygnatur oraz zachowania ataku.","options":[{"letter":"A","text":"ACL"},{"letter":"B","text":"IDS"},{"letter":"C","text":"HIDS"},{"letter":"D","text":"NIPS"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":340,"question":"Which of the following would enable a data center to remain operational through a multiday power outage?","keyword":"Multiday loss of utility power ➡️ Generator","correct_raw":"A. Generator","explanation":"Generator może zasilać centrum danych przez wiele godzin lub dni, o ile zapewnione są paliwo, obsługa i konserwacja. UPS dostarcza energię zwykle tylko przez krótki czas, aby przetrwać chwilową przerwę, bezpiecznie wyłączyć systemy albo uruchomić generator. Replikacja i przetwarzanie równoległe nie zapewniają lokalnego źródła energii.","options":[{"letter":"A","text":"Generator"},{"letter":"B","text":"Uninterruptible power supply"},{"letter":"C","text":"Replication"},{"letter":"D","text":"Parallel processing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":341,"question":"A company installed cameras and added signs to alert visitors that they are being recorded. Which of the following controls did the company implement? (Choose two.)","keyword":"Cameras record activity / Signs discourage misconduct ➡️ Detective and deterrent","correct_raw":"B. Deterrent | D. Detective","explanation":"Kamery są kontrolą detektywistyczną, ponieważ rejestrują zdarzenia i pomagają wykryć nieautoryzowane działania. Znaki informujące o monitoringu są kontrolą odstraszającą, ponieważ mają zniechęcić osoby do naruszenia zasad. Sama kamera nie musi fizycznie uniemożliwiać wejścia, dlatego nie jest tu najlepszym przykładem kontroli preventive.","options":[{"letter":"A","text":"Directive"},{"letter":"B","text":"Deterrent"},{"letter":"C","text":"Preventive"},{"letter":"D","text":"Detective"},{"letter":"E","text":"Corrective"},{"letter":"F","text":"Technical"}],"correctLetters":["B","D"],"isPBQ":false,"multiSelect":true},{"id":342,"question":"Which of the following is the best way to securely store an encryption key for a data set in a manner that allows multiple entities to access the key when needed?","keyword":"Securely store a key for authorized recovery by multiple entities ➡️ Key escrow","correct_raw":"D. Key escrow","explanation":"Key escrow polega na bezpiecznym zdeponowaniu kopii klucza u zaufanej strony lub w kontrolowanym systemie, aby uprawnione podmioty mogły go odzyskać, gdy będzie potrzebny. PKI zarządza certyfikatami i kluczami publicznymi, ale nie oznacza automatycznie współdzielonego depozytu klucza szyfrującego.","options":[{"letter":"A","text":"Public key infrastructure"},{"letter":"B","text":"Open public ledger"},{"letter":"C","text":"Public key encryption"},{"letter":"D","text":"Key escrow"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":343,"question":"For which of the following reasons would a systems administrator leverage a 3DES hash from an installer file that is posted on a vendor’s website?","keyword":"Compare a vendor-posted digest with the downloaded installer ➡️ Verify integrity","correct_raw":"A. To test the integrity of the file","explanation":"Administrator oblicza wartość skrótu pobranego instalatora i porównuje ją z wartością opublikowaną przez producenta. Zgodność wskazuje, że plik nie został zmieniony podczas pobierania. Odpowiedź D opisuje czynność obliczenia sumy kontrolnej, ale pytanie pyta o cel jej użycia, którym jest sprawdzenie integralności. Treść pytania jest technicznie wadliwa: 3DES jest algorytmem szyfrowania blokowego, a nie funkcją skrótu. Najprawdopodobniej autor miał na myśli kryptograficzny hash lub checksum.","options":[{"letter":"A","text":"To test the integrity of the file"},{"letter":"B","text":"To validate the authenticity of the file"},{"letter":"C","text":"To activate the license for the file"},{"letter":"D","text":"To calculate the checksum of the file"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":344,"question":"A company is redesigning its infrastructure and wants to reduce the number of physical servers in use. Which of the following architectures is best suited for this goal?","keyword":"Consolidate multiple workloads onto fewer physical servers ➡️ Virtualization","correct_raw":"C. Virtualization","explanation":"Wirtualizacja pozwala uruchamiać wiele niezależnych maszyn wirtualnych na jednym serwerze fizycznym. Dzięki konsolidacji obciążeń organizacja może ograniczyć liczbę urządzeń fizycznych. Segmentacja i izolacja dotyczą rozdzielania zasobów, a redundancja zwykle zwiększa liczbę komponentów.","options":[{"letter":"A","text":"Isolation"},{"letter":"B","text":"Segmentation"},{"letter":"C","text":"Virtualization"},{"letter":"D","text":"Redundancy"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":345,"question":"Which of the following security concepts is being followed when implementing a product that offers protection against DDoS attacks?","keyword":"DDoS protection keeps services reachable ➡️ Availability","correct_raw":"A. Availability","explanation":"Atak DDoS ma uniemożliwić prawidłowym użytkownikom korzystanie z usługi przez przeciążenie jej zasobów. Rozwiązanie anty-DDoS chroni więc przede wszystkim dostępność, czyli zdolność systemu do świadczenia usługi wtedy, gdy jest potrzebna.","options":[{"letter":"A","text":"Availability"},{"letter":"B","text":"Non-repudiation"},{"letter":"C","text":"Integrity"},{"letter":"D","text":"Confidentiality"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":346,"question":"A security manager created new documentation to use in response to various types of security incidents. Which of the following is the next step the manager should take?","keyword":"New incident-response documentation / Validate that the team can use it ➡️ Tabletop exercise","correct_raw":"D. Conduct a tabletop exercise with the team.","explanation":"Po przygotowaniu procedur należy je zweryfikować w praktyce. Ćwiczenie tabletop pozwala zespołowi przejść przez hipotetyczny incydent, sprawdzić role, decyzje, komunikację i wykryć luki w dokumentacji bez ingerencji w środowisko produkcyjne.","options":[{"letter":"A","text":"Set the maximum data retention policy."},{"letter":"B","text":"Securely store the documents on an air-gapped network."},{"letter":"C","text":"Review the documents’ data classification policy."},{"letter":"D","text":"Conduct a tabletop exercise with the team."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":347,"question":"After failing an audit twice, an organization has been ordered by a government regulatory agency to pay fines. Which of the following causes this action?","keyword":"Failed regulatory audits leading to fines ➡️ Non-compliance","correct_raw":"A. Non-compliance","explanation":"Organizacja nie spełniła wymagań regulatora, czyli pozostawała w stanie niezgodności. Grzywna jest konsekwencją tej niezgodności. Government sanctions opisują możliwy rodzaj kary, natomiast pytanie pyta o przyczynę jej nałożenia.","options":[{"letter":"A","text":"Non-compliance"},{"letter":"B","text":"Contract violations"},{"letter":"C","text":"Government sanctions"},{"letter":"D","text":"Rules of engagement"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":348,"question":"A company is developing a critical system for the government and storing project information on a fileshare. Which of the following describes how this data will most likely be classified? (Choose two.)","keyword":"Critical government project information / Highly limited access ➡️ Confidential and restricted","correct_raw":"B. Confidential | F. Restricted","explanation":"Informacje o krytycznym systemie rządowym nie powinny być publicznie dostępne. Klasyfikacja confidential wskazuje, że ujawnienie danych mogłoby zaszkodzić organizacji lub klientowi, a restricted oznacza najbardziej ograniczony dostęp dla ściśle uprawnionych osób. W praktyce organizacje zwykle stosują jeden hierarchiczny poziom klasyfikacji, dlatego pytanie jest uproszczone; spośród podanych opcji te dwa określenia najlepiej opisują wymagany poziom ochrony.","options":[{"letter":"A","text":"Private"},{"letter":"B","text":"Confidential"},{"letter":"C","text":"Public"},{"letter":"D","text":"Operational"},{"letter":"E","text":"Urgent"},{"letter":"F","text":"Restricted"}],"correctLetters":["B","F"],"isPBQ":false,"multiSelect":true},{"id":349,"question":"Which of the following activities is included in the post-incident review phase?","keyword":"Post-incident review / Lessons learned ➡️ Determine root cause","correct_raw":"A. Determining the root cause of the incident","explanation":"W fazie post-incident review zespół analizuje przebieg zdarzenia, ustala jego przyczynę źródłową i dokumentuje wnioski. Na tej podstawie może później tworzyć działania zapobiegawcze i poprawiać procedury. Odtwarzanie konfiguracji należy do recovery, a walidacja dowodów jest częścią dochodzenia i analizy.","options":[{"letter":"A","text":"Determining the root cause of the incident"},{"letter":"B","text":"Developing steps to mitigate the risks of the incident"},{"letter":"C","text":"Validating the accuracy of the evidence collected during the investigation"},{"letter":"D","text":"Reestablishing the compromised system’s configuration and settings"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":350,"question":"Which of the following attacks exploits a potential vulnerability as a result of using weak cryptographic algorithms?","keyword":"Weak cryptographic algorithm makes protected secrets easier to recover ➡️ Password cracking","correct_raw":"A. Password cracking","explanation":"Słabe lub przestarzałe algorytmy skrótu i szyfrowania mogą umożliwiać szybsze odtwarzanie haseł metodą słownikową, brute force lub z użyciem wcześniej obliczonych tablic. Atak on-path polega na przechwytywaniu komunikacji, a side-channel wykorzystuje informacje uboczne implementacji, takie jak czas wykonania lub pobór energii, a nie samą słabość algorytmu.","options":[{"letter":"A","text":"Password cracking"},{"letter":"B","text":"On-path"},{"letter":"C","text":"Digital signing"},{"letter":"D","text":"Side-channel"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":351,"question":"Which of the following is a preventive physical security control?","keyword":"Physical barrier that stops vehicle access ➡️ Bollards","correct_raw":"B. Bollards","explanation":"Bollards, czyli słupki zabezpieczające, fizycznie uniemożliwiają lub utrudniają wjazd pojazdu do chronionego obszaru, dlatego są kontrolą prewencyjną. Kamery, alarmy i czujniki ruchu przede wszystkim wykrywają lub rejestrują zdarzenia, więc klasyfikuje się je głównie jako kontrole detektywistyczne.","options":[{"letter":"A","text":"Video surveillance system"},{"letter":"B","text":"Bollards"},{"letter":"C","text":"Alarm system"},{"letter":"D","text":"Motion sensors"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":352,"question":"Which of the following is most likely to be used as a just-in-time reference document within a security operations center?","keyword":"Just-in-time SOC instructions for a specific incident ➡️ Playbook","correct_raw":"C. Playbook","explanation":"Playbook zawiera konkretne, uporządkowane kroki postępowania dla określonego typu zdarzenia, np. phishingu, ransomware lub przejęcia konta. Analityk SOC może sięgnąć do niego w trakcie incydentu jako szybkiego dokumentu referencyjnego. Polityka zmian i profil ryzyka są dokumentami bardziej ogólnymi.","options":[{"letter":"A","text":"Change management policy"},{"letter":"B","text":"Risk profile"},{"letter":"C","text":"Playbook"},{"letter":"D","text":"SIEM profile"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":353,"question":"A security engineer configured a remote access VPN. The remote access VPN allows end users to connect to the network by using an agent that is installed on the endpoint, which establishes an encrypted tunnel. Which of the following protocols did the engineer most likely implement?","keyword":"VPN client creates an encrypted tunnel ➡️ IPSec","correct_raw":"B. IPSec","explanation":"IPSec zapewnia szyfrowanie i uwierzytelnianie ruchu IP oraz jest powszechnie używany przez klienty zdalnego dostępu VPN. GRE tworzy tunel, ale sam nie zapewnia szyfrowania. EAP jest mechanizmem uwierzytelniania, a SD-WAN jest architekturą zarządzania siecią WAN, nie protokołem tunelu użytkownika.","options":[{"letter":"A","text":"GRE"},{"letter":"B","text":"IPSec"},{"letter":"C","text":"SD-WAN"},{"letter":"D","text":"EAP"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":354,"question":"Executives at a company are concerned about employees accessing systems and information about sensitive company projects unrelated to the employees’ normal job duties. Which of the following enterprise security capabilities will the security team most likely deploy to detect that activity?","keyword":"Detect unusual user access outside normal job behavior ➡️ UBA","correct_raw":"A. UBA","explanation":"User Behavior Analytics buduje bazowy profil normalnej aktywności użytkownika i wykrywa odstępstwa, np. dostęp do projektów niezwiązanych z jego rolą, nietypowe godziny pracy lub nagłe pobieranie dużej liczby plików. DLP skupia się głównie na zapobieganiu wyciekowi danych, EDR na aktywności endpointu, a NAC na dopuszczaniu urządzeń do sieci.","options":[{"letter":"A","text":"UBA"},{"letter":"B","text":"EDR"},{"letter":"C","text":"NAC"},{"letter":"D","text":"DLP"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":355,"question":"Several customers want an organization to verify its security controls are operating effectively and have requested an independent opinion. Which of the following is the most efficient way to address these requests?","keyword":"One independent assurance report for many customers ➡️ Third-party attestation","correct_raw":"D. Provide a third-party attestation report","explanation":"Raport atestacyjny przygotowany przez niezależną stronę, np. raport SOC, daje klientom jednolitą opinię o projekcie i skuteczności kontroli. Jest znacznie efektywniejszy niż umożliwianie każdemu klientowi oddzielnego audytu. Samoocena nie jest niezależna, a test penetracyjny nie ocenia pełnego zestawu kontroli.","options":[{"letter":"A","text":"Hire a vendor to perform a penetration test"},{"letter":"B","text":"Perform an annual self-assessment."},{"letter":"C","text":"Allow each client the right to audit"},{"letter":"D","text":"Provide a third-party attestation report"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":356,"question":"A university employee logged on to the academic server and attempted to guess the system administrators’ log-in credentials. Which of the following security measures should the university have implemented to detect the employee’s attempts to gain access to the administrators’ accounts?","keyword":"Detect repeated login attempts by an authenticated employee ➡️ User activity logs","correct_raw":"D. User activity logs","explanation":"Dzienniki aktywności użytkowników rejestrują próby logowania, nazwy kont, źródło połączenia, czas oraz wynik uwierzytelnienia. Pozwalają więc wykryć, że pracownik wielokrotnie próbował logować się na konta administratorów. MFA utrudniłoby przejęcie konta, ale pytanie dotyczy wykrywania. Firewall nie analizuje zwykle lokalnych prób logowania, a IPS może nie widzieć zdarzeń uwierzytelniania na samym serwerze.","options":[{"letter":"A","text":"Two-factor authentication"},{"letter":"B","text":"Firewall"},{"letter":"C","text":"Intrusion prevention system"},{"letter":"D","text":"User activity logs"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":357,"question":"Which of the following consequences would a retail chain most likely face from customers in the event the retailer is non-compliant with PCI DSS?","keyword":"Consequence specifically from customers ➡️ Reputational damage","correct_raw":"D. Reputational damage","explanation":"Klienci mogą stracić zaufanie do sprzedawcy, ograniczyć zakupy lub przejść do konkurencji, co oznacza szkodę reputacyjną. Kary finansowe, sankcje i skutki kontraktowe są zwykle nakładane przez banki, agentów rozliczeniowych, organizacje kartowe lub partnerów, a nie bezpośrednio przez klientów.","options":[{"letter":"A","text":"Contractual impacts"},{"letter":"B","text":"Sanctions"},{"letter":"C","text":"Fines"},{"letter":"D","text":"Reputational damage"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":358,"question":"A security analyst is reviewing logs and discovers an HTTP request containing a suspicious User-Agent value similar to `${/bin/sh/ id}`. Which of the following should be used to best mitigate this type of attack?","keyword":"Shell command embedded in an HTTP header ➡️ Command injection / Input sanitization","correct_raw":"A. Input sanitization","explanation":"Wartość nagłówka zawiera próbę przekazania polecenia systemowego do aplikacji. Dane wejściowe z żądań HTTP, w tym nagłówki, powinny być walidowane i oczyszczane, a aplikacja nie powinna przekazywać ich bezpośrednio do interpretera poleceń. Secure cookies nie chronią przed command injection. Analiza statyczna może pomóc wykryć wadliwy kod przed wdrożeniem, ale bezpośrednią kontrolą ograniczającą taki atak jest walidacja i sanitizacja wejścia.","options":[{"letter":"A","text":"Input sanitization"},{"letter":"B","text":"Secure cookies"},{"letter":"C","text":"Static code analysis"},{"letter":"D","text":"Sandboxing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":359,"question":"An administrator is installing an SSL certificate on a new system. During testing, errors indicate that the certificate is not trusted. The administrator has verified with the issuing CA and has validated the private key. Which of the following should the administrator check for next?","keyword":"Valid server certificate and private key but untrusted chain ➡️ Missing root CA","correct_raw":"C. If the root certificate is installed","explanation":"Klient ufa certyfikatowi serwera tylko wtedy, gdy może zbudować poprawny łańcuch zaufania do zaufanego urzędu certyfikacji. Jeśli certyfikat i klucz prywatny są prawidłowe, należy sprawdzić obecność certyfikatu głównego CA, a w praktyce również wymaganych certyfikatów pośrednich. CSR jest używany przed wydaniem certyfikatu, więc nie jest głównym problemem po jego instalacji.","options":[{"letter":"A","text":"If the wildcard certificate is configured"},{"letter":"B","text":"If the certificate signing request is valid"},{"letter":"C","text":"If the root certificate is installed"},{"letter":"D","text":"If the public key is configured"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":360,"question":"An employee emailed a new systems administrator a malicious web link and convinced the administrator to change the email server’s password. The employee used this access to remove the mailboxes of key personnel. Which of the following security awareness concepts would help prevent this threat in the future?","keyword":"Malicious link and social engineering by email ➡️ Recognizing phishing","correct_raw":"A. Recognizing phishing","explanation":"Atak rozpoczął się od wiadomości zawierającej złośliwy link i manipulacji odbiorcą, czyli phishingu połączonego z socjotechniką. Szkolenie powinno uczyć rozpoznawania podejrzanych linków, weryfikowania nietypowych próśb i korzystania z niezależnego kanału potwierdzenia przed zmianą haseł lub konfiguracji.","options":[{"letter":"A","text":"Recognizing phishing"},{"letter":"B","text":"Providing situational awareness training"},{"letter":"C","text":"Using password management"},{"letter":"D","text":"Reviewing email policies"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":361,"question":"Which of the following strategies should an organization use to efficiently manage and analyze multiple types of logs?","keyword":"Centralized collection and correlation of heterogeneous logs ➡️ SIEM","correct_raw":"A. Deploy a SIEM solution","explanation":"SIEM centralizuje logi z wielu źródeł, normalizuje je, koreluje zdarzenia i umożliwia wyszukiwanie, alertowanie oraz raportowanie. Własne skrypty mogą agregować wybrane logi, ale są trudniejsze w utrzymaniu i zwykle nie oferują pełnej korelacji. EDR koncentruje się na endpointach, a UTM na funkcjach ochrony ruchu sieciowego.","options":[{"letter":"A","text":"Deploy a SIEM solution"},{"letter":"B","text":"Create custom scripts to aggregate and analyze logs."},{"letter":"C","text":"Implement EDR technology."},{"letter":"D","text":"Install a unified threat management appliance."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":362,"question":"A new security regulation was announced that will take effect in the coming year. A company must comply with it to remain in business. Which of the following activities should the company perform next?","keyword":"Compare current controls with new regulatory requirements ➡️ Gap analysis","correct_raw":"A. Gap analysis","explanation":"Gap analysis porównuje obecny stan organizacji z wymaganym stanem wynikającym z nowej regulacji. Pozwala ustalić, które kontrole, procesy, dokumenty i technologie już spełniają wymagania, a które trzeba wdrożyć lub poprawić przed wejściem regulacji w życie. Przegląd polityk i procedur może być częścią tej analizy, ale nie zastępuje całościowego porównania stanu obecnego z docelowym.","options":[{"letter":"A","text":"Gap analysis"},{"letter":"B","text":"Policy review"},{"letter":"C","text":"Security procedure evaluation"},{"letter":"D","text":"Threat scope reduction"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":363,"question":"An accountant is transferring information to a bank over FTP. Which of the following mitigations should the accountant use to protect the confidentiality of the data?","keyword":"Protect confidentiality of data in transit over insecure FTP ➡️ Encryption","correct_raw":"C. Encryption","explanation":"Zwykły FTP przesyła dane i dane logowania bez szyfrowania. Poufność należy zapewnić przez szyfrowanie, np. zastosowanie SFTP, FTPS albo dodatkowego szyfrowania pliku przed wysłaniem. Tokenizacja i maskowanie zmieniają sposób prezentacji danych, a obfuscation utrudnia zrozumienie treści, lecz nie zapewnia kryptograficznej poufności transmisji.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"Data masking"},{"letter":"C","text":"Encryption"},{"letter":"D","text":"Obfuscation"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":364,"question":"An organization has recently decided to implement SSO. The requirements are to leverage access tokens and focus on application authorization rather than user authentication. Which of the following solutions would the engineering team most likely configure?","keyword":"Access tokens and delegated application authorization ➡️ OAuth","correct_raw":"D. OAuth","explanation":"OAuth jest frameworkiem delegowanej autoryzacji. Używa access tokenów, aby aplikacja mogła uzyskać określony dostęp do zasobów w imieniu użytkownika bez poznawania jego hasła. SAML jest częściej używany do federacyjnego uwierzytelniania i SSO, natomiast pytanie wyraźnie wskazuje na tokeny dostępu i autoryzację aplikacji.","options":[{"letter":"A","text":"LDAP"},{"letter":"B","text":"Federation"},{"letter":"C","text":"SAML"},{"letter":"D","text":"OAuth"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":365,"question":"Which of the following would most likely be used by attackers to perform credential harvesting?","keyword":"Trick users into revealing credentials ➡️ Social engineering","correct_raw":"A. Social engineering","explanation":"Credential harvesting najczęściej polega na nakłonieniu użytkownika do podania danych logowania, np. przez phishing, fałszywą stronę logowania, vishing lub podszywanie się pod dział IT. Rainbow table służy do odtwarzania haseł z przechwyconych skrótów, a nie do samego zbierania danych uwierzytelniających od użytkowników.","options":[{"letter":"A","text":"Social engineering"},{"letter":"B","text":"Supply chain compromise"},{"letter":"C","text":"Third-party software"},{"letter":"D","text":"Rainbow table"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":366,"question":"A security engineer would like to enhance the use of automation and orchestration within the SIEM. Which of the following would be the primary benefit of this enhancement?","keyword":"Automate repetitive SOC tasks and scale analyst capacity ➡️ Workforce multiplier","correct_raw":"D. It acts as a workforce multiplier.","explanation":"Automatyzacja i orkiestracja wykonują powtarzalne czynności, takie jak wzbogacanie alertów, blokowanie adresów, izolowanie hostów i tworzenie zgłoszeń. Dzięki temu niewielki zespół może obsłużyć większą liczbę zdarzeń i skupić się na analizie wymagającej decyzji człowieka. Nie usuwa to automatycznie długu technicznego, a wzrost złożoności nie jest podstawową korzyścią.","options":[{"letter":"A","text":"It increases complexity."},{"letter":"B","text":"It removes technical debt."},{"letter":"C","text":"It adds additional guard rails."},{"letter":"D","text":"It acts as a workforce multiplier."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":367,"question":"A systems administrator receives an alert that a company’s internal file server is very slow and is only working intermittently. The server management software shows FileSev01 with 12 connections, CPU usage of 99.6%, memory usage of 97%, reads of 50KB/s, and writes of 100KB/s. Which of the following indicators most likely triggered this alert?","keyword":"CPU 99.6% and memory 97% ➡️ Resource consumption","correct_raw":"D. Resource consumption","explanation":"Procesor i pamięć są niemal całkowicie wykorzystane, co może powodować spowolnienie i niestabilną pracę serwera. Dwanaście połączeń nie wygląda samo w sobie na nadmierną liczbę sesji, a wartości odczytu i zapisu są zbyt małe, aby wskazywać na nasycenie sieci. Account lockout dotyczy uwierzytelniania, a nie wydajności.","options":[{"letter":"A","text":"Concurrent session usage"},{"letter":"B","text":"Network saturation"},{"letter":"C","text":"Account lockout"},{"letter":"D","text":"Resource consumption"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":368,"question":"Which of the following data states applies to data that is being actively processed by a database server?","keyword":"Data actively processed in memory or by an application ➡️ In use","correct_raw":"A. In use","explanation":"Dane aktywnie przetwarzane przez bazę danych znajdują się w stanie data in use. Data at rest oznacza dane zapisane na dysku lub innym nośniku, a data in transit oznacza dane przesyłane pomiędzy systemami. Hashowanie jest operacją na danych, a nie podstawowym stanem danych.","options":[{"letter":"A","text":"In use"},{"letter":"B","text":"At rest"},{"letter":"C","text":"In transit"},{"letter":"D","text":"Being hashed"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":369,"question":"Which of the following architectures is most suitable to provide redundancy for critical business processes?","keyword":"Distributed, resilient services designed for redundancy and scaling ➡️ Cloud-native","correct_raw":"C. Cloud-native","explanation":"Architektura cloud-native wykorzystuje rozproszone usługi, automatyczne skalowanie, orkiestrację, wiele instancji i mechanizmy samonaprawy. Ułatwia to projektowanie wysokiej dostępności i redundancji dla krytycznych procesów. Multitenancy opisuje współdzielenie infrastruktury przez wielu klientów, a określenia network-enabled i server-side nie oznaczają same w sobie redundancji.","options":[{"letter":"A","text":"Network-enabled"},{"letter":"B","text":"Server-side"},{"letter":"C","text":"Cloud-native"},{"letter":"D","text":"Multitenant"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":370,"question":"After a security incident, a systems administrator asks the company to buy a NAC platform. Which of the following attack surfaces is the systems administrator trying to protect?","keyword":"Control which endpoints can connect through network access ports ➡️ Wired","correct_raw":"B. Wired","explanation":"Network Access Control kontroluje, które urządzenia i użytkownicy mogą uzyskać dostęp do sieci, często przez uwierzytelnianie 802.1X, ocenę stanu urządzenia i dynamiczne przypisanie VLAN-u. Spośród podanych opcji najlepiej odpowiada to ochronie przewodowej powierzchni ataku, czyli portów Ethernet i urządzeń podłączających się do sieci LAN. NAC może obejmować także Wi-Fi, ale takiej odpowiedzi nie podano.","options":[{"letter":"A","text":"Bluetooth"},{"letter":"B","text":"Wired"},{"letter":"C","text":"NFC"},{"letter":"D","text":"SCADA"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":371,"question":"While reviewing logs, a security administrator identifies the following code: <script>function (send_info)<\/script>. Which of the following best describes the vulnerability being exploited?","keyword":"Injected <script> code in web content ➡️ Cross-site scripting (XSS)","correct_raw":"A. XSS","explanation":"Znaczniki <script> wskazują na próbę wstrzyknięcia i wykonania kodu JavaScript w kontekście strony internetowej lub przeglądarki użytkownika. Jest to charakterystyczne dla cross-site scripting. SQL injection wykorzystuje polecenia SQL, CSRF nakłania zalogowaną przeglądarkę do wykonania niechcianego żądania, a DDoS polega na przeciążaniu usługi dużą liczbą żądań.","options":[{"letter":"A","text":"XSS"},{"letter":"B","text":"SQLi"},{"letter":"C","text":"DDoS"},{"letter":"D","text":"CSRF"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":372,"question":"An organization issued new laptops to all employees and wants to provide web filtering both in and out of the office without configuring additional access to the network. Which of the following types of web filtering should a systems administrator configure?","keyword":"Filtering must follow laptops inside and outside the corporate network ➡️ Agent-based","correct_raw":"A. Agent-based","explanation":"Agent zainstalowany na laptopie może egzekwować politykę filtrowania niezależnie od tego, czy urządzenie znajduje się w biurze, w domu czy w publicznej sieci. Centralny proxy wymaga skierowania ruchu przez infrastrukturę organizacji, zwykle przez VPN lub dodatkową konfigurację. URL scanning i content categorization opisują metody oceny stron, a nie sposób zapewnienia filtrowania poza siecią firmową.","options":[{"letter":"A","text":"Agent-based"},{"letter":"B","text":"Centralized proxy"},{"letter":"C","text":"URL scanning"},{"letter":"D","text":"Content categorization"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":373,"question":"Which of the following should be used to aggregate log data in order to create alerts and detect anomalous activity?","keyword":"Aggregate and correlate logs to alert on anomalies ➡️ SIEM","correct_raw":"A. SIEM","explanation":"SIEM zbiera i normalizuje logi z wielu źródeł, koreluje zdarzenia, wykrywa anomalie i tworzy alerty. WAF chroni aplikacje webowe, network tap kopiuje ruch sieciowy do narzędzi analitycznych, a IDS wykrywa podejrzany ruch, ale nie jest centralną platformą do agregowania wielu typów logów.","options":[{"letter":"A","text":"SIEM"},{"letter":"B","text":"WAF"},{"letter":"C","text":"Network taps"},{"letter":"D","text":"IDS"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":374,"question":"Which of the following provides the best protection against unwanted or insecure communications to and from a device?","keyword":"Control inbound and outbound communications on one endpoint ➡️ Host-based firewall","correct_raw":"B. Host-based firewall","explanation":"Zapora hostowa filtruje połączenia przychodzące i wychodzące bezpośrednio na urządzeniu według adresów, portów, protokołów i aplikacji. IDS głównie wykrywa i alarmuje, anty-malware koncentruje się na złośliwym oprogramowaniu, a system hardening jest szerszym procesem ograniczania powierzchni ataku, lecz nie zapewnia tak bezpośredniej kontroli komunikacji sieciowej.","options":[{"letter":"A","text":"System hardening"},{"letter":"B","text":"Host-based firewall"},{"letter":"C","text":"Intrusion detection system"},{"letter":"D","text":"Anti-malware software"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":375,"question":"Which of the following is the primary purpose of a service that tracks log-ins and time spent using the service?","keyword":"Record who logged in and how long resources were used ➡️ Accounting","correct_raw":"B. Accounting","explanation":"W modelu AAA accounting rejestruje aktywność użytkownika, w tym czas rozpoczęcia i zakończenia sesji, czas korzystania z usługi oraz użyte zasoby. Authentication potwierdza tożsamość, a authorization określa dozwolone działania. Availability dotyczy dostępności usługi.","options":[{"letter":"A","text":"Availability"},{"letter":"B","text":"Accounting"},{"letter":"C","text":"Authentication"},{"letter":"D","text":"Authorization"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":376,"question":"An employee who was working remotely lost a mobile device containing company data. Which of the following provides the best solution to prevent future data loss?","keyword":"Lost corporate mobile device / Enforce controls and remotely wipe data ➡️ MDM","correct_raw":"A. MDM","explanation":"Mobile Device Management pozwala centralnie wymuszać szyfrowanie, blokadę ekranu, zgodność urządzenia oraz zdalne zablokowanie lub wymazanie danych po zgubieniu sprzętu. FDE bardzo dobrze chroni dane na wyłączonym lub zablokowanym nośniku, ale MDM jest pełniejszym rozwiązaniem dla floty urządzeń mobilnych i umożliwia reakcję po utracie. DLP kontroluje przepływ danych, a EDR wykrywa zagrożenia na endpointach.","options":[{"letter":"A","text":"MDM"},{"letter":"B","text":"DLP"},{"letter":"C","text":"FDE"},{"letter":"D","text":"EDR"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":377,"question":"An IT administrator needs to ensure data retention standards are implemented on an enterprise application. Which of the following describes the administrator’s role?","keyword":"Implement and maintain controls defined by the data owner ➡️ Custodian","correct_raw":"B. Custodian","explanation":"Data custodian wdraża i utrzymuje techniczne mechanizmy ochrony oraz retencji zgodnie z wymaganiami ustalonymi przez właściciela danych. Data owner określa klasyfikację, zasady dostępu i wymagania retencyjne, ale administrator aplikacji pełni rolę wykonawczą. Privacy officer nadzoruje zgodność z przepisami prywatności, a processor przetwarza dane w imieniu administratora danych.","options":[{"letter":"A","text":"Processor"},{"letter":"B","text":"Custodian"},{"letter":"C","text":"Privacy officer"},{"letter":"D","text":"Owner"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":378,"question":"A company plans to secure its systems by preventing users from sending sensitive data over corporate email and restricting access to potentially harmful websites. Which of the following features should the company set up? (Choose two.)","keyword":"Stop sensitive email exfiltration and block harmful domains ➡️ DLP plus DNS filtering","correct_raw":"A. DLP software | B. DNS filtering","explanation":"DLP może analizować treść wiadomości i załączników oraz blokować wysyłanie poufnych informacji. DNS filtering blokuje rozwiązywanie nazw domen sklasyfikowanych jako złośliwe lub niedozwolone, dzięki czemu ogranicza dostęp do niebezpiecznych witryn. Stateful firewall filtruje połączenia według stanu i reguł sieciowych, ale nie zapewnia tak precyzyjnej kontroli treści e-mail ani kategorii domen.","options":[{"letter":"A","text":"DLP software"},{"letter":"B","text":"DNS filtering"},{"letter":"C","text":"File integrity monitoring"},{"letter":"D","text":"Stateful firewall"},{"letter":"E","text":"Guardrails"},{"letter":"F","text":"Antivirus signatures"}],"correctLetters":["A","B"],"isPBQ":false,"multiSelect":true},{"id":379,"question":"A company processes and stores sensitive data on its own systems. Which of the following steps should the company take first to ensure compliance with privacy regulations?","keyword":"Sensitive data stored on company systems / First direct privacy safeguard ➡️ Access controls and encryption","correct_raw":"A. Implement access controls and encryption.","explanation":"Spośród podanych opcji najbardziej bezpośrednim pierwszym działaniem zapewniającym ochronę danych przetwarzanych i przechowywanych na własnych systemach jest wdrożenie kontroli dostępu oraz szyfrowania. Kontrole dostępu ograniczają dane do uprawnionych osób, a szyfrowanie chroni ich poufność. Polityki i szkolenia są niezbędne w programie zgodności, ale same nie zabezpieczają danych. Pytanie jest dyskusyjne z perspektywy governance, ponieważ w rzeczywistym programie najpierw identyfikuje się wymagania i tworzy polityki; jednak w logice tego klucza i spośród dostępnych odpowiedzi oczekiwana jest odpowiedź A.","options":[{"letter":"A","text":"Implement access controls and encryption."},{"letter":"B","text":"Develop and provide training on data protection policies."},{"letter":"C","text":"Create incident response and disaster recovery plans."},{"letter":"D","text":"Purchase and install security software."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":380,"question":"Which of the following cryptographic methods is preferred for securing communications with limited computing resources?","keyword":"Limited computing resources / Lowest processing overhead for protecting communication ➡️ Symmetric encryption","correct_raw":"C. Symmetric encryption","explanation":"Szyfrowanie symetryczne wymaga znacznie mniej obliczeń niż kryptografia asymetryczna i dlatego najlepiej nadaje się do szyfrowania właściwego strumienia komunikacji na urządzeniach o ograniczonych zasobach. ECC jest wydajniejsze od RSA i używa krótszych kluczy, ale nadal jest metodą asymetryczną, zwykle stosowaną do uzgadniania kluczy lub podpisów, a nie do szyfrowania całej sesji. Gdyby pytanie pytało o preferowany algorytm asymetryczny dla urządzeń ograniczonych zasobowo, odpowiedzią byłoby ECC; przy ogólnym pytaniu o zabezpieczenie komunikacji najtrafniejsze jest C.","options":[{"letter":"A","text":"Hashing algorithm"},{"letter":"B","text":"Public key infrastructure"},{"letter":"C","text":"Symmetric encryption"},{"letter":"D","text":"Elliptic curve cryptography"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":381,"question":"A network administrator wants to ensure that network traffic is highly secure while in transit. Which of the following actions best describes the actions the network administrator should take?","keyword":"Highly secure data in transit ➡️ Encrypted protocols such as TLS","correct_raw":"B. Ensure only TLS and other encrypted protocols are selected for use on the network, and only permit authorized traffic via secure protocols.","explanation":"Poufność i integralność ruchu w trakcie przesyłania zapewniają protokoły szyfrowane, np. TLS, SSH, SFTP lub IPsec. NAC, zapory, IPS i EDR są ważnymi kontrolami, ale nie szyfrują całej komunikacji. Odpowiedź B bezpośrednio dotyczy zabezpieczenia danych in transit i ograniczenia ruchu do zatwierdzonych, bezpiecznych protokołów.","options":[{"letter":"A","text":"Ensure that NAC is enforced on all network segments, and confirm that firewalls have updated policies to block unauthorized traffic."},{"letter":"B","text":"Ensure only TLS and other encrypted protocols are selected for use on the network, and only permit authorized traffic via secure protocols."},{"letter":"C","text":"Configure the perimeter IPS to block inbound HTTPS directory traversal traffic, and verify that signatures are updated on a daily basis."},{"letter":"D","text":"Ensure the EDR software monitors for unauthorized applications that could be used by threat actors, and configure alerts for the security team."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":382,"question":"Which of the following definitions best describes the concept of log correlation?","keyword":"Relate events across logs to identify attack patterns ➡️ Log correlation","correct_raw":"B. Searching and processing data to identify patterns of malicious activity","explanation":"Log correlation łączy i porównuje powiązane zdarzenia z różnych źródeł, aby wykryć wzorce, zależności i sekwencje wskazujące na atak. Odpowiedź A opisuje przede wszystkim agregację lub centralizację logów. C oznacza samo logowanie zdarzeń, a D jest zbyt ogólnym opisem analizy pojedynczych plików.","options":[{"letter":"A","text":"Combining relevant logs from multiple sources into one location"},{"letter":"B","text":"Searching and processing data to identify patterns of malicious activity"},{"letter":"C","text":"Making a record of the events that occur in the system"},{"letter":"D","text":"Analyzing the log files of the system components"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":383,"question":"An enterprise security team is researching a new security architecture to better protect the company’s networks and applications against the latest cyberthreats. The company has a fully remote workforce. The solution should be highly redundant and enable users to connect to a VPN with an integrated, software-based firewall. Which of the following solutions meets these requirements?","keyword":"Remote workforce + cloud-delivered VPN and firewall ➡️ SASE","correct_raw":"C. SASE","explanation":"SASE łączy funkcje sieciowe i bezpieczeństwa jako usługę dostarczaną z chmury, np. bezpieczny zdalny dostęp, SD-WAN, secure web gateway, firewall as a service i ZTNA. Rozproszona architektura punktów obecności sprzyja redundancji i obsłudze zdalnych użytkowników. CASB koncentruje się na dostępie do usług chmurowych, SIEM na analizie logów, a IPS na wykrywaniu i blokowaniu ataków.","options":[{"letter":"A","text":"IPS"},{"letter":"B","text":"SIEM"},{"letter":"C","text":"SASE"},{"letter":"D","text":"CASB"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":384,"question":"Which of the following is the best way to validate the integrity and availability of a disaster recovery site?","keyword":"Validate that the DR site can actually take over operations ➡️ Simulated failover","correct_raw":"A. Lead a simulated failover.","explanation":"Symulowane przełączenie pozwala sprawdzić, czy systemy, dane, zależności, łączność i procedury w ośrodku DR rzeczywiście działają oraz czy usługi można uruchomić w wymaganym czasie. Tabletop weryfikuje wiedzę i procedury, lecz nie potwierdza technicznej gotowości całej lokalizacji. Test generatorów sprawdza tylko zasilanie, a szyfrowanie nie potwierdza dostępności.","options":[{"letter":"A","text":"Lead a simulated failover."},{"letter":"B","text":"Conduct a tabletop exercise."},{"letter":"C","text":"Periodically test the generators."},{"letter":"D","text":"Develop requirements for database encryption."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":385,"question":"Which of the following allows an exploit to go undetected by the operating system?","keyword":"Malicious code executed inside process memory to evade normal detection ➡️ Memory injection","correct_raw":"C. Memory injection","explanation":"Memory injection umieszcza złośliwy kod bezpośrednio w pamięci działającego, często legalnego procesu. Kod może wykonywać się bez typowego pliku wykonywalnego na dysku i pod nazwą zaufanego procesu, co utrudnia jego wykrycie przez mechanizmy systemu operacyjnego i tradycyjne skanery plików. Firmware vulnerabilities działają poniżej warstwy systemu, ale są kategorią podatności, a nie opisaną tu techniką ukrywania wykonania exploita.","options":[{"letter":"A","text":"Firmware vulnerabilities"},{"letter":"B","text":"Side loading"},{"letter":"C","text":"Memory injection"},{"letter":"D","text":"Encrypted payloads"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":386,"question":"A malicious insider from the marketing team alters records and transfers company funds to a personal account. Which of the following methods would be the best way to secure company records in the future?","keyword":"Malicious insider should not have permission to modify financial records ➡️ Permission restrictions","correct_raw":"A. Permission restrictions","explanation":"Pracownik działu marketingu nie powinien mieć uprawnień do modyfikowania rekordów finansowych ani inicjowania przelewów. Permission restrictions oznaczają ograniczenie czynności dostępnych dla użytkownika zgodnie z jego rolą i zasadą least privilege. Odpowiedź D, access control list, jest kusząca, ponieważ ACL może technicznie egzekwować część takich uprawnień, szczególnie dla plików i zasobów systemowych. Pytanie pyta jednak szerzej o najlepszą metodę zabezpieczenia rekordów biznesowych przed nieuprawnioną zmianą przez insidera, dlatego bardziej bezpośrednią odpowiedzią są permission restrictions. Hashing może pomóc wykryć zmianę, ale jej nie blokuje, a input validation nie rozwiązuje problemu legalnie zalogowanego użytkownika z nadmiernymi uprawnieniami.","options":[{"letter":"A","text":"Permission restrictions"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Input validation"},{"letter":"D","text":"Access control list"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":387,"question":"An organization is required to provide assurance that its controls are properly designed and operating effectively. Which of the following reports will best achieve the objective?","keyword":"Independent assurance over control design and operating effectiveness ➡️ Independent audit","correct_raw":"C. Independent audit","explanation":"Niezależny audyt ocenia zarówno projekt kontroli, jak i to, czy działają one skutecznie w określonym okresie. Red teaming, test penetracyjny i ocena podatności koncentrują się głównie na możliwościach ataku oraz słabościach technicznych, a nie na pełnym zestawie kontroli organizacyjnych, proceduralnych i technicznych.","options":[{"letter":"A","text":"Red teaming"},{"letter":"B","text":"Penetration testing"},{"letter":"C","text":"Independent audit"},{"letter":"D","text":"Vulnerability assessment"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":388,"question":"A systems administrator successfully configures VPN access to a cloud environment. Which of the following capabilities should the administrator use to best facilitate remote administration?","keyword":"Controlled administrative entry point into cloud resources ➡️ Jump host","correct_raw":"A. A jump host in the shared services security zone","explanation":"Jump host, nazywany też bastion hostem, stanowi kontrolowany punkt wejścia do administracji zasobami w prywatnych segmentach chmury. Można na nim wymusić MFA, rejestrowanie sesji, ograniczenia źródeł i narzędzi administracyjnych. Serwer SSH w lokalnym LAN nie zapewnia bezpośrednio kontrolowanej administracji środowiskiem chmurowym, reverse proxy obsługuje głównie ruch aplikacyjny, a MDM zarządza urządzeniami końcowymi.","options":[{"letter":"A","text":"A jump host in the shared services security zone"},{"letter":"B","text":"An SSH server within the corporate LAN"},{"letter":"C","text":"A reverse proxy on the firewall"},{"letter":"D","text":"An MDM solution with conditional access"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":389,"question":"Which of the following best describes the concept of information being stored outside of its country of origin while still being subject to the laws and requirements of the country of origin?","keyword":"Data remains governed by national legal requirements ➡️ Data sovereignty","correct_raw":"A. Data sovereignty","explanation":"Data sovereignty opisuje zależność danych od przepisów i wymagań określonej jurysdykcji. Pytanie podkreśla, że mimo fizycznego przechowywania poza krajem pochodzenia dane nadal podlegają jego wymaganiom prawnym. Geolocation określa położenie, geographic restrictions ograniczają dozwolone lokalizacje, a intellectual property dotyczy praw do wytworów intelektualnych.","options":[{"letter":"A","text":"Data sovereignty"},{"letter":"B","text":"Geolocation"},{"letter":"C","text":"Intellectual property"},{"letter":"D","text":"Geographic restrictions"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":390,"question":"An audit reveals that cardholder database logs are exposing account numbers inappropriately. Which of the following mechanisms would help limit the impact of this error?","keyword":"Hide portions of account numbers displayed in logs ➡️ Masking","correct_raw":"D. Masking","explanation":"Maskowanie zastępuje część wrażliwej wartości znakami zastępczymi, np. **** **** **** 1234, dzięki czemu logi pozostają użyteczne bez ujawniania pełnego numeru konta lub karty. Segmentacja ogranicza komunikację między sieciami, hashing uniemożliwiłby łatwe odzyskanie pełnej wartości, a journaling tworzy dodatkowy zapis zmian i nie ukrywa danych.","options":[{"letter":"A","text":"Segmentation"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Journaling"},{"letter":"D","text":"Masking"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":391,"question":"A security analyst attempts to start a company's database server. When the server starts, the analyst receives an error message indicating the database server did not pass authentication. After reviewing and testing the system, the analyst receives confirmation that the server has been compromised and that attackers have redirected all outgoing database traffic to a server under their control. Which of the following MITRE ATT&CK techniques did the attacker most likely use to redirect database traffic?","keyword":"Alter a running database process so its traffic is redirected ➡️ Process injection","correct_raw":"B. Process injection","explanation":"Process injection polega na umieszczeniu lub uruchomieniu złośliwego kodu w przestrzeni pamięci działającego procesu. Wstrzyknięty kod może zmienić zachowanie procesu bazy danych, np. przechwytywać lub przekierowywać jego połączenia wychodzące do infrastruktury napastnika. Browser extension dotyczy przeglądarki, valid accounts umożliwia dostęp przy użyciu prawidłowych poświadczeń, a escape to host oznacza wydostanie się z kontenera lub maszyny wirtualnej do systemu hosta.","options":[{"letter":"A","text":"Browser extension"},{"letter":"B","text":"Process injection"},{"letter":"C","text":"Valid accounts"},{"letter":"D","text":"Escape to host"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":392,"question":"A penetration tester enters an office building at the same time as a group of employees despite not having an access badge. Which of the following attack types is the penetration tester performing?","keyword":"Entering a restricted area by following authorized employees ➡️ Tailgating","correct_raw":"A. Tailgating","explanation":"Tailgating polega na wejściu do chronionego obszaru bez własnego uwierzytelnienia poprzez podążanie za osobą uprawnioną lub dołączenie do grupy pracowników. Shoulder surfing oznacza podglądanie informacji, RFID cloning kopiowanie identyfikatora karty, a forgery fałszowanie dokumentu lub poświadczenia.","options":[{"letter":"A","text":"Tailgating"},{"letter":"B","text":"Shoulder surfing"},{"letter":"C","text":"RFID cloning"},{"letter":"D","text":"Forgery"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":393,"question":"Which of the following enables the ability to receive a consolidated report from different devices on the network?","keyword":"One consolidated report from many network devices ➡️ SIEM","correct_raw":"C. SIEM","explanation":"SIEM zbiera logi i zdarzenia z wielu urządzeń, normalizuje je i przedstawia w postaci scentralizowanych raportów, pulpitów oraz alertów. IPS, DLP i firewall generują własne zdarzenia, ale nie są podstawowym systemem konsolidującym raporty z całego środowiska.","options":[{"letter":"A","text":"IPS"},{"letter":"B","text":"DLP"},{"letter":"C","text":"SIEM"},{"letter":"D","text":"Firewall"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":394,"question":"Which of the following should an organization focus on the most when making decisions about vulnerability prioritization?","keyword":"Standardized severity score used to rank vulnerabilities ➡️ CVSS","correct_raw":"B. CVSS","explanation":"CVSS nadaje podatności ustandaryzowany wynik odzwierciedlający jej dotkliwość i właściwości techniczne, co pomaga ustalać kolejność remediacji. CVE jest jedynie identyfikatorem podatności. Exposure factor to składnik ilościowej analizy ryzyka określający procent utraty aktywa, a industry impact jest zbyt ogólny. W praktyce CVSS należy łączyć z ekspozycją zasobu, znaczeniem biznesowym i aktywną eksploatacją, ale spośród podanych odpowiedzi jest najlepszą podstawą priorytetyzacji.","options":[{"letter":"A","text":"Exposure factor"},{"letter":"B","text":"CVSS"},{"letter":"C","text":"CVE"},{"letter":"D","text":"Industry impact"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":395,"question":"An organization needs to monitor its users’ activities in order to prevent insider threats. Which of the following solutions would help the organization achieve this goal?","keyword":"Detect abnormal user activity and insider behavior ➡️ Behavioral analytics","correct_raw":"A. Behavioral analytics","explanation":"Behavioral analytics tworzy profil normalnych działań użytkowników i wykrywa odchylenia, np. nietypowe logowania, dostęp do nieużywanych zasobów lub masowe pobieranie danych. ACL i IAM kontrolują uprawnienia, ale nie analizują samodzielnie wzorców zachowania. NIDS obserwuje ruch sieciowy, lecz nie daje tak pełnego obrazu aktywności konkretnego użytkownika.","options":[{"letter":"A","text":"Behavioral analytics"},{"letter":"B","text":"Access control lists"},{"letter":"C","text":"Identity and access management"},{"letter":"D","text":"Network intrusion detection system"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":396,"question":"A customer of a large company receives a phone call from someone claiming to work for the company and asking for the customer’s credit card information. The customer sees the caller ID is the same as the company's main phone number. Which of the following attacks is the customer most likely a target of?","keyword":"Fraudulent voice call with spoofed caller ID ➡️ Vishing","correct_raw":"D. Vishing","explanation":"Vishing to phishing prowadzony głosowo przez telefon. Napastnik może podszyć się pod prawidłowy numer firmy za pomocą caller ID spoofing i nakłaniać ofiarę do ujawnienia danych karty. Smishing wykorzystuje SMS, whaling jest ukierunkowany na osoby wysoko postawione, a phishing jest kategorią ogólną.","options":[{"letter":"A","text":"Phishing"},{"letter":"B","text":"Whaling"},{"letter":"C","text":"Smishing"},{"letter":"D","text":"Vishing"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":397,"question":"A security analyst is reviewing logs to identify the destination of command-and-control traffic originating from a compromised device within the on-premises network. Which of the following is the best log to review?","keyword":"Find the external destination of outbound C2 connections ➡️ Firewall logs","correct_raw":"C. Firewall","explanation":"Firewall na granicy sieci rejestruje połączenia wychodzące, w tym źródłowy host, docelowy adres IP, port, protokół i wynik decyzji. Pozwala więc ustalić, dokąd skompromitowane urządzenie wysyła ruch C2. IDS może rozpoznać wzorzec C2, ale najlepszym źródłem do potwierdzenia konkretnego celu połączeń są logi firewalla.","options":[{"letter":"A","text":"IDS"},{"letter":"B","text":"Antivirus"},{"letter":"C","text":"Firewall"},{"letter":"D","text":"Application"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":398,"question":"When trying to access an internal website, an employee reports that a prompt displays, stating that the site is insecure. Which of the following certificate types is the site most likely using?","keyword":"Browser does not trust the issuing authority ➡️ Self-signed certificate","correct_raw":"D. Self-signed","explanation":"Certyfikat self-signed jest podpisany własnym kluczem serwera lub organizacji i nie prowadzi domyślnie do zaufanego publicznego urzędu certyfikacji. Jeżeli jego certyfikat główny nie został dodany do magazynu zaufania urządzenia, przeglądarka wyświetli ostrzeżenie. Certyfikat wildcard może być całkowicie zaufany, a certyfikat third-party zwykle pochodzi od rozpoznawanego CA.","options":[{"letter":"A","text":"Wildcard"},{"letter":"B","text":"Root of trust"},{"letter":"C","text":"Third-party"},{"letter":"D","text":"Self-signed"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":399,"question":"Which of the following would most likely be deployed to obtain and analyze attacker activity and techniques?","keyword":"Decoy system designed to observe attacker behavior ➡️ Honeypot","correct_raw":"C. Honeypot","explanation":"Honeypot jest celowo przygotowanym systemem-wabikiem, który ma przyciągnąć napastnika i umożliwić obserwowanie jego narzędzi, poleceń, sposobów poruszania się i technik ataku. Firewall i IDS mogą blokować lub wykrywać ruch, ale nie zapewniają tak kontrolowanego środowiska do badania zachowania atakującego.","options":[{"letter":"A","text":"Firewall"},{"letter":"B","text":"IDS"},{"letter":"C","text":"Honeypot"},{"letter":"D","text":"Layer 3 switch"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":400,"question":"Which of the following objectives is best achieved by a tabletop exercise?","keyword":"Discussion-based exercise used to rehearse roles and procedures ➡️ Familiarization","correct_raw":"A. Familiarizing participants with the incident response process","explanation":"Tabletop exercise jest dyskusyjnym przejściem przez hipotetyczny scenariusz. Uczestnicy poznają swoje role, procedury eskalacji, kanały komunikacji i kolejne etapy reakcji. Nie jest to aktywne dochodzenie ani test techniczny, a rules of engagement ustala się przed ćwiczeniami red/blue team.","options":[{"letter":"A","text":"Familiarizing participants with the incident response process"},{"letter":"B","text":"Deciding red and blue team rules of engagement"},{"letter":"C","text":"Quickly determining the impact of an actual security breach"},{"letter":"D","text":"Conducting multiple security investigations in parallel"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":401,"question":"The private key for a website was stolen, and a new certificate has been issued. Which of the following needs to be updated next?","keyword":"Stolen private key means the old certificate must be revoked ➡️ CRL","correct_raw":"B. CRL","explanation":"Po kradzieży klucza prywatnego stary certyfikat należy unieważnić, nawet jeżeli wydano już nowy. CA publikuje informację o unieważnieniu w CRL, czyli Certificate Revocation List, aby klienci nie ufali skompromitowanemu certyfikatowi. OCSP służy do sprawdzania bieżącego statusu certyfikatu, ale opiera się na informacjach o unieważnieniu utrzymywanych przez CA. CSR służy do zamówienia certyfikatu, a SCEP do automatycznej rejestracji i dystrybucji certyfikatów.","options":[{"letter":"A","text":"SCEP"},{"letter":"B","text":"CRL"},{"letter":"C","text":"OCSP"},{"letter":"D","text":"CSR"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":402,"question":"Which of the following organizational documents is most often used to establish and communicate expectations associated with integrity and ethical behavior within an organization?","keyword":"Communicate acceptable and ethical use expectations to users ➡️ AUP","correct_raw":"A. AUP","explanation":"Acceptable Use Policy określa, w jaki sposób pracownicy i inni użytkownicy mogą korzystać z systemów, sieci i danych organizacji. Może obejmować oczekiwania dotyczące uczciwości, etycznego zachowania, ochrony informacji oraz zakazanych działań. SLA opisuje poziom usług, EULA warunki licencji dla użytkownika końcowego, a MOA formalizuje współpracę pomiędzy organizacjami.","options":[{"letter":"A","text":"AUP"},{"letter":"B","text":"SLA"},{"letter":"C","text":"EULA"},{"letter":"D","text":"MOA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":403,"question":"Which of the following explains how to determine the global regulations that data is subject to regardless of the country where the data is stored?","keyword":"Determine which jurisdiction's laws govern data ➡️ Data sovereignty","correct_raw":"B. Data sovereignty","explanation":"Data sovereignty opisuje zależność danych od przepisów określonej jurysdykcji. Przy ocenie globalnych wymagań trzeba ustalić, jakie prawa dotyczą danych ze względu na ich pochodzenie, właściciela, osoby, których dotyczą, oraz miejsce przetwarzania. Geographic restrictions określają, gdzie dane mogą być przechowywane lub przetwarzane, ale nie są samą zasadą ustalania właściwej jurysdykcji.","options":[{"letter":"A","text":"Geographic dispersion"},{"letter":"B","text":"Data sovereignty"},{"letter":"C","text":"Geographic restrictions"},{"letter":"D","text":"Data segmentation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":404,"question":"An organization's web servers host an online ordering system. The organization discovers that the servers are vulnerable to a malicious JavaScript injection, which could allow attackers to access customer payment information. Which of the following mitigation strategies would be most effective for preventing an attack on the organization's web servers? (Choose two.)","keyword":"JavaScript injection against a web application ➡️ Patch vulnerable software and deploy a WAF","correct_raw":"A. Regularly updating server software and patches | D. Utilizing a web-application firewall","explanation":"Złośliwe wstrzyknięcie JavaScriptu wskazuje na podatność aplikacji webowej, najczęściej XSS. Aktualizacje i poprawki usuwają znane podatności w serwerze, frameworku lub aplikacji, a WAF może rozpoznawać i blokować podejrzane ładunki HTTP przed dotarciem do aplikacji. Szyfrowanie ogranicza skutki ujawnienia danych, lecz nie zapobiega samemu wstrzyknięciu. Skanowanie podatności wykrywa problemy, ale nie jest bezpośrednią kontrolą blokującą atak.","options":[{"letter":"A","text":"Regularly updating server software and patches"},{"letter":"B","text":"Implementing strong password policies"},{"letter":"C","text":"Encrypting sensitive data at rest and in transit"},{"letter":"D","text":"Utilizing a web-application firewall"},{"letter":"E","text":"Performing regular vulnerability scans"},{"letter":"F","text":"Removing payment information from the servers"}],"correctLetters":["A","D"],"isPBQ":false,"multiSelect":true},{"id":405,"question":"Which of the following tools is best for logging and monitoring in a cloud environment?","keyword":"Centralized cloud log collection, correlation and monitoring ➡️ SIEM","correct_raw":"D. SIEM","explanation":"SIEM centralizuje logi z usług chmurowych, systemów, aplikacji i urządzeń bezpieczeństwa, normalizuje zdarzenia, koreluje je oraz generuje alerty. IPS skupia się na ruchu sieciowym, FIM na zmianach plików, a NAC na dopuszczaniu urządzeń do sieci.","options":[{"letter":"A","text":"IPS"},{"letter":"B","text":"FIM"},{"letter":"C","text":"NAC"},{"letter":"D","text":"SIEM"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":406,"question":"During a SQL update of a database, a temporary field that was created was replaced by an attacker in order to allow access to the system. Which of the following best describes this type of vulnerability?","keyword":"Attacker changes a temporary value during a timing window ➡️ Race condition","correct_raw":"A. Race condition","explanation":"Race condition występuje, gdy bezpieczeństwo operacji zależy od kolejności lub czasu wykonania kilku czynności. Napastnik wykorzystuje krótki moment pomiędzy utworzeniem, sprawdzeniem i użyciem tymczasowej wartości, aby podmienić ją przed zakończeniem aktualizacji. Jest to podobne do ataku TOCTOU: system sprawdza jedną wartość, ale później wykorzystuje już wartość zmienioną przez atakującego.","options":[{"letter":"A","text":"Race condition"},{"letter":"B","text":"Memory injection"},{"letter":"C","text":"Malicious update"},{"letter":"D","text":"Side loading"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":407,"question":"A group of developers has a shared backup account to access the source code repository. Which of the following is best way to secure the backup account if there is an SSO failure?","keyword":"Secure and audit an emergency shared privileged account ➡️ PAM","correct_raw":"D. PAM","explanation":"Privileged Access Management może przechowywać hasło konta awaryjnego w sejfie, ograniczać dostęp do uprawnionych osób, wymagać zatwierdzenia, automatycznie zmieniać hasło i rejestrować użycie konta. Jest to właściwe rozwiązanie dla konta typu break-glass używanego podczas awarii SSO. SAML i EAP są mechanizmami uwierzytelniania, a RAS dotyczy zdalnego dostępu.","options":[{"letter":"A","text":"RAS"},{"letter":"B","text":"EAP"},{"letter":"C","text":"SAML"},{"letter":"D","text":"PAM"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":408,"question":"Which of the following elements of digital forensics should a company use if it needs to ensure the integrity of evidence?","keyword":"Protect evidence from alteration or destruction ➡️ Preservation","correct_raw":"A. Preservation","explanation":"Preservation obejmuje zabezpieczenie dowodów przed zmianą, uszkodzeniem lub utratą. W praktyce stosuje się m.in. hashowanie, nośniki tylko do odczytu, kontrolowany dostęp i chain of custody. Acquisition to proces pozyskania kopii danych, e-discovery dotyczy wyszukiwania materiałów na potrzeby prawne, a containment jest fazą reagowania na incydent.","options":[{"letter":"A","text":"Preservation"},{"letter":"B","text":"E-discovery"},{"letter":"C","text":"Acquisition"},{"letter":"D","text":"Containment"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":409,"question":"A company suffered a critical incident where 30GB of data was exfiltrated from the corporate network. Which of the following actions is the most efficient way to identify where the system data was exfiltrated from and what location the attacker sent the data to?","keyword":"Find source and destination of a large outbound transfer ➡️ Firewall and network flow logs","correct_raw":"A. Analyze firewall and network logs for large amounts of outbound traffic to external IP addresses or domains.","explanation":"Logi firewalla, proxy, routerów i przepływów sieciowych pokazują źródłowy host, docelowy adres lub domenę, port, czas i wolumen ruchu. Wyszukanie nietypowego transferu około 30GB jest najszybszym sposobem na ustalenie, z którego systemu dane wyszły i dokąd zostały wysłane. Logi IDS dotyczące rekonesansu ani skany podatności nie pokazują rzeczywistej ścieżki eksfiltracji.","options":[{"letter":"A","text":"Analyze firewall and network logs for large amounts of outbound traffic to external IP addresses or domains."},{"letter":"B","text":"Analyze IPS and IDS logs to find the IP addresses used by the attacker for reconnaissance scans."},{"letter":"C","text":"Analyze endpoint and application logs to see whether file-sharing programs were running on the company systems."},{"letter":"D","text":"Analyze external vulnerability scans and automated reports to identify the systems the attacker could have exploited a remote code vulnerability."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":410,"question":"Which of the following describes the procedures a penetration tester must follow while conducting a test?","keyword":"Authorized scope, methods, timing and restrictions for a penetration test ➡️ Rules of engagement","correct_raw":"A. Rules of engagement","explanation":"Rules of engagement określają zakres testu, dozwolone techniki, terminy, systemy wyłączone z testowania, warunki przerwania działań, sposób komunikacji oraz procedury eskalacji. Penetration tester musi ich przestrzegać przez cały test. Pozostałe określenia nie są standardowymi nazwami takiego dokumentu.","options":[{"letter":"A","text":"Rules of engagement"},{"letter":"B","text":"Rules of acceptance"},{"letter":"C","text":"Rules of understanding"},{"letter":"D","text":"Rules of execution"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":411,"question":"A security analyst wants to better understand the behavior of users and devices in order to gain visibility into potential malicious activities. The analyst needs a control to detect when actions deviate from a common baseline. Which of the following should the analyst use?","keyword":"Detect endpoint behavior that deviates from a normal baseline ➡️ EDR","correct_raw":"C. Endpoint detection and response","explanation":"EDR stale zbiera telemetrię z urządzeń końcowych i analizuje procesy, logowania, połączenia sieciowe, uruchamiane pliki oraz inne zachowania. Może wykrywać aktywność odbiegającą od ustalonego profilu i umożliwiać reakcję, np. izolację hosta. Najdokładniejszym terminem dla analizy zachowania użytkowników i urządzeń byłoby UEBA, ale takiej odpowiedzi nie podano. IPS analizuje głównie ruch sieciowy, sandbox uruchamia podejrzany kod w odizolowanym środowisku, a klasyczny antywirus koncentruje się przede wszystkim na znanych sygnaturach złośliwego oprogramowania.","options":[{"letter":"A","text":"Intrusion prevention system"},{"letter":"B","text":"Sandbox"},{"letter":"C","text":"Endpoint detection and response"},{"letter":"D","text":"Antivirus"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":412,"question":"A legal department must maintain a backup from all devices that have been shredded and recycled by a third party. Which of the following best describes this requirement?","keyword":"Keep required copies even after physical media destruction ➡️ Data retention","correct_raw":"A. Data retention","explanation":"Data retention określa, jak długo organizacja musi zachowywać dane i ich kopie ze względów prawnych, regulacyjnych lub biznesowych. Urządzenia mogą zostać fizycznie zniszczone i poddane recyklingowi, ale wymagane informacje nadal muszą być dostępne w kopii zapasowej przez ustalony okres. Destruction i sanitization opisują usuwanie danych lub nośników, a certification może potwierdzać wykonanie zniszczenia.","options":[{"letter":"A","text":"Data retention"},{"letter":"B","text":"Certification"},{"letter":"C","text":"Sanitization"},{"letter":"D","text":"Destruction"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":413,"question":"Which of the following can be used to compromise a system that is running an RTOS?","keyword":"RTOS and embedded systems may lack strong memory protections ➡️ Memory injection","correct_raw":"B. Memory injection","explanation":"RTOS, czyli real-time operating system, jest często używany w systemach wbudowanych i urządzeniach o ograniczonych zasobach. Niektóre implementacje mają słabszą izolację pamięci lub ochronę procesów, co może umożliwiać wstrzyknięcie kodu do pamięci i zmianę działania systemu. XSS dotyczy aplikacji webowych, ransomware jest typem złośliwego oprogramowania, a replay attack polega na ponownym użyciu przechwyconej komunikacji, nie jest więc najbardziej bezpośrednią odpowiedzią dotyczącą samego RTOS.","options":[{"letter":"A","text":"Cross-site scripting"},{"letter":"B","text":"Memory injection"},{"letter":"C","text":"Replay attack"},{"letter":"D","text":"Ransomware"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":414,"question":"Which of the following threat actors would most likely deface the website of a high-profile music group?","keyword":"Website defacement for attention or notoriety ➡️ Unskilled attacker","correct_raw":"A. Unskilled attacker","explanation":"Defacement strony znanej grupy muzycznej jest typowym działaniem osoby o niewielkich umiejętnościach, która używa gotowych narzędzi lub publicznego exploita, aby zdobyć rozgłos. Organized crime zwykle działa dla zysku, nation-state realizuje cele strategiczne, a insider threat wykorzystuje dostęp wewnętrzny.","options":[{"letter":"A","text":"Unskilled attacker"},{"letter":"B","text":"Organized crime"},{"letter":"C","text":"Nation-state"},{"letter":"D","text":"Insider threat"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":415,"question":"A security architect wants to prevent employees from receiving malicious attachments by email. Which of the following functions should the chosen solution do?","keyword":"Block malicious attachments before delivery ➡️ Inline email scanning","correct_raw":"C. Scan email traffic inline.","explanation":"Rozwiązanie działające inline znajduje się na ścieżce dostarczania poczty i może przeskanować załącznik, zablokować wiadomość, poddać plik analizie lub umieścić go w kwarantannie zanim dotrze do odbiorcy. Tap i monitoring są pasywne i nie zapobiegają dostarczeniu. SPF sprawdza uprawnienie serwera do wysyłania poczty dla domeny, ale nie analizuje załączników. Reputacja IP może ograniczyć część spamu, lecz nie wykryje każdego złośliwego pliku.","options":[{"letter":"A","text":"Apply IP address reputation data."},{"letter":"B","text":"Tap and monitor the email feed."},{"letter":"C","text":"Scan email traffic inline."},{"letter":"D","text":"Check SPF records."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":416,"question":"Which of the following activities is the first stage in the incident response process?","keyword":"First available incident-response phase ➡️ Detection","correct_raw":"A. Detection","explanation":"Pełny proces reagowania zwykle zaczyna się od przygotowania, ale takiej opcji nie podano. Spośród dostępnych odpowiedzi pierwszym etapem jest wykrycie potencjalnego incydentu. Następnie zdarzenie jest analizowane i weryfikowane, może zostać formalnie zadeklarowane jako incydent, a później następuje containment. Nie można ograniczać incydentu, którego wcześniej nie wykryto.","options":[{"letter":"A","text":"Detection"},{"letter":"B","text":"Declaration"},{"letter":"C","text":"Containment"},{"letter":"D","text":"Verification"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":417,"question":"Which of the following is the main consideration when a legacy system that is a critical part of a company's infrastructure cannot be replaced?","keyword":"Irreplaceable critical legacy system ➡️ Single point of failure","correct_raw":"C. Single point of failure","explanation":"Jeśli k
