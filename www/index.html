, B. TPM presence","explanation":"Wdrażanie szyfrowania całego dysku (Full Disk Encryption - FDE, np. Windows BitLocker) w przedsiębiorstwie najczęściej opiera się na obecności sprzętowego układu kryptograficznego na płycie głównej – TPM (Trusted Platform Module), w którym bezpiecznie przechowywane są klucze. Ponadto bezwzględnie wymagany jest centralny depozyt kluczy (Key escrow), aby firma posiadała zapasowy sposób na odszyfrowanie dysku w przypadku, gdy pracownik zapomni hasła lub złośliwie zablokuje urządzenie.","options":[{"letter":"A","text":"Key escrow"},{"letter":"B","text":"TPM presence"},{"letter":"C","text":"Digital signatures"},{"letter":"D","text":"Data tokenization"},{"letter":"E","text":"Public key management"},{"letter":"F","text":"Certificate authority linking"}],"correctLetters":["A","B"],"isPBQ":false,"multiSelect":true},{"id":83,"question":"A security analyst scans a company's public network and discovers a host is running a remote desktop that can be used to access the production network. Which of the following changes should the security analyst recommend?","keyword":"Host running remote desktop on public network ➡️ VPN and jump server","correct_raw":"B. Setting up a VPN and placing the jump server inside the firewall","explanation":"Bezpośrednie udostępnienie usługi RDP w publicznym internecie istotnie zwiększa ryzyko skanowania, ataków na hasła i wykorzystania podatności. Bezpieczniejszym rozwiązaniem jest umieszczenie jump servera za zaporą oraz wymaganie uwierzytelnionego i szyfrowanego połączenia VPN przed uzyskaniem dostępu administracyjnego.","options":[{"letter":"A","text":"Changing the remote desktop port to a non-standard number"},{"letter":"B","text":"Setting up a VPN and placing the jump server inside the firewall"},{"letter":"C","text":"Using a proxy for web connections from the remote desktop server"},{"letter":"D","text":"Connecting the remote server to the domain and increasing the password length"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":84,"question":"An enterprise has been experiencing attacks focused on exploiting vulnerabilities in older browser versions with well-known exploits. Which of the following security solutions should be configured to best provide the ability to monitor and block these known signature-based attacks?","keyword":"Monitor and block / Known signature-based attacks ➡️ IPS","correct_raw":"D. IPS","explanation":"System Zapobiegania Włamaniom (Intrusion Prevention System - IPS) to aktywne rozwiązanie bezpieczeństwa umieszczane na trasie pakietów (in-line). W przeciwieństwie do IDS, który tylko zgłasza alerty (monitor), IPS potrafi na bieżąco analizować sieć ORAZ aktywnie blokować podejrzany ruch w oparciu o bazę znanych sygnatur (signature-based).","options":[{"letter":"A","text":"ACL"},{"letter":"B","text":"DLP"},{"letter":"C","text":"IDS"},{"letter":"D","text":"IPS"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":85,"question":"Security controls in a data center are being reviewed to ensure data is properly protected and that human life considerations are included. Which of the following best describes how the controls should be set up?","keyword":"Human life considerations ➡️ Safety controls should fail open","correct_raw":"C. Safety controls should fail open.","explanation":"Gdy w grę wchodzi ochrona życia i zdrowia ludzi (np. pożar lub zadymienie w centrum danych), fizyczne systemy zabezpieczeń muszą działać w trybie \"Fail Open\" (otwarcie w razie awarii zasilania). Oznacza to, że magnetyczne zamki w drzwiach ewakuacyjnych automatycznie zwalniają blokady po przerwaniu dopływu prądu, pozwalając na bezproblemową ucieczkę.","options":[{"letter":"A","text":"Remote access points should fail closed."},{"letter":"B","text":"Logging controls should fail open."},{"letter":"C","text":"Safety controls should fail open."},{"letter":"D","text":"Logical security controls should fail closed."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":86,"question":"Which of the following would be best suited for constantly changing environments?","keyword":"Constantly changing environments ➡️ Containers","correct_raw":"B. Containers","explanation":"Kontenery (np. Docker) to wydzielone pakiety z aplikacjami, które są niezwykle lekkie, można je bezproblemowo i błyskawicznie \"odpalić\" oraz zniszczyć na dowolnym środowisku z zachowaniem ich niezmienionej struktury. Idealnie pasują do dynamicznych, zwinnych i stale rotujących nowoczesnych architektur informatycznych (w przeciwieństwie do np. systemów SCADA, które wymagają sztywnych konfiguracji).","options":[{"letter":"A","text":"RTOS"},{"letter":"B","text":"Containers"},{"letter":"C","text":"Embedded systems"},{"letter":"D","text":"SCADA"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":87,"question":"Which of the following incident response activities ensures evidence is properly handled?","keyword":"Ensures evidence is properly handled ➡️ Chain of custody","correct_raw":"B. Chain of custody","explanation":"Łańcuch dowodowy (Chain of custody) to wysoce rygorystyczny, formalny proces dokumentowania historii posiadania sprzętu w trakcie śledztwa. Prowadzi on rejestr wszystkich osób, które przejmowały, badały lub przechowywały dany dowód cyfrowy. Zapewnia to integralność materiału w potencjalnym postępowaniu sądowym.","options":[{"letter":"A","text":"E-discovery"},{"letter":"B","text":"Chain of custody"},{"letter":"C","text":"Legal hold"},{"letter":"D","text":"Preservation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":88,"question":"An accounting clerk sent money to an attacker's bank account after receiving fraudulent instructions to use a new account. Which of the following would most likely prevent this activity in the future?","keyword":"Sent money after fraudulent instructions / Prevent this activity ➡️ Updating processes for sending wire transfers","correct_raw":"D. Updating processes for sending wire transfers","explanation":"Wektor za pomocą którego wyłudzono tu przelew to inżynieria społeczna i oszustwo finansowe (CEO Fraud / BEC). Najmocniejszym zabezpieczeniem zapobiegającym stratom kapitałowym w przyszłości są twarde środki administracyjne i modyfikacja procedur wewnętrznych – np. zasada, że każda prośba o przelew bankowy i zmianę numeru konta kontrahenta musi zostać potwierdzona werbalnie przez telefon (out-of-band communication).","options":[{"letter":"A","text":"Standardizing security incident reporting"},{"letter":"B","text":"Executing regular phishing campaigns"},{"letter":"C","text":"Implementing insider threat detection measures"},{"letter":"D","text":"Updating processes for sending wire transfers"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":89,"question":"A systems administrator is creating a script that would save time and prevent human error when performing account creation for a large number of end users. Which of the following would be a good use case for this task?","keyword":"Script to save time and prevent human error / Account creation ➡️ Orchestration","correct_raw":"B. Orchestration","explanation":"Orkiestracja (Orchestration) odnosi się do spajania i automatyzowania wielu rozbudowanych zadań informatycznych. Użycie pojedynczego skryptu po to, by automatycznie wykreować nowych użytkowników i skonfigurować ich we wszystkich wymaganych podsystemach naraz, eliminuje ludzką niedokładność i drastycznie przyspiesza wdrażanie kont.","options":[{"letter":"A","text":"Off-the-shelf software"},{"letter":"B","text":"Orchestration"},{"letter":"C","text":"Baseline"},{"letter":"D","text":"Policy enforcement"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":90,"question":"A company's marketing department collects, modifies, and stores sensitive customer data. The infrastructure team is responsible for securing the data while in transit and at rest. Which of the following data roles describes the customer?","keyword":"Data role describes the customer ➡️ Subject","correct_raw":"C. Subject","explanation":"W systematyce prywatności danych (np. według norm takich jak RODO/GDPR), jednostki – czyli osoby fizyczne, klienci – o których gromadzone są poszczególne informacje osobiste, definiuje się rolą „Podmiotu danych” (Data Subject). Z kolei organizacja ustalająca cel to zazwyczaj \"Data Owner/Controller\".","options":[{"letter":"A","text":"Processor"},{"letter":"B","text":"Custodian"},{"letter":"C","text":"Subject"},{"letter":"D","text":"Owner"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":91,"question":"Which of the following describes the maximum allowance of accepted risk?","keyword":"Maximum allowance of accepted risk ➡️ Risk threshold","correct_raw":"D. Risk threshold","explanation":"Próg ryzyka (Risk threshold) to twardy, maksymalny limit (tolerancja) ryzyka, jaki organizacja zgadza się ponieść w danym obszarze, zanim uzna, że sytuacja jest nie do zaakceptowania i wymusi natychmiastowe wdrożenie działań zapobiegawczych lub mitygujących.","options":[{"letter":"A","text":"Risk indicator"},{"letter":"B","text":"Risk level"},{"letter":"C","text":"Risk score"},{"letter":"D","text":"Risk threshold"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":92,"question":"A security analyst receives alerts about an internal system sending a large amount of unusual DNS queries to systems on the internet over short periods of time during non-business hours. Which of the following is most likely occurring?","keyword":"Unusual DNS queries / short periods / non-business hours ➡️ Data is being exfiltrated","correct_raw":"B. Data is being exfiltrated.","explanation":"Masowe, nietypowe zapytania DNS często są objawem tzw. tunelowania DNS (DNS tunneling). Atakujący używają tego protokołu, który rzadko jest filtrowany przez firewalle, jako ukrytego kanału do po cichu wyprowadzania (eksfiltracji) skradzionych z firmy danych na swoje serwery, zwłaszcza poza godzinami pracy.","options":[{"letter":"A","text":"A worm is propagating across the network."},{"letter":"B","text":"Data is being exfiltrated."},{"letter":"C","text":"A logic bomb is deleting data."},{"letter":"D","text":"Ransomware is encrypting files."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":93,"question":"A technician is opening ports on a firewall for a new system being deployed and supported by a SaaS provider. Which of the following is a risk in the new system?","keyword":"Supported by a SaaS provider / risk ➡️ Supply chain vendor","correct_raw":"C. Supply chain vendor","explanation":"Umożliwienie integracji zewnętrznemu dostawcy SaaS poprzez otwarcie portów na firewallu w naturalny sposób powiększa powierzchnię ataku. Organizacja jest w tym momencie narażona na ryzyko tzw. łańcucha dostaw (Supply chain vendor risk) – jeśli dostawca chmurowy zostanie zhakowany, organizacja również może na tym ucierpieć.","options":[{"letter":"A","text":"Default credentials"},{"letter":"B","text":"Non-segmented network"},{"letter":"C","text":"Supply chain vendor"},{"letter":"D","text":"Vulnerable software"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":94,"question":"A systems administrator is working on a solution with the following requirements: Provide a secure zone. Enforce a company-wide access control policy. Reduce the scope of threats. Which of the following is the systems administrator setting up?","keyword":"Provide a secure zone / Reduce the scope of threats ➡️ Zero Trust","correct_raw":"A. Zero Trust","explanation":"Architektura „Zero Zaufania” (Zero Trust) zakłada, że nie ma znaczenia, czy ruch pochodzi z wewnątrz, czy z zewnątrz sieci – każdy musi być weryfikowany. Stosuje się w niej m.in. mikrosegmentację (tworzenie bardzo wielu bezpiecznych mini-stref), która egzekwuje uprawnienia kontroli dostępu i radykalnie zmniejsza zakres potencjalnego ataku (promień rażenia) po udanym włamaniu.","options":[{"letter":"A","text":"Zero Trust"},{"letter":"B","text":"AAA"},{"letter":"C","text":"Non-repudiation"},{"letter":"D","text":"CIA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":95,"question":"Which of the following involves an attempt to take advantage of database misconfigurations?","keyword":"Database misconfigurations ➡️ SQL injection","correct_raw":"B. SQL injection","explanation":"Ataki typu SQL Injection nakierowane są stricte na bazy danych obsługujące aplikacje webowe. Haker wykorzystuje w nich luki w autoryzacji (np. niewłaściwą walidację znaków) i błędną, zbyt otwartą konfigurację uprawnień silnika bazodanowego, by zmodyfikować lub skopiować zawarte tam rekordy.","options":[{"letter":"A","text":"Buffer overflow"},{"letter":"B","text":"SQL injection"},{"letter":"C","text":"VM escape"},{"letter":"D","text":"Memory injection"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":96,"question":"Which of the following is used to validate a certificate when it is presented to a user?","keyword":"Validate a certificate ➡️ OCSP","correct_raw":"A. OCSP","explanation":"OCSP (Online Certificate Status Protocol) to specjalny protokół służący do weryfikacji w czasie rzeczywistym. Dzięki niemu przeglądarki użytkowników szybko odpytują Urząd Certyfikacji (CA) i sprawdzają na bieżąco, czy dany certyfikat bezpieczeństwa (SSL/TLS) dla strony, na którą wchodzą, nie został przedwcześnie unieważniony i wciąż jest godny zaufania.","options":[{"letter":"A","text":"OCSP"},{"letter":"B","text":"CSR"},{"letter":"C","text":"CA"},{"letter":"D","text":"CRC"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":97,"question":"One of a company's vendors sent an analyst a security bulletin that recommends a BIOS update. Which of the following vulnerability types is being addressed by the patch?","keyword":"BIOS update ➡️ Firmware","correct_raw":"B. Firmware","explanation":"BIOS (podobnie jak nowoczesne UEFI) to oprogramowanie układowe (Firmware), które jest instalowane fabrycznie prosto w pamięci na płycie głównej urządzenia, służąc do inicjalizacji sprzętu podczas rozruchu. Wszelkie aktualizacje BIOS-u dotyczą łatania podatności w tzw. warstwie firmware'u.","options":[{"letter":"A","text":"Virtualization"},{"letter":"B","text":"Firmware"},{"letter":"C","text":"Application"},{"letter":"D","text":"Operating system"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":98,"question":"Which of the following is used to quantitatively measure the criticality of a vulnerability?","keyword":"Quantitatively measure the criticality ➡️ CVSS","correct_raw":"B. CVSS","explanation":"CVSS (Common Vulnerability Scoring System) to międzynarodowy standard do ilościowego (liczbowego) oceniania powagi nowo wykrytej luki w bezpieczeństwie oprogramowania. Ocenia krytyczność luki z reguły w skali od 0 do 10, umożliwiając ustalenie odpowiednich priorytetów łatkowania w organizacji (gdzie 10 to stan krytyczny).","options":[{"letter":"A","text":"CVE"},{"letter":"B","text":"CVSS"},{"letter":"C","text":"CIA"},{"letter":"D","text":"CERT"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":99,"question":"Which of the following actions could a security engineer take to ensure workstations and servers are properly monitored for unauthorized changes and software?","keyword":"Monitor workstations and servers for unauthorized software ➡️ Install endpoint management software","correct_raw":"D. Install endpoint management software on all systems","explanation":"Aby widzieć zachowanie wprost na pojedynczych komputerach użytkowników oraz serwerach – to znaczy rejestrować nieautoryzowane oprogramowanie i zmiany plików w systemie – analitycy potrzebują mieć zainstalowane agenty zintegrowane z hostem (na \"Końcówkach\"). Rozwiązaniem jest System Zarządzania Punktami Końcowymi (Endpoint Management / np. EDR / HIDS).","options":[{"letter":"A","text":"Configure all systems to log scheduled tasks."},{"letter":"B","text":"Collect and monitor all traffic exiting the network."},{"letter":"C","text":"Block traffic based on known malicious signatures."},{"letter":"D","text":"Install endpoint management software on all systems"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":100,"question":"An organization is leveraging a VPN between its headquarters and a branch location. Which of the following is the VPN protecting?","keyword":"VPN protecting ➡️ Data in transit","correct_raw":"B. Data in transit","explanation":"Główną funkcją Wirtualnej Sieci Prywatnej (VPN), np. korzystającej z szyfrowania IPsec łączącego siedziby firmy (Site-to-Site VPN), jest ustanowienie bezpiecznego tunelu poprzez niezaufany internet. Chroni on pakiety w trakcie ich \"podróży\", czyli dane w tranzycie (Data in transit) przed próbami odczytania z zewnątrz.","options":[{"letter":"A","text":"Data in use"},{"letter":"B","text":"Data in transit"},{"letter":"C","text":"Geographic restrictions"},{"letter":"D","text":"Data sovereignty"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":101,"question":"After reviewing the following vulnerability scanning report: [Raport wskazuje port 23 Telnet jako \"High Severity - Use of an insecure network protocol\"]. A security analyst performs the following test: [nmap -p 23 192.168.14.6 --script telnet-encryption, który zwraca wynik: \"Telnet server supports encryption\"]. Which of the following would the security analyst conclude for this reported vulnerability?","keyword":"Telnet reported as insecure / Script shows it supports encryption ➡️ False positive","correct_raw":"A. It is a false positive.","explanation":"Skaner zaklasyfikował usługę na porcie 23 jako nieszyfrowany Telnet. Ręczna weryfikacja wskazała, że serwer obsługuje szyfrowanie, dlatego w kontekście pytania alarm należy uznać za false positive. W rzeczywistym środowisku należałoby dodatkowo potwierdzić, że szyfrowanie jest wymagane i używane podczas każdej sesji, a tryb cleartext jest wyłączony.","options":[{"letter":"A","text":"It is a false positive."},{"letter":"B","text":"A rescan is required."},{"letter":"C","text":"It is considered noise."},{"letter":"D","text":"Compensating controls exist."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":102,"question":"An organization disabled unneeded services and placed a firewall in front of a business-critical legacy system. Which of the following best describes the actions taken by the organization?","keyword":"Disabled unneeded services and placed firewall / Legacy system ➡️ Compensating controls","correct_raw":"D. Compensating controls","explanation":"Przestarzałe systemy (legacy systems) mają to do siebie, że nie da się ich już zaktualizować (brak wsparcia producenta) ani zaimplementować w nich nowoczesnych, wbudowanych funkcji bezpieczeństwa. Aby to zrekompensować, zabezpiecza się je z zewnątrz (np. stawiając przed nimi zaporę i wyłączając zbędne usługi). Takie działania zastępcze określa się jako kontrolę kompensującą (Compensating controls).","options":[{"letter":"A","text":"Exception"},{"letter":"B","text":"Segmentation"},{"letter":"C","text":"Risk transfer"},{"letter":"D","text":"Compensating controls"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":103,"question":"A security consultant needs secure, remote access to a client environment. Which of the following should the security consultant most likely use to gain access?","keyword":"Secure, remote access ➡️ IPSec","correct_raw":"C. IPSec","explanation":"Aby uzyskać bezpieczny, zdalny dostęp do środowiska klienta przez internet, należy użyć technologii Wirtualnej Sieci Prywatnej (VPN). IPSec (Internet Protocol Security) to najpopularniejszy standardowy protokół kryptograficzny używany właśnie do zabezpieczania i szyfrowania tuneli VPN.","options":[{"letter":"A","text":"EAP"},{"letter":"B","text":"DHCP"},{"letter":"C","text":"IPSec"},{"letter":"D","text":"NAT"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":104,"question":"Which of the following should a systems administrator use to ensure an easy deployment of resources within the cloud provider?","keyword":"Easy deployment of resources within the cloud ➡️ Infrastructure as code","correct_raw":"B. Infrastructure as code","explanation":"Infrastruktura jako Kod (Infrastructure as Code - IaC) to podejście polegające na zarządzaniu zasobami chmurowymi i serwerami za pomocą plików konfiguracyjnych (skryptów), a nie ręcznego wyklikiwania ich w panelu. Umożliwia to błyskawiczne, łatwe, powtarzalne i zautomatyzowane wdrażanie identycznych środowisk.","options":[{"letter":"A","text":"Software as a service"},{"letter":"B","text":"Infrastructure as code"},{"letter":"C","text":"Internet of Things"},{"letter":"D","text":"Software-defined networking"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":105,"question":"After a security awareness training session, a user called the IT help desk and reported a suspicious call. The suspicious caller stated that the Chief Financial Officer wanted credit card information in order to close an invoice. Which of the following topics did the user recognize from the training?","keyword":"Suspicious call / Caller stated CFO wanted credit card info ➡️ Social engineering","correct_raw":"C. Social engineering","explanation":"Sytuacja, w której atakujący dzwoni do ofiary i próbuje wykorzystać autorytet szefa (CFO), by wyłudzić od niej poufne dane (dane karty), to socjotechnika (Social engineering), a dokładniej jej głosowa odmiana – Vishing. Nie jest to \"Executive whaling\", ponieważ atakujący podszywa się pod szefa, a celem ataku jest zwykły pracownik (w whalingu celem ataku jest sam prezes).","options":[{"letter":"A","text":"Insider threat"},{"letter":"B","text":"Email phishing"},{"letter":"C","text":"Social engineering"},{"letter":"D","text":"Executive whaling"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":106,"question":"A security administrator is deploying a DLP solution to prevent the exfiltration of sensitive customer data. Which of the following should the administrator do first?","keyword":"Deploying DLP / What to do first ➡️ Apply classifications to the data","correct_raw":"C. Apply classifications to the data.","explanation":"System Zapobiegania Utracie Danych (Data Loss Prevention - DLP) to narzędzie, które musi wiedzieć, czego dokładnie ma pilnować. Zanim wdroży się reguły blokowania, organizacja musi zidentyfikować i sklasyfikować swoje dane (Apply classifications) – tzn. nadać im metki \"poufne\", \"prywatne\", \"publiczne\", aby system DLP mógł rozpoznawać wrażliwe dokumenty klientów.","options":[{"letter":"A","text":"Block access to cloud storage websites."},{"letter":"B","text":"Create a rule to block outgoing email attachments."},{"letter":"C","text":"Apply classifications to the data."},{"letter":"D","text":"Remove all user permissions from shares on the file server."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":107,"question":"An administrator assists the legal and compliance team with ensuring information about customer transactions is archived for the proper time period. Which of the following data policies is the administrator carrying out?","keyword":"Information archived for the proper time period ➡️ Retention","correct_raw":"B. Retention","explanation":"Wymóg prawny i regulacyjny określający, przez jaki konkretnie czas organizacja ma obowiązek archiwizować i przechowywać określone zbiory danych (np. dokumentację finansową przez 5 lat), nosi nazwę Polityki Przechowywania Danych (Data Retention policy).","options":[{"letter":"A","text":"Compromise"},{"letter":"B","text":"Retention"},{"letter":"C","text":"Analysis"},{"letter":"D","text":"Transfer"},{"letter":"E","text":"Inventory"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":108,"question":"A company is working with a vendor to perform a penetration test. Which of the following includes an estimate about the number of hours required to complete the engagement?","keyword":"Penetration test / Estimate about number of hours ➡️ SOW","correct_raw":"A. SOW","explanation":"SOW (Statement of Work - Zakres Prac) to umowny dokument projektowy, który definiuje dokładny harmonogram, produkty końcowe, nakład pracy oraz szacunkową liczbę godzin wymaganych do zrealizowania usługi przez firmę zewnętrzną (w tym przypadku – testów penetracyjnych).","options":[{"letter":"A","text":"SOW"},{"letter":"B","text":"BPA"},{"letter":"C","text":"SLA"},{"letter":"D","text":"NDA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":109,"question":"A Chief Information Security Officer (CISO) wants to explicitly raise awareness about the increase of ransomware-as-a-service in a report to the management team. Which of the following best describes the threat actor in the CISO’s report?","keyword":"Ransomware-as-a-service (RaaS) / Threat actor ➡️ Organized crime","correct_raw":"D. Organized crime","explanation":"Ransomware-as-a-Service jest modelem przestępczym, w którym operatorzy tworzą i utrzymują narzędzia ransomware, a następnie udostępniają je afiliantom w zamian za opłatę lub udział w okupie. Taka zorganizowana, nastawiona na korzyść finansową działalność jest charakterystyczna dla zorganizowanej przestępczości.","options":[{"letter":"A","text":"Insider threat"},{"letter":"B","text":"Hacktivist"},{"letter":"C","text":"Nation-state"},{"letter":"D","text":"Organized crime"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":110,"question":"Which of the following practices would be best to prevent an insider from introducing malicious code into a company's development process?","keyword":"Prevent insider from introducing malicious code ➡️ Peer review and approval","correct_raw":"D. Peer review and approval","explanation":"Skuteczne powstrzymanie programisty (insider) przed celowym wstrzyknięciem złośliwego backdoora we własny kod źródłowy firmy wymaga zasady podwójnej weryfikacji. Oznacza to, że żaden kod nie trafi na środowisko produkcyjne, dopóki inny, niezależny programista z zespołu nie dokona jego inspekcji i zatwierdzenia (Peer review and approval). Automatyczne skanery (A) rzadko wyłapują unikalne, ręcznie zaprojektowane luki logiczne.","options":[{"letter":"A","text":"Code scanning for vulnerabilities"},{"letter":"B","text":"Open-source component usage"},{"letter":"C","text":"Quality assurance testing"},{"letter":"D","text":"Peer review and approval"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":111,"question":"Which of the following can best protect against an employee inadvertently installing malware on a company system?","keyword":"Protect against employee inadvertently installing malware ➡️ Application allow list","correct_raw":"D. Application allow list","explanation":"Lista dozwolonych aplikacji (Application allow list / Whitelisting) to najbardziej restrykcyjna i najskuteczniejsza metoda ochrony punktów końcowych. Nawet jeśli pracownik z uprawnieniami (niechcący) pobierze i kliknie plik ze złośliwym oprogramowaniem, system operacyjny zablokuje jego wykonanie, ponieważ pliku tego nie ma na odgórnie zdefiniowanej liście zaufanych aplikacji.","options":[{"letter":"A","text":"Host-based firewall"},{"letter":"B","text":"System isolation"},{"letter":"C","text":"Least privilege"},{"letter":"D","text":"Application allow list"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":112,"question":"A company is adding a clause to its AUP that states employees are not allowed to modify the operating system on mobile devices. Which of the following vulnerabilities is the organization addressing?","keyword":"Not allowed to modify the operating system on mobile devices ➡️ Jailbreaking","correct_raw":"C. Jailbreaking","explanation":"Modyfikacja oprogramowania systemowego na urządzeniach mobilnych, mająca na celu usunięcie zabezpieczeń i ograniczeń nałożonych przez producenta (np. Apple), nosi nazwę \"Jailbreaking\" (lub \"Rooting\" w środowisku Android). Organizacja zakazuje tego w swojej polityce (AUP), aby pracownicy nie obniżali integralności zabezpieczeń swoich telefonów używanych w pracy.","options":[{"letter":"A","text":"Cross-site scripting"},{"letter":"B","text":"Buffer overflow"},{"letter":"C","text":"Jailbreaking"},{"letter":"D","text":"Side loading"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":113,"question":"Which of the following would be the best ways to ensure only authorized personnel can access a secure facility? (Choose two.)","keyword":"Ensure only authorized personnel access a secure facility ➡️ Badge access / Access control vestibule","correct_raw":"C. Badge access, D. Access control vestibule","explanation":"Aby fizycznie zagwarantować, że do strefy o podwyższonym bezpieczeństwie wejdą tylko osoby z uprawnieniami, należy użyć kart zbliżeniowych (Badge access) do uwierzytelniania, oraz śluzy kontroli dostępu (Access control vestibule / Mantrap), która powstrzymuje intruzów przed wślizgnięciem się za osobą uprawnioną (atak typu tailgating).","options":[{"letter":"A","text":"Fencing"},{"letter":"B","text":"Video surveillance"},{"letter":"C","text":"Badge access"},{"letter":"D","text":"Access control vestibule"},{"letter":"E","text":"Sign-in sheet"},{"letter":"F","text":"Sensor"}],"correctLetters":["C","D"],"isPBQ":false,"multiSelect":true},{"id":114,"question":"An organization would like to store customer data on a separate part of the network that is not accessible to users on the main corporate network. Which of the following should the administrator use to accomplish this goal?","keyword":"Store data on a separate part of the network / Not accessible to main network ➡️ Segmentation","correct_raw":"A. Segmentation","explanation":"Segmentacja sieci (Network Segmentation) polega na podziale dużej, płaskiej sieci na mniejsze, bezpieczne fragmenty (np. używając wirtualnych sieci LAN - VLANów oraz list kontroli dostępu na przełącznikach). Dzięki temu można stworzyć oddzielną \"strefę\" z danymi klientów i zabronić ruchu do niej ze zwykłej sieci pracowniczej.","options":[{"letter":"A","text":"Segmentation"},{"letter":"B","text":"Isolation"},{"letter":"C","text":"Patching"},{"letter":"D","text":"Encryption"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":115,"question":"Which of the following is the most common data loss path for an air-gapped network?","keyword":"Data loss path for an air-gapped network ➡️ Removable devices","correct_raw":"D. Removable devices","explanation":"Sieć izolowana fizycznie (Air-gapped network) to sieć w żaden sposób niepodłączona do internetu czy innych zewnętrznych segmentów. Jedynym sposobem, by wynieść z niej poufne dane lub dostarczyć tam wirusa (jak miało to miejsce ze słynnym Stuxnetem), jest użycie fizycznych nośników przenośnych podłączanych prosto do komputerów (Removable devices, np. pendrive USB).","options":[{"letter":"A","text":"Bastion host"},{"letter":"B","text":"Unsecured Bluetooth"},{"letter":"C","text":"Unpatched OS"},{"letter":"D","text":"Removable devices"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":116,"question":"Malware spread across a company's network after an employee visited a compromised industry blog. Which of the following best describes this type of attack?","keyword":"Visited a compromised industry blog ➡️ Watering-hole","correct_raw":"C. Watering-hole","explanation":"Atak typu \"Wodopój\" (Watering-hole attack) polega na wstrzyknięciu złośliwego kodu na stronę internetową o specyficznej tematyce (np. popularny blog branżowy, portal z przepisami prawa), o której napastnik wie, że pracownicy danej instytucji często i chętnie ją odwiedzają. Celem jest zainfekowanie ofiar na ich \"własnym, zaufanym terenie\".","options":[{"letter":"A","text":"Impersonation"},{"letter":"B","text":"Disinformation"},{"letter":"C","text":"Watering-hole"},{"letter":"D","text":"Smishing"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":117,"question":"An organization is struggling with scaling issues on its VPN concentrator and internet circuit due to remote work. The organization is looking for a software solution that will allow it to reduce traffic on the VPN and internet circuit, while still providing encrypted tunnel access to the data center and monitoring of remote employee internet traffic. Which of the following will help achieve these objectives?","keyword":"Reduce traffic on VPN / monitor remote internet traffic / software solution ➡️ SASE","correct_raw":"A. Deploying a SASE solution to remote employees","explanation":"SASE (Secure Access Service Edge) łączy bezpieczny dostęp sieciowy z chmurowymi funkcjami bezpieczeństwa. Rozwiązanie to przenosi całe uwierzytelnianie, filtrowanie i tunelowanie na brzeg chmury (tzw. krawędź), zdejmując obciążenie sprzętowe z lokalnych punktów VPN firmy i zachowując pełny monitoring pracowników z domu.","options":[{"letter":"A","text":"Deploying a SASE solution to remote employees"},{"letter":"B","text":"Building a load-balanced VPN solution with redundant internet"},{"letter":"C","text":"Purchasing a low-cost SD-WAN solution for VPN traffic"},{"letter":"D","text":"Using a cloud provider to create additional VPN concentrators"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":118,"question":"Which of the following is the best reason to complete an audit in a banking environment?","keyword":"Best reason to complete an audit / Banking environment ➡️ Regulatory requirement","correct_raw":"A. Regulatory requirement","explanation":"Sektor bankowy jest uwarunkowany niezwykle surowym nadzorem finansowym i państwowym. Najistotniejszą z przyczyn, dla których instytucje finansowe muszą wdrażać zabezpieczenia i przeprowadzać obszerne audyty, są absolutne wymogi prawne i legislacyjne (Regulatory requirement) ustanawiane m.in. przez rząd czy systemy płatnicze (np. PCI DSS).","options":[{"letter":"A","text":"Regulatory requirement"},{"letter":"B","text":"Organizational change"},{"letter":"C","text":"Self-assessment requirement"},{"letter":"D","text":"Service-level requirement"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":119,"question":"Which of the following security concepts is the best reason for permissions on a human resources fileshare to follow the principle of least privilege?","keyword":"Human resources fileshare / least privilege ➡️ Confidentiality","correct_raw":"C. Confidentiality","explanation":"Zasób HR zawiera wysoce poufne dane (PII), takie jak zarobki, dane medyczne i adresy pracowników. Zastosowanie Zasady Najmniejszych Uprawnień (Least Privilege) poprzez restrykcyjne odcięcie dostępu dla zwykłych użytkowników chroni przede wszystkim zasadę Poufności (Confidentiality) tych specyficznych danych, minimalizując ryzyko ich wycieku i nieautoryzowanego wglądu.","options":[{"letter":"A","text":"Integrity"},{"letter":"B","text":"Availability"},{"letter":"C","text":"Confidentiality"},{"letter":"D","text":"Non-repudiation"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":120,"question":"Which of the following are cases in which an engineer should recommend the decommissioning of a network device? (Choose two.)","keyword":"Recommend decommissioning of a network device ➡️ Encryption level cannot meet standards / Unable to receive updates","correct_raw":"E. The device's encryption level cannot meet organizational standards., F. The device is unable to receive authorized updates.","explanation":"Urządzenie należy rozważyć do wycofania, gdy jego ograniczeń bezpieczeństwa nie można już usunąć konfiguracją ani aktualizacją. Brak obsługi wymaganych standardów szyfrowania oraz brak możliwości instalowania autoryzowanych poprawek oznaczają trwałe ryzyko. Używanie haseł w postaci jawnej jest natomiast problemem konfiguracyjnym, który może zostać skorygowany, o ile urządzenie obsługuje bezpieczniejszy mechanizm.","options":[{"letter":"A","text":"The device has been moved from a production environment to a test environment."},{"letter":"B","text":"The device is configured to use cleartext passwords."},{"letter":"C","text":"The device is moved to an isolated segment on the enterprise network."},{"letter":"D","text":"The device is moved to a different location in the enterprise."},{"letter":"E","text":"The device's encryption level cannot meet organizational standards."},{"letter":"F","text":"The device is unable to receive authorized updates."}],"correctLetters":["E","F"],"isPBQ":false,"multiSelect":true},{"id":121,"question":"A company is required to perform a risk assessment on an annual basis. Which of the following types of risk assessments does this requirement describe?","keyword":"Perform a risk assessment on an annual basis ➡️ Recurring","correct_raw":"C. Recurring","explanation":"Wymóg przeprowadzania oceny ryzyka co roku (na bazie rocznej) oznacza, że jest to ocena cykliczna, powtarzająca się (Recurring). Działania „Ad hoc” wykonuje się doraźnie, „One time” to akcje jednorazowe, a „Continuous” oznacza monitoring w czasie rzeczywistym.","options":[{"letter":"A","text":"Continuous"},{"letter":"B","text":"Ad hoc"},{"letter":"C","text":"Recurring"},{"letter":"D","text":"One time"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":122,"question":"After a recent ransomware attack on a company's system, an administrator reviewed the log files. Which of the following control types did the administrator use?","keyword":"Reviewed the log files after an attack ➡️ Detective","correct_raw":"B. Detective","explanation":"Przeglądanie i analiza logów systemowych już po fakcie (po ataku) w celu ustalenia, w jaki sposób doszło do włamania, to klasyczny środek detektywistyczny (Detective control). Nie zapobiega on incydentowi (jak Preventive), ale pozwala na jego wykrycie i udokumentowanie.","options":[{"letter":"A","text":"Compensating"},{"letter":"B","text":"Detective"},{"letter":"C","text":"Preventive"},{"letter":"D","text":"Corrective"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":123,"question":"Which of the following exercises should an organization use to improve its incident response process?","keyword":"Exercises to improve incident response process ➡️ Tabletop","correct_raw":"A. Tabletop","explanation":"Ćwiczenia typu „Tabletop” (ćwiczenia przy stole) to sesje oparte na dyskusji, podczas których zespół ds. bezpieczeństwa omawia hipotetyczne scenariusze ataków (np. infekcja ransomware). Pozwala to na bezstresowe przetestowanie i udoskonalenie planów reagowania na incydenty (Incident Response) bez ingerencji w żywą sieć.","options":[{"letter":"A","text":"Tabletop"},{"letter":"B","text":"Replication"},{"letter":"C","text":"Failover"},{"letter":"D","text":"Recovery"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":124,"question":"Which of the following best ensures minimal downtime and data loss for organizations with critical computing equipment located in earthquake-prone areas?","keyword":"Minimal data loss / Earthquake-prone areas ➡️ Off-site replication","correct_raw":"B. Off-site replication","explanation":"Trzęsienie ziemi może fizycznie zniszczyć całe centrum danych (więc np. generatory prądu nie pomogą). Aby zapewnić minimalną utratę danych i najszybszy powrót do działania, organizacja powinna na bieżąco replikować swoje dane (Off-site replication) do innej, oddalonej i bezpiecznej geograficznie lokalizacji.","options":[{"letter":"A","text":"Generators and UPS"},{"letter":"B","text":"Off-site replication"},{"letter":"C","text":"Redundant cold sites"},{"letter":"D","text":"High availability networking"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":125,"question":"A newly identified network access vulnerability has been found in the OS of legacy IoT devices. Which of the following would best mitigate this vulnerability quickly?","keyword":"Vulnerability in legacy IoT devices / Mitigate quickly ➡️ Segmentation","correct_raw":"C. Segmentation","explanation":"Przestarzałe urządzenia internetu rzeczy (legacy IoT) z reguły nie otrzymują już łatek bezpieczeństwa (Patching jest niemożliwy), a ich wymiana (Replacement) wymaga czasu i pieniędzy. Najszybszą i najskuteczniejszą metodą złagodzenia tego ryzyka jest segmentacja sieci (Network Segmentation) – odizolowanie tych podatnych urządzeń w osobnym VLAN-ie, do którego nikt nie ma swobodnego dostępu.","options":[{"letter":"A","text":"Insurance"},{"letter":"B","text":"Patching"},{"letter":"C","text":"Segmentation"},{"letter":"D","text":"Replacement"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":126,"question":"After an audit, an administrator discovers all users have access to confidential data on a file server. Which of the following should the administrator use to restrict access to the data quickly?","keyword":"Restrict access to confidential data on a file server ➡️ Access control lists","correct_raw":"D. Access control lists","explanation":"Na serwerach plików (file servers) o tym, kto ma prawo odczytywać, modyfikować czy usuwać dane foldery i pliki, decydują Listy Kontroli Dostępu (Access Control Lists – ACLs). Jest to podstawowy i bezpośredni mechanizm do natychmiastowego nakładania restrykcji na konkretne zasoby.","options":[{"letter":"A","text":"Group Policy"},{"letter":"B","text":"Content filtering"},{"letter":"C","text":"Data loss prevention"},{"letter":"D","text":"Access control lists"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":127,"question":"A client demands at least 99.99% uptime from a service provider's hosted security services. Which of the following documents includes the information the service provider should return to the client?","keyword":"99.99% uptime / Service provider's hosted services ➡️ SLA","correct_raw":"D. SLA","explanation":"Umowa o gwarantowanym poziomie świadczenia usług (Service Level Agreement – SLA) to formalny dokument zawarty między dostawcą chmury/usług a klientem. Precyzuje ona obietnice dotyczące jakości, czasów reakcji, a przede wszystkim gwarantowanego czasu bezawaryjnego działania systemu (tzw. uptime, np. 99,99%).","options":[{"letter":"A","text":"MOA"},{"letter":"B","text":"SOW"},{"letter":"C","text":"MOU"},{"letter":"D","text":"SLA"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":128,"question":"A company is discarding a classified storage array and hires an outside vendor to complete the disposal. Which of the following should the company request from the vendor?","keyword":"Discarding a classified storage array / Outside vendor ➡️ Certification","correct_raw":"A. Certification","explanation":"Kiedy firma powierza zewnętrznemu podmiotowi zniszczenie poufnych czy tajnych nośników pamięci, zawsze musi wymagać tzw. Certyfikatu Zniszczenia (Certificate of Destruction). Stanowi on prawny dowód, że dane zostały właściwie i bezpiecznie zutylizowane zgodnie z obowiązującymi standardami branżowymi.","options":[{"letter":"A","text":"Certification"},{"letter":"B","text":"Inventory list"},{"letter":"C","text":"Classification"},{"letter":"D","text":"Proof of ownership"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":129,"question":"A company is planning a disaster recovery site and needs to ensure that a single natural disaster would not result in the complete loss of regulated backup data. Which of the following should the company consider?","keyword":"Ensure a single natural disaster would not result in complete loss ➡️ Geographic dispersion","correct_raw":"A. Geographic dispersion","explanation":"Rozproszenie geograficzne (Geographic dispersion) polega na zlokalizowaniu centrum zapasowego w odległym i niezależnym geologicznie/klimatycznie miejscu względem głównej serwerowni. Gwarantuje to, że jedno ogromne katastrofalne wydarzenie (np. powodź zalewająca miasto) nie zniszczy obydwu lokalizacji na raz.","options":[{"letter":"A","text":"Geographic dispersion"},{"letter":"B","text":"Platform diversity"},{"letter":"C","text":"Hot site"},{"letter":"D","text":"Load balancing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":130,"question":"A security analyst locates a potentially malicious video file on a server and needs to identify both the creation date and the file's creator. Which of the following actions would most likely give the security analyst the information required?","keyword":"Identify creation date and file's creator ➡️ Query the file's metadata","correct_raw":"D. Query the file's metadata.","explanation":"Metadane to informacje zaszyte w samym pliku opisujące jego cechy (tzw. „dane o danych”). Sprawdzenie właściwości i metadanych nagrania wideo ujawni takie atrybuty jak dokładna data utworzenia pliku, użyte oprogramowanie, a także informacje o twórcy (autorze) czy urządzeniu nagrywającym.","options":[{"letter":"A","text":"Obtain the file's SHA-256 hash."},{"letter":"B","text":"Use hexdump on the file's contents."},{"letter":"C","text":"Check endpoint logs."},{"letter":"D","text":"Query the file's metadata."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":131,"question":"Which of the following teams combines both offensive and defensive testing techniques to protect an organization's critical systems?","keyword":"Combines both offensive and defensive testing ➡️ Purple team","correct_raw":"C. Purple","explanation":"Zespół fioletowy (Purple Team) to kolaboratywne podejście, w którym specjaliści ofensywni (Red Team) i defensywni (Blue Team) pracują razem, wymieniając się wiedzą i technikami, aby na bieżąco weryfikować skuteczność zabezpieczeń oraz szybko łatać wykryte luki w krytycznych systemach organizacji.","options":[{"letter":"A","text":"Red"},{"letter":"B","text":"Blue"},{"letter":"C","text":"Purple"},{"letter":"D","text":"Yellow"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":132,"question":"A small business uses kiosks on the sales floor to display product information for customers. A security team discovers the kiosks use end-of-life operating systems. Which of the following is the security team most likely to document as a security implication of the current architecture?","keyword":"End-of-life operating systems / security implication ➡️ Patch availability","correct_raw":"A. Patch availability","explanation":"Systemy operacyjne, które osiągnęły koniec swojego cyklu życia, nie są już dłużej wspierane przez producenta. Główną konsekwencją bezpieczeństwa jest brak dostępności jakichkolwiek nowych łatek i aktualizacji bezpieczeństwa (Patch availability), co naraża kioski na nieustanne ryzyko exploitów.","options":[{"letter":"A","text":"Patch availability"},{"letter":"B","text":"Product software compatibility"},{"letter":"C","text":"Ease of recovery"},{"letter":"D","text":"Cost of replacement"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":133,"question":"Which of the following would help ensure a security analyst is able to accurately measure the overall risk to an organization when a new vulnerability is disclosed?","keyword":"Accurately measure the overall risk when a new vulnerability is disclosed ➡️ A full inventory of all hardware and software","correct_raw":"A. A full inventory of all hardware and software","explanation":"Gdy publicznie ujawniana jest nowa podatność, analityk musi natychmiast sprawdzić, czy firma posiada dany komponent w swojej sieci. Pełna i aktualna inwentaryzacja całego sprzętu oraz oprogramowania (Asset inventory) jest do tego absolutnie kluczowa.","options":[{"letter":"A","text":"A full inventory of all hardware and software"},{"letter":"B","text":"Documentation of system classifications"},{"letter":"C","text":"A list of system owners and their departments"},{"letter":"D","text":"Third-party risk assessment documentation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":134,"question":"Which of the following best practices gives administrators a set period to perform changes to an operational system to ensure availability and minimize business impacts?","keyword":"Set period to perform changes to an operational system ➡️ Scheduled downtime","correct_raw":"B. Scheduled downtime","explanation":"Zaplanowany przestój lub tzw. okienko serwisowe (Scheduled downtime) to wyznaczony przedział czasowy, w którym administratorzy mogą legalnie wdrażać zmiany i aktualizacje na systemach produkcyjnych, minimalizując straty biznesowe i przerwę w dostępności usług dla klientów.","options":[{"letter":"A","text":"Impact analysis"},{"letter":"B","text":"Scheduled downtime"},{"letter":"C","text":"Backout plan"},{"letter":"D","text":"Change management boards"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":135,"question":"A company must ensure sensitive data at rest is rendered unreadable. Which of the following will the company most likely use?","keyword":"Sensitive data at rest rendered unreadable ➡️ Encryption","correct_raw":"C. Encryption","explanation":"Szyfrowanie (Encryption) to podstawowa metoda przekształcania danych (zarówno w ruchu, jak i w spoczynku – at rest na dyskach) w postać całkowicie nieczytelną dla osób nieuprawnionych, dopóki nie zostanie użyty odpowiedni klucz deszyfrujący.","options":[{"letter":"A","text":"Hashing"},{"letter":"B","text":"Tokenization"},{"letter":"C","text":"Encryption"},{"letter":"D","text":"Segmentation"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":136,"question":"A legacy device is being decommissioned and is no longer receiving updates or patches. Which of the following describes this scenario?","keyword":"No longer receiving updates or patches ➡️ End of support","correct_raw":"C. End of support","explanation":"Kluczem do tej odpowiedzi jest fakt, że urządzenie przestało otrzymywać łatki i aktualizacje (no longer receiving updates or patches), co w terminologii producenta bezpośrednio definiuje koniec wsparcia technicznego (End of Support – EoS).","options":[{"letter":"A","text":"End of business"},{"letter":"B","text":"End of testing"},{"letter":"C","text":"End of support"},{"letter":"D","text":"End of life"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":137,"question":"A bank insists all of its vendors must prevent data loss on stolen laptops. Which of the following strategies is the bank requiring?","keyword":"Prevent data loss on stolen laptops ➡️ Encryption at rest","correct_raw":"A. Encryption at rest","explanation":"Fizyczna kradzież laptopa to jedno z największych zagrożeń dla danych. Aby zapobiec wyciekowi informacji w takim wypadku, jedynym skutecznym zabezpieczeniem danych zapisanych lokalnie na dysku jest szyfrowanie w spoczynku (Encryption at rest, np. BitLocker), które uniemożliwia odczytanie plików bez hasła lub klucza deszyfrującego.","options":[{"letter":"A","text":"Encryption at rest"},{"letter":"B","text":"Masking"},{"letter":"C","text":"Data classification"},{"letter":"D","text":"Permission restrictions"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":138,"question":"A company's end users are reporting that they are unable to reach external websites. After reviewing the performance data for the DNS severs, the analyst discovers that the CPU, disk, and memory usage are minimal, but the network interface is flooded with inbound traffic. Network logs show only a small number of DNS queries sent to this server. Which of the following best describes what the security analyst is seeing?","keyword":"CPU/memory minimal, network interface flooded, small number of DNS queries ➡️ Reflected denial of service","correct_raw":"D. Reflected denial of service","explanation":"Minimalne wykorzystanie CPU, pamięci i dysku przy jednoczesnym nasyceniu interfejsu sieciowego dużym ruchem przychodzącym wskazuje na atak odbity. Atakujący fałszuje adres źródłowy ofiary i wykorzystuje zewnętrzne serwery DNS do wysyłania odpowiedzi w jej kierunku, często dodatkowo wzmacniając wolumen ruchu.","options":[{"letter":"A","text":"Concurrent session usage"},{"letter":"B","text":"Secure DNS cryptographic downgrade"},{"letter":"C","text":"On-path resource consumption"},{"letter":"D","text":"Reflected denial of service"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":139,"question":"A systems administrator wants to prevent users from being able to access data based on their responsibilities. The administrator also wants to apply the required access structure via a simplified format. Which of the following should the administrator apply to the site recovery resource group?","keyword":"Access data based on responsibilities / simplified format ➡️ RBAC","correct_raw":"A. RBAC","explanation":"Kontrola dostępu oparta na rolach (Role-Based Access Control – RBAC) pozwala upraszczać zarządzanie uprawnieniami poprzez przypisywanie użytkowników do konkretnych ról w organizacji (zgodnie z ich obowiązkami i odpowiedzialnością), zamiast konfigurować dostęp indywidualnie dla każdego pracownika.","options":[{"letter":"A","text":"RBAC"},{"letter":"B","text":"ACL"},{"letter":"C","text":"SAML"},{"letter":"D","text":"GPO"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":140,"question":"During the onboarding process, an employee needs to create a password for an intranet account. The password must include ten characters, numbers, and letters, and two special characters. Once the password is created, the company will grant the employee access to other company-owned websites based on the intranet profile. Which of the following access management concepts is the company most likely using to safeguard intranet accounts and grant access to multiple sites based on a user's intranet account? (Choose two.)","keyword":"Password characters/numbers/special chars / grant access to other websites based on intranet profile ➡️ Federation / Password complexity","correct_raw":"A. Federation, C. Password complexity","explanation":"Wymagania dotyczące znaków, cyfr i długości hasła to klasyczna złożoność haseł (Password complexity). Z kolei mechanizm pozwalający użytkownikowi na zalogowanie się raz w jednym miejscu (intranet) i uzyskanie automatycznego dostępu do innych, niezależnych serwisów i stron firmy bez ponownego wpisywania danych to federacja tożsamości (Federation).","options":[{"letter":"A","text":"Federation"},{"letter":"B","text":"Identity proofing"},{"letter":"C","text":"Password complexity"},{"letter":"D","text":"Default password changes"},{"letter":"E","text":"Password manager"},{"letter":"F","text":"Open authentication"}],"correctLetters":["A","C"],"isPBQ":false,"multiSelect":true},{"id":141,"question":"Which of the following describes a security alerting and monitoring tool that collects system, application, and network logs from multiple sources in a centralized system?","keyword":"Collects system, application, and network logs in a centralized system ➡️ SIEM","correct_raw":"A. SIEM","explanation":"System SIEM (Security Information and Event Management) służy do centralnego gromadzenia, agregacji i analizowania logów ze wszystkich możliwych źródeł w organizacji w celu wykrywania zagrożeń i monitorowania bezpieczeństwa.","options":[{"letter":"A","text":"SIEM"},{"letter":"B","text":"DLP"},{"letter":"C","text":"IDS"},{"letter":"D","text":"SNMP"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":142,"question":"A network manager wants to protect the company's VPN by implementing multifactor authentication that uses: Something you know - Something you have - Something you are - Which of the following would accomplish the manager's goal?","keyword":"Something you know / have / are ➡️ Password, authentication token, thumbprint","correct_raw":"C. Password, authentication token, thumbprint","explanation":"Uwierzytelnianie wieloskładnikowe (MFA) wymaga podania elementów z różnych kategorii: hasło (coś, co wiesz), token uwierzytelniający (coś, co masz) oraz odcisk palca/thumbprint (coś, kim jesteś).","options":[{"letter":"A","text":"Domain name, PKI, GeoIP lookup"},{"letter":"B","text":"VPN IP address, company ID, facial structure"},{"letter":"C","text":"Password, authentication token, thumbprint"},{"letter":"D","text":"Company URL, TLS certificate, home address"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":143,"question":"Which of the following would be the best way to handle a critical business application that is running on a legacy server?","keyword":"Critical business application on a legacy server ➡️ Segmentation","correct_raw":"A. Segmentation","explanation":"Ponieważ aplikacja jest krytyczna dla biznesu, nie można jej wyłączyć ani całkowicie odizolować od sieci. Z kolei standardowy hardening (utwardzanie poprzez łatkowanie) odpada, ponieważ to stary system legacy i producent nie wydaje już do niego łatek. Najlepszym wyjściem jest segmentacja sieci – odizolowanie go w bezpiecznym fragmencie sieci przy jednoczesnym zachowaniu dostępu dla biznesu.","options":[{"letter":"A","text":"Segmentation"},{"letter":"B","text":"Isolation"},{"letter":"C","text":"Hardening"},{"letter":"D","text":"Decommissioning"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":144,"question":"Which of the following vulnerabilities is exploited when an attacker overwrites a register with a malicious address?","keyword":"Overwrites a register with a malicious address ➡️ Buffer overflow","correct_raw":"C. Buffer overflow","explanation":"Przepełnienie bufora (Buffer overflow) polega na wpisaniu do pamięci nadmiarowych danych, które \"wylewają się\" poza bufor i nadpisują rejestr adresu powrotu, zmuszając procesor do wykonania wstrzykniętego przez hakera kodu.","options":[{"letter":"A","text":"VM escape"},{"letter":"B","text":"SQL injection"},{"letter":"C","text":"Buffer overflow"},{"letter":"D","text":"Race condition"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":145,"question":"After a company was compromised, customers initiated a lawsuit. The company's attorneys have requested that the security team initiate a legal hold in response to the lawsuit. Which of the following describes the action the security team will most likely be required to take?","keyword":"Legal hold / lawsuit ➡️ Retain any communications related to the security breach until further notice","correct_raw":"B. Retain any communications related to the security breach until further notice.","explanation":"Blokada prawna (Legal hold) to nakaz wstrzymujący standardowe kasowanie danych. Zobowiązuje ona firmę do zachowania wszelkiej dokumentacji i komunikacji powiązanej ze sprawą aż do odwołania przez prawników.","options":[{"letter":"A","text":"Retain the emails between the security team and affected customers for 30 days."},{"letter":"B","text":"Retain any communications related to the security breach until further notice."},{"letter":"C","text":"Retain any communications between security members during the breach response."},{"letter":"D","text":"Retain all emails from the company to affected customers for an indefinite period of time."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":146,"question":"Which of the following describes the process of concealing code or text inside a graphical image?","keyword":"Concealing code or text inside a graphical image ➡️ Steganography","correct_raw":"D. Steganography","explanation":"Steganografia polega na ukrywaniu poufnych wiadomości lub kodu wewnątrz innych, nieszkodliwych nośników (np. ukrycie tekstu w pikselach pliku graficznego).","options":[{"letter":"A","text":"Symmetric encryption"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Data masking"},{"letter":"D","text":"Steganography"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":147,"question":"An employee receives a text message from an unknown number claiming to be the company’s Chief Executive Officer and asking the employee to purchase several gift cards. Which of the following types of attacks does this describe?","keyword":"Text message (SMS) asking to purchase gift cards ➡️ Smishing","correct_raw":"B. Smishing","explanation":"Smishing to phishing prowadzony drogą wiadomości tekstowych (SMS), w którym oszuści próbują wyłudzić dane lub zmusić ofiarę do działania.","options":[{"letter":"A","text":"Vishing"},{"letter":"B","text":"Smishing"},{"letter":"C","text":"Pretexting"},{"letter":"D","text":"Phishing"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":148,"question":"Which of the following risk management strategies should an enterprise adopt first if a legacy application is critical to business operations and there are preventative controls that are not yet implemented?","keyword":"Legacy application critical to business / preventative controls not yet implemented ➡️ Mitigate","correct_raw":"A. Mitigate","explanation":"Skoro aplikacja jest krytyczna, nie można jej porzucić (Avoid). W obliczu braku zabezpieczeń zapobiegawczych należy dążyć do ograniczenia ryzyka za pomocą mitygacji (np. kontroli kompensujących).","options":[{"letter":"A","text":"Mitigate"},{"letter":"B","text":"Accept"},{"letter":"C","text":"Transfer"},{"letter":"D","text":"Avoid"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":149,"question":"Visitors to a secured facility are required to check in with a photo ID and enter the facility through an access control vestibule. Which of the following best describes this form of security control?","keyword":"Visitors to a secured facility / access control vestibule ➡️ Physical","correct_raw":"A. Physical","explanation":"Śluza wejściowa (mantrap) oraz fizyczna recepcja sprawdzająca dowody tożsamości to klasyczne przykłady fizycznych środków kontroli (Physical controls).","options":[{"letter":"A","text":"Physical"},{"letter":"B","text":"Managerial"},{"letter":"C","text":"Technical"},{"letter":"D","text":"Operational"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":150,"question":"The local administrator account for a company's VPN appliance was unexpectedly used to log in to the remote management interface. Which of the following would have most likely prevented this from happening?","keyword":"Local administrator account unexpectedly used on a VPN appliance ➡️ Changing the default password","correct_raw":"B. Changing the default password","explanation":"Urządzenia sieciowe często są dostarczane z lokalnym kontem administracyjnym i hasłem początkowym. Pozostawienie domyślnego hasła może umożliwić zalogowanie się osobie, która zna publicznie dostępne dane producenta. W kontekście odpowiedzi egzaminacyjnej najbardziej prawdopodobnym zabezpieczeniem jest więc natychmiastowa zmiana domyślnego hasła podczas wdrożenia urządzenia. Treść pytania nie potwierdza jednak bezpośrednio, że właśnie domyślne poświadczenia zostały użyte.","options":[{"letter":"A","text":"Using least privilege"},{"letter":"B","text":"Changing the default password"},{"letter":"C","text":"Assigning individual user IDs"},{"letter":"D","text":"Reviewing logs more frequently"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":151,"question":"Which of the following is the best way to secure an on-site data center against intrusion from an insider?","keyword":"On-site data center / Intrusion from an insider ➡️ Access badge","correct_raw":"B. Access badge","explanation":"System kart dostępu pozwala ograniczyć wejście do centrum danych wyłącznie do osób posiadających odpowiednie uprawnienia. Pracownik może być zatrudniony w organizacji, ale nie powinien automatycznie mieć dostępu do serwerowni. Bollardy chronią głównie przed pojazdami, a monitoring i czujniki ruchu przede wszystkim wykrywają zdarzenia, zamiast bezpośrednio blokować wejście.","options":[{"letter":"A","text":"Bollards"},{"letter":"B","text":"Access badge"},{"letter":"C","text":"Motion sensor"},{"letter":"D","text":"Video surveillance"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":152,"question":"An engineer moved to another team and is unable to access the new team's shared folders while still being able to access the shared folders from the former team. After opening a ticket, the engineer discovers that the account was never moved to the new group. Which of the following access controls is most likely causing the lack of access?","keyword":"Access based on team membership / Account not moved to new group ➡️ Role-based","correct_raw":"A. Role-based","explanation":"Kontrola dostępu oparta na rolach (Role-Based Access Control – RBAC) przyznaje uprawnienia na podstawie pełnionej funkcji lub członkostwa w odpowiedniej grupie. Ponieważ konto pracownika nadal znajduje się w grupie poprzedniego zespołu, zachowuje stary dostęp i nie otrzymuje uprawnień do zasobów nowego zespołu.","options":[{"letter":"A","text":"Role-based"},{"letter":"B","text":"Discretionary"},{"letter":"C","text":"Time of day"},{"letter":"D","text":"Least privilege"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":153,"question":"Which of the following factors are the most important to address when formulating a training curriculum plan for a security awareness program? (Choose two.)","keyword":"Training curriculum plan / Industry threats / Training frequency ➡️ Threat vectors and cadence","correct_raw":"C. Threat vectors based on the industry in which the organization operates | E. Cadence and duration of training events","explanation":"Program szkoleniowy powinien być dopasowany do realnych zagrożeń charakterystycznych dla branży organizacji. Należy również określić, jak często szkolenia będą prowadzone i jak długo będą trwały. Pozwala to utrzymać aktualność wiedzy oraz odpowiedni poziom świadomości pracowników.","options":[{"letter":"A","text":"Channels by which the organization communicates with customers"},{"letter":"B","text":"The reporting mechanisms for ethics violations"},{"letter":"C","text":"Threat vectors based on the industry in which the organization operates"},{"letter":"D","text":"Secure software development training for all personnel"},{"letter":"E","text":"Cadence and duration of training events"},{"letter":"F","text":"Retraining requirements for individuals who fail phishing simulations"}],"correctLetters":["C","E"],"isPBQ":false,"multiSelect":true},{"id":154,"question":"A network administrator is working on a project to deploy a load balancer in the company's cloud environment. Which of the following fundamental security requirements does this project fulfil?","keyword":"Load balancer ➡️ Availability","correct_raw":"D. Availability","explanation":"Load balancer rozdziela ruch pomiędzy wiele serwerów lub instancji aplikacji. Zapobiega przeciążeniu pojedynczego systemu i umożliwia dalsze świadczenie usługi, gdy jeden z węzłów przestanie działać. Wspiera więc przede wszystkim dostępność.","options":[{"letter":"A","text":"Privacy"},{"letter":"B","text":"Integrity"},{"letter":"C","text":"Confidentiality"},{"letter":"D","text":"Availability"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":155,"question":"A systems administrator is changing the password policy within an enterprise environment and wants this update implemented on all systems as quickly as possible. Which of the following operating system security measures will the administrator most likely use?","keyword":"Password policy / All enterprise systems ➡️ GPO update","correct_raw":"B. Pushing GPO update","explanation":"Group Policy umożliwia centralne definiowanie i rozpowszechnianie zasad bezpieczeństwa w środowisku domenowym, w tym wymagań dotyczących długości, złożoności i ważności haseł. Wymuszenie aktualizacji GPO pozwoli szybko zastosować nową politykę na wszystkich objętych nią systemach.","options":[{"letter":"A","text":"Deploying PowerShell scripts"},{"letter":"B","text":"Pushing GPO update"},{"letter":"C","text":"Enabling PAP"},{"letter":"D","text":"Updating EDR profiles"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":156,"question":"Which of the following would be most useful in determining whether the long-term cost to transfer a risk is less than the impact of the risk?","keyword":"Long-term cost of risk transfer / Compare with expected impact ➡️ ALE","correct_raw":"D. ALE","explanation":"ALE (Annualized Loss Expectancy) określa przewidywaną roczną wartość strat wynikających z danego ryzyka. Organizacja może porównać ALE z rocznym kosztem transferu ryzyka, na przykład składką ubezpieczeniową, i ocenić, które rozwiązanie jest bardziej opłacalne. ALE oblicza się jako SLE × ARO.","options":[{"letter":"A","text":"ARO"},{"letter":"B","text":"RTO"},{"letter":"C","text":"RPO"},{"letter":"D","text":"ALE"},{"letter":"E","text":"SLE"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":157,"question":"In order to strengthen a password and prevent a hacker from cracking it, a random string of 36 characters was added to the password. Which of the following best describes this technique?","keyword":"Random string added to password ➡️ Salting","correct_raw":"D. Salting","explanation":"Salting polega na dodaniu losowej wartości do hasła przed jego zhashowaniem. Dzięki temu identyczne hasła uzyskują różne skróty, a gotowe tablice tęczowe stają się nieskuteczne. Key stretching polega natomiast na wielokrotnym wykonywaniu kosztownych operacji kryptograficznych, aby spowolnić próby łamania hasła.","options":[{"letter":"A","text":"Key stretching"},{"letter":"B","text":"Tokenization"},{"letter":"C","text":"Data masking"},{"letter":"D","text":"Salting"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":158,"question":"A technician is deploying a new security camera. Which of the following should the technician do?","keyword":"Deploying a new security camera ➡️ Conduct a site survey","correct_raw":"D. Conduct a site survey.","explanation":"Przed instalacją kamery należy przeprowadzić wizję lokalną, aby określić właściwe miejsce montażu, pole widzenia, oświetlenie, martwe strefy, dostęp do zasilania i możliwości połączenia z siecią. Konfiguracja VLAN-u i utwardzenie urządzenia są również istotne, ale następują po ustaleniu odpowiedniej lokalizacji i warunków instalacji.","options":[{"letter":"A","text":"Configure the correct VLAN."},{"letter":"B","text":"Perform a vulnerability scan."},{"letter":"C","text":"Disable unnecessary ports."},{"letter":"D","text":"Conduct a site survey."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":159,"question":"A company is experiencing a web services outage on the public network. The services are up and available but inaccessible. The network logs show a sudden increase in network traffic that is causing the outage. Which of the following attacks is the organization experiencing?","keyword":"Sudden increase in network traffic / Services inaccessible ➡️ DDoS","correct_raw":"D. DDoS","explanation":"Rozproszony atak odmowy usługi (Distributed Denial-of-Service – DDoS) polega na zalaniu systemu ogromną ilością ruchu pochodzącego z wielu źródeł. Usługi mogą nadal działać technicznie, ale zasoby sieciowe zostają przeciążone, przez co prawidłowi użytkownicy nie mogą uzyskać do nich dostępu.","options":[{"letter":"A","text":"ARP poisoning"},{"letter":"B","text":"Brute force"},{"letter":"C","text":"Buffer overflow"},{"letter":"D","text":"DDoS"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":160,"question":"Which of the following threat actors is the most likely to be motivated by profit?","keyword":"Threat actor motivated by profit ➡️ Organized crime","correct_raw":"C. Organized crime","explanation":"Zorganizowane grupy przestępcze prowadzą cyberataki przede wszystkim w celu osiągnięcia korzyści finansowych. Wykorzystują między innymi ransomware, kradzież danych, oszustwa finansowe i sprzedaż skradzionych informacji. Hacktywiści są zazwyczaj motywowani ideologicznie, a Shadow IT nie jest odrębną kategorią aktora zagrożeń.","options":[{"letter":"A","text":"Hacktivist"},{"letter":"B","text":"Insider threat"},{"letter":"C","text":"Organized crime"},{"letter":"D","text":"Shadow IT"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":161,"question":"An organization experiences a cybersecurity incident involving a command-and-control server. Which of the following logs should be analyzed to identify the impacted host? (Choose two.)","keyword":"Command-and-control server / Identify the impacted host ➡️ Firewall logs and DHCP logs","correct_raw":"C. DHCP | E. Firewall","explanation":"Logi zapory sieciowej pozwalają ustalić wewnętrzny adres IP hosta, który nawiązywał połączenia z adresem serwera command-and-control (C2). Jeżeli adresy IP są przydzielane dynamicznie, logi DHCP umożliwiają sprawdzenie, które urządzenie otrzymało dany adres w czasie incydentu. Korelacja obu źródeł pozwala wskazać konkretny zainfekowany host.","options":[{"letter":"A","text":"Application"},{"letter":"B","text":"Authentication"},{"letter":"C","text":"DHCP"},{"letter":"D","text":"Network"},{"letter":"E","text":"Firewall"},{"letter":"F","text":"Database"}],"correctLetters":["C","E"],"isPBQ":false,"multiSelect":true},{"id":162,"question":"During a penetration test, a vendor attempts to enter an unauthorized area using an access badge. Which of the following types of tests does this represent?","keyword":"Attempts to enter an unauthorized area using an access badge ➡️ Physical test","correct_raw":"D. Physical","explanation":"Próba wejścia do chronionej strefy za pomocą karty dostępu sprawdza fizyczne zabezpieczenia obiektu, takie jak kontrola wejścia, uprawnienia zapisane na identyfikatorach i reakcja ochrony. Jest to test bezpieczeństwa fizycznego, nawet jeśli stanowi część ofensywnego testu penetracyjnego.","options":[{"letter":"A","text":"Defensive"},{"letter":"B","text":"Passive"},{"letter":"C","text":"Offensive"},{"letter":"D","text":"Physical"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":163,"question":"A systems administrator uses a key to encrypt a message being sent to a peer in a different branch office. The peer then uses the same key to decrypt the message. Which of the following describes this example?","keyword":"Same key used to encrypt and decrypt ➡️ Symmetric encryption","correct_raw":"A. Symmetric","explanation":"Szyfrowanie symetryczne wykorzystuje ten sam współdzielony klucz zarówno do zaszyfrowania, jak i odszyfrowania danych. W szyfrowaniu asymetrycznym używa się natomiast pary różnych, matematycznie powiązanych kluczy: publicznego i prywatnego.","options":[{"letter":"A","text":"Symmetric"},{"letter":"B","text":"Asymmetric"},{"letter":"C","text":"Hashing"},{"letter":"D","text":"Salting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":164,"question":"A visitor plugs a laptop into a network jack in the lobby and is able to connect to the company's network. Which of the following should be configured on the existing network infrastructure to best prevent this activity?","keyword":"Unauthorized laptop connected to a network jack ➡️ Port security","correct_raw":"A. Port security","explanation":"Port security na przełączniku ogranicza, jakie urządzenia mogą korzystać z konkretnego portu fizycznego, na przykład na podstawie dozwolonego adresu MAC lub maksymalnej liczby adresów. Może również automatycznie zablokować port po wykryciu nieautoryzowanego urządzenia. Pozostałe rozwiązania nie kontrolują dostępu do fizycznego gniazda sieciowego.","options":[{"letter":"A","text":"Port security"},{"letter":"B","text":"Web application firewall"},{"letter":"C","text":"Transport layer security"},{"letter":"D","text":"Virtual private network"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":165,"question":"A security administrator is reissuing a former employee's laptop. Which of the following is the best combination of data handling activities for the administrator to perform? (Choose two.)","keyword":"Reissuing a former employee's laptop ➡️ Retain required data and sanitize the device","correct_raw":"A. Data retention | E. Sanitization","explanation":"Przed ponownym wydaniem laptopa należy zachować dane byłego pracownika, które muszą być przechowywane ze względów biznesowych, prawnych lub regulacyjnych. Następnie urządzenie powinno zostać poddane sanityzacji, czyli bezpiecznemu usunięciu pozostałych danych i konfiguracji. Fizyczne zniszczenie nośnika uniemożliwiłoby ponowne wykorzystanie laptopa.","options":[{"letter":"A","text":"Data retention"},{"letter":"B","text":"Certification"},{"letter":"C","text":"Destruction"},{"letter":"D","text":"Classification"},{"letter":"E","text":"Sanitization"},{"letter":"F","text":"Enumeration"}],"correctLetters":["A","E"],"isPBQ":false,"multiSelect":true},{"id":166,"question":"A systems administrator would like to deploy a change to a production system. Which of the following must the administrator submit to demonstrate that the system can be restored to a working state in the event of a performance issue?","keyword":"Restore the system if a change causes a performance issue ➡️ Backout plan","correct_raw":"A. Backout plan","explanation":"Plan wycofania zmiany (backout plan lub rollback plan) opisuje konkretne działania potrzebne do cofnięcia wdrożenia i przywrócenia poprzedniego, sprawnego stanu systemu. Jest wymagany przed zmianą produkcyjną, aby ograniczyć czas awarii w przypadku pogorszenia wydajności lub innych problemów.","options":[{"letter":"A","text":"Backout plan"},{"letter":"B","text":"Impact analysis"},{"letter":"C","text":"Test procedure"},{"letter":"D","text":"Approval procedure"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":167,"question":"A company is redesigning its infrastructure and wants to reduce the number of physical servers in use. Which of the following architectures is best suited for this goal?","keyword":"Reduce the number of physical servers ➡️ Virtualization","correct_raw":"C. Virtualization","explanation":"Wirtualizacja pozwala uruchamiać wiele niezależnych maszyn wirtualnych na jednym serwerze fizycznym. Umożliwia konsolidację obciążeń, lepsze wykorzystanie procesora, pamięci i przestrzeni dyskowej oraz bezpośrednio ogranicza liczbę potrzebnych serwerów fizycznych.","options":[{"letter":"A","text":"Serverless"},{"letter":"B","text":"Segmentation"},{"letter":"C","text":"Virtualization"},{"letter":"D","text":"Microservices"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":168,"question":"A bank set up a new server that contains customers' PII. Which of the following should the bank use to make sure the sensitive data is not modified?","keyword":"Make sure sensitive data is not modified ➡️ File integrity monitoring","correct_raw":"C. File integrity monitoring","explanation":"File Integrity Monitoring (FIM) tworzy wartości referencyjne, najczęściej skróty kryptograficzne, dla chronionych plików i wykrywa ich nieautoryzowane modyfikacje. Mechanizm ten wspiera integralność danych. Szyfrowanie całego dysku chroni przede wszystkim poufność danych, ale samo nie informuje o zmianie zawartości plików.","options":[{"letter":"A","text":"Full disk encryption"},{"letter":"B","text":"Network access control"},{"letter":"C","text":"File integrity monitoring"},{"letter":"D","text":"User behavior analytics"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":169,"question":"Users at a company are reporting they are unable to access the URL for a new retail website because it is flagged as gambling and is being blocked. Which of the following changes would allow users to access the site?","keyword":"Website incorrectly categorized as gambling ➡️ Update content-filter categorization","correct_raw":"D. Updating the categorization in the content filter","explanation":"Dostęp jest blokowany dlatego, że filtr treści błędnie zaklasyfikował stronę jako hazardową. Należy poprawić kategorię witryny lub dodać odpowiedni wyjątek w systemie filtrowania treści. Reguła firewalla dla HTTPS nie pomoże, ponieważ
