sions ➡️ Tabletop exercise","correct_raw":"A. Tabletop exercise","explanation":"Tabletop exercise jest prowadzonym dyskusyjnie ćwiczeniem scenariuszowym. Uczestnicy analizują hipotetyczny incydent, omawiają role, odpowiedzialność, komunikację i decyzje bez wykonywania realnego ataku na systemy. Penetration test jest techniczną próbą wykorzystania podatności. Geographic dispersion to rozmieszczenie zasobów w różnych lokalizacjach, a incident response oznacza rzeczywistą reakcję na incydent lub cały proces reagowania, nie samo ćwiczenie dyskusyjne.","options":[{"letter":"A","text":"Tabletop exercise"},{"letter":"B","text":"Penetration test"},{"letter":"C","text":"Geographic dispersion"},{"letter":"D","text":"Incident response"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":493,"question":"Which of the following is an example of a data protection strategy that uses tokenization?","keyword":"Replace the real value with a non-sensitive substitute token ➡️ Surrogate values","correct_raw":"B. Replacing sensitive data with surrogate values","explanation":"Tokenizacja zastępuje wrażliwą wartość niewrażliwym tokenem lub wartością zastępczą. Powiązanie między tokenem a oryginalnymi danymi jest utrzymywane w oddzielnym, chronionym systemie lub vault. Szyfrowanie przekształca dane przy użyciu klucza, hashing tworzy skrót jednokierunkowy, a usunięcie danych z produkcji jest formą minimalizacji, nie tokenizacji.","options":[{"letter":"A","text":"Encrypting databases containing sensitive data"},{"letter":"B","text":"Replacing sensitive data with surrogate values"},{"letter":"C","text":"Removing sensitive data from production systems"},{"letter":"D","text":"Hashing sensitive data in critical systems"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":494,"question":"Which of the following is a type of vulnerability that refers to the unauthorized installation of applications on a device through means other than the official application store?","keyword":"Install an application outside the official app store ➡️ Side loading","correct_raw":"D. Side loading","explanation":"Side loading oznacza instalowanie aplikacji z pliku, alternatywnego sklepu albo innego źródła niż oficjalny sklep platformy. Może ominąć proces weryfikacji aplikacji i zwiększyć ryzyko instalacji złośliwego oprogramowania. Jailbreaking usuwa lub obchodzi ograniczenia systemu urządzenia i może umożliwiać sideloading, ale samo określenie instalacji aplikacji poza oficjalnym sklepem to side loading.","options":[{"letter":"A","text":"Cross-site scripting"},{"letter":"B","text":"Buffer overflow"},{"letter":"C","text":"Jailbreaking"},{"letter":"D","text":"Side loading"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":495,"question":"Which of the following types of identification methods can be performed on a deployed application during runtime?","keyword":"Examine a running, deployed application ➡️ Dynamic analysis","correct_raw":"A. Dynamic analysis","explanation":"Dynamic analysis bada aplikację podczas jej wykonywania. Pozwala obserwować zachowanie, wywołania, obsługę danych wejściowych, błędy i podatności ujawniające się w runtime. Code review analizuje kod źródłowy bez konieczności uruchamiania aplikacji. Package monitoring dotyczy pakietów lub komponentów, a bug bounty jest programem wynagradzania badaczy za zgłoszone podatności, nie konkretną techniką analizy wykonywaną w runtime.","options":[{"letter":"A","text":"Dynamic analysis"},{"letter":"B","text":"Code review"},{"letter":"C","text":"Package monitoring"},{"letter":"D","text":"Bug bounty"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":496,"question":"Which of the following cryptographic solutions is used to hide the fact that communication is occurring?","keyword":"Conceal the existence of the message itself ➡️ Steganography","correct_raw":"A. Steganography","explanation":"Steganografia ukrywa wiadomość wewnątrz innego nośnika, np. obrazu, pliku audio lub wideo, aby obserwator nie zauważył, że komunikacja w ogóle się odbywa. Szyfrowanie ukrywa treść, lecz zwykle nie ukrywa samego faktu przesyłania zaszyfrowanych danych. Data masking zasłania prezentowane wartości, tokenization zastępuje dane tokenami, a private key jest elementem kryptografii asymetrycznej.","options":[{"letter":"A","text":"Steganography"},{"letter":"B","text":"Data masking"},{"letter":"C","text":"Tokenization"},{"letter":"D","text":"Private key"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":497,"question":"Which of the following steps should be taken before mitigating a vulnerability in a production server?","keyword":"Any production modification must follow approved change control ➡️ Change management policy","correct_raw":"D. Refer to the change management policy.","explanation":"Mitigacja podatności na serwerze produkcyjnym zwykle wymaga zmiany konfiguracji, instalacji poprawki, wyłączenia funkcji albo wdrożenia innej kontroli. Przed wykonaniem takiej zmiany należy zastosować procedurę change management: ocenić wpływ, zaplanować testy, zatwierdzenie, okno serwisowe, plan wycofania i komunikację. Risk assessment pomaga określić istotność i priorytet podatności, ale pytanie zakłada, że ma zostać wykonana konkretna modyfikacja systemu produkcyjnego. IR plan nie jest standardową procedurą zatwierdzania zmian, a SDLC nie zarządza zmianami operacyjnymi na serwerze produkcyjnym.","options":[{"letter":"A","text":"Escalate the issue to the SDLC team."},{"letter":"B","text":"Use the IR plan to evaluate the changes."},{"letter":"C","text":"Perform a risk assessment to classify the vulnerability."},{"letter":"D","text":"Refer to the change management policy."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":498,"question":"A security engineer needs to quickly identify a signature from a known malicious file. Which of the following analysis methods would the security engineer most likely use?","keyword":"Known file signature or hash can be extracted without execution ➡️ Static analysis","correct_raw":"A. Static","explanation":"Static analysis bada plik bez jego uruchamiania. Pozwala szybko obliczyć hash, wyszukać ciągi znaków, nagłówki, importowane funkcje lub inne cechy używane jako sygnatura znanego malware. Sandbox uruchamia plik w kontrolowanym środowisku i obserwuje zachowanie, co jest wolniejsze. Network traffic analysis dotyczy komunikacji sieciowej, a package monitoring nie jest właściwą metodą identyfikacji sygnatury pojedynczego pliku.","options":[{"letter":"A","text":"Static"},{"letter":"B","text":"Sandbox"},{"letter":"C","text":"Network traffic"},{"letter":"D","text":"Package monitoring"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":499,"question":"Which of the following should a company use to provide proof of external network security testing?","keyword":"Formal evidence from an independent party that external testing occurred ➡️ Third-party attestation","correct_raw":"D. Third-party attestation","explanation":"Third-party attestation jest formalnym potwierdzeniem od niezależnej strony, że określone testy lub kontrole zostały wykonane i spełniają wskazane wymagania. Dlatego najlepiej odpowiada słowu proof. Vulnerability assessment jest samym technicznym badaniem podatności sieci; jego raport może być częścią dowodów, ale odpowiedź nie wskazuje niezależności ani formalnego poświadczenia. BIA ocenia wpływ zakłóceń na biznes, a supply chain analysis analizuje ryzyka łańcucha dostaw.","options":[{"letter":"A","text":"Business impact analysis"},{"letter":"B","text":"Supply chain analysis"},{"letter":"C","text":"Vulnerability assessment"},{"letter":"D","text":"Third-party attestation"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":500,"question":"A security administrator is addressing an issue with a legacy system that communicates data using an unencrypted protocol to transfer sensitive data to a third party. No software updates that use an encrypted protocol are available, so a compensating control is needed. Which of the following are the most appropriate for the administrator to suggest? (Choose two.)","keyword":"Legacy cleartext protocol ➡️ Encrypt the transport and isolate the vulnerable system","correct_raw":"C. SSH tunneling oraz D. Segmentation","explanation":"SSH tunneling opakowuje ruch starszego, nieszyfrowanego protokołu w szyfrowany kanał, chroniąc dane podczas transmisji. Segmentacja ogranicza dostęp do systemu legacy i zmniejsza możliwość ruchu bocznego oraz ekspozycję usługi. Są to kontrole kompensujące, ponieważ aplikacja sama nie obsługuje bezpiecznego protokołu i nie ma dostępnej poprawki. Cryptographic downgrade obniża bezpieczeństwo, patch installation nie jest dostępny zgodnie z treścią, a tokenization i data masking zmieniają lub ukrywają dane, lecz nie rozwiązują bezpośrednio problemu nieszyfrowanego kanału i mogą wymagać zmian po obu stronach integracji.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"Cryptographic downgrade"},{"letter":"C","text":"SSH tunneling"},{"letter":"D","text":"Segmentation"},{"letter":"E","text":"Patch installation"},{"letter":"F","text":"Data masking"}],"correctLetters":["C","D"],"isPBQ":false,"multiSelect":true},{"id":501,"question":"Which of the following steps in the risk management process involves establishing the scope and potential risks involved with a project?","keyword":"Define what could affect the project within its scope ➡️ Risk identification","correct_raw":"B. Risk identification","explanation":"Risk identification polega na znajdowaniu, rozpoznawaniu i opisywaniu potencjalnych zagrożeń dla projektu. Aby wskazać właściwe ryzyka, trzeba najpierw rozumieć granice i zakres projektu. Risk assessment jest szerszym etapem, który oprócz identyfikacji obejmuje zwykle analizę prawdopodobieństwa i wpływu. Risk treatment dotyczy wyboru sposobu postępowania z już rozpoznanym ryzykiem, a monitoring and review polega na późniejszym śledzeniu ryzyka i skuteczności zastosowanych działań.","options":[{"letter":"A","text":"Risk assessment"},{"letter":"B","text":"Risk identification"},{"letter":"C","text":"Risk treatment"},{"letter":"D","text":"Risk monitoring and review"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":502,"question":"A company's website is www.company.com. Attackers purchased the domain www.c0mpany.com. Which of the following types of attacks describes this example?","keyword":"Lookalike domain with a substituted character ➡️ Typosquatting","correct_raw":"A. Typosquatting","explanation":"Typosquatting polega na rejestrowaniu domen bardzo podobnych do prawidłowej domeny organizacji. Tutaj literę „o” zastąpiono cyfrą „0”, aby użytkownik mógł nie zauważyć różnicy. Brand impersonation jest szerszym pojęciem podszywania się pod markę, ale konkretną techniką domenową przedstawioną w pytaniu jest typosquatting. On-path oznacza przechwytywanie komunikacji, a watering-hole polega na zainfekowaniu strony często odwiedzanej przez określoną grupę.","options":[{"letter":"A","text":"Typosquatting"},{"letter":"B","text":"Brand impersonation"},{"letter":"C","text":"On-path"},{"letter":"D","text":"Watering-hole"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":503,"question":"Which of the following allows a systems administrator to tune permissions for a file?","keyword":"Specify who can read, write, modify, or execute a file ➡️ Access control list","correct_raw":"B. Access control list","explanation":"Access Control List, czyli ACL, jest listą uprawnień przypisaną do obiektu, np. pliku lub katalogu. Pozwala określić, którzy użytkownicy albo grupy mogą odczytywać, zapisywać, modyfikować lub wykonywać dany plik. Least privilege jest zasadą nadawania minimalnych potrzebnych uprawnień, ale ACL jest konkretnym mechanizmem służącym do ich ustawienia. Patching naprawia oprogramowanie, a configuration enforcement wymusza zgodność konfiguracji.","options":[{"letter":"A","text":"Patching"},{"letter":"B","text":"Access control list"},{"letter":"C","text":"Configuration enforcement"},{"letter":"D","text":"Least privilege"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":504,"question":"Which of the following would be the greatest concern for a company that is aware of the consequences of non-compliance with government regulations?","keyword":"Government non-compliance can trigger legal or financial penalties ➡️ Sanctions","correct_raw":"B. Sanctions","explanation":"Sanctions są prawnymi lub administracyjnymi konsekwencjami naruszenia wymagań, np. karami finansowymi, ograniczeniami działalności lub innymi środkami egzekucyjnymi. Right to be forgotten jest konkretnym prawem dotyczącym danych osobowych. External compliance reporting i attestation są sposobami wykazywania zgodności, a nie samą konsekwencją jej braku.","options":[{"letter":"A","text":"Right to be forgotten"},{"letter":"B","text":"Sanctions"},{"letter":"C","text":"External compliance reporting"},{"letter":"D","text":"Attestation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":505,"question":"Which of the following security concepts is accomplished when granting access after an individual has logged into a computer network?","keyword":"Determine what an authenticated user is allowed to access ➡️ Authorization","correct_raw":"A. Authorization","explanation":"Po zalogowaniu użytkownik został już uwierzytelniony. Następnie system określa, do jakich danych, aplikacji i operacji może uzyskać dostęp — jest to authorization. Identification polega na podaniu tożsamości, np. nazwy użytkownika. Authentication potwierdza tę tożsamość, a non-repudiation zapewnia, że wykonania określonej czynności nie można wiarygodnie wyprzeć się później.","options":[{"letter":"A","text":"Authorization"},{"letter":"B","text":"Identification"},{"letter":"C","text":"Non-repudiation"},{"letter":"D","text":"Authentication"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":506,"question":"A growing organization, which hosts an externally accessible application, adds multiple virtual servers to improve application performance and decrease the resource usage on individual servers. Which of the following solutions is the organization most likely to employ to further increase performance and availability?","keyword":"Distribute requests across multiple application servers ➡️ Load balancer","correct_raw":"A. Load balancer","explanation":"Load balancer rozdziela ruch klientów pomiędzy wiele serwerów aplikacyjnych. Zmniejsza obciążenie pojedynczych maszyn i może kierować żądania wyłącznie do zdrowych serwerów, zwiększając zarówno wydajność, jak i dostępność. Jump server służy do kontrolowanego dostępu administracyjnego. Proxy pośredniczy w komunikacji, ale nie musi równoważyć ruchu między serwerami. SD-WAN zarządza połączeniami WAN.","options":[{"letter":"A","text":"Load balancer"},{"letter":"B","text":"Jump server"},{"letter":"C","text":"Proxy server"},{"letter":"D","text":"SD-WAN"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":507,"question":"A systems administrator is concerned users are accessing emails through a duplicate site that is not run by the company. Which of the following is used in this scenario?","keyword":"Duplicate site mimics the company's legitimate email service ➡️ Impersonation","correct_raw":"A. Impersonation","explanation":"Impersonation oznacza podszywanie się pod zaufaną osobę, markę, system lub usługę. W pytaniu użytkownicy korzystają z duplikatu firmowej witryny pocztowej, który nie jest prowadzony przez firmę, więc fałszywa strona udaje legalną usługę organizacji. Phishing byłby właściwy, gdyby treść wskazywała, że użytkownicy zostali zwabieni wiadomością, linkiem lub inną przynętą w celu wyłudzenia poświadczeń. Takiej informacji jednak nie podano. Duplikat witryny może być elementem phishingu, ale przy literalnym brzmieniu pytania najbardziej bezpośrednią odpowiedzią jest A. Impersonation. Smishing wymagałby wiadomości SMS, a replication nie jest atakiem socjotechnicznym.","options":[{"letter":"A","text":"Impersonation"},{"letter":"B","text":"Replication"},{"letter":"C","text":"Phishing"},{"letter":"D","text":"Smishing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":508,"question":"A security engineer at a large company needs to enhance IAM in order to ensure that employees can only access corporate systems during their shifts. Which of the following access controls should the security engineer implement?","keyword":"Permit access only during scheduled working hours ➡️ Time-of-day restrictions","correct_raw":"B. Time-of-day restrictions","explanation":"Time-of-day restrictions uzależniają możliwość logowania lub korzystania z zasobów od godziny i dnia tygodnia. Można więc dopasować dostęp do grafiku zmianowego pracownika. Role-based access określa dostęp na podstawie roli zawodowej, least privilege ogranicza zakres uprawnień, a biometria jest metodą uwierzytelniania — żadna z tych odpowiedzi sama nie ogranicza dostępu do godzin zmiany.","options":[{"letter":"A","text":"Role-based"},{"letter":"B","text":"Time-of-day restrictions"},{"letter":"C","text":"Least privilege"},{"letter":"D","text":"Biometric authentication"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":509,"question":"A company wants to ensure employees are allowed to copy files from a virtual desktop during the workday but are restricted during non-working hours. Which of the following security measures should the company set up?","keyword":"Allow an action during working hours and deny it afterward ➡️ Time-based access control","correct_raw":"C. Time-based access control","explanation":"Time-based access control pozwala uzależnić konkretną operację od czasu. Firma może dopuścić kopiowanie plików z wirtualnego pulpitu w godzinach pracy i automatycznie je blokować poza tym okresem. RBAC opiera się na roli użytkownika, a nie godzinie. NAC kontroluje dostęp urządzenia do sieci. DRM może ograniczać używanie lub kopiowanie chronionych plików, lecz nie jest najbardziej bezpośrednią odpowiedzią na wymóg zmieniający się zależnie od pory dnia.","options":[{"letter":"A","text":"Digital rights management"},{"letter":"B","text":"Role-based access control"},{"letter":"C","text":"Time-based access control"},{"letter":"D","text":"Network access control"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":510,"question":"Employees sign an agreement that restricts specific activities when leaving the company. Violating the agreement can result in legal consequences. Which of the following agreements does this best describe?","keyword":"Confidentiality obligations continue after employment ends ➡️ NDA","correct_raw":"C. NDA","explanation":"Non-Disclosure Agreement ogranicza ujawnianie i wykorzystywanie informacji poufnych. Obowiązek może obowiązywać również po odejściu pracownika, a naruszenie może prowadzić do odpowiedzialności prawnej. SLA określa poziom świadczenia usługi, BPA reguluje współpracę pomiędzy partnerami biznesowymi, a MOA opisuje uzgodnienia i odpowiedzialność współpracujących organizacji.","options":[{"letter":"A","text":"SLA"},{"letter":"B","text":"BPA"},{"letter":"C","text":"NDA"},{"letter":"D","text":"MOA"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":511,"question":"A systems administrator just purchased multiple network devices. Which of the following should the systems administrator perform to prevent attackers from accessing the devices by using publicly available information?","keyword":"Publicly documented factory credentials can provide immediate access ➡️ Change default passwords","correct_raw":"C. Change default passwords.","explanation":"Fabryczne nazwy użytkowników i hasła urządzeń sieciowych są często opisane w instrukcjach producenta, bazach internetowych i dokumentacji dostępnej publicznie. Pozostawienie ich bez zmian umożliwia napastnikowi zalogowanie się przy użyciu powszechnie znanych danych. Wyłączenie zbędnych portów i usług również należy do hardeningu, ale sformułowanie „using publicly available information” wskazuje przede wszystkim na domyślne poświadczenia.","options":[{"letter":"A","text":"Install endpoint protection."},{"letter":"B","text":"Disable ports/protocols."},{"letter":"C","text":"Change default passwords."},{"letter":"D","text":"Remove unnecessary software."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":512,"question":"A CVE in a key back-end component of an application has been disclosed. The systems administrator is identifying all of the systems in the environment that are susceptible to this risk. Which of the following should the systems administrator perform?","keyword":"Find every system affected by a disclosed CVE ➡️ Vulnerability scan","correct_raw":"B. Vulnerability scan","explanation":"Skan podatności porównuje wykryte systemy, wersje oprogramowania i konfiguracje z bazą znanych podatności, dzięki czemu może wskazać hosty podatne na konkretny CVE. Packet capture analizuje przesyłany ruch, metadata analysis bada informacje opisujące dane, a automated reporting jedynie prezentuje wyniki zebrane przez inne mechanizmy.","options":[{"letter":"A","text":"Packet capture"},{"letter":"B","text":"Vulnerability scan"},{"letter":"C","text":"Metadata analysis"},{"letter":"D","text":"Automated reporting"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":513,"question":"Which of the following activities uses OSINT?","keyword":"Gather publicly available information to make a pretext convincing ➡️ Social engineering testing","correct_raw":"A. Social engineering testing","explanation":"OSINT, czyli Open-Source Intelligence, polega na pozyskiwaniu informacji z publicznie dostępnych źródeł, np. stron internetowych, mediów społecznościowych, rejestrów, ogłoszeń o pracę i dokumentów publicznych. Podczas testów socjotechnicznych informacje te służą do przygotowania wiarygodnego pretekstu i poznania struktury organizacji. Analiza logów, zbieranie dowodów i tworzenie IOC zwykle opierają się na danych wewnętrznych lub technicznych artefaktach incydentu.","options":[{"letter":"A","text":"Social engineering testing"},{"letter":"B","text":"Data analysis of logs"},{"letter":"C","text":"Collecting evidence of malicious activity"},{"letter":"D","text":"Producing IOC for malicious artifacts"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":514,"question":"Which of the following are the best security controls for controlling on-premises access? (Choose two.)","keyword":"Prevent entry using possession and biometric verification ➡️ Swipe card and biometric scanner","correct_raw":"A. Swipe card oraz D. Biometric scanner","explanation":"Karta dostępowa jest fizycznym mechanizmem kontroli wejścia opartym na czymś, co użytkownik posiada. Skaner biometryczny potwierdza cechę użytkownika i utrudnia wykorzystanie skradzionej karty przez inną osobę. Oba mechanizmy mogą bezpośrednio zezwolić lub odmówić wejścia do obiektu. Picture ID działa skutecznie dopiero wtedy, gdy jest sprawdzany przez ochronę. Kamera jest głównie kontrolą detektywistyczną i nie blokuje samodzielnie wejścia. Aplikacja telefoniczna i memorable question są bardziej typowe dla dostępu logicznego niż fizycznego dostępu do siedziby.","options":[{"letter":"A","text":"Swipe card"},{"letter":"B","text":"Picture ID"},{"letter":"C","text":"Phone authentication application"},{"letter":"D","text":"Biometric scanner"},{"letter":"E","text":"Camera"},{"letter":"F","text":"Memorable question"}],"correctLetters":["A","D"],"isPBQ":false,"multiSelect":true},{"id":515,"question":"A company is considering an expansion of access controls for an application that contractors and internal employees use to reduce costs. Which of the following risk elements should the implementation team understand before granting access to the application?","keyword":"Determine how much risk the organization is willing to accept before expanding access ➡️ Risk appetite","correct_raw":"B. Appetite","explanation":"Risk appetite określa ogólny poziom i rodzaj ryzyka, jaki organizacja jest gotowa zaakceptować w zamian za korzyści, tutaj redukcję kosztów i szerszy dostęp dla wykonawców. Zespół powinien wiedzieć, czy dodatkowe ryzyko związane z dostępem podmiotów zewnętrznych mieści się w tej akceptacji. Risk threshold jest konkretną granicą lub punktem, po którego przekroczeniu należy podjąć działanie. Risk avoidance jest strategią całkowitego unikania ryzyka, a risk register jest rejestrem zidentyfikowanych ryzyk.","options":[{"letter":"A","text":"Threshold"},{"letter":"B","text":"Appetite"},{"letter":"C","text":"Avoidance"},{"letter":"D","text":"Register"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":516,"question":"Which of the following is the act of proving to a customer that software developers are trained on secure coding?","keyword":"Provide a formal statement or evidence that a requirement is true ➡️ Attestation","correct_raw":"D. Attestation","explanation":"Attestation jest formalnym potwierdzeniem lub oświadczeniem, że określony warunek został spełniony, np. że deweloperzy ukończyli wymagane szkolenia z bezpiecznego programowania. Assurance oznacza poziom zaufania, że zabezpieczenia i procesy działają zgodnie z wymaganiami, ale nie jest nazwą samego aktu przedstawienia dowodu klientowi. Contract ustanawia zobowiązania, a due diligence oznacza należytą staranność przy badaniu i ograniczaniu ryzyka.","options":[{"letter":"A","text":"Assurance"},{"letter":"B","text":"Contract"},{"letter":"C","text":"Due diligence"},{"letter":"D","text":"Attestation"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":517,"question":"An administrator is creating a secure method for a contractor to access a test environment. Which of the following would provide the contractor with the best access to the test environment?","keyword":"Provide controlled administrative access through a hardened intermediary ➡️ Jump server","correct_raw":"B. Jump server","explanation":"Jump server jest kontrolowanym punktem pośrednim, przez który użytkownik uzyskuje dostęp do wydzielonego środowiska. Pozwala ograniczyć źródła połączeń, stosować MFA, rejestrować sesje i zablokować bezpośredni dostęp wykonawcy do pozostałej części sieci. RDP server opisuje protokół lub serwer sesyjny, ale nie zapewnia sam w sobie funkcji bezpiecznej bramy. Proxy pośredniczy w ruchu aplikacyjnym, a application server uruchamia aplikację.","options":[{"letter":"A","text":"Application server"},{"letter":"B","text":"Jump server"},{"letter":"C","text":"RDP server"},{"letter":"D","text":"Proxy server"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":518,"question":"A security analyst notices unusual behavior on the network. The IDS on the network was not able to detect the activities. Which of the following should the security analyst use to help the IDS detect such attacks in the future?","keyword":"Create a recognizable detection pattern for the newly observed attack ➡️ Signatures","correct_raw":"A. Signatures","explanation":"Po poznaniu cech niewykrytego ataku analityk może utworzyć lub wdrożyć sygnaturę opisującą charakterystyczne pakiety, ciągi, nagłówki albo sekwencje zachowania. IDS będzie wtedy mógł rozpoznawać podobne zdarzenia w przyszłości. Trends służą do obserwowania zmian w czasie, reputation ocenia wiarygodność adresów lub domen, a honeypot może zebrać dodatkowe informacje o napastniku, lecz nie jest regułą detekcyjną dla IDS.","options":[{"letter":"A","text":"Signatures"},{"letter":"B","text":"Trends"},{"letter":"C","text":"Honeypot"},{"letter":"D","text":"Reputation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":519,"question":"To which of the following security categories does an EDR solution belong?","keyword":"Software detects and responds to endpoint threats ➡️ Technical control","correct_raw":"D. Technical","explanation":"EDR jest rozwiązaniem programowym monitorującym endpointy, wykrywającym podejrzane zachowania i umożliwiającym techniczną reakcję, np. izolację hosta lub zatrzymanie procesu. Jest więc kontrolą techniczną. Kontrole managerial obejmują polityki i zarządzanie ryzykiem, operational są realizowane głównie przez ludzi i procesy, a physical chronią fizyczny dostęp i obiekty.","options":[{"letter":"A","text":"Physical"},{"letter":"B","text":"Operational"},{"letter":"C","text":"Managerial"},{"letter":"D","text":"Technical"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":520,"question":"A company relies on open-source software libraries to build the software used by its customers. Which of the following vulnerability types would be the most difficult to remediate due to the company’s reliance on open-source libraries?","keyword":"A newly discovered dependency flaw may have no available vendor or community fix ➡️ Zero-day","correct_raw":"D. Zero-day","explanation":"Zero-day w zależności open-source może nie mieć jeszcze dostępnej poprawki, bezpiecznej wersji ani gotowego obejścia. Organizacja jest wtedy zależna od utrzymujących bibliotekę albo musi samodzielnie opracować i utrzymywać własną poprawkę, co jest trudne i ryzykowne. Buffer overflow, SQL injection i XSS są konkretnymi klasami błędów, które po zidentyfikowaniu można zazwyczaj naprawić przez aktualizację biblioteki, zmianę kodu, walidację danych lub kontrolę wyjścia. Zero-day jest najtrudniejszy, ponieważ w chwili wykrycia może nie istnieć jeszcze gotowa remediacja.","options":[{"letter":"A","text":"Buffer overflow"},{"letter":"B","text":"SQL injection"},{"letter":"C","text":"Cross-site scripting"},{"letter":"D","text":"Zero-day"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":521,"question":"An organization has a new regulatory requirement to implement corrective controls on a financial system. Which of the following is the most likely reason for the new requirement?","keyword":"Correct detected errors before they propagate to dependent systems ➡️ Corrective control","correct_raw":"B. To ensure that errors are not passed to other systems","explanation":"Kontrole korekcyjne działają po wykryciu błędu lub niepożądanego zdarzenia i mają naprawić jego skutki albo przywrócić prawidłowy stan. W systemie finansowym mogą zatrzymać lub skorygować błędne dane, zanim zostaną przekazane do kolejnych systemów. Odpowiedzi A i D opisują głównie zapobieganie nieautoryzowanym zmianom, czyli kontrolę prewencyjną. Zakup ubezpieczenia jest transferem ryzyka, nie celem kontroli korekcyjnej.","options":[{"letter":"A","text":"To defend against insider threats altering banking details"},{"letter":"B","text":"To ensure that errors are not passed to other systems"},{"letter":"C","text":"To allow for business insurance to be purchased"},{"letter":"D","text":"To prevent unauthorized changes to financial data"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":522,"question":"Which of the following is the stage in an investigating when forensic images are obtained?","keyword":"Create a forensic copy of the original evidence ➡️ Acquisition","correct_raw":"A. Acquisition","explanation":"Acquisition jest etapem pozyskiwania danych dowodowych, w tym wykonywania bitowej kopii nośnika lub forensic image. Preservation dotyczy zabezpieczenia dowodu przed zmianą i utrzymania chain of custody. Reporting opisuje wyniki dochodzenia, a e-discovery jest procesem identyfikacji i udostępniania informacji elektronicznych na potrzeby postępowania prawnego.","options":[{"letter":"A","text":"Acquisition"},{"letter":"B","text":"Preservation"},{"letter":"C","text":"Reporting"},{"letter":"D","text":"E-discovery"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":523,"question":"Which of the following describes the difference between encryption and hashing?","keyword":"Reversible ciphertext versus a one-way digest ➡️ Encryption and hashing","correct_raw":"B. Encryption replaces cleartext with ciphertext, while hashing calculates a checksum.","explanation":"Szyfrowanie przekształca tekst jawny w ciphertext i może zostać odwrócone za pomocą odpowiedniego klucza. Hashing oblicza jednokierunkowy skrót o stałej długości, używany m.in. do kontroli integralności i porównywania danych. Hash nie musi być technicznie tym samym co klasyczna suma kontrolna, ale spośród podanych odpowiedzi B najlepiej oddaje różnicę. Szyfrowanie może chronić dane zarówno w tranzycie, jak i w spoczynku, a hashing nie wykorzystuje klucza prywatnego.","options":[{"letter":"A","text":"Encryption protects data in transit, while hashing protects data at rest."},{"letter":"B","text":"Encryption replaces cleartext with ciphertext, while hashing calculates a checksum."},{"letter":"C","text":"Encryption ensures data integrity, while hashing ensures data confidentiality."},{"letter":"D","text":"Encryption uses a public-key exchange, while hashing uses a private key."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":524,"question":"A security report shows that during a two-week test period, 80% of employees unwittingly disclosed their SSO credentials when accessing an external website. The organization purposely created the website to simulate a cost-free password complexity test. Which of the following would best help reduce the number of visits to similar websites in the future?","keyword":"Users entered SSO credentials on a deceptive external site ➡️ Phishing awareness campaign","correct_raw":"B. Introduce a campaign to recognize phishing attempts.","explanation":"Wynik testu pokazuje, że pracownicy nie rozpoznają fałszywych stron i podają na nich poświadczenia. Szkolenie oraz kampania uświadamiająca uczą weryfikowania adresu, celu strony i próśb o logowanie, dzięki czemu ograniczają ryzyko także wobec nowych domen. Deny list zablokuje tylko znane adresy i łatwo ją ominąć przez utworzenie kolejnej domeny. Blokada całego ruchu wychodzącego jest nieproporcjonalna, a ograniczenie Internetu wyłącznie osobom, które popełniły błąd, nie rozwiązuje problemu organizacyjnego.","options":[{"letter":"A","text":"Block all outbound traffic from the intranet."},{"letter":"B","text":"Introduce a campaign to recognize phishing attempts."},{"letter":"C","text":"Restrict internet access for the employees who disclosed credentials."},{"letter":"D","text":"Implement a deny list of websites."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":525,"question":"A Chief Information Security Officer (CISO) has developed information security policies that relate to the software development methodology. Which of the following would the CISO most likely include in the organization’s documentation?","keyword":"Development methodology defines required review gates for code changes ➡️ Peer review requirements","correct_raw":"A. Peer review requirements","explanation":"Polityka dotycząca metodyki wytwarzania oprogramowania może wymagać, aby zmiany kodu były sprawdzane przez inną osobę przed połączeniem lub wydaniem. Peer review jest kontrolą procesową pasującą do poziomu polityki i SDLC. MFA jest ogólną kontrolą IAM, a szczegółowe konfiguracje secrets management są bardziej odpowiednie dla standardu lub procedury technicznej. Branch protection może wspierać egzekwowanie review, ale „branch protection tests” nie jest tak bezpośrednim wymaganiem metodyki jak peer review.","options":[{"letter":"A","text":"Peer review requirements"},{"letter":"B","text":"Multifactor authentication"},{"letter":"C","text":"Branch protection tests"},{"letter":"D","text":"Secrets management configurations"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":526,"question":"An organization is developing a security program that conveys the responsibilities associated with the general operation of systems and software within the organization. Which of the following documents would most likely communicate these expectations?","keyword":"Communicate users’ responsibilities for using organizational systems and software ➡️ Acceptable use policy","correct_raw":"C. Acceptable use policy","explanation":"Acceptable Use Policy określa, jak pracownicy i inni użytkownicy mogą korzystać z firmowych systemów, oprogramowania, sieci i danych oraz jakie mają obowiązki. BCP opisuje utrzymanie działalności podczas zakłócenia. Change management procedure dotyczy kontrolowania zmian, a SDLC policy reguluje tworzenie i utrzymywanie oprogramowania, nie ogólne zasady korzystania z systemów przez użytkowników.","options":[{"letter":"A","text":"Business continuity plan"},{"letter":"B","text":"Change management procedure"},{"letter":"C","text":"Acceptable use policy"},{"letter":"D","text":"Software development life cycle policy"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":527,"question":"A security analyst created a fake account and saved the password in a non-readily accessible directory in a spreadsheet. An alert was also configured to notify the security team if the spreadsheet is opened. Which of the following best describes the deception method being deployed?","keyword":"A decoy spreadsheet triggers an alert when accessed ➡️ Honeyfile","correct_raw":"B. Honeyfile","explanation":"Honeyfile jest fałszywym plikiem umieszczonym w miejscu, w którym legalny użytkownik nie powinien go otwierać. Dostęp do niego generuje alert i wskazuje podejrzane przeglądanie danych. Fałszywe konto oraz hasło zapisane wewnątrz są jednocześnie honeytokenem, dlatego C jest odpowiedzią kuszącą. Pytanie pyta jednak o metodę, która faktycznie wyzwala alert: otwarcie monitorowanego arkusza, więc najlepiej pasuje B. Honeyfile. Honeypot jest całym systemem-wabikiem, a honeynet siecią takich systemów.","options":[{"letter":"A","text":"Honeypot"},{"letter":"B","text":"Honeyfile"},{"letter":"C","text":"Honeytoken"},{"letter":"D","text":"Honeynet"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":528,"question":"Which of the following is the best way to provide secure, remote access for employees while minimizing the exposure of a company’s internal network?","keyword":"Create an encrypted remote tunnel into authorized internal resources ➡️ VPN","correct_raw":"A. VPN","explanation":"VPN tworzy szyfrowany tunel pomiędzy urządzeniem pracownika a bramą organizacji i pozwala ograniczyć dostęp do określonych podsieci lub usług. Dzięki temu zasoby wewnętrzne nie muszą być bezpośrednio wystawione do Internetu. LDAP jest protokołem katalogowym, FTP służy do przesyłania plików i w zwykłej postaci nie szyfruje transmisji, a RADIUS jest protokołem AAA, który może uwierzytelniać użytkowników VPN, ale sam nie zapewnia tunelu zdalnego dostępu.","options":[{"letter":"A","text":"VPN"},{"letter":"B","text":"LDAP"},{"letter":"C","text":"FTP"},{"letter":"D","text":"RADIUS"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":529,"question":"A company wants to track modifications to the code that is used to build new virtual servers. Which of the following will the company most likely deploy?","keyword":"Track every change to infrastructure code and restore earlier revisions ➡️ Version control tool","correct_raw":"D. Version control tool","explanation":"Kod używany do budowy serwerów wirtualnych jest formą Infrastructure as Code. System kontroli wersji rejestruje autora, czas i treść każdej zmiany, umożliwia porównywanie wersji, code review oraz powrót do wcześniejszego stanu. Ticketing może dokumentować zatwierdzenie zmiany, ale nie śledzi dokładnie historii kodu. Collaboration platform wspiera komunikację, a behavioral analyzer wykrywa anomalie.","options":[{"letter":"A","text":"Change management ticketing system"},{"letter":"B","text":"Behavioral analyzer"},{"letter":"C","text":"Collaboration platform"},{"letter":"D","text":"Version control tool"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":530,"question":"Which of the following documents details how to accomplish a technical security task?","keyword":"Step-by-step instructions explain how to perform a task ➡️ Procedure","correct_raw":"D. Procedure","explanation":"Procedure zawiera szczegółowe, wykonywalne kroki opisujące, jak zrealizować zadanie techniczne. Policy określa wymagania i kierunek działania, standard ustanawia obowiązkowe parametry lub minimalne wymagania, a guideline przekazuje zalecane, lecz zwykle niewiążące praktyki. Gdy dokument odpowiada na pytanie „jak dokładnie to zrobić?”, jest procedurą.","options":[{"letter":"A","text":"Standard"},{"letter":"B","text":"Policy"},{"letter":"C","text":"Guideline"},{"letter":"D","text":"Procedure"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":531,"question":"While conducting a business continuity tabletop exercise, the security team becomes concerned by potential impact if a generator was to develop a fault during failover. Which of the following is the team most likely to consider in regard to risk management activities?","keyword":"Evaluate the business impact of a failed generator during failover ➡️ BIA","correct_raw":"C. BIA","explanation":"Business Impact Analysis określa, jakie skutki dla krytycznych procesów biznesowych wywoła awaria konkretnego zasobu lub mechanizmu ciągłości działania. Zespół chce ocenić konsekwencje sytuacji, w której generator zawiedzie podczas przełączania zasilania, więc analizuje wpływ przerwy na usługi, procesy i organizację. RPO określa dopuszczalną utratę danych wyrażoną w czasie, ARO przewidywaną roczną częstotliwość zdarzenia, a MTTR średni czas naprawy lub przywrócenia działania. Te parametry mogą wspierać analizę, ale nie są samym procesem oceny wpływu biznesowego.","options":[{"letter":"A","text":"RPO"},{"letter":"B","text":"ARO"},{"letter":"C","text":"BIA"},{"letter":"D","text":"MTTR"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":532,"question":"Which of the following is prevented by proper data sanitization?","keyword":"Make residual data unrecoverable before media reuse or disposal ➡️ Data sanitization","correct_raw":"A. Hackers’ ability to obtain data from used hard drives","explanation":"Data sanitization usuwa albo niszczy dane na nośniku w sposób dostosowany do ryzyka i planowanego wykorzystania urządzenia. Przed sprzedażą, zwrotem, ponownym użyciem lub utylizacją dysku właściwa sanityzacja ma uniemożliwić odzyskanie pozostałości danych przez kolejną osobę. Nie rozwiązuje natomiast problemu końca wsparcia urządzenia, błędnej klasyfikacji danych ani nieprawidłowego prowadzenia inwentarza.","options":[{"letter":"A","text":"Hackers’ ability to obtain data from used hard drives"},{"letter":"B","text":"Devices reaching end-of-life and losing support"},{"letter":"C","text":"Disclosure of sensitive data through incorrect classification"},{"letter":"D","text":"Incorrect inventory data leading to a laptop shortage"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":533,"question":"A certificate authority needs to post information about expired certificates. Which of the following would accomplish this task?","keyword":"Publish certificate invalidation status ➡️ CRL","correct_raw":"B. CRL","explanation":"CRL, czyli Certificate Revocation List, jest publikowaną i podpisaną przez CA listą certyfikatów unieważnionych przed końcem ich okresu ważności. Spośród podanych odpowiedzi tylko CRL jest mechanizmem publikowania informacji o certyfikatach, którym nie należy ufać. Treść pytania jest jednak technicznie nieprecyzyjna: certyfikat zwyczajnie wygasły jest odrzucany na podstawie pola końca ważności w samym certyfikacie i zazwyczaj nie musi być dodawany do CRL. Gdyby autor użył słowa revoked zamiast expired, odpowiedź B byłaby jednoznaczna. TPM chroni klucze w sprzęcie, PKI jest całym ekosystemem certyfikatów, a CSR jest żądaniem wystawienia certyfikatu.","options":[{"letter":"A","text":"TPM"},{"letter":"B","text":"CRL"},{"letter":"C","text":"PKI"},{"letter":"D","text":"CSR"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":534,"question":"Which of the following can best contribute to prioritizing patch applications?","keyword":"Use a standardized vulnerability severity score to rank remediation ➡️ CVSS","correct_raw":"A. CVSS","explanation":"CVSS przypisuje podatności wynik liczbowy i klasę dotkliwości na podstawie cech takich jak możliwość wykorzystania i wpływ na poufność, integralność oraz dostępność. Wynik może pomóc ustalić kolejność wdrażania poprawek, choć w praktyce trzeba go połączyć z ekspozycją systemu, znaczeniem zasobu i aktywnym wykorzystaniem podatności. CVE jest identyfikatorem konkretnej podatności, a nie oceną jej priorytetu. SCAP standaryzuje automatyzację informacji i kontroli bezpieczeństwa, a OSINT oznacza analizę źródeł publicznych.","options":[{"letter":"A","text":"CVSS"},{"letter":"B","text":"SCAP"},{"letter":"C","text":"OSINT"},{"letter":"D","text":"CVE"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":535,"question":"A systems administrator creates a script that validates OS version, patch levels, and installed applications when users log in. Which of the following examples best describes the purpose of this script?","keyword":"Validate each endpoint against an approved configuration standard ➡️ Baseline enforcement","correct_raw":"C. Baseline enforcement","explanation":"Bezpieczna konfiguracja bazowa określa zatwierdzony system operacyjny, wymagane poprawki, dozwolone aplikacje i inne ustawienia. Skrypt sprawdza urządzenie podczas logowania i porównuje jego stan z takim wzorcem, czyli egzekwuje baseline. Resource scaling zwiększa albo zmniejsza zasoby, policy enumeration oznacza raczej odczyt lub wyliczenie polityk, a guard rails są szerszymi ograniczeniami zapobiegającymi wdrożeniu niedozwolonych konfiguracji.","options":[{"letter":"A","text":"Resource scaling"},{"letter":"B","text":"Policy enumeration"},{"letter":"C","text":"Baseline enforcement"},{"letter":"D","text":"Guard rails implementation"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":536,"question":"A security analyst learns that an attack vector, which was used as a part of a recent incident, was a well-known IoT device exploit. The analyst needs to review logs to identify the time of initial exploit. Which of the following logs should the analyst review first?","keyword":"Trace the first inbound connection targeting a networked IoT device ➡️ Firewall logs","correct_raw":"C. Firewall","explanation":"Firewall rejestruje połączenia przychodzące i wychodzące, w tym czas, adresy źródłowe i docelowe, porty oraz wynik decyzji. Przy znanym exploicie urządzenia IoT jest najbardziej prawdopodobnym pierwszym miejscem do ustalenia, kiedy podejrzany ruch dotarł do urządzenia. Urządzenia IoT często zapewniają ograniczone logi endpointowe. NAC może pokazać moment podłączenia lub dopuszczenia urządzenia do sieci, ale niekoniecznie czas wykorzystania podatności. Log aplikacyjny mógłby pomóc, jeśli podatna usługa prowadzi szczegółowe logi, lecz firewall jest najlepszym pierwszym źródłem spośród podanych.","options":[{"letter":"A","text":"Endpoint"},{"letter":"B","text":"Application"},{"letter":"C","text":"Firewall"},{"letter":"D","text":"NAC"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":537,"question":"A company’s gate access logs show multiple entries from an employee’s ID badge within a two-minute period. Which of the following is this an example of?","keyword":"The same badge identity appears at multiple gate events almost simultaneously ➡️ RFID cloning","correct_raw":"A. RFID cloning","explanation":"Sklonowany identyfikator RFID pozwala drugiej karcie przedstawiać się jako ta sama karta pracownika. Kilka użyć tego samego identyfikatora w bardzo krótkim czasie może wskazywać, że oryginalna i sklonowana karta są używane równolegle. Tailgating polega na wejściu za uprawnioną osobą bez własnego użycia karty, więc zwykle nie generuje dodatkowego wpisu dla tego samego badge ID. Shoulder surfing to podglądanie informacji, a side-channel attack wykorzystuje uboczne cechy działania systemu.","options":[{"letter":"A","text":"RFID cloning"},{"letter":"B","text":"Side-channel attack"},{"letter":"C","text":"Shoulder surfing"},{"letter":"D","text":"Tailgating"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":538,"question":"Which of the following most accurately describes the order in which a security engineer should implement secure baselines?","keyword":"Define the standard, apply it, and keep it current ➡️ Establish, deploy, maintain","correct_raw":"C. Establish, deploy, maintain","explanation":"Najpierw należy establish, czyli opracować i zatwierdzić bezpieczną konfigurację bazową. Następnie deploy, czyli wdrożyć ją na systemach. Ostatnim, ciągłym etapem jest maintain: monitorowanie zgodności, aktualizacja wzorca i dostosowywanie go do nowych wersji, zagrożeń oraz wymagań. Nie można sensownie wdrożyć baseline, który nie został wcześniej ustanowiony.","options":[{"letter":"A","text":"Deploy, maintain, establish"},{"letter":"B","text":"Establish, maintain, deploy"},{"letter":"C","text":"Establish, deploy, maintain"},{"letter":"D","text":"Deploy, establish, maintain"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":539,"question":"A SOC analyst establishes a remote control session on an end user’s machine and discovers the following in a file:\n\ngmail.com[ENT]my.name@gmail.com[ENT]NoOneCanGuessThis123! [ENT]Hello Susan, it was great to see you the other day! Let’s plan a followup[BACKSPACE]follow-up meeting soon. Here is the link to register. [RTN][CTRL]c [CTRL]v [RTN]after[BACKSPACE]After you register give me a call on my cellphone.\n\nWhich of the following actions should the SOC analyst perform first?","keyword":"Remove the active keylogger before entering replacement credentials ➡️ Reimage the machine","correct_raw":"B. Reimage the end user’s machine.","explanation":"Znaczniki [ENT], [BACKSPACE], [CTRL]c i [CTRL]v wskazują, że plik jest zapisem naciśnięć klawiszy utworzonym przez keylogger. Ponieważ komputer jest aktywnie skompromitowany, najpierw należy usunąć z niego zagrożenie. Spośród podanych odpowiedzi najlepiej realizuje to ponowne przygotowanie systemu z zaufanego obrazu. Zmiana hasła przed usunięciem keyloggera mogłaby spowodować przechwycenie nowego hasła, jeśli użytkownik ponownie użyłby go na zainfekowanym urządzeniu. Po odizolowaniu i odtworzeniu komputera należy zmienić wszystkie ujawnione hasła z czystego urządzenia oraz sprawdzić, czy nie doszło do przejęcia kont. W pełnej procedurze pierwszym krokiem byłoby odizolowanie hosta i zabezpieczenie dowodów, ale takiej odpowiedzi nie podano. Odpowiedź A jest koniecznym kolejnym działaniem, lecz B lepiej odpowiada słowu first w tym zestawie odpowiedzi.","options":[{"letter":"A","text":"Advise the user to change passwords."},{"letter":"B","text":"Reimage the end user’s machine."},{"letter":"C","text":"Check the policy on personal email at work."},{"letter":"D","text":"Check host firewall logs."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":540,"question":"Which of the following is a reason environmental variables are a concern when reviewing potential system vulnerabilities?","keyword":"Runtime configuration values can broaden what an exploit can reach or expose ➡️ Scope and impact","correct_raw":"A. The contents of environmental variables could affect the scope and impact of an exploited vulnerability.","explanation":"Zmienne środowiskowe przekazują procesom informacje o ich kontekście uruchomieniowym, np. ścieżki PATH, katalogi tymczasowe, nazwy hostów, tryb pracy, adresy usług, dane konfiguracyjne, a czasem również sekrety lub tokeny. Jeżeli podatność pozwoli napastnikowi odczytać albo wykorzystać te wartości, mogą one ujawnić dodatkowe cele, poświadczenia i ścieżki lub rozszerzyć skutki ataku. Odpowiedź B opisuje szczególny możliwy scenariusz manipulacji, ale błędnie przedstawia go jako ogólną definicję memory injection. Zmienne środowiskowe nie definiują automatycznie standardów kryptograficznych ani harmonogramu aktualizacji.","options":[{"letter":"A","text":"The contents of environmental variables could affect the scope and impact of an exploited vulnerability."},{"letter":"B","text":"In-memory environmental variable values can be overwritten and used by attackers to insert malicious code."},{"letter":"C","text":"Environmental variables define cryptographic standards for the system and could create vulnerabilities if deprecated algorithms are used."},{"letter":"D","text":"Environmental variables will determine when updates are run and could mitigate the likelihood of vulnerability exploitation."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":541,"question":"A company evaluates several options that would allow employees to have remote access to the network. The security team wants to ensure the solution includes AAA to comply with internal security policies. Which of the following should the security team recommend?","keyword":"Encrypted remote access plus centralized authentication, authorization, and accounting ➡️ IPSec with RADIUS","correct_raw":"A. IPSec with RADIUS","explanation":"IPSec zapewnia szyfrowany tunel zdalnego dostępu do sieci, a RADIUS centralizuje AAA: authentication potwierdza tożsamość użytkownika, authorization określa jego uprawnienia, a accounting rejestruje sesję i użycie zasobów. RDP z LDAPS może zapewniać zdalny pulpit i bezpieczne zapytania katalogowe, ale nie stanowi kompletnego rozwiązania AAA. Web proxy nie zapewnia zdalnego dostępu do całej sieci, a 802.1X jest stosowany głównie do kontroli dostępu do sieci przewodowej lub bezprzewodowej, nie jako typowe rozwiązanie zdalnego dostępu przez Internet.","options":[{"letter":"A","text":"IPSec with RADIUS"},{"letter":"B","text":"RDP connection with LDAPS"},{"letter":"C","text":"Web proxy for all remote traffic"},{"letter":"D","text":"Jump server with 802.1X"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":542,"question":"An administrator must replace an expired SSL certificate. Which of the following does the administrator need to create the new SSL certificate?","keyword":"Request a certificate from a CA using identity data and a public key ➡️ CSR","correct_raw":"A. CSR","explanation":"CSR, czyli Certificate Signing Request, jest żądaniem przekazywanym do urzędu certyfikacji w celu wystawienia nowego certyfikatu. Zawiera między innymi klucz publiczny i dane identyfikujące podmiot, a żądanie jest podpisywane odpowiadającym mu kluczem prywatnym. W praktyce administrator często generuje nową parę kluczy, a następnie tworzy CSR, lecz spośród odpowiedzi dokumentem wymaganym do zamówienia certyfikatu jest CSR. OCSP sprawdza status certyfikatu, a CRL publikuje informacje o certyfikatach unieważnionych.","options":[{"letter":"A","text":"CSR"},{"letter":"B","text":"OCSP"},{"letter":"C","text":"Key"},{"letter":"D","text":"CRL"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":543,"question":"A systems administrator receives a text message from an unknown number claiming to be the Chief Executive Officer of the company. The message states an emergency situation requires a password reset. Which of the following threat vectors is being used?","keyword":"A deceptive request is delivered through an SMS text message ➡️ Smishing","correct_raw":"B. Smishing","explanation":"Smishing jest phishingiem przeprowadzanym za pomocą wiadomości SMS lub innej wiadomości tekstowej. Podszywanie się pod CEO jest impersonation, a rzekoma sytuacja awaryjna tworzy pretekst, lecz pytanie pyta o threat vector, czyli kanał użyty do dostarczenia ataku. Tym kanałem jest wiadomość tekstowa. Typosquatting dotyczy podobnych nazw domen.","options":[{"letter":"A","text":"Typosquatting"},{"letter":"B","text":"Smishing"},{"letter":"C","text":"Pretexting"},{"letter":"D","text":"Impersonation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":544,"question":"A Chief Information Security Officer (CISO) wants to:\n\n• Prevent employees from downloading malicious content.\n• Establish controls based on departments and users.\n• Map internet access for business applications to specific service accounts.\n• Restrict content based on categorization.\n\nWhich of the following should the CSO implement?","keyword":"Apply user-aware application control, malware prevention, and URL categorization ➡️ Next-generation firewall","correct_raw":"D. Next-generation firewall","explanation":"NGFW łączy klasyczne filtrowanie sieciowe z rozpoznawaniem aplikacji i użytkowników, kontrolą dostępu według grup lub działów, inspekcją treści, blokowaniem złośliwych plików oraz filtrowaniem kategorii URL. Może również powiązać ruch aplikacji lub procesów z określonymi tożsamościami i kontami serwisowymi. WAF chroni przede wszystkim publikowane aplikacje webowe przed atakami na HTTP/HTTPS. Secure DNS może blokować złośliwe domeny, ale nie realizuje całego zestawu wymagań. Jump server służy do kontrolowanego dostępu administracyjnego.","options":[{"letter":"A","text":"Web application firewall"},{"letter":"B","text":"Secure DNS server"},{"letter":"C","text":"Jump server"},{"letter":"D","text":"Next-generation firewall"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":545,"question":"A company is aware of a given security risk related to a specific market segment. The business chooses not to accept responsibility and target their services to a different market segment. Which of the following describes this risk management strategy?","keyword":"Stop the risky activity by leaving the affected market segment ➡️ Risk avoidance","correct_raw":"C. Avoid","explanation":"Risk avoidance polega na rezygnacji z działania powodującego ryzyko. Firma nie ogranicza ryzyka w pierwotnym segmencie i nie przekazuje odpowiedzialności innej stronie, lecz całkowicie wycofuje się z tego rynku i wybiera inny. Risk transfer przenosi część skutków, np. przez ubezpieczenie lub umowę. Exception i exemption oznaczają odstępstwa lub zwolnienia od wymagań, a nie podstawową strategię postępowania z ryzykiem.","options":[{"letter":"A","text":"Exemption"},{"letter":"B","text":"Exception"},{"letter":"C","text":"Avoid"},{"letter":"D","text":"Transfer"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":546,"question":"A security analyst needs to improve the company’s authentication policy following a password audit. Which of the following should be included in the policy? (Choose two.)","keyword":"Define properties required of passwords themselves ➡️ Length and complexity","correct_raw":"A. Length oraz B. Complexity","explanation":"Audyt dotyczył haseł, dlatego polityka powinna określać właściwości samych haseł, przede wszystkim minimalną długość oraz wymagania dotyczące złożoności. Least privilege jest zasadą autoryzacji, a nie parametrem hasła. Something you have, security keys i biometrics są dodatkowymi czynnikami uwierzytelniania. W nowoczesnych wytycznych większy nacisk kładzie się na długość, blokowanie haseł powszechnych i skompromitowanych oraz MFA niż na sztywne reguły kompozycji, lecz egzaminowy zestaw odpowiedzi oczekuje A i B.","options":[{"letter":"A","text":"Length"},{"letter":"B","text":"Complexity"},{"letter":"C","text":"Least privilege"},{"letter":"D","text":"Something you have"},{"letter":"E","text":"Security keys"},{"letter":"F","text":"Biometrics"}],"correctLetters":["A","B"],"isPBQ":false,"multiSelect":true},{"id":547,"question":"Which of the following is an example of a treatment strategy for a continuous risk?","keyword":"Continuously filter a recurring stream of phishing threats ➡️ Email gateway","correct_raw":"A. Email gateway to block phishing attempts","explanation":"Phishing jest zagrożeniem występującym stale, ponieważ nowe wiadomości i kampanie docierają do organizacji każdego dnia. Brama pocztowa działa ciągle i automatycznie filtruje wiadomości, załączniki, odnośniki oraz znane wskaźniki zagrożeń, dlatego jest przykładem stałego ograniczania ryzyka. Background check jest wykonywany głównie w określonym momencie procesu zatrudnienia. Dual control jest stosowany przy każdej transakcji, a branch protection przy każdej zmianie kodu, więc odpowiedzi C i D także opisują powtarzalne kontrole. Pytanie nie jest idealnie rozłączne, ale oczekiwanym przykładem continuous risk jest stale napływający phishing i stale działająca brama pocztowa.","options":[{"letter":"A","text":"Email gateway to block phishing attempts"},{"letter":"B","text":"Background checks for new employees"},{"letter":"C","text":"Dual control requirements for wire transfers"},{"letter":"D","text":"Branch protection as part of the CI/CD pipeline"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":548,"question":"An organization wants to deploy software in a container environment to increase security. Which of the following would limit the organization's ability to achieve this goal?","keyword":"A tightly coupled application is difficult to separate into isolated container workloads ➡️ Monolithic code","correct_raw":"D. Monolithic code","explanation":"Aplikacja monolityczna składa się z silnie powiązanych funkcji wdrażanych jako jeden duży komponent. Utrudnia to rozdzielenie funkcji na małe, niezależne kontenery, ograniczanie ich uprawnień i aktualizowanie poszczególnych usług bez wdrażania całej aplikacji. Kontenery mogą uruchamiać monolit, ale organizacja nie uzyska wtedy pełnych korzyści z izolacji i ograniczenia zakresu poszczególnych komponentów. Wersja kernela może wpływać na kompatybilność i dostępne mechanizmy bezpieczeństwa, lecz największym ograniczeniem architektonicznym w tym scenariuszu jest monolityczny kod.","options":[{"letter":"A","text":"Regulatory compliance"},{"letter":"B","text":"Patch availability"},{"letter":"C","text":"Kernel version"},{"letter":"D","text":"Monolithic code"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":549,"question":"Prior to implementing a design change, the change must go through multiple steps to ensure that it does not cause any security issues. Which of the following is most likely to be one of those steps?","keyword":"Prepare a tested way to reverse the change if it causes problems ➡️ Backout planning","correct_raw":"C. Backout planning","explanation":"Przed wdrożeniem zmiany należy przygotować plan wycofania, który określa, jak wrócić do wcześniejszej konfiguracji, wersji lub architektury, jeśli zmiana spowoduje awarię albo problem bezpieczeństwa. Backout planning jest standardowym elementem change management obok analizy wpływu, testowania, zatwierdzenia i planowania okna wdrożeniowego. Restart usługi i maintenance mogą być czynnościami wykonawczymi, ale nie są obowiązkowym etapem oceny każdej zmiany. Ogólne board review nie musi być wymagane dla każdej zmiany technicznej.","options":[{"letter":"A","text":"Board review"},{"letter":"B","text":"Service restart"},{"letter":"C","text":"Backout planning"},{"letter":"D","text":"Maintenance"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":550,"question":"The internal audit team determines a software application is no longer in scope for external reporting requirements. Which of the following will confirm that the application is no longer applicable?","keyword":"Verify the application no longer stores, processes, or retains reportable data ➡️ Data inventory and retention","correct_raw":"A. Data inventory and retention","explanation":"Inwentaryzacja danych pokazuje, jakie kategorie danych aplikacja przechowuje, przetwarza lub przesyła, a zasady retencji określają, czy dane regulowane nadal powinny się w niej znajdować. Jeżeli przegląd potwierdzi, że aplikacja nie obsługuje już danych objętych zewnętrznym raportowaniem i nie przechowuje ich zgodnie z wymaganiami retencji, stanowi to rzeczową podstawę do wyłączenia jej z zakresu. Right to be forgotten dotyczy prawa osoby do żądania usunięcia jej danych. Due care i due diligence opisują należytą staranność. Acknowledgement and attestation byłoby mocnym kandydatem, gdyby pytanie pytało o formalne udokumentowanie lub potwierdzenie stanowiska kierownictwa; tutaj słowo confirm odnosi się najbardziej bezpośrednio do sprawdzenia faktycznego zakresu danych aplikacji.","options":[{"letter":"A","text":"Data inventory and retention"},{"letter":"B","text":"Right to be forgotten"},{"letter":"C","text":"Due care and due diligence"},{"letter":"D","text":"Acknowledgement and attestation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":551,"question":"Which of the following are the first steps an analyst should perform when developing a heat map? (Choose two.)","keyword":"Map the physical layout and record wireless signal strength at measured locations -> Floor plan and site walk","correct_raw":"A. Methodically walk around the office noting Wi-Fi signal strength oraz C. Create or obtain a layout of the office.","explanation":"Mapa cieplna Wi-Fi wymaga najpierw planu pomieszczeń, na który zostaną naniesione wyniki pomiarów, oraz systematycznego przejścia po obiekcie z pomiarem siły sygnału w kolejnych punktach. Samo sprawdzenie ustawień punktów dostępowych nie pokazuje rzeczywistego rozkładu zasięgu. Długość kabli, logi aktywności urządzeń i usuwanie przeszkód nie są pierwszymi krokami tworzenia heat mapy.","options":[{"letter":"A","text":"Methodically walk around the office noting Wi-Fi signal strength."},{"letter":"B","text":"Log in to each access point and check the settings."},{"letter":"C","text":"Create or obtain a layout of the office."},{"letter":"D","text":"Measure cable lengths between access points."},{"letter":"E","text":"Review access logs to determine the most active devices."},{"letter":"F","text":"Remove possible impediments to radio transmissions."}],"correctLetters":["A","C"],"isPBQ":false,"multiSelect":true},{"id":552,"question":"Which of the following is used to improve security and overall functionality without losing critical application data?","keyword":"Apply fixes and improvements while preserving application data -> Patching","correct_raw":"C. Patching","explanation":"Patching polega na wdrażaniu poprawek usuwających podatności, błędy i problemy funkcjonalne bez celowego usuwania danych aplikacji. Reformatting usuwa zawartość nośnika, decommissioning wycofuje system z użytkowania, a encryption chroni poufność danych, ale nie poprawia ogólnej funkcjonalności aplikacji.","options":[{"letter":"A","text":"Reformatting"},{"letter":"B","text":"Decommissioning"},{"letter":"C","text":"Patching"},{"letter":"D","text":"Encryption"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":553,"question":"An organization is preparing to export proprietary software to a customer. Which of the following would be the best way to prevent the loss of intellectual property?","keyword":"Make proprietary code difficult to understand and reverse engineer -> Obfuscation","correct_raw":"B. Obfuscation","explanation":"Obfuscation przekształca kod w formę trudniejszą do odczytania, analizowania i odtworzenia, zachowując jego działanie. Ogranicza to ryzyko kradzieży własności intelektualnej przez reverse engineering. Code signing potwierdza pochodzenie i integralność oprogramowania, ale nie ukrywa jego logiki. Tokenization zastępuje dane wrażliwe tokenami, a blockchain nie jest typowym zabezpieczeniem kodu przed analizą przez klienta.","options":[{"letter":"A","text":"Code signing"},{"letter":"B","text":"Obfuscation"},{"letter":"C","text":"Tokenization"},{"letter":"D","text":"Blockchain"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":554,"question":"After a series of account compromises and credential misuse, a company hires a security manager to develop a security program. Which of the following steps should the security manager take first to increase security awareness?","keyword":"Establish and communicate the required behavior before testing or measuring employees -> Update policies and handbooks","correct_raw":"D. Update policies and handbooks to ensure all employees are informed of the new procedures.","explanation":"Pierwszym krokiem powinno być formalne określenie i przekazanie pracownikom nowych zasad dotyczących haseł, poświadczeń i bezpiecznego korzystania z kont. Dopiero po ustanowieniu oczekiwań można prowadzić kampanie phishingowe, mierzyć zachowania albo wysyłać cykliczne materiały przypominające. Narzędzia i raporty nie zastąpią jasnej polityki, a sam newsletter nie tworzy pełnego programu.","options":[{"letter":"A","text":"Evaluate tools that identify risky behavior and distribute reports on the findings."},{"letter":"B","text":"Send quarterly newsletters that explain the importance of password management."},{"letter":"C","text":"Develop phishing campaigns and notify the management team of any successes."},{"letter":"D","text":"Update policies and handbooks to ensure all employees are informed of the new procedures."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":555,"question":"Which of the following should be used to ensure a device is inaccessible to a network-connected resource?","keyword":"Cut a device off from network resources -> Host isolation","correct_raw":"C. Host isolation","explanation":"Host isolation odcina urządzenie od komunikacji z siecią albo ogranicza ją wyłącznie do narzędzi zarządzających i reagowania na incydent. Dzięki temu urządzenie nie może korzystać z zasobów sieciowych ani rozprzestrzeniać zagrożenia. Wyłączenie nieużywanych usług zmniejsza powierzchnię ataku, WAF chroni aplikacje webowe, a NIDS wykrywa ruch, ale nie blokuje automatycznie dostępu hosta do zasobów.","options":[{"letter":"A","text":"Disablement of unused services"},{"letter":"B","text":"Web application firewall"},{"letter":"C","text":"Host isolation"},{"letter":"D","text":"Network-based IDS"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":556,"question":"In which of the following will unencrypted network traffic most likely be found?","keyword":"Resource-constrained connected devices often transmit data without strong encryption -> IoT","correct_raw":"B. IoT","explanation":"IoT jest najbardziej prawdopodobną odpowiedzią egzaminacyjną. Wiele urządzeń IoT ma ograniczone zasoby, słabe mechanizmy bezpieczeństwa i korzysta z prostych lub źle wdrożonych protokołów, dlatego w ich ruchu często można spotkać dane przesyłane bez szyfrowania. SCADA również jest bardzo mocnym kandydatem, ponieważ starsze protokoły przemysłowe często nie zapewniają szyfrowania ani uwierzytelniania. Pytanie jest więc nieidealnie rozłączne. W dostępnych zestawieniach tego dokładnego pytania częściej wskazywane jest jednak B. IoT, dlatego tę odpowiedź należy przyjąć jako właściwą do nauki. VPN z definicji ma zapewniać szyfrowany tunel, a SDN samo w sobie nie oznacza ruchu nieszyfrowanego.","options":[{"letter":"A","text":"SDN"},{"letter":"B","text":"IoT"},{"letter":"C","text":"VPN"},{"letter":"D","text":"SCADA"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":557,"question":"Which of the following is the best reason to perform a tabletop exercise?","keyword":"Discuss a simulated incident to identify gaps and improve the response plan -> Update the IRP","correct_raw":"C. To update the IRP","explanation":"Tabletop exercise polega na przejściu przez symulowany incydent w formie dyskusji. Uczestnicy sprawdzają role, komunikację, decyzje, eskalację i procedury, a wykryte luki służą do aktualizacji Incident Response Plan. Ćwiczenie nie służy przede wszystkim obliczaniu ROI ani dokładnemu mierzeniu czasu remediacji, ponieważ nie jest pełnym testem operacyjnym. Może pośrednio pomóc w zamknięciu ustaleń audytowych, ale głównym celem jest ulepszanie planu reakcji.","options":[{"letter":"A","text":"To address audit findings"},{"letter":"B","text":"To collect remediation response times"},{"letter":"C","text":"To update the IRP"},{"letter":"D","text":"To calculate the ROI"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":558,"question":"Which of the following is a use of CVSS?","keyword":"Use standardized severity scores to rank vulnerability remediation -> CVSS","correct_raw":"D. To prioritize the remediation of vulnerabilities","explanation":"CVSS nadaje podatności ocenę dotkliwości na podstawie jej wykorzystywalności i wpływu. Wynik pomaga porównywać podatności oraz ustalać kolejność działań naprawczych. Nie wylicza kosztu patchowania, nie skanuje portów i nie analizuje kodu źródłowego.","options":[{"letter":"A","text":"To determine the cost associated with patching systems"},{"letter":"B","text":"To identify unused ports and services that should be closed"},{"letter":"C","text":"To analyze code for defects that could be exploited"},{"letter":"D","text":"To prioritize the remediation of vulnerabilities"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":559,"question":"For an upcoming product launch, a company hires a marketing agency whose owner is a close relative of the Chief Executive Officer. Which of the following did the company violate?","keyword":"A decision-maker has a personal relationship with the selected vendor -> Conflict of interest","correct_raw":"D. Conflict of interest policy","explanation":"Bliska relacja rodzinna między CEO a właścicielem wybranej agencji może wpływać na bezstronność decyzji zakupowej albo tworzyć takie wrażenie. Taka sytuacja powinna zostać ujawniona i obsłużona zgodnie z polityką konfliktu interesów. Pozostałe odpowiedzi dotyczą audytów, oceny łańcucha dostaw i praw umownych.","options":[{"letter":"A","text":"Independent assessments"},{"letter":"B","text":"Supply chain analysis"},{"letter":"C","text":"Right-to-audit clause"},{"letter":"D","text":"Conflict of interest policy"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":560,"question":"An organization designs an inbound firewall with a fail-open configuration while implementing a website. Which of the following would the organization consider to be the highest priority?","keyword":"Allow traffic to continue when the firewall fails -> Availability","correct_raw":"C. Availability","explanation":"Fail-open oznacza, że w przypadku awarii urządzenie przestaje blokować ruch i pozwala mu przechodzić, aby usługa pozostała osiągalna. Organizacja świadomie przyjmuje większe ryzyko bezpieczeństwa w zamian za ciągłość dostępu do strony, więc najwyższym priorytetem jest availability. Fail-closed lepiej chroniłby poufność i integralność, ale mógłby spowodować niedostępność usługi podczas awarii.","options":[{"letter":"A","text":"Confidentiality"},{"letter":"B","text":"Non-repudiation"},{"letter":"C","text":"Availability"},{"letter":"D","text":"Integrity"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":561,"question":"An engineer needs to ensure that a script has not been modified before it is launched. Which of the following best provides this functionality?","keyword":"Compare the current digest with a trusted digest before execution -> Hashing","correct_raw":"C. Hashing","explanation":"Administrator oblicza hash zaufanej wersji skryptu, a przed uruchomieniem ponownie oblicza hash bieżącego pliku. Jeżeli wartości są identyczne, skrypt najprawdopodobniej nie został zmodyfikowany. Nawet niewielka zmiana powinna wygenerować inny digest. Masking ukrywa część danych, obfuscation utrudnia zrozumienie kodu, a encryption chroni poufność, lecz samo w sobie nie jest najprostszym mechanizmem sprawdzania integralności pliku.","options":[{"letter":"A","text":"Masking"},{"letter":"B","text":"Obfuscation"},{"letter":"C","text":"Hashing"},{"letter":"D","text":"Encryption"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":562,"question":"Which of the following is the most important element when defining effective security governance?","keyword":"Establish accountability by defining who owns, controls, and protects information -> Roles and responsibilities","correct_raw":"C. Assigning roles and responsibilities for owners, controllers, and custodians","explanation":"Skuteczne governance wymaga jednoznacznej odpowiedzialności i rozliczalności. Trzeba określić, kto podejmuje decyzje dotyczące danych, kto ustala zasady ich przetwarzania oraz kto wykonuje codzienną ochronę i obsługę. Bez przypisania właścicieli, kontrolerów i kustoszy polityki mogą istnieć, ale nie wiadomo, kto ma je zatwierdzać, wdrażać i egzekwować. External considerations, onboarding/offboarding i change management są ważnymi elementami programu, lecz są bardziej szczegółowymi procesami opartymi na wcześniej ustalonych rolach.","options":[{"letter":"A","text":"Discovering and documenting external considerations"},{"letter":"B","text":"Developing procedures for employee onboarding and offboarding"},{"letter":"C","text":"Assigning roles and responsibilities for owners, controllers, and custodians"},{"letter":"D","text":"Defining and monitoring change management procedures"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":563,"question":"A contractor is required to visually inspect the motherboards of all new servers that are purchased to determine whether the servers were tampered with. Which of the following risks is the contractor attempting to mitigate?","keyword":"Check newly acquired hardware for tampering before deployment -> Supply chain risk","correct_raw":"B. Supply chain","explanation":"Serwer może zostać zmodyfikowany na etapie produkcji, magazynowania, transportu albo dystrybucji. Kontrola fizyczna płyty głównej ma wykryć nieautoryzowane komponenty, podmiany lub ślady manipulacji, czyli ograniczyć ryzyko kompromitacji łańcucha dostaw. Embedded rootkit może być jednym z konkretnych skutków takiego ataku, ale pytanie dotyczy szerszej kategorii ryzyka wynikającego z drogi produktu od producenta do odbiorcy.","options":[{"letter":"A","text":"Embedded rootkit"},{"letter":"B","text":"Supply chain"},{"letter":"C","text":"Firmware failure"},{"letter":"D","text":"RFID keylogger"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":564,"question":"Which of the following could potentially be introduced at the time of side loading?","keyword":"Install software from an untrusted source outside the approved store -> Rootkit","correct_raw":"B. Rootkit","explanation":"Sideloading oznacza instalowanie aplikacji spoza zatwierdzonego sklepu lub oficjalnego kanału dystrybucji. Jeżeli pakiet został zmodyfikowany albo pochodzi z niezaufanego źródła, może zawierać złośliwe oprogramowanie, w tym rootkit zapewniający ukryty, uprzywilejowany dostęp. Impersonation jest techniką podszywania się, on-path attack dotyczy przechwytywania komunikacji, a buffer overflow jest klasą podatności, nie typowym ładunkiem wprowadzanym przez instalację niezweryfikowanej aplikacji.","options":[{"letter":"A","text":"User impersonation"},{"letter":"B","text":"Rootkit"},{"letter":"C","text":"On-path attack"},{"letter":"D","text":"Buffer overflow"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":565,"question":"While a school district is performing state testing, a security analyst notices all internet services are unavailable. The analyst discovers that ARP poisoning is occurring on the network and then terminates access for the host. Which of the following is most likely responsible for this malicious activity?","keyword":"A host already inside the school network deliberately disrupts a time-sensitive internal activity -> Insider threat","correct_raw":"C. Insider threat","explanation":"ARP poisoning jest wykonywany w lokalnym segmencie sieci, a analityk identyfikuje i odcina konkretny host znajdujący się w środowisku szkoły. Celowe zakłócenie testów stanowych przez osobę mającą lokalny dostęp, np. ucznia albo pracownika, najlepiej odpowiada insider threat. Odpowiedź A jest kusząca, ponieważ d
