ord":"Prove controls operated effectively over six months ➡️ SOC 2 Type 2","correct_raw":"B. SOC 2 Type 2 report","explanation":"Raport SOC 2 Type 2 ocenia zarówno projekt mechanizmów kontrolnych, jak i ich skuteczne działanie w określonym przedziale czasu, na przykład przez sześć miesięcy. SOC 2 Type 1 opisuje stan kontroli w konkretnym dniu, natomiast frameworki NIST i CIS nie stanowią same w sobie niezależnego dowodu skuteczności kontroli w badanym okresie.","options":[{"letter":"A","text":"NIST CSF"},{"letter":"B","text":"SOC 2 Type 2 report"},{"letter":"C","text":"CIS Top 20 compliance reports"},{"letter":"D","text":"Vulnerability report"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":256,"question":"A city municipality lost its primary data center when a tornado hit the facility. Which of the following should the city staff use immediately after the disaster to handle essential public services?","keyword":"Primary data center destroyed / Restore IT services after disaster ➡️ DRP","correct_raw":"C. DRP","explanation":"Disaster Recovery Plan określa procedury odtworzenia infrastruktury IT, systemów i danych po zniszczeniu podstawowego centrum danych. Miasto powinno uruchomić DRP, aby przywrócić środowisko obsługujące kluczowe usługi publiczne. BCP ma szerszy zakres i opisuje ciągłość całej działalności, natomiast pytanie wskazuje konkretną utratę centrum danych i potrzebę odzyskania usług po katastrofie.","options":[{"letter":"A","text":"BCP"},{"letter":"B","text":"Communication plan"},{"letter":"C","text":"DRP"},{"letter":"D","text":"IRP"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":257,"question":"Which of the following is considered a preventive control?","keyword":"Preventive control that limits fraud and unauthorized actions ➡️ Segregation of duties","correct_raw":"D. Segregation of duties","explanation":"Segregation of duties rozdziela krytyczne etapy procesu pomiędzy różne osoby, aby jedna osoba nie mogła samodzielnie wykonać i ukryć niedozwolonej operacji. Jest to kontrola zapobiegawcza. Audyty konfiguracji, korelacja logów i alerty incydentów służą przede wszystkim wykrywaniu problemów.","options":[{"letter":"A","text":"Configuration auditing"},{"letter":"B","text":"Log correlation"},{"letter":"C","text":"Incident alerts"},{"letter":"D","text":"Segregation of duties"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":258,"question":"A systems administrator notices that a testing system is down. While investigating, the systems administrator finds that the servers are online and accessible from any device on the server network. The monitoring table shows that Test01 and Test02 are down and have each received approximately 651 million units of traffic while sending only about 15,000–17,000. Other servers remain up and show much lower traffic levels. Which of the following is the most likely cause of the outage?","keyword":"Testing servers overwhelmed by extremely large inbound traffic ➡️ Denial of service","correct_raw":"A. Denial of service","explanation":"Test01 i Test02 otrzymują nieproporcjonalnie ogromną ilość ruchu i przestają świadczyć usługę, mimo że same serwery pozostają włączone i osiągalne w sieci. Jest to typowy skutek ataku denial of service, który wyczerpuje przepustowość lub zasoby usługi. Jamming dotyczy zakłócania sygnału bezprzewodowego, a Kerberoasting atakuje konta usługowe w Active Directory.","options":[{"letter":"A","text":"Denial of service"},{"letter":"B","text":"ARP poisoning"},{"letter":"C","text":"Jamming"},{"letter":"D","text":"Kerberoasting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":259,"question":"A security team has been alerted to a flood of incoming emails that have various subject lines and are addressed to multiple email inboxes. Each email contains a URL shortener link that is redirecting to a dead domain. Which of the following is the best step for the security team to take?","keyword":"Same URL-shortener domain across a changing email campaign ➡️ Block it in the web proxy","correct_raw":"D. Block the URL shortener domain in the web proxy.","explanation":"Tematy wiadomości i skrzynki odbiorców są różne, natomiast wspólnym elementem kampanii jest domena usługi skracającej adresy URL. Zablokowanie tej domeny w web proxy uniemożliwia użytkownikom otwieranie linków z kampanii, nawet gdy napastnik zmieni docelową domenę przekierowania. Blokowanie tematów jest nieskuteczne, a sinkhole dla aktualnie martwej domeny nie obejmie nowych celów ukrytych za tym samym skracaczem URL.","options":[{"letter":"A","text":"Create a blocklist for all subject lines."},{"letter":"B","text":"Send the dead domain to a DNS sinkhole."},{"letter":"C","text":"Quarantine all emails received and notify all employees."},{"letter":"D","text":"Block the URL shortener domain in the web proxy."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":260,"question":"A security administrator is working to secure company data on corporate laptops in case the laptops are stolen. Which of the following solutions should the administrator consider?","keyword":"Protect data stored on stolen laptops ➡️ Disk encryption","correct_raw":"A. Disk encryption","explanation":"Szyfrowanie dysku chroni dane w spoczynku, uniemożliwiając ich odczyt po wyjęciu nośnika lub uruchomieniu komputera bez właściwego klucza. DLP ogranicza nieautoryzowane przesyłanie danych, a hardening i zabezpieczenia rozruchu nie zastępują szyfrowania całej zawartości dysku.","options":[{"letter":"A","text":"Disk encryption"},{"letter":"B","text":"Data loss prevention"},{"letter":"C","text":"Operating system hardening"},{"letter":"D","text":"Boot security"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":261,"question":"A company needs to keep the fewest records possible, meet compliance needs, and ensure destruction of records that are no longer needed. Which of the following best describes the policy that meets these requirements?","keyword":"Keep only required records / Destroy records when no longer needed ➡️ Retention policy","correct_raw":"C. Retention policy","explanation":"Polityka retencji określa, jakie dane i dokumenty organizacja musi przechowywać, przez jaki czas oraz kiedy należy je bezpiecznie usunąć. Pozwala spełnić wymagania prawne i regulacyjne, a jednocześnie ograniczyć ilość przechowywanych informacji do niezbędnego minimum.","options":[{"letter":"A","text":"Security policy"},{"letter":"B","text":"Classification policy"},{"letter":"C","text":"Retention policy"},{"letter":"D","text":"Access control policy"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":262,"question":"Which of the following is a common source of unintentional corporate credential leakage in cloud environments?","keyword":"Unintentional cloud credential leakage ➡️ Code repositories","correct_raw":"A. Code repositories","explanation":"Programiści mogą przypadkowo umieszczać w repozytoriach kodu klucze API, tokeny dostępu, hasła lub dane uwierzytelniające do usług chmurowych. Szczególnie niebezpieczne są repozytoria publiczne. Dark web jest miejscem późniejszej publikacji lub sprzedaży przejętych danych, a nie typowym źródłem ich nieumyślnego ujawnienia.","options":[{"letter":"A","text":"Code repositories"},{"letter":"B","text":"Dark web"},{"letter":"C","text":"Threat feeds"},{"letter":"D","text":"State actors"},{"letter":"E","text":"Vulnerability databases"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":263,"question":"Which of the following is the best reason an organization should enforce a data classification policy to help protect its most sensitive information?","keyword":"Protect sensitive information through classification ➡️ Apply security requirements by classification level","correct_raw":"C. The organization will have the ability to create security requirements based on classification levels.","explanation":"Klasyfikacja danych umożliwia przypisanie odpowiednich wymagań ochrony do poszczególnych kategorii informacji. Organizacja może na przykład wymagać szyfrowania, ograniczonego dostępu, określonego czasu retencji lub zakazu przesyłania danych oznaczonych jako poufne. Same etykiety nie chronią danych, dopóki nie zostaną powiązane z konkretnymi zabezpieczeniami.","options":[{"letter":"A","text":"End users will be required to consider the classification of data that can be used in documents."},{"letter":"B","text":"The policy will result in the creation of access levels for each level of classification."},{"letter":"C","text":"The organization will have the ability to create security requirements based on classification levels."},{"letter":"D","text":"Security analysts will be able to see the classification of data within a document before opening it."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":264,"question":"An analyst is performing a vulnerability scan against the web servers exposed to the internet without a system account. Which of the following is most likely being performed?","keyword":"Vulnerability scan without a system account ➡️ Non-credentialed scan","correct_raw":"A. Non-credentialed scan","explanation":"Skan nieuwierzytelniony jest wykonywany bez konta i poświadczeń do badanego systemu. Skaner ocenia serwer z perspektywy zewnętrznego napastnika, analizując dostępne porty, usługi i widoczne podatności. Nie jest to skan pasywny, ponieważ narzędzie aktywnie wysyła zapytania do serwerów.","options":[{"letter":"A","text":"Non-credentialed scan"},{"letter":"B","text":"Packet capture"},{"letter":"C","text":"Privilege escalation"},{"letter":"D","text":"System enumeration"},{"letter":"E","text":"Passive scan"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":265,"question":"A security administrator is hardening corporate systems and applying appropriate mitigations by consulting a real-world knowledge base for adversary behavior. Which of the following would be best for the administrator to reference?","keyword":"Real-world knowledge base for adversary behavior ➡️ MITRE ATT&CK","correct_raw":"A. MITRE ATT&CK","explanation":"MITRE ATT&CK jest bazą wiedzy opisującą rzeczywiste taktyki, techniki i procedury stosowane przez napastników. Administrator może wykorzystać ją do zrozumienia sposobów działania przeciwnika i dobrania odpowiednich zabezpieczeń. CVSS ocenia istotność podatności, SOAR automatyzuje działania bezpieczeństwa, a CSIRT jest zespołem reagowania na incydenty.","options":[{"letter":"A","text":"MITRE ATT&CK"},{"letter":"B","text":"CSIRT"},{"letter":"C","text":"CVSS"},{"letter":"D","text":"SOAR"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":266,"question":"An architect has a request to increase the speed of data transfer using JSON requests externally. Currently, the organization uses SFTP to transfer data files. Which of the following will most likely meet the requirements?","keyword":"External JSON requests / Replace file-based SFTP transfers ➡️ Microservices using API","correct_raw":"D. Microservices using API","explanation":"Interfejs API umożliwia bezpośrednią, szybką wymianę danych w formacie JSON pomiędzy usługami, bez konieczności tworzenia i przesyłania całych plików przez SFTP. Architektura mikroserwisowa dobrze wspiera takie lekkie i niezależne wywołania. Poczta, współdzielony dysk i zwykła witryna nie zapewniają równie właściwego mechanizmu integracji aplikacyjnej.","options":[{"letter":"A","text":"A website-hosted solution"},{"letter":"B","text":"Cloud shared storage"},{"letter":"C","text":"A secure email solution"},{"letter":"D","text":"Microservices using API"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":267,"question":"Which of the following addresses individual rights such as the right to be informed, the right of access, and the right to be forgotten?","keyword":"Right to be informed / Access / Right to be forgotten ➡️ GDPR","correct_raw":"A. GDPR","explanation":"GDPR, czyli RODO, określa prawa osób, których dane dotyczą. Obejmują one między innymi prawo do informacji, dostęp do własnych danych, ich sprostowanie oraz w określonych warunkach usunięcie, nazywane prawem do bycia zapomnianym. PCI DSS dotyczy danych kart płatniczych, a NIST i ISO dostarczają standardów oraz ram postępowania.","options":[{"letter":"A","text":"GDPR"},{"letter":"B","text":"PCI DSS"},{"letter":"C","text":"NIST"},{"letter":"D","text":"ISO"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":268,"question":"An administrator is installing an LDAP browser tool in order to view objects in the corporate LDAP directory. Secure connections to the LDAP server are required. When the browser connects to the server, certificate errors are being displayed, and then the connection is terminated. Which of the following is the most likely solution?","keyword":"Secure LDAP connection terminates with certificate errors ➡️ Add the certificate chain to the local truststore","correct_raw":"B. The administrator needs to install the server certificate into the local truststore.","explanation":"Klient LDAP nie ufa certyfikatowi przedstawionemu przez serwer, dlatego przerywa bezpieczne połączenie. Należy dodać do lokalnego magazynu zaufania odpowiedni certyfikat serwera lub, częściej, certyfikat urzędu certyfikacji, który go wystawił. Gdyby port LDAPS był zamknięty, wystąpiłby błąd połączenia, a nie błąd weryfikacji certyfikatu.","options":[{"letter":"A","text":"The administrator should allow SAN certificates in the browser configuration."},{"letter":"B","text":"The administrator needs to install the server certificate into the local truststore."},{"letter":"C","text":"The administrator should request that the secure LDAP port be opened to the server."},{"letter":"D","text":"The administrator needs to increase the TLS version on the organization's RA."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":269,"question":"Which of the following is the most important security concern when using legacy systems to provide production service?","keyword":"Legacy production system / Primary security concern ➡️ Lack of vendor support","correct_raw":"B. Lack of vendor support","explanation":"Brak wsparcia producenta oznacza, że system nie otrzymuje poprawek bezpieczeństwa, aktualizacji ani pomocy przy nowych podatnościach. Jest to podstawowy problem systemów legacy, z którego mogą wynikać kolejne zagrożenia, takie jak używanie przestarzałych protokołów. Utrata dostępności i niestabilność są możliwymi skutkami, ale nie najbardziej charakterystyczną przyczyną ryzyka.","options":[{"letter":"A","text":"Instability"},{"letter":"B","text":"Lack of vendor support"},{"letter":"C","text":"Loss of availability"},{"letter":"D","text":"Use of insecure protocols"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":270,"question":"A security investigation revealed that malicious software was installed on a server using a server administrator's credentials. During the investigation, the server administrator explained that Telnet was regularly used to log in. Which of the following most likely occurred?","keyword":"Administrator regularly used Telnet / Credentials stolen ➡️ Packet capture","correct_raw":"B. A packet capture tool was used to steal the password.","explanation":"Telnet przesyła dane, w tym nazwę użytkownika i hasło, bez szyfrowania. Napastnik mający możliwość podsłuchania ruchu mógł użyć narzędzia do przechwytywania pakietów i odczytać poświadczenia administratora w postaci jawnej. Ataki słownikowe i password spraying polegają na zgadywaniu haseł, natomiast w tym scenariuszu kluczową wskazówką jest korzystanie z niezabezpieczonego protokołu Telnet.","options":[{"letter":"A","text":"A spraying attack was used to determine which credentials to use."},{"letter":"B","text":"A packet capture tool was used to steal the password."},{"letter":"C","text":"A remote-access Trojan was used to install the malware."},{"letter":"D","text":"A dictionary attack was used to log in as the server administrator."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":271,"question":"A user is requesting Telnet access to manage a remote development web server. Insecure protocols are not allowed for use within any environment. Which of the following should be configured to allow remote access to this server?","keyword":"Replace insecure Telnet for remote server administration ➡️ SSH","correct_raw":"C. SSH","explanation":"SSH zapewnia szyfrowany, uwierzytelniony dostęp do wiersza poleceń zdalnego serwera i jest bezpiecznym zamiennikiem Telnetu. HTTPS służy głównie do zabezpieczania ruchu WWW, SNMPv3 do monitorowania i zarządzania urządzeniami, RDP do zdalnego pulpitu systemów Windows, a SMTP do przesyłania poczty.","options":[{"letter":"A","text":"HTTPS"},{"letter":"B","text":"SNMPv3"},{"letter":"C","text":"SSH"},{"letter":"D","text":"RDP"},{"letter":"E","text":"SMTP"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":272,"question":"A security administrator is working to find a cost-effective solution to implement certificates for a large number of domains and subdomains owned by the company. Which of the following types of certificates should the administrator implement?","keyword":"Cost-effective certificate for many subdomains ➡️ Wildcard certificate","correct_raw":"A. Wildcard","explanation":"Certyfikat wildcard zabezpiecza wiele subdomen należących do jednej domeny bazowej, na przykład *.example.com, dzięki czemu nie trzeba kupować i utrzymywać osobnego certyfikatu dla każdej subdomeny. Certyfikat kliencki służy do uwierzytelniania użytkownika lub urządzenia, self-signed nie zapewnia publicznego zaufania, a code signing służy do podpisywania oprogramowania. Jeżeli organizacja ma wiele całkowicie różnych domen bazowych, praktycznie stosuje się również certyfikaty SAN, ale takiej odpowiedzi nie podano.","options":[{"letter":"A","text":"Wildcard"},{"letter":"B","text":"Client certificate"},{"letter":"C","text":"Self-signed"},{"letter":"D","text":"Code signing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":273,"question":"An auditor discovered multiple insecure ports on some servers. Other servers were found to have legacy protocols enabled. Which of the following tools did the auditor use to discover these issues?","keyword":"Discover insecure ports and legacy protocols across servers ➡️ Nessus","correct_raw":"A. Nessus","explanation":"Nessus jest skanerem podatności, który identyfikuje otwarte porty, uruchomione usługi, wersje oprogramowania oraz przestarzałe lub niebezpieczne protokoły. curl służy głównie do wykonywania żądań do usług sieciowych, Wireshark analizuje przechwycony ruch, a netcat umożliwia ręczne zestawianie połączeń i testowanie pojedynczych portów.","options":[{"letter":"A","text":"Nessus"},{"letter":"B","text":"curl"},{"letter":"C","text":"Wireshark"},{"letter":"D","text":"netcat"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":274,"question":"A security analyst received a tip that sensitive proprietary information was leaked to the public. The analyst is reviewing the PCAP and notices traffic between an internal server and an external host that includes the following: 12:47:22.327233 PPPoE [ses 0x8122] IP (tos 0x0, ttl 64, id 0, offset 0, flags [DF], proto IPv6 (41), length 331) 10.5.1.1 > 52.165.16.154: IP6 (hlim E3, next-header TCP (6) payload length: 271) 2001:67c:2158:a019::ace.53104 > 2001:0:5ef5:79fd:380c:dddd:a601:24fa.13788: Flags [P.], cksum 0xd7ee (correct), seq 97:348, ack 102, win 16444, length 251. Which of the following was most likely used to exfiltrate the data?","keyword":"IPv6 packet carried inside IPv4 protocol 41 traffic ➡️ Encapsulation","correct_raw":"A. Encapsulation","explanation":"Zapis PCAP pokazuje pakiet IPv4, którego pole protokołu ma wartość 41, oznaczającą przenoszenie IPv6 wewnątrz IPv4. Jest to tunelowanie przez enkapsulację: jeden protokół zostaje opakowany w drugi, aby przenieść dane przez sieć i potencjalnie ominąć standardowe kontrole. MAC spoofing dotyczy podszywania się pod adres warstwy 2, steganografia ukrywa dane w innym nośniku, a sniffing służy do podsłuchu, nie do wskazanego sposobu eksfiltracji.","options":[{"letter":"A","text":"Encapsulation"},{"letter":"B","text":"MAC address spoofing"},{"letter":"C","text":"Steganography"},{"letter":"D","text":"Broken encryption"},{"letter":"E","text":"Sniffing via on-path position"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":275,"question":"A company wants to reduce the time and expense associated with code deployment. Which of the following technologies should the company utilize?","keyword":"Reduce code deployment time and infrastructure expense ➡️ Serverless architecture","correct_raw":"A. Serverless architecture","explanation":"Architektura serverless pozwala wdrażać funkcje lub kod bez samodzielnego przygotowywania i utrzymywania serwerów oraz systemów operacyjnych. Dostawca automatycznie zapewnia zasoby i skalowanie, a opłaty są zwykle naliczane za faktyczne wykonanie kodu. Thin clients dotyczą urządzeń użytkowników, prywatna chmura nadal wymaga utrzymania infrastruktury, a maszyny wirtualne wymagają zarządzania systemami operacyjnymi.","options":[{"letter":"A","text":"Serverless architecture"},{"letter":"B","text":"Thin clients"},{"letter":"C","text":"Private cloud"},{"letter":"D","text":"Virtual machines"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":276,"question":"A security administrator is performing an audit on a stand-alone UNIX server, and the following message is immediately displayed: (Error 13): /etc/shadow: Permission denied. Which of the following best describes the type of tool that is being used?","keyword":"/etc/shadow access attempted during a UNIX audit ➡️ Password cracker","correct_raw":"D. Password cracker","explanation":"Plik /etc/shadow przechowuje skróty haseł lokalnych kont UNIX i jest dostępny wyłącznie dla uprzywilejowanych procesów. Narzędzie do łamania haseł próbuje pozyskać te skróty, aby następnie wykonywać ataki słownikowe lub brute force. Komunikat Permission denied wskazuje, że narzędzie nie miało wystarczających uprawnień do odczytu pliku. FIM monitoruje zmiany plików, a pass-the-hash dotyczy używania przejętych hashy do uwierzytelniania.","options":[{"letter":"A","text":"Pass-the-hash monitor"},{"letter":"B","text":"File integrity monitor"},{"letter":"C","text":"Forensic analysis"},{"letter":"D","text":"Password cracker"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":277,"question":"A security administrator needs to create firewall rules for the following protocols: RTP, SIP, H.323, and SRTP. Which of the following does this rule set support?","keyword":"RTP / SIP / H.323 / SRTP ➡️ VoIP","correct_raw":"B. VoIP","explanation":"SIP i H.323 służą do zestawiania oraz sterowania sesjami głosowymi i multimedialnymi, natomiast RTP przenosi strumień audio lub wideo, a SRTP zapewnia jego szyfrowaną wersję. Zestaw tych protokołów jest charakterystyczny dla telefonii VoIP.","options":[{"letter":"A","text":"RTOS"},{"letter":"B","text":"VoIP"},{"letter":"C","text":"SoC"},{"letter":"D","text":"HVAC"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":278,"question":"Which of the following best describes a social engineering attack that uses a targeted electronic messaging campaign aimed at a Chief Executive Officer?","keyword":"Targeted electronic message aimed at a CEO ➡️ Whaling","correct_raw":"A. Whaling","explanation":"Whaling jest odmianą ukierunkowanego phishingu, której celem są osoby zajmujące najwyższe stanowiska, takie jak CEO, CFO lub członkowie zarządu. Spear phishing również jest atakiem celowanym, ale termin whaling precyzyjnie wskazuje, że ofiarą jest wysoki rangą członek kierownictwa.","options":[{"letter":"A","text":"Whaling"},{"letter":"B","text":"Spear phishing"},{"letter":"C","text":"Impersonation"},{"letter":"D","text":"Identity fraud"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":279,"question":"During a penetration test, a flaw in the internal PKI was exploited to gain domain administrator rights using specially crafted certificates. Which of the following remediation tasks should be completed as part of the cleanup phase?","keyword":"Malicious certificates used for privileged access / Cleanup ➡️ Update the CRL","correct_raw":"A. Updating the CRL","explanation":"W fazie cleanup należy unieważnić certyfikaty utworzone lub wykorzystane przez atakującego i opublikować zaktualizowaną listę CRL, aby systemy przestały je akceptować. Zmiana haseł nie unieważnia uwierzytelniania opartego na certyfikatach. Naprawienie podatności lub błędnej konfiguracji urzędu certyfikacji jest również konieczne, lecz spośród podanych odpowiedzi aktualizacja CRL najbezpośredniej usuwa zaufanie do złośliwych certyfikatów pozostawionych po ataku.","options":[{"letter":"A","text":"Updating the CRL"},{"letter":"B","text":"Patching the CA"},{"letter":"C","text":"Changing passwords"},{"letter":"D","text":"Implementing SOAR"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":280,"question":"A company wants to implement MFA. Which of the following enables the additional factor while using a smart card?","keyword":"Smart card is something you have / Additional factor ➡️ PIN","correct_raw":"A. PIN","explanation":"Karta inteligentna jest składnikiem typu „coś, co masz”. PIN dodaje niezależny składnik typu „coś, co wiesz”, dzięki czemu razem tworzą MFA. Dodatkowy hardware token należałby do tej samej kategorii co smart card, identyfikator użytkownika nie jest sekretnym czynnikiem, a SMS może być dodatkowym czynnikiem, lecz PIN jest standardowym uzupełnieniem uwierzytelniania kartą.","options":[{"letter":"A","text":"PIN"},{"letter":"B","text":"Hardware token"},{"letter":"C","text":"User ID"},{"letter":"D","text":"SMS"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":281,"question":"A company hired an external consultant to assist with required system upgrades to a critical business application. A systems administrator needs to secure the consultant's access without sharing passwords to critical systems. Which of the following solutions should most likely be utilized?","keyword":"External consultant access / No password sharing ➡️ PAM software","correct_raw":"E. PAM software","explanation":"Privileged Access Management zapewnia kontrolowany dostęp do kont uprzywilejowanych bez ujawniania konsultantowi właściwych haseł. PAM może przechowywać poświadczenia w sejfie, automatycznie je podstawiać, ograniczać czas i zakres sesji oraz rejestrować działania wykonawcy. RBAC określa uprawnienia roli, ale samo nie rozwiązuje problemu bezpiecznego używania współdzielonych kont uprzywilejowanych.","options":[{"letter":"A","text":"TACACS+"},{"letter":"B","text":"SAML"},{"letter":"C","text":"An SSO platform"},{"letter":"D","text":"Role-based access control"},{"letter":"E","text":"PAM software"}],"correctLetters":["E"],"isPBQ":false,"multiSelect":false},{"id":282,"question":"A newly implemented wireless network is designed so that visitors can connect to the wireless network for business activities. The legal department is concerned that visitors might connect to the network and perform illicit activities. Which of the following should the security team implement to address this concern?","keyword":"Guest Wi-Fi / Legal concern about visitor activity ➡️ Captive portal with terms and conditions","correct_raw":"C. Add a guest captive portal requiring visitors to accept terms and conditions.","explanation":"Captive portal może przed udzieleniem dostępu wyświetlić zasady dopuszczalnego korzystania z sieci i wymagać ich zaakceptowania. Zapewnia to użytkownikom informację o odpowiedzialności i ograniczeniach prawnych. RADIUS i 802.1X służą głównie do technicznego uwierzytelniania, a WPS obniża bezpieczeństwo i nie rozwiązuje problemu prawnego.","options":[{"letter":"A","text":"Configure a RADIUS server to manage device authentication."},{"letter":"B","text":"Use 802.1X on all devices connecting to wireless."},{"letter":"C","text":"Add a guest captive portal requiring visitors to accept terms and conditions."},{"letter":"D","text":"Allow for new devices to be connected via WPS."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":283,"question":"Which of the following data roles is responsible for identifying risks and appropriate access to data?","keyword":"Identify data risks and decide appropriate access ➡️ Data owner","correct_raw":"A. Owner","explanation":"Właściciel danych ponosi biznesową odpowiedzialność za dany zbiór informacji. Określa jego klasyfikację, identyfikuje ryzyka oraz decyduje, kto powinien mieć dostęp. Custodian technicznie przechowuje i zabezpiecza dane, steward dba o ich jakość i właściwe zarządzanie, a controller w terminologii prywatności ustala cele i sposoby przetwarzania danych osobowych.","options":[{"letter":"A","text":"Owner"},{"letter":"B","text":"Custodian"},{"letter":"C","text":"Steward"},{"letter":"D","text":"Controller"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":284,"question":"Which of the following physical controls can be used to both detect and deter? (Choose two.)","keyword":"Physical controls that reveal activity and discourage intruders ➡️ Lighting and sensor","correct_raw":"A. Lighting | D. Sensor","explanation":"Oświetlenie zwiększa widoczność osób i zdarzeń, ułatwiając ich zauważenie, a jednocześnie zniechęca intruzów do działania pod osłoną ciemności. Czujnik wykrywa ruch, otwarcie lub inne zdarzenie, a jego widoczna obecność albo powiązany alarm może również odstraszać. Ogrodzenia, bollardy i zamki są głównie kontrolami prewencyjnymi i odstraszającymi, natomiast oznakowanie przede wszystkim odstrasza.","options":[{"letter":"A","text":"Lighting"},{"letter":"B","text":"Fencing"},{"letter":"C","text":"Signage"},{"letter":"D","text":"Sensor"},{"letter":"E","text":"Bollard"},{"letter":"F","text":"Lock"}],"correctLetters":["A","D"],"isPBQ":false,"multiSelect":true},{"id":285,"question":"A multinational bank hosts several servers in its data center. These servers run a business-critical application used by customers to access their account information. Which of the following should the bank use to ensure accessibility during peak usage times?","keyword":"Maintain application accessibility during peak demand ➡️ Load balancer","correct_raw":"A. Load balancer","explanation":"Load balancer rozdziela żądania klientów pomiędzy wiele serwerów, zapobiegając przeciążeniu pojedynczego węzła i zwiększając dostępność aplikacji podczas szczytowego ruchu. Kopie zapasowe służą do odtwarzania danych, rozproszenie geograficzne chroni głównie przed awarią lokalizacji, a multipathing zapewnia nadmiarowe ścieżki do pamięci masowej.","options":[{"letter":"A","text":"Load balancer"},{"letter":"B","text":"Cloud backups"},{"letter":"C","text":"Geographic dispersal"},{"letter":"D","text":"Disk multipathing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":286,"question":"The author of a software package is concerned about bad actors repackaging and inserting malware into the software. The software download is hosted on a website, and the author exclusively controls the website's contents. Which of the following techniques would best ensure the software's integrity?","keyword":"Prevent repackaged software from appearing authentic ➡️ Code signing","correct_raw":"B. Code signing","explanation":"Podpisanie kodu kluczem prywatnym autora pozwala użytkownikom zweryfikować zarówno pochodzenie programu, jak i jego integralność. Po przepakowaniu aplikacji lub dodaniu malware podpis przestanie być prawidłowy. Input validation i fuzzing dotyczą odporności aplikacji na błędne dane wejściowe, a secure cookies zabezpieczają sesje internetowe.","options":[{"letter":"A","text":"Input validation"},{"letter":"B","text":"Code signing"},{"letter":"C","text":"Secure cookies"},{"letter":"D","text":"Fuzzing"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":287,"question":"A third-party vendor is moving a particular application to the end-of-life stage at the end of the current year. Which of the following is the most critical risk if the company chooses to continue running the application?","keyword":"Application reaches end of life / Most critical security risk ➡️ No security updates","correct_raw":"A. Lack of security updates","explanation":"Po osiągnięciu końca cyklu życia producent przestaje wydawać poprawki bezpieczeństwa. Nowo odkryte podatności mogą więc pozostać trwale niezałatane i być wykorzystywane przez napastników. Brak wsparcia jest szerszym problemem organizacyjnym, ale z punktu widzenia bezpieczeństwa najbardziej bezpośrednim ryzykiem jest brak aktualizacji usuwających podatności.","options":[{"letter":"A","text":"Lack of security updates"},{"letter":"B","text":"Lack of new features"},{"letter":"C","text":"Lack of support"},{"letter":"D","text":"Lack of source code access"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":288,"question":"A security analyst recently read a report about a flaw in several of the organization's printer models that causes credentials to be sent over the network in cleartext, regardless of the encryption settings. Which of the following would be best to use to validate this finding?","keyword":"Validate whether credentials travel in cleartext ➡️ Packet capture with Wireshark","correct_raw":"A. Wireshark","explanation":"Wireshark przechwytuje i analizuje pakiety przesyłane przez sieć, dlatego pozwala bezpośrednio sprawdzić, czy nazwy użytkowników lub hasła są widoczne w postaci jawnej. Nessus może zgłosić podatność, Nmap identyfikuje porty i usługi, a netcat służy do ręcznego zestawiania połączeń, lecz żadne z nich nie pokazuje zawartości ruchu tak dokładnie jak analizator pakietów.","options":[{"letter":"A","text":"Wireshark"},{"letter":"B","text":"netcat"},{"letter":"C","text":"Nessus"},{"letter":"D","text":"Nmap"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":289,"question":"A development team is launching a new public-facing web product. The Chief Information Security Officer has asked that the product be protected from attackers who use malformed or invalid inputs to destabilize the system. Which of the following practices should the development team implement?","keyword":"Malformed or invalid inputs used to crash the application ➡️ Fuzzing","correct_raw":"A. Fuzzing","explanation":"Fuzzing polega na automatycznym podawaniu aplikacji dużej liczby nieprawidłowych, nieoczekiwanych lub losowych danych wejściowych. Pozwala wykryć awarie, błędy obsługi wyjątków i podatności, zanim wykorzysta je napastnik. Analiza statyczna i peer review są wartościowe, ale nie testują bezpośrednio reakcji uruchomionego programu na zniekształcone dane.","options":[{"letter":"A","text":"Fuzzing"},{"letter":"B","text":"Continuous deployment"},{"letter":"C","text":"Static code analysis"},{"letter":"D","text":"Manual peer review"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":290,"question":"During an annual review of the system design, an engineer identified a few issues with the currently released design. Which of the following should be performed next according to best practices?","keyword":"Issues found in an already released design / Implement corrections safely ➡️ Change control process","correct_raw":"D. Change control process","explanation":"Ponieważ problemy dotyczą już wydanego i działającego projektu, ich usunięcie będzie wymagało kontrolowanych zmian. Proces change control zapewnia ocenę wpływu, zatwierdzenie, plan testów, harmonogram oraz możliwość wycofania zmiany. Kolejny design review jedynie ponownie oceniałby projekt, natomiast produkt jest już na etapie eksploatacji.","options":[{"letter":"A","text":"Risk management process"},{"letter":"B","text":"Product design process"},{"letter":"C","text":"Design review process"},{"letter":"D","text":"Change control process"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":291,"question":"Which of the following is best to use when determining the severity of a vulnerability?","keyword":"Determine vulnerability severity ➡️ CVSS","correct_raw":"D. CVSS","explanation":"CVSS (Common Vulnerability Scoring System) przypisuje podatności liczbową ocenę istotności, zazwyczaj w skali od 0 do 10. Uwzględnia m.in. sposób wykorzystania luki, wymagane uprawnienia i możliwy wpływ na poufność, integralność oraz dostępność. CVE jest identyfikatorem podatności, a nie miarą jej dotkliwości.","options":[{"letter":"A","text":"CVE"},{"letter":"B","text":"OSINT"},{"letter":"C","text":"SOAR"},{"letter":"D","text":"CVSS"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":292,"question":"An organization experienced a security breach that allowed an attacker to send fraudulent wire transfers from a hardened PC exclusively to the attacker's bank through remote connections. A security analyst is creating a timeline of events and has found a different PC on the network containing malware. Upon reviewing the command history, the analyst finds the following: PS>.\\mimikatz.exe \"sekurlsa::pth /user:localadmin /domain:corp-domain.com /ntlm:B4B9B02E1F29A3CF193EAB28C8D617D3F327\" Which of the following best describes how the attacker gained access to the hardened PC?","keyword":"Mimikatz sekurlsa::pth / NTLM hash / localadmin ➡️ Pass-the-hash","correct_raw":"B. The attacker performed a pass-the-hash attack using a shared support account.","explanation":"Polecenie Mimikatz `sekurlsa::pth` wskazuje bezpośrednio na atak Pass-the-Hash. Napastnik nie musi znać jawnego hasła — wykorzystuje przejęty skrót NTLM do uwierzytelnienia jako konto `localadmin`. Skoro ten sam lokalny administrator był używany na wielu komputerach, przejęty hash umożliwił dostęp do utwardzonej stacji.","options":[{"letter":"A","text":"The attacker created fileless malware that was hosted by the banking platform."},{"letter":"B","text":"The attacker performed a pass-the-hash attack using a shared support account."},{"letter":"C","text":"The attacker utilized living-off-the-land binaries to evade endpoint detection and response software."},{"letter":"D","text":"The attacker socially engineered the accountant into performing bad transfers."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":293,"question":"Which of the following is the best resource to consult for information on the most common application exploitation methods?","keyword":"Common application exploitation methods ➡️ OWASP","correct_raw":"A. OWASP","explanation":"OWASP publikuje materiały dotyczące najczęstszych zagrożeń aplikacyjnych, w tym OWASP Top 10, oraz praktyczne zalecenia dla twórców i testerów aplikacji. STIX służy do wymiany informacji o zagrożeniach, OVAL do opisu i oceny stanów systemów, a CVE kataloguje konkretne podatności.","options":[{"letter":"A","text":"OWASP"},{"letter":"B","text":"STIX"},{"letter":"C","text":"OVAL"},{"letter":"D","text":"Threat intelligence feed"},{"letter":"E","text":"Common Vulnerabilities and Exposures"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":294,"question":"A security analyst is reviewing the logs on an organization's DNS server and notices an unusual AXFR request from an external address. The response contains internal host records such as www, dns, adds, fshare and sip. Which of the following attack techniques was most likely used?","keyword":"AXFR zone transfer reveals internal DNS records ➡️ Footprinting","correct_raw":"C. Footprinting the internal network","explanation":"AXFR jest pełnym transferem strefy DNS. Jeżeli serwer pozwala wykonać go nieuprawnionemu hostowi, napastnik może poznać nazwy i adresy wewnętrznych systemów, takich jak serwer plików, DNS czy SIP. Jest to rozpoznanie i mapowanie infrastruktury, czyli footprinting wewnętrznej sieci.","options":[{"letter":"A","text":"Determining the organization's ISP-assigned address space"},{"letter":"B","text":"Bypassing the organization's DNS sinkholing"},{"letter":"C","text":"Footprinting the internal network"},{"letter":"D","text":"Attempting to achieve initial access to the DNS server"},{"letter":"E","text":"Exfiltrating data from fshare.int.complia.org"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":295,"question":"A security analyst at an organization observed several user logins from outside the organization's network. The analyst determined that these logins were not performed by individuals within the organization. Which of the following recommendations would reduce the likelihood of future attacks? (Choose two.)","keyword":"Unauthorized external logins ➡️ Conditional access and MFA","correct_raw":"B. Conditional access policies | D. Implementation of additional authentication factors","explanation":"Polityki dostępu warunkowego mogą blokować lub dodatkowo weryfikować logowania na podstawie lokalizacji, ryzyka, urządzenia i innych warunków. Dodatkowy składnik uwierzytelniania sprawia, że samo przejęte hasło nie wystarcza do zalogowania. Audyty kont i przegląd uprawnień mogą wykrywać problemy, ale nie ograniczają bezpośrednio skuteczności kolejnej próby przejęcia konta.","options":[{"letter":"A","text":"Disciplinary actions for users"},{"letter":"B","text":"Conditional access policies"},{"letter":"C","text":"More regular account audits"},{"letter":"D","text":"Implementation of additional authentication factors"},{"letter":"E","text":"Enforcement of content filtering policies"},{"letter":"F","text":"A review of user account permissions"}],"correctLetters":["B","D"],"isPBQ":false,"multiSelect":true},{"id":296,"question":"A security team is addressing a risk associated with the attack surface of the organization's web application over port 443. Currently, no advanced network security capabilities are in place. Which of the following would be best to set up? (Choose two.)","keyword":"Public web application over HTTPS / Add network detection and application protection ➡️ NIDS and WAF","correct_raw":"A. NIDS | E. WAF","explanation":"WAF analizuje ruch HTTP/HTTPS na poziomie aplikacji i może blokować m.in. SQL injection, XSS oraz inne ataki na aplikację webową. NIDS monitoruje ruch sieciowy i wykrywa znane wzorce ataków lub anomalie. HIPS działa na pojedynczym hoście, SIEM agreguje logi, a CRL służy do sprawdzania unieważnienia certyfikatów.","options":[{"letter":"A","text":"NIDS"},{"letter":"B","text":"Honeypot"},{"letter":"C","text":"Certificate revocation list"},{"letter":"D","text":"HIPS"},{"letter":"E","text":"WAF"},{"letter":"F","text":"SIEM"}],"correctLetters":["A","E"],"isPBQ":false,"multiSelect":true},{"id":297,"question":"A systems administrator would like to create a point-in-time backup of a virtual machine. Which of the following should the administrator use?","keyword":"Point-in-time state of a virtual machine ➡️ Snapshot","correct_raw":"C. Snapshot","explanation":"Snapshot zapisuje stan maszyny wirtualnej w określonym momencie, obejmując stan dysków, a zależnie od rozwiązania także pamięć i konfigurację. Pozwala szybko wrócić do wcześniejszego stanu. Nie powinien jednak zastępować pełnej, niezależnej kopii zapasowej przechowywanej poza tym samym datastore.","options":[{"letter":"A","text":"Replication"},{"letter":"B","text":"Simulation"},{"letter":"C","text":"Snapshot"},{"letter":"D","text":"Containerization"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":298,"question":"A security administrator notices numerous unused, non-compliant desktops are connected to the network. Which of the following actions would the administrator most likely recommend to the management team?","keyword":"Unused and non-compliant desktops ➡️ Decommissioning","correct_raw":"B. Decommissioning","explanation":"Skoro komputery są nieużywane, dalsze utrzymywanie ich w sieci nie przynosi wartości, a zwiększa powierzchnię ataku. Najwłaściwsze jest formalne wycofanie ich z eksploatacji, bezpieczne usunięcie danych i usunięcie z sieci oraz inwentaryzacji. Izolacja byłaby rozwiązaniem tymczasowym dla systemów nadal potrzebnych.","options":[{"letter":"A","text":"Monitoring"},{"letter":"B","text":"Decommissioning"},{"letter":"C","text":"Patching"},{"letter":"D","text":"Isolating"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":299,"question":"Which of the following is a common data removal option for companies that want to wipe sensitive data from hard drives in a repeatable manner but allow the hard drives to be reused?","keyword":"Repeatable secure wiping while allowing drive reuse ➡️ Sanitization","correct_raw":"A. Sanitization","explanation":"Sanityzacja polega na kontrolowanym usunięciu danych z nośnika w sposób utrudniający lub uniemożliwiający ich odzyskanie, przy zachowaniu możliwości ponownego wykorzystania dysku. Zwykłe formatowanie często pozostawia odzyskiwalne dane, degaussing może trwale uszkodzić nośnik magnetyczny, a defragmentacja nie usuwa danych.","options":[{"letter":"A","text":"Sanitization"},{"letter":"B","text":"Formatting"},{"letter":"C","text":"Degaussing"},{"letter":"D","text":"Defragmentation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":300,"question":"An organization wants to improve the company's security authentication method for remote employees. Given the following requirements: Must work across SaaS and internal network applications; must be device manufacturer agnostic; must have offline capabilities. Which of the following would be the most appropriate authentication method?","keyword":"Works with SaaS and internal apps / Vendor-agnostic / Offline ➡️ Time-based tokens","correct_raw":"D. Time-based tokens","explanation":"Token czasowy, najczęściej TOTP, generuje jednorazowe kody na podstawie wspólnego sekretu i bieżącego czasu. Może działać bez dostępu do sieci, jest obsługiwany przez wiele aplikacji SaaS i systemów wewnętrznych oraz nie zależy od producenta konkretnego urządzenia. SMS wymaga zasięgu i połączenia z operatorem, a biometria zależy od możliwości sprzętu.","options":[{"letter":"A","text":"Username and password"},{"letter":"B","text":"Biometrics"},{"letter":"C","text":"SMS verification"},{"letter":"D","text":"Time-based tokens"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":301,"question":"A security officer is implementing a security awareness program and has placed security-themed posters around the building and assigned online user training. Which of the following will the security officer most likely implement?","keyword":"Security awareness posters and online training / Test effectiveness ➡️ Phishing campaign","correct_raw":"C. Phishing campaign","explanation":"Symulowana kampania phishingowa pozwala sprawdzić, czy pracownicy stosują wiedzę przekazaną podczas szkoleń i rozpoznają podejrzane wiadomości. Może mierzyć m.in. liczbę kliknięć, podanych poświadczeń i poprawnych zgłoszeń. Pozostałe odpowiedzi nie są bezpośrednim sposobem weryfikacji skuteczności programu świadomości bezpieczeństwa.","options":[{"letter":"A","text":"Password policy"},{"letter":"B","text":"Access badges"},{"letter":"C","text":"Phishing campaign"},{"letter":"D","text":"Risk assessment"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":302,"question":"A malicious update was distributed to a common software platform and disabled services at many organizations. Which of the following best describes this type of vulnerability?","keyword":"Malicious software update distributed to many customers ➡️ Supply chain","correct_raw":"D. Supply chain","explanation":"Atak na łańcuch dostaw polega na przejęciu lub zmanipulowaniu zaufanego produktu, aktualizacji albo dostawcy, aby dotrzeć do wielu organizacji korzystających z tego samego oprogramowania. Złośliwa aktualizacja została rozpowszechniona legalnym kanałem dostawcy, dlatego jest to incydent supply chain.","options":[{"letter":"A","text":"DDoS attack"},{"letter":"B","text":"Rogue employee"},{"letter":"C","text":"Insider threat"},{"letter":"D","text":"Supply chain"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":303,"question":"A company web server is initiating outbound traffic to a low-reputation, public IP on a non-standard port. The web server is used to present an unauthenticated page to clients who upload images to the company. An analyst notices a suspicious process running on the server that was not created by the company development team. Which of the following is the most likely explanation for this security incident?","keyword":"Unauthenticated file upload page / Unknown process / Outbound C2-like traffic ➡️ Web shell","correct_raw":"A. A web shell has been deployed to the server through the page.","explanation":"Nieprawidłowo zabezpieczony formularz przesyłania plików może pozwolić napastnikowi wgrać plik wykonywalny lub skrypt pełniący funkcję web shell. Taki komponent umożliwia zdalne wykonywanie poleceń na serwerze i może generować ruch wychodzący do infrastruktury napastnika. W scenariuszu nie ma wskazówek o samopropagacji robaka, wydobywaniu kryptowalut ani wystawionym RDP.","options":[{"letter":"A","text":"A web shell has been deployed to the server through the page."},{"letter":"B","text":"A vulnerability has been exploited to deploy a worm to the server."},{"letter":"C","text":"Malicious insiders are using the server to mine cryptocurrency."},{"letter":"D","text":"Attackers have deployed a rootkit Trojan to the server over an exposed RDP port."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":304,"question":"An organization requests a third-party full-spectrum analysis of its supply chain. Which of the following would the analysis team use to meet this requirement?","keyword":"Full-spectrum supply chain analysis ➡️ Illumination tool","correct_raw":"D. Illumination tool","explanation":"Narzędzie typu supply chain illumination służy do odwzorowania dostawców, podwykonawców, zależności i powiązań w łańcuchu dostaw oraz do identyfikacji ryzyka na wielu jego poziomach. Skaner podatności i test penetracyjny oceniają przede wszystkim konkretne systemy techniczne, a SCAP standaryzuje wymianę informacji o konfiguracjach i podatnościach.","options":[{"letter":"A","text":"Vulnerability scanner"},{"letter":"B","text":"Penetration test"},{"letter":"C","text":"SCAP"},{"letter":"D","text":"Illumination tool"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":305,"question":"A systems administrator deployed a monitoring solution that does not require installation on the endpoints that the solution is monitoring. Which of the following is described in this scenario?","keyword":"No software installed on monitored endpoints ➡️ Agentless solution","correct_raw":"A. Agentless solution","explanation":"Rozwiązanie agentless zbiera dane bez instalowania dedykowanego agenta na każdym monitorowanym urządzeniu. Może korzystać z protokołów i interfejsów dostępnych w systemie, takich jak SNMP, WMI, SSH lub API. Rozwiązanie client-based wymagałoby lokalnego komponentu na endpointach.","options":[{"letter":"A","text":"Agentless solution"},{"letter":"B","text":"Client-based solution"},{"letter":"C","text":"Open port"},{"letter":"D","text":"File-based solution"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":306,"question":"A security analyst is reviewing the source code of an application in order to identify misconfigurations and vulnerabilities. Which of the following kinds of analysis best describes this review?","keyword":"Reviewing source code without executing the application ➡️ Static analysis","correct_raw":"B. Static","explanation":"Analiza statyczna bada kod źródłowy lub skompilowany bez uruchamiania aplikacji. Pozwala wykrywać błędy programistyczne, niebezpieczne funkcje, sekrety w kodzie i część podatności. Analiza dynamiczna obserwuje zachowanie działającej aplikacji.","options":[{"letter":"A","text":"Dynamic"},{"letter":"B","text":"Static"},{"letter":"C","text":"Gap"},{"letter":"D","text":"Impact"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":307,"question":"Which of the following agreement types is used to limit external discussions?","keyword":"Limit disclosure and external discussion of confidential information ➡️ NDA","correct_raw":"B. NDA","explanation":"NDA (Non-Disclosure Agreement) zobowiązuje strony do zachowania określonych informacji w poufności i ogranicza możliwość omawiania lub ujawniania ich osobom zewnętrznym. SLA określa poziom usług, MSA ogólne warunki współpracy, a BPA zasady partnerstwa biznesowego.","options":[{"letter":"A","text":"BPA"},{"letter":"B","text":"NDA"},{"letter":"C","text":"SLA"},{"letter":"D","text":"MSA"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":308,"question":"A security analyst is evaluating a SaaS application that the human resources department would like to implement. The analyst requests a SOC 2 report from the SaaS vendor. Which of the following processes is the analyst most likely conducting?","keyword":"Evaluate a prospective SaaS vendor / Request SOC 2 evidence ➡️ Due diligence","correct_raw":"D. Due diligence","explanation":"Due diligence polega na zebraniu i przeanalizowaniu informacji o potencjalnym dostawcy przed podjęciem decyzji biznesowej. Żądanie raportu SOC 2 pomaga ocenić, czy dostawca posiada odpowiednie mechanizmy ochrony danych i czy jego ryzyko jest akceptowalne. Sam raport SOC 2 jest formą niezależnej atestacji, ale proces wykonywany przez analityka podczas oceny dostawcy to due diligence.","options":[{"letter":"A","text":"Internal audit"},{"letter":"B","text":"Penetration testing"},{"letter":"C","text":"Attestation"},{"letter":"D","text":"Due diligence"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":309,"question":"Which of the following is used to conceal credit card information in a database log file?","keyword":"Hide credit card number in logs while retaining a limited visible form ➡️ Masking","correct_raw":"B. Masking","explanation":"Maskowanie ukrywa wrażliwe fragmenty danych podczas ich zapisywania lub wyświetlania, np. zastępując większość cyfr numeru karty znakami `*`. Dzięki temu log może zawierać końcowe cyfry potrzebne do identyfikacji transakcji bez ujawniania pełnego numeru. Tokenizacja zastępuje wartość odrębnym tokenem w systemach przetwarzających dane, a hash jest nieodwracalnym skrótem.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"Masking"},{"letter":"C","text":"Hashing"},{"letter":"D","text":"Obfuscation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":310,"question":"SIMULATION: A systems administrator is configuring a site-to-site VPN between two branch offices. Requirements: select the most secure algorithms, encrypt all traffic over the VPN, and use a secret password to authenticate the two VPN concentrators.","keyword":"Secret password ➡️ PSK | Strongest available algorithms ➡️ AES256 and SHA256 | Encrypt traffic ➡️ ESP tunnel mode","correct_raw":"Koncentrator 1 i Koncentrator 2: PSK, AES256, SHA256, DH group 14; w fazie 2: Tunnel, ESP, AES256, SHA256, z poprawnymi sieciami lokalnymi i zdalnymi.","explanation":"Konfiguracja VPN Concentrator 1 — Phase 1: Peer IP address `5.5.5.20`; Auth method `PSK`; Negotiation mode `MAIN`; Encryption algorithm `AES256`; Hash algorithm `SHA256`; DH key group `14`. Phase 2: Mode `Tunnel`; Protocol `ESP`; Encryption algorithm `AES256`; Hash algorithm `SHA256`; Local network/mask `192.168.1.0/24` (lub `192.168.1.0 255.255.255.0`, zależnie od formatu pola); Remote network/mask `192.168.2.0/24`.\nKonfiguracja VPN Concentrator 2 — Phase 1: Peer IP address `5.5.5.10`; Auth method `PSK`; Negotiation mode `MAIN`; Encryption algorithm `AES256`; Hash algorithm `SHA256`; DH key group `14`. Phase 2: Mode `Tunnel`; Protocol `ESP`; Encryption algorithm `AES256`; Hash algorithm `SHA256`; Local network/mask `192.168.2.0/24`; Remote network/mask `192.168.1.0/24`.\nPSK spełnia wymaganie użycia wspólnego sekretnego hasła. AES256 i SHA256 są najmocniejszymi dostępnymi opcjami na ekranie. ESP zapewnia szyfrowanie i integralność ruchu, natomiast AH nie szyfruje danych. Ustawienia po obu stronach muszą być zgodne, a sieci lokalna i zdalna muszą być wpisane odwrotnie na drugim koncentratorze.","options":[{"letter":"","text":"Skonfigurować oba koncentratory w fazach 1 i 2 zgodnie z topologią."}],"correctLetters":[],"isPBQ":true,"multiSelect":false},{"id":311,"question":"An organization recently started hosting a new service that customers access through a web portal. A security engineer needs to add to the existing security devices a new solution to protect this new service. Which of the following is the engineer most likely to deploy?","keyword":"Customer-facing web portal / Protect a web application ➡️ WAF","correct_raw":"C. WAF","explanation":"Web Application Firewall chroni aplikacje internetowe, analizując ruch HTTP/HTTPS na warstwie aplikacji. Może wykrywać i blokować m.in. SQL injection, XSS, niebezpieczne żądania oraz próby wykorzystania podatności formularzy i interfejsów webowych. Firewall warstwy 4 filtruje głównie adresy, porty i protokoły, natomiast NGFW i UTM są rozwiązaniami szerszymi, ale mniej wyspecjalizowanymi w ochronie konkretnego portalu WWW.","options":[{"letter":"A","text":"Layer 4 firewall"},{"letter":"B","text":"NGFW"},{"letter":"C","text":"WAF"},{"letter":"D","text":"UTM"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":312,"question":"Which of the following topics would most likely be included within an organization's SDLC?","keyword":"SDLC / Protection of source-code branches ➡️ Branch protection requirements","correct_raw":"D. Branch protection requirements","explanation":"Branch protection requirements są bezpośrednio związane z procesem tworzenia i zatwierdzania kodu w SDLC. Mogą wymagać pull requestów, przeglądu kodu, pomyślnego wykonania testów oraz zakazywać bezpośrednich zmian w głównej gałęzi. Metodyka testów penetracyjnych może wspierać bezpieczny SDLC, ale jest odrębną metodologią testową, natomiast wymagania ochrony gałęzi stanowią element codziennego procesu rozwoju oprogramowania.","options":[{"letter":"A","text":"Service-level agreements"},{"letter":"B","text":"Information security policy"},{"letter":"C","text":"Penetration testing methodology"},{"letter":"D","text":"Branch protection requirements"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":313,"question":"Which of the following control types is AUP an example of?","keyword":"Acceptable Use Policy is a policy created by management ➡️ Managerial control","correct_raw":"B. Managerial","explanation":"AUP (Acceptable Use Policy) jest formalną polityką określającą, w jaki sposób pracownicy mogą korzystać z systemów i zasobów organizacji. Ponieważ ustanawia zasady, obowiązki i oczekiwane zachowania, jest kontrolą zarządczą, nazywaną również administracyjną lub managerial.","options":[{"letter":"A","text":"Physical"},{"letter":"B","text":"Managerial"},{"letter":"C","text":"Technical"},{"letter":"D","text":"Operational"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":314,"question":"An organization is adopting cloud services at a rapid pace and now has multiple SaaS applications in use. Each application has a separate log-in, so the security team wants to reduce the number of credentials each employee must maintain. Which of the following is the first step the security team should take?","keyword":"Implement SSO across multiple SaaS applications / First step ➡️ Select an IdP","correct_raw":"D. Select an IdP.","explanation":"Najpierw organizacja musi wybrać dostawcę tożsamości (Identity Provider), który będzie centralnie uwierzytelniał użytkowników. Dopiero później poszczególne aplikacje SaaS można integrować z IdP za pomocą SAML, OpenID Connect lub innych mechanizmów federacyjnych. Password vaulting przechowuje wiele haseł, ale nie tworzy właściwego, scentralizowanego SSO.","options":[{"letter":"A","text":"Enable SAML."},{"letter":"B","text":"Create OAuth tokens."},{"letter":"C","text":"Use password vaulting."},{"letter":"D","text":"Select an IdP."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":315,"question":"A company's online shopping website became unusable shortly after midnight on January 30, 2023. When a security analyst reviewed the database server, the analyst noticed the following code used for backing up data: IF DATE() = \"01/30/2023\" THEN BEGIN DROP DATABASE WebShopOnline; END. Which of the following should the analyst do next?","keyword":"Date-triggered DROP DATABASE command ➡️ Logic bomb / Possible malicious DBA","correct_raw":"A. Check for recently terminated DBAs.","explanation":"Kod zawiera zaplanowany warunek czasowy, który po osiągnięciu konkretnej daty usuwa bazę danych. Jest to typowy przykład logic bomb. Ponieważ kod został umieszczony w procedurze związanej z bazą danych, analityk powinien ustalić, kto miał odpowiednie uprawnienia i motyw, w szczególności sprawdzić niedawno zwolnionych lub odchodzących administratorów baz danych. Nie ma wskazówek świadczących o command injection, ransomware ani niezależnym malware.","options":[{"letter":"A","text":"Check for recently terminated DBAs."},{"letter":"B","text":"Review WAF logs for evidence of command injection."},{"letter":"C","text":"Scan the database server for malware."},{"letter":"D","text":"Search the web server for ransomware notes."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":316,"question":"Which of the following would be the best way to test resiliency in the event of a primary power failure?","keyword":"Verify actual continuity after loss of primary power ➡️ Production failover","correct_raw":"D. Production failover","explanation":"Rzeczywiste przełączenie środowiska produkcyjnego na zasilanie lub infrastrukturę zapasową najlepiej potwierdza, czy mechanizmy odporności rzeczywiście działają pod obciążeniem. Tabletop i symulacja sprawdzają procedury bez pełnego potwierdzenia technicznego, a parallel processing dotyczy równoległego działania środowisk. Test produkcyjnego failoveru jest najbardziej miarodajny, choć powinien być przeprowadzony w kontrolowanym oknie serwisowym z planem wycofania.","options":[{"letter":"A","text":"Parallel processing"},{"letter":"B","text":"Tabletop exercise"},{"letter":"C","text":"Simulation testing"},{"letter":"D","text":"Production failover"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":317,"question":"Which of the following would be the most appropriate way to protect data in transit?","keyword":"Protect data while it travels across a network ➡️ TLS 1.3","correct_raw":"C. TLS 1.3","explanation":"TLS 1.3 jest współczesnym protokołem zabezpieczającym dane przesyłane pomiędzy systemami. Zapewnia szyfrowanie, integralność i uwierzytelnienie połączenia. SHA-256 jest funkcją skrótu, AES-256 samym algorytmem szyfrowania wymagającym odpowiedniego protokołu i zarządzania kluczami, a SSL 3.0 jest przestarzały i podatny.","options":[{"letter":"A","text":"SHA-256"},{"letter":"B","text":"SSL 3.0"},{"letter":"C","text":"TLS 1.3"},{"letter":"D","text":"AES-256"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":318,"question":"Which of the following is a common, passive reconnaissance technique employed by penetration testers in the early phases of an engagement?","keyword":"Passive reconnaissance before interacting with the target ➡️ OSINT","correct_raw":"A. Open-source intelligence","explanation":"OSINT polega na zbieraniu publicznie dostępnych informacji, np. z witryn, rejestrów domen, dokumentów, mediów społecznościowych i wyszukiwarek, bez bezpośredniego wysyłania ruchu do systemów celu. Port scanning jest aktywnym rozpoznaniem, pivoting następuje po uzyskaniu dostępu, a exploit validation sprawdza możliwość wykorzystania podatności.","options":[{"letter":"A","text":"Open-source intelligence"},{"letter":"B","text":"Port scanning"},{"letter":"C","text":"Pivoting"},{"letter":"D","text":"Exploit validation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":319,"question":"Which of the following threat actors is the most likely to seek financial gain through the use of ransomware attacks?","keyword":"Ransomware used for financial profit ➡️ Organized crime","correct_raw":"A. Organized crime","explanation":"Zorganizowane grupy przestępcze wykorzystują ransomware, model Ransomware-as-a-Service i wymuszenia w celu uzyskania zysku finansowego. Hacktywiści są zwykle motywowani ideologicznie, a podmioty państwowe przede wszystkim celami geopolitycznymi lub wywiadowczymi. Insider może działać dla zysku, ale ransomware na dużą skalę jest najbardziej typowe dla organized crime.","options":[{"letter":"A","text":"Organized crime"},{"letter":"B","text":"Insider threat"},{"letter":"C","text":"Nation-state"},{"letter":"D","text":"Hacktivists"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":320,"question":"Which of the following would a systems administrator follow when upgrading the firmware of an organization's router?","keyword":"Upgrade firmware on a production router ➡️ Maintenance window","correct_raw":"D. Maintenance window","explanation":"Aktualizacja firmware'u routera może wymagać restartu urządzenia i przerwać łączność, dlatego powinna zostać wykonana w zaplanowanym oknie serwisowym. Maintenance window ogranicza wpływ na użytkowników i pozwala przygotować kopię konfiguracji, testy oraz plan wycofania. SDLC dotyczy tworzenia oprogramowania, CSR certyfikatów, a risk tolerance określa akceptowany poziom ryzyka.","options":[{"letter":"A","text":"Software development life cycle"},{"letter":"B","text":"Risk tolerance"},{"letter":"C","text":"Certificate signing request"},{"letter":"D","text":"Maintenance window"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":321,"question":"The security team has been asked to only enable host A (10.2.2.7) and host B (10.3.9.9) to the new isolated network segment (10.9.8.14) that provides access to legacy devices. Access from all other hosts should be blocked. Which of the following entries would need to be added on the firewall?","keyword":"Only two individual hosts / Deny everyone else ➡️ Two /32 permits followed by deny all","correct_raw":"C.","explanation":"Reguła C stosuje zasadę najmniejszych uprawnień: dopuszcza wyłącznie host A jako 10.2.2.7/32 oraz host B jako 10.3.9.9/32, a następnie blokuje wszystkie pozostałe źródła kierujące ruch do chronionego segmentu. Odpowiedź A zezwala całym podsieciom /24, B zaczyna od deny all, więc późniejsze reguły permit nie zostaną osiągnięte, a D ma końcową regułę deny w przeciwnym kierunku. Technicznie adres sieci dla prefiksu /27 powinien być zapisany jako 10.9.8.0/27, ale egzamin konsekwentnie używa w opcjach celu 10.9.8.14/27.","options":[{"letter":"A","text":"Permit entire 10.2.2.0/24 and 10.3.9.0/24 networks, then deny all others"},{"letter":"B","text":"Deny all first, then permit both networks"},{"letter":"C","text":"Permit 10.2.2.7/32 and 10.3.9.9/32 to 10.9.8.14/27, then deny all other sources"},{"letter":"D","text":"Permit both hosts, then apply a deny rule in the wrong traffic direction"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":322,"question":"SIMULATION: Create a secure, redundant network diagram for a new customer-facing payment application hosted by a third-party cloud provider. Every diagram position must be filled and the middle subnet type must be selected.","keyword":"Secure redundant cloud web application ➡️ WAF at the edge, redundant load balancers in the public subnet, Auto Scaling for private application instances, database in the deepest private subnet","correct_raw":"Górne pole: WAF. Public Subnet — lewe pole: Load Balancer; prawe pole: Load Balancer. Pole pomiędzy Public Subnet a środkową podsiecią: Autoscaling Instance. Środkowa podsieć z listy: Private Subnet. Środkowa Private Subnet — lewe, środkowe i prawe pole: Instance, Instance, Instance. Dolna Private Subnet — środkowe pole: Database.","explanation":"Ten układ najlepiej odpowiada zarówno połączeniom na diagramie, jak i typowej architekturze chmurowej. WAF chroni wejście aplikacji HTTP/HTTPS. Dwa load balancery w publicznej podsieci przedstawiają warstwę wejściową i redundancję. Element Autoscaling Instance reprezentuje mechanizm Auto Scaling zarządzający pulą serwerów aplikacyjnych, a nie serwer, przez który przechodzi ruch. Trzy instancje w prywatnej podsieci są backendem aplikacji i nie są bezpośrednio dostępne z internetu. Baza danych znajduje się w najgłębszej prywatnej podsieci i powinna być osiągalna wyłącznie z warstwy aplikacyjnej. Przesłany zrzut sugerujący bazę w środkowej warstwie oraz autoskalowanie jako zwykłe węzły na ścieżce ruchu jest architektonicznie niespójny i nie wygląda na oficjalny klucz CompTIA.","options":[{"letter":"","text":"Dostępne elementy: Autoscaling Instance, Database, Instance, Load Balancer, WAF; wybór Public/Private Subnet."}],"correctLetters":[],"isPBQ":true,"multiSelect":false},{"id":323,"question":"A systems administrator needs to ensure the secure communication of sensitive data within the organization’s private cloud. Which of the following is the best choice for the administrator to implement?","keyword":"Secure network communication in a private cloud ➡️ IPSec","correct_raw":"A. IPSec","explanation":"IPSec zabezpiecza ruch IP pomiędzy hostami lub sieciami, zapewniając szyfrowanie, integralność i uwierzytelnienie. SHA-1 jest przestarzałą funkcją skrótu, RSA jest algorytmem asymetrycznym używanym jako element większego rozwiązania, a TGT jest biletem Kerberos służącym do uwierzytelniania.","options":[{"letter":"A","text":"IPSec"},{"letter":"B","text":"SHA-1"},{"letter":"C","text":"RSA"},{"letter":"D","text":"TGT"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":324,"question":"Which of the following should an internal auditor check for first when conducting an audit of the organization’s risk management program?","keyword":"Audit a risk management program / First step ➡️ Policies and procedures","correct_raw":"A. Policies and procedures","explanation":"Audytor powinien najpierw ustalić, jakie zasady i procedury organizacja formalnie przyjęła. Stanowią one punkt odniesienia do oceny, czy zarządzanie aktywami, analiza ryzyka, BIA i działania naprawcze są wykonywane zgodnie z zatwierdzonym programem. Dopiero potem można porównywać praktykę z wymaganiami.","options":[{"letter":"A","text":"Policies and procedures"},{"letter":"B","text":"Asset management"},{"letter":"C","text":"Vulnerability assessment"},{"letter":"D","text":"Business impact analysis"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":325,"question":"Which of the following activities are associated with vulnerability management? (Choose two.)","keyword":"Vulnerability management lifecycle ➡️ Prioritization and reporting","correct_raw":"A. Reporting | B. Prioritization","explanation":"Po wykryciu podatności należy ocenić ich istotność i kolejność usuwania, czyli przeprowadzić priorytetyzację. Wyniki, właściciele ryzyka, terminy i status remediacji są następnie raportowane. Eksploatowanie luk należy do testów penetracyjnych, containment do reagowania na incydenty, a tabletop jest ćwiczeniem proceduralnym.","options":[{"letter":"A","text":"Reporting"},{"letter":"B","text":"Prioritization"},{"letter":"C","text":"Exploiting"},{"letter":"D","text":"Correlation"},{"letter":"E","text":"Containment"},{"letter":"F","text":"Tabletop exercise"}],"correctLetters":["A","B"],"isPBQ":false,"multiSelect":true},{"id":326,"question":"An administrator wants to perform a risk assessment without using proprietary company information. Which of the following methods should the administrator use to gather information?","keyword":"Gather information without proprietary internal data ➡️ OSINT","correct_raw":"C. Open-source intelligence","explanation":"OSINT wykorzystuje publicznie dostępne źródła, takie jak rejestry domen, strony internetowe, dokumenty, ogłoszenia, repozytoria i media społecznościowe. Nie wymaga dostępu do poufnych informacji firmy. Skanowanie, test penetracyjny i audyt konfiguracji bezpośrednio badają środowisko organizacji.","options":[{"letter":"A","text":"Network scanning"},{"letter":"B","text":"Penetration testing"},{"letter":"C","text":"Open-source intelligence"},{"letter":"D","text":"Configuration auditing"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":327,"question":"A systems administrator is concerned about vulnerabilities within cloud computing instances. Which of the following is most important for the administrator to consider when architecting a cloud computing environment?","keyword":"Cloud virtualization architecture / Isolation between virtual machines ➡️ VM escape","correct_raw":"C. VM escape","explanation":"VM escape jest podatnością charakterystyczną dla środowisk zwirtualizowanych. Pozwala procesowi lub napastnikowi wydostać się z maszyny wirtualnej i uzyskać dostęp do hypervisora albo innych maszyn na tym samym hoście. Dlatego izolacja tenantów, aktualizacje hypervisora i bezpieczna architektura są kluczowe w chmurze.","options":[{"letter":"A","text":"SQL injection"},{"letter":"B","text":"TOC/TOU"},{"letter":"C","text":"VM escape"},{"letter":"D","text":"Tokenization"},{"letter":"E","text":"Password spraying"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":328,"question":"A database administrator is updating the company’s SQL database, which stores credit card information for pending purchases. Which of the following is the best method to secure the data against a potential breach?","keyword":"Protect stored payment-card data while preserving transaction use ➡️ Tokenization","correct_raw":"C. Tokenization","explanation":"Tokenizacja zastępuje właściwy numer karty losowym tokenem, który nie ma użytecznej wartości poza kontrolowanym systemem. Oryginalny numer jest przechowywany oddzielnie w bezpiecznym repozytorium. Maskowanie jedynie ukrywa sposób wyświetlania danych, obfuscation utrudnia ich odczyt, a hashing nie nadaje się do danych, które muszą być później wykorzystane w procesie płatności.","options":[{"letter":"A","text":"Hashing"},{"letter":"B","text":"Obfuscation"},{"letter":"C","text":"Tokenization"},{"letter":"D","text":"Masking"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":329,"question":"Which of the following is a benefit of vendor diversity?","keyword":"Different vendors reduce common-mode exposure ➡️ Zero-day resiliency","correct_raw":"B. Zero-day resiliency","explanation":"Gdy wszystkie systemy pochodzą od jednego dostawcy, jedna podatność zero-day może dotknąć całe środowisko. Zróżnicowanie producentów ogranicza wspólny punkt podatności, ponieważ luka dotycząca jednego produktu nie musi występować w rozwiązaniu innego dostawcy. Nie gwarantuje to bezpieczeństwa, ale zwiększa odporność na pojedynczą klasę błędu.","options":[{"letter":"A","text":"Patch availability"},{"letter":"B","text":"Zero-day resiliency"},{"letter":"C","text":"Secure configuration guide applicability"},{"letter":"D","text":"Load balancing"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":330,"question":"An employee used a company’s billing system to issue fraudulent checks. The administrator is looking for evidence of other occurrences of this activity. Which of the following should the administrator examine?","keyword":"Fraudulent actions performed inside a billing application ➡️ Application logs","correct_raw":"A. Application logs","explanation":"Logi aplikacji rozliczeniowej powinny zawierać informacje o wystawionych czekach, użytkownikach, czasie, kwotach i wykonanych operacjach. Pozwalają więc wyszukać inne podobne transakcje. Firewall i IDS/IPS widzą przede wszystkim ruch sieciowy, a skaner podatności nie rejestruje operacji biznesowych.","options":[{"letter":"A","text":"Application logs"},{"letter":"B","text":"Vulnerability scanner logs"},{"letter":"C","text":"IDS/IPS logs"},{"letter":"D","text":"Firewall logs"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":331,"question":"An organization is looking to optimize its environment and reduce the number of patches necessary for operating systems. Which of the following will best help to achieve this objective?","keyword":"Reduce the number of operating systems requiring patches ➡️ Containers","correct_raw":"D. Containers","explanation":"Kontenery współdzielą jądro systemu operacyjnego hosta, dlatego nie wymagają osobnego systemu operacyjnego dla każdego obciążenia. Organizacja aktualizuje przede wszystkim system hosta oraz obrazy kontenerów. Wirtualizacja ogranicza liczbę serwerów fizycznych, ale każda maszyna wirtualna nadal zwykle ma własny system operacyjny, który wymaga osobnego łatania.","options":[{"letter":"A","text":"Microservices"},{"letter":"B","text":"Virtualization"},{"letter":"C","text":"Real-time operating system"},{"letter":"D","text":"Containers"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":332,"question":"Which of the following tasks is typically included in the BIA process?","keyword":"Business Impact Analysis / Determine acceptable recovery timing ➡️ Estimate recovery time","correct_raw":"A. Estimating the recovery time of systems","explanation":"Business Impact Analysis identyfikuje krytyczne procesy, zależności oraz skutki ich niedostępności. Na tej podstawie określa się wymagania odtworzeniowe, w tym RTO, czyli maksymalny akceptowalny czas przywrócenia systemu lub procesu. Konkretne procedury backupu, komunikacji i reagowania są opracowywane później na podstawie wyników BIA.","options":[{"letter":"A","text":"Estimating the recovery time of systems"},{"letter":"B","text":"Identifying the communication strategy"},{"letter":"C","text":"Evaluating the risk management plan"},{"letter":"D","text":"Establishing the backup and recovery procedures"},{"letter":"E","text":"Developing the incident response plan"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":333,"question":"Which of the following is a risk of conducting a vulnerability assessment?","keyword":"Active vulnerability assessment may affect production systems ➡️ Business disruption","correct_raw":"A. A disruption of business operations","explanation":"Aktywny skan podatności wysyła dużą liczbę zapytań i może uruchamiać testy obciążające lub destabilizujące starsze albo błędnie skonfigurowane systemy. W skrajnym przypadku może spowodować spowolnienie lub przerwę w działaniu usługi. Fałszywe alarmy są częstym ograniczeniem skanerów, ale największym ryzykiem biznesowym samego przeprowadzania oceny jest zakłócenie operacji.","options":[{"letter":"A","text":"A disruption of business operations"},{"letter":"B","text":"Unauthorized access to the system"},{"letter":"C","text":"Reports of false positives"},{"letter":"D","text":"Finding security gaps in the system"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":334,"question":"Which of the following techniques would attract the attention of a malicious attacker in an insider threat scenario?","keyword":"Decoy sensitive file intended to attract an insider ➡️ Honeyfile","correct_raw":"A. Creating a false text file in /docs/salaries","explanation":"Fałszywy plik o atrakcyjnej nazwie, umieszczony w katalogu związanym z wynagrodzeniami, działa jak honeyfile lub honeytoken. Legalni użytkownicy nie powinni go otwierać, więc dostęp może wygenerować alarm i wskazać osobę poszukującą danych bez uzasadnienia. Pozostałe opcje tworzą realne słabości albo modyfikują konta i zadania systemowe.","options":[{"letter":"A","text":"Creating a false text file in
