rytyczny system legacy nie może zostać zastąpiony, jego awaria może zatrzymać kluczowy proces biznesowy. Najważniejszą kwestią jest więc ryzyko single point of failure i konieczność zapewnienia redundancji, części zamiennych, backupu, planu odtworzeniowego lub zabezpieczeń kompensujących. Koszt i złożoność są ważne, ale mniej istotne niż wpływ całkowitej awarii jedynego krytycznego komponentu.","options":[{"letter":"A","text":"Resource provisioning"},{"letter":"B","text":"Cost"},{"letter":"C","text":"Single point of failure"},{"letter":"D","text":"Complexity"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":418,"question":"Which of the following is a compensating control for providing user access to a high-risk website?","keyword":"Website must remain accessible, so reduce the residual risk ➡️ Firewall threat prevention","correct_raw":"A. Enabling threat prevention features on the firewall","explanation":"Kontrola kompensująca jest stosowana wtedy, gdy nie można zastosować podstawowej kontroli, np. całkowicie zablokować niebezpiecznej strony. Włączenie IPS, filtrowania URL, analizy malware lub sandboxingu na firewallu pozwala nadal zapewnić dostęp, jednocześnie ograniczając ryzyko. SIEM jedynie rejestruje i analizuje zdarzenia, odpowiedź C nadmiernie rozszerza dostęp, a D całkowicie blokuje stronę zamiast kompensować ryzyko jej udostępnienia.","options":[{"letter":"A","text":"Enabling threat prevention features on the firewall"},{"letter":"B","text":"Configuring a SIEM tool to capture all web traffic"},{"letter":"C","text":"Setting firewall rules to allow traffic from any port to that destination"},{"letter":"D","text":"Blocking that website on the endpoint protection software"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":419,"question":"An organization is implementing a COPE mobile device management policy. Which of the following should the organization include in the COPE policy? (Choose two.)","keyword":"Corporate-owned mobile device containing business data ➡️ Remote wipe and encryption","correct_raw":"A. Remote wiping of the device | B. Data encryption","explanation":"W modelu COPE urządzenie należy do organizacji, ale może być również używane prywatnie. Polityka MDM powinna chronić dane firmowe przez szyfrowanie oraz umożliwiać zdalne wymazanie urządzenia po utracie, kradzieży lub zakończeniu zatrudnienia. W praktyce polityka COPE powinna także regulować prywatność, własność danych i dozwolone aplikacje, ale spośród podanych odpowiedzi A i B są najważniejszymi bezpośrednimi kontrolami bezpieczeństwa. Wymóg dokładnie ośmiu znaków jest zbyt słaby i arbitralny, a data usage caps dotyczą głównie kosztów.","options":[{"letter":"A","text":"Remote wiping of the device"},{"letter":"B","text":"Data encryption"},{"letter":"C","text":"Requiring passwords with eight characters"},{"letter":"D","text":"Data usage caps"},{"letter":"E","text":"Employee data ownership"},{"letter":"F","text":"Personal application store access"}],"correctLetters":["A","B"],"isPBQ":false,"multiSelect":true},{"id":420,"question":"A security administrator observed the following in a web server log while investigating an incident: \"GET ../../../../etc/passwd\" Which of the following attacks did the security administrator most likely see?","keyword":"../ sequences used to escape the web directory ➡️ Directory traversal","correct_raw":"D. Directory traversal","explanation":"Sekwencje ../ oznaczają przechodzenie do katalogu nadrzędnego. Napastnik próbuje wyjść poza katalog udostępniany przez serwer WWW i odczytać plik /etc/passwd z systemu Linux. Jest to directory traversal, nazywane także path traversal. Privilege escalation zwiększa uprawnienia, credential replay ponownie wykorzystuje przechwycone dane uwierzytelniające, a brute force polega na wielu próbach odgadnięcia hasła.","options":[{"letter":"A","text":"Privilege escalation"},{"letter":"B","text":"Credential replay"},{"letter":"C","text":"Brute force"},{"letter":"D","text":"Directory traversal"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":421,"question":"An organization wants a third-party vendor to do a penetration test that targets a specific device. The organization has provided basic information about the device. Which of the following best describes this kind of penetration test?","keyword":"Tester receives only basic target information ➡️ Partially known environment","correct_raw":"A. Partially known environment","explanation":"W teście częściowo znanego środowiska tester otrzymuje ograniczone informacje, np. adres urządzenia, jego typ lub ogólny zakres, ale nie dostaje pełnej dokumentacji, konfiguracji ani danych uwierzytelniających. Unknown environment oznacza test bez wcześniejszej wiedzy o celu, a known environment zapewnia szeroki dostęp do informacji wewnętrznych. Określenie integrated nie opisuje standardowego poziomu wiedzy testera.","options":[{"letter":"A","text":"Partially known environment"},{"letter":"B","text":"Unknown environment"},{"letter":"C","text":"Integrated"},{"letter":"D","text":"Known environment"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":422,"question":"Which of the following should a security team do first before a new web server goes live?","keyword":"Secure the server itself before exposing it to production ➡️ Harden the virtual host","correct_raw":"A. Harden the virtual host.","explanation":"Przed wystawieniem nowego serwera WWW należy najpierw zabezpieczyć sam host zgodnie z bezpiecznym baseline'em: usunąć zbędne usługi, zmienić ustawienia domyślne, ograniczyć porty i uprawnienia, włączyć logowanie oraz zainstalować aktualne poprawki. Patch management jest procesem ciągłym i stanowi część utrzymania bezpiecznej konfiguracji, natomiast reguły WAF i NIDS są dodatkowymi warstwami ochrony. Najpierw trzeba zabezpieczyć system źródłowy, zanim dopuści się go do ruchu produkcyjnego.","options":[{"letter":"A","text":"Harden the virtual host."},{"letter":"B","text":"Create WAF rules."},{"letter":"C","text":"Enable network intrusion detection."},{"letter":"D","text":"Apply patch management."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":423,"question":"Which of the following techniques can be used to sanitize the data contained on a hard drive while allowing for the hard drive to be repurposed?","keyword":"Sanitize a drive while preserving it for reuse ➡️ Wipe tool","correct_raw":"D. Wipe tool","explanation":"Wipe tool nadpisuje dane na dysku i pozwala ponownie wykorzystać sprawny nośnik. Degaussing może uniemożliwić dalsze używanie dysku magnetycznego, zwłaszcza gdy usunie również informacje serwisowe. Drive shredder fizycznie niszczy urządzenie, a retention platform służy do przechowywania danych, a nie ich sanitizacji.","options":[{"letter":"A","text":"Degaussing"},{"letter":"B","text":"Drive shredder"},{"letter":"C","text":"Retention platform"},{"letter":"D","text":"Wipe tool"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":424,"question":"An attacker submits a request containing unexpected characters in an attempt to gain unauthorized access to information within the underlying systems. Which of the following best describes this attack?","keyword":"Unexpected characters sent to manipulate an underlying database query ➡️ SQL injection","correct_raw":"D. SQL injection","explanation":"SQL injection wykorzystuje specjalnie przygotowane znaki i fragmenty składni, takie jak apostrofy, operatory logiczne, komentarze lub polecenia SQL, aby zmienić zapytanie wykonywane przez aplikację i uzyskać nieautoryzowany dostęp do danych. Side loading dotyczy uruchamiania aplikacji lub bibliotek poza zaufanym kanałem, target of evaluation jest obiektem oceny bezpieczeństwa, a resource reuse odnosi się do pozostałości danych w ponownie używanym zasobie.","options":[{"letter":"A","text":"Side loading"},{"letter":"B","text":"Target of evaluation"},{"letter":"C","text":"Resource reuse"},{"letter":"D","text":"SQL injection"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":425,"question":"A security analyst has determined that a security breach would have a financial impact of $15,000 and is expected to occur twice within a three-year period. Which of the following is the ALE for this risk?","keyword":"ALE = SLE × ARO; $15,000 × 2/3 per year ➡️ $10,000","correct_raw":"B. $10,000","explanation":"Strata z jednego zdarzenia, czyli SLE, wynosi 15 000 USD. Zdarzenie ma wystąpić dwa razy w ciągu trzech lat, więc roczna częstotliwość ARO wynosi 2/3. Obliczenie: ALE = SLE × ARO = 15 000 × 2/3 = 10 000 USD rocznie. Odpowiedź D przedstawiałaby łączną stratę w całym trzyletnim okresie, a nie annualized loss expectancy.","options":[{"letter":"A","text":"$7,500"},{"letter":"B","text":"$10,000"},{"letter":"C","text":"$15,000"},{"letter":"D","text":"$30,000"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":426,"question":"A systems administrator discovers a system that is no longer receiving support from the vendor. However, this system and its environment are critical to running the business, cannot be modified, and must stay online. Which of the following risk treatments is the most appropriate in this situation?","keyword":"System cannot be changed, removed or shut down ➡️ Accept the residual risk","correct_raw":"B. Accept","explanation":"Organizacja nie może uniknąć ryzyka przez wyłączenie systemu ani ograniczyć go przez modyfikację, ponieważ system musi pozostać online i nie może być zmieniony. Nie wskazano również możliwości przeniesienia ryzyka na ubezpieczyciela lub dostawcę. Pozostaje formalne zaakceptowanie ryzyka przez właściwego właściciela biznesowego. W praktyce należałoby zastosować możliwe kontrole kompensujące, np. segmentację, monitoring i restrykcyjny dostęp, ale nie zmienia to wybranego rodzaju traktowania ryzyka.","options":[{"letter":"A","text":"Reject"},{"letter":"B","text":"Accept"},{"letter":"C","text":"Transfer"},{"letter":"D","text":"Avoid"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":427,"question":"A company discovered its data was advertised for sale on the dark web. During the initial investigation, the company determined the data was proprietary data. Which of the following is the next step the company should take?","keyword":"Confirmed breach and classified affected data ➡️ Notify applicable parties","correct_raw":"C. Notify the applicable parties of the breach.","explanation":"Po potwierdzeniu naruszenia i ustaleniu rodzaju ujawnionych danych organizacja powinna uruchomić wymagany proces powiadamiania właściwych interesariuszy, np. kierownictwa, właściciela danych, klientów, partnerów, ubezpieczyciela lub organów, zależnie od umów i obowiązujących wymagań. Ustalenie wektora wejścia pozostaje ważnym elementem dochodzenia, lecz nie powinno opóźniać terminowych obowiązków notyfikacyjnych. Samo skanowanie podatności nie wyjaśni całego naruszenia, a lokalne organy ścigania nie zawsze są pierwszym ani jedynym podmiotem wymagającym zawiadomienia.","options":[{"letter":"A","text":"Identify the attacker’s entry methods."},{"letter":"B","text":"Report the breach to the local authorities."},{"letter":"C","text":"Notify the applicable parties of the breach."},{"letter":"D","text":"Implement vulnerability scanning of the company's systems."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":428,"question":"Which of the following would be the best solution to deploy a low-cost standby site that includes hardware and internet access?","keyword":"Standby site with hardware and connectivity but not fully live ➡️ Warm site","correct_raw":"D. Warm site","explanation":"Warm site posiada część lub całość wymaganej infrastruktury sprzętowej oraz łączność, ale zwykle wymaga odtworzenia danych, dodatkowej konfiguracji i uruchomienia usług. Jest tańszy od hot site, które jest niemal natychmiast gotowe do przejęcia pracy, a jednocześnie bardziej przygotowany niż cold site, które zazwyczaj zapewnia głównie lokalizację, zasilanie i podstawową łączność bez kompletnego sprzętu.","options":[{"letter":"A","text":"Recovery site"},{"letter":"B","text":"Cold site"},{"letter":"C","text":"Hot site"},{"letter":"D","text":"Warm site"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":429,"question":"An organization needs to determine how many employees are accessing the building each day in order to configure the proper access controls. Which of the following control types best meets this requirement?","keyword":"Observe and count building access events ➡️ Detective control","correct_raw":"A. Detective","explanation":"Kontrola detektywistyczna rejestruje i ujawnia zdarzenia, np. liczbę użyć kart dostępu, wejścia przez bramki lub obecność osób w budynku. Zebrane informacje można później wykorzystać do zaprojektowania odpowiednich kontroli dostępu. Kontrola preventive blokuje zdarzenie, corrective usuwa jego skutki, a directive określa wymagane zachowanie.","options":[{"letter":"A","text":"Detective"},{"letter":"B","text":"Preventive"},{"letter":"C","text":"Corrective"},{"letter":"D","text":"Directive"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":430,"question":"An organization wants to implement a secure solution for remote users. The users handle sensitive PHI on a regular basis and need to access an internally developed corporate application. Which of the following best meet the organization's security requirements? (Choose two.)","keyword":"Remote access to internal PHI application ➡️ Encrypted VPN plus strong MFA","correct_raw":"E. MFA | F. VPN","explanation":"VPN tworzy zaszyfrowany tunel pomiędzy urządzeniem zdalnego użytkownika a siecią organizacji, chroniąc PHI w tranzycie i umożliwiając dostęp do aplikacji wewnętrznej. MFA zmniejsza ryzyko przejęcia konta po kradzieży hasła. WAF może chronić aplikację webową przed atakami, ale nie zastępuje bezpiecznego zdalnego dostępu i silnego uwierzytelniania. Jump server jest przeznaczony głównie do kontrolowanej administracji systemami, a nie do zwykłego dostępu użytkowników biznesowych.","options":[{"letter":"A","text":"Local administrative password"},{"letter":"B","text":"Perimeter network"},{"letter":"C","text":"Jump server"},{"letter":"D","text":"WAF"},{"letter":"E","text":"MFA"},{"letter":"F","text":"VPN"}],"correctLetters":["E","F"],"isPBQ":false,"multiSelect":true},{"id":431,"question":"A security officer is implementing a security awareness program and is placing security-themed posters around the building and is assigning online user training. Which of the following would the security officer most likely implement?","keyword":"Security awareness activities, posters and user training ➡️ Phishing campaign","correct_raw":"C. Phishing campaign","explanation":"Symulowana kampania phishingowa jest typowym elementem programu podnoszenia świadomości. Pozwala sprawdzić, czy użytkownicy rozpoznają podejrzane wiadomości, a wyniki można wykorzystać do kierowania dodatkowych szkoleń i komunikatów, takich jak plakaty. Password policy jest dokumentem określającym wymagania dla haseł, access badges są kontrolą fizyczną, a risk assessment jest procesem oceny ryzyka, nie działaniem szkoleniowym dla użytkowników.","options":[{"letter":"A","text":"Password policy"},{"letter":"B","text":"Access badges"},{"letter":"C","text":"Phishing campaign"},{"letter":"D","text":"Risk assessment"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":432,"question":"A security consultant is working with a client that wants to physically isolate its secure systems. Which of the following best describes this architecture?","keyword":"Physical isolation from other networks ➡️ Air gap","correct_raw":"B. Air gapped","explanation":"Air-gapped system jest fizycznie odłączony od niezaufanych sieci, w szczególności od internetu i często także od zwykłej sieci firmowej. SDN programowo zarządza siecią, kontenery zapewniają izolację logiczną procesów, a high availability dotyczy ciągłości działania, nie fizycznej separacji.","options":[{"letter":"A","text":"SDN"},{"letter":"B","text":"Air gapped"},{"letter":"C","text":"Containerized"},{"letter":"D","text":"Highly available"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":433,"question":"A company is in the process of migrating to cloud-based services. The company’s IT department has limited resources for migration and ongoing support. Which of the following best meets the company’s needs?","keyword":"Cloud-delivered, consolidated networking and security with limited IT resources ➡️ SASE","correct_raw":"C. SASE","explanation":"SASE łączy funkcje sieciowe i bezpieczeństwa w usłudze dostarczanej z chmury, np. secure web gateway, ZTNA, firewall as a service i SD-WAN. Konsolidacja usług oraz zarządzanie przez dostawcę mogą ograniczyć nakład pracy potrzebny do utrzymania wielu oddzielnych rozwiązań. IPS, WAF i IAM realizują pojedyncze obszary ochrony, ale nie zapewniają tak szerokiej, zintegrowanej architektury dla migracji do chmury.","options":[{"letter":"A","text":"IPS"},{"letter":"B","text":"WAF"},{"letter":"C","text":"SASE"},{"letter":"D","text":"IAM"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":434,"question":"An employee clicks a malicious link in an email that appears to be from the company's Chief Executive Officer. The employee's computer is infected with ransomware that encrypts the company's files. Which of the following is the most effective way for the company to prevent similar incidents in the future?","keyword":"Employee clicked a socially engineered malicious link ➡️ Security awareness training","correct_raw":"A. Security awareness training","explanation":"Źródłem incydentu była wiadomość phishingowa podszywająca się pod osobę z kierownictwa. Szkolenie powinno uczyć rozpoznawania podejrzanych linków, weryfikowania nietypowych próśb i zgłaszania wiadomości. Reporting suspicious emails jest pożądanym zachowaniem, ale jest elementem szerszego programu szkoleniowego. Segmentacja może ograniczyć rozprzestrzenianie ransomware, lecz nie zapobiega kliknięciu. Szyfrowanie bazy danych nie chroni przed uruchomieniem złośliwego załącznika lub linku.","options":[{"letter":"A","text":"Security awareness training"},{"letter":"B","text":"Database encryption"},{"letter":"C","text":"Segmentation"},{"letter":"D","text":"Reporting suspicious emails"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":435,"question":"Which of the following types of vulnerabilities is primarily caused by improper use and management of cryptographic certificates?","keyword":"Expired, untrusted, mismatched or incorrectly deployed certificates ➡️ Misconfiguration","correct_raw":"A. Misconfiguration","explanation":"Nieprawidłowe wdrożenie i utrzymanie certyfikatów może prowadzić do używania certyfikatów wygasłych, samopodpisanych, wystawionych dla niewłaściwej nazwy, bez pełnego łańcucha zaufania albo niepoprawnie odwołanych. Są to typowe błędy konfiguracji. Insecure key storage dotyczy sposobu przechowywania kluczy prywatnych, a weak cipher suites dotyczą wyboru słabych algorytmów i parametrów TLS.","options":[{"letter":"A","text":"Misconfiguration"},{"letter":"B","text":"Resource reuse"},{"letter":"C","text":"Insecure key storage"},{"letter":"D","text":"Weak cipher suites"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":436,"question":"Which of the following best describe the benefits of a microservices architecture when compared to a monolithic architecture? (Choose two.)","keyword":"Independent services can scale separately and isolate failures ➡️ Scalability and compartmentalization","correct_raw":"C. Improved scalability of the system | D. Increased compartmentalization of the system","explanation":"Mikrousługi można skalować niezależnie, dlatego zasoby zwiększa się tylko dla przeciążonych elementów systemu. Podział aplikacji na mniejsze usługi zwiększa także compartmentalization: awaria lub naruszenie jednej usługi może być ograniczone do mniejszej części środowiska. Mikrousługi nie muszą zmniejszać kosztów ani złożoności; często zwiększają wymagania dotyczące orkiestracji, monitoringu i komunikacji między usługami. Nie zapewniają również automatycznie silniejszego uwierzytelniania.","options":[{"letter":"A","text":"Easier debugging of the system"},{"letter":"B","text":"Reduced cost of ownership of the system"},{"letter":"C","text":"Improved scalability of the system"},{"letter":"D","text":"Increased compartmentalization of the system"},{"letter":"E","text":"Stronger authentication of the system"},{"letter":"F","text":"Reduced complexity of the system"}],"correctLetters":["C","D"],"isPBQ":false,"multiSelect":true},{"id":437,"question":"A user's workstation becomes unresponsive and displays a ransom note demanding payment to decrypt files. Before the attack, the user opened a resume they received in a message, browsed the company's website, and installed OS updates. Which of the following is the most likely vector of this attack?","keyword":"Targeted message containing a malicious resume attachment ➡️ Spear phishing","correct_raw":"A. Spear-phishing attachment","explanation":"Plik CV otrzymany w wiadomości jest najbardziej bezpośrednim i typowym wektorem dostarczenia ransomware. Spear phishing wykorzystuje wiadomość dopasowaną do odbiorcy lub kontekstu biznesowego, aby skłonić go do otwarcia złośliwego pliku. Watering hole wymagałby celowego zainfekowania strony często odwiedzanej przez ofiary, a typosquatting wykorzystuje domenę podobną do prawidłowej. Samo odwiedzenie firmowej strony i instalacja aktualizacji nie wskazują na te ataki.","options":[{"letter":"A","text":"Spear-phishing attachment"},{"letter":"B","text":"Watering hole"},{"letter":"C","text":"Infected website"},{"letter":"D","text":"Typosquatting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":438,"question":"A penetration tester finds an unused Ethernet port during an on-site penetration test. Upon plugging a device into the unused port, the penetration tester notices that the machine is assigned an IP address, allowing the tester to enumerate the local network. Which of the following should an administrator implement in order to prevent this situation from happening in the future?","keyword":"Unauthorized device connected to an unused switch port ➡️ Port security","correct_raw":"A. Port security","explanation":"Port security na przełączniku może ograniczyć dozwolone adresy MAC, liczbę urządzeń na porcie albo wyłączyć port po wykryciu nieautoryzowanego urządzenia. Nieużywane porty powinny być także administracyjnie wyłączone lub objęte NAC/802.1X. TLS szyfruje komunikację, proxy pośredniczy w ruchu aplikacyjnym, a security zones segmentują sieć, ale nie blokują samego podłączenia urządzenia do aktywnego portu.","options":[{"letter":"A","text":"Port security"},{"letter":"B","text":"Transport Layer Security"},{"letter":"C","text":"Proxy server"},{"letter":"D","text":"Security zones"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":439,"question":"Which of the following should be used to ensure an attacker is unable to read the contents of a mobile device's drive if the device is lost?","keyword":"Lost device; protect all stored drive contents ➡️ Full disk encryption","correct_raw":"C. FDE","explanation":"Full Disk Encryption szyfruje całą zawartość dysku i chroni dane przed odczytaniem po utracie lub kradzieży urządzenia. TPM może bezpiecznie przechowywać materiał kluczowy i wspierać FDE, ale sam nie szyfruje całego dysku. ECC jest algorytmem kryptografii asymetrycznej, a HSM to wyspecjalizowane urządzenie do ochrony kluczy.","options":[{"letter":"A","text":"TPM"},{"letter":"B","text":"ECC"},{"letter":"C","text":"FDE"},{"letter":"D","text":"HSM"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":440,"question":"A security administrator documented DNS records during an assessment. The A record for @ and the WWW record originally resolved to 192.168.1.1 with a TTL of 14400. Two weeks later, both records resolved to 233.123.123.23, and the service owner confirmed that the new address was not part of the company network. Which of the following was the company most likely experiencing?","keyword":"DNS records changed to an unauthorized external address ➡️ DNS poisoning","correct_raw":"B. DNS poisoning","explanation":"DNS poisoning lub DNS hijacking powoduje, że prawidłowa nazwa domenowa zaczyna wskazywać na adres kontrolowany przez napastnika. Użytkownicy mogą wtedy zostać przekierowani do fałszywej usługi mimo wpisania poprawnej nazwy. DDoS powoduje niedostępność przez przeciążenie, ransomware szyfruje dane, a spyware zbiera informacje; żaden z tych scenariuszy nie wyjaśnia bezpośredniej zmiany rekordów DNS na nieautoryzowany zewnętrzny adres.","options":[{"letter":"A","text":"DDoS attack"},{"letter":"B","text":"DNS poisoning"},{"letter":"C","text":"Ransomware compromise"},{"letter":"D","text":"Spyware infection"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":441,"question":"Which of the following is the primary reason why false negatives on a vulnerability scan should be a concern?","keyword":"False negative = a real vulnerability is missed ➡️ Undetected vulnerabilities","correct_raw":"A. The system has vulnerabilities that are not being detected.","explanation":"False negative oznacza, że skaner informuje o braku problemu, mimo że podatność rzeczywiście istnieje. Organizacja może uznać system za bezpieczny i nie podjąć remediacji, pozostawiając podatność dostępną dla atakującego. Odpowiedź B opisuje skutek false positive, czyli zgłoszenia podatności, która nie istnieje. Odpowiedź D opisuje sytuację braku poprawki, a nie błąd wykrywania skanera.","options":[{"letter":"A","text":"The system has vulnerabilities that are not being detected."},{"letter":"B","text":"The time to remediate vulnerabilities that do not exist is excessive."},{"letter":"C","text":"Vulnerabilities with a lower severity will be prioritized over critical vulnerabilities."},{"letter":"D","text":"The system has vulnerabilities, and a patch has not yet been released."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":442,"question":"A company is concerned about theft of client data from decommissioned laptops. Which of the following is the most cost-effective method to decrease this risk?","keyword":"Sanitize decommissioned laptops without destroying reusable hardware ➡️ Wiping","correct_raw":"A. Wiping","explanation":"Bezpieczne nadpisanie danych jest tańsze niż fizyczne zniszczenie dysku i pozwala ponownie wykorzystać lub sprzedać sprawny sprzęt. Zwykłe usunięcie plików pozostawia dane możliwe do odzyskania, a sam recykling nie zapewnia sanitizacji. Shredding jest skuteczne, lecz niszczy nośnik i zwykle kosztuje więcej.","options":[{"letter":"A","text":"Wiping"},{"letter":"B","text":"Recycling"},{"letter":"C","text":"Shredding"},{"letter":"D","text":"Deletion"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":443,"question":"A company that has a large IT operation is looking to better control, standardize, and lower the time required to build new servers. Which of the following architectures will best achieve the company’s objectives?","keyword":"Standardized, repeatable and automated server builds ➡️ Infrastructure as Code","correct_raw":"B. IaC","explanation":"Infrastructure as Code opisuje infrastrukturę w plikach konfiguracyjnych lub kodzie, dzięki czemu serwery mogą być tworzone automatycznie, szybko i w powtarzalny sposób. Zapewnia kontrolę wersji, standaryzację i ogranicza błędy ręcznej konfiguracji. IaaS jest modelem dostarczania infrastruktury chmurowej, ale samo w sobie nie gwarantuje zautomatyzowanych i ustandaryzowanych wdrożeń.","options":[{"letter":"A","text":"IoT"},{"letter":"B","text":"IaC"},{"letter":"C","text":"IaaS"},{"letter":"D","text":"ICS"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":444,"question":"A government official receives a blank envelope containing photos and a note instructing the official to wire a large sum of money by midnight to prevent the photos from being leaked on the internet. Which of the following best describes the threat actor's intent?","keyword":"Threaten disclosure unless money is paid ➡️ Blackmail","correct_raw":"D. Blackmail","explanation":"Blackmail, czyli szantaż, polega na grożeniu ujawnieniem kompromitujących lub poufnych informacji, jeśli ofiara nie spełni żądania. Organized crime opisuje rodzaj aktora, a pytanie pyta o jego intencję. Espionage oznacza potajemne zdobywanie informacji, natomiast philosophical beliefs byłyby motywacją ideologiczną.","options":[{"letter":"A","text":"Organized crime"},{"letter":"B","text":"Philosophical beliefs"},{"letter":"C","text":"Espionage"},{"letter":"D","text":"Blackmail"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":445,"question":"Which of the following is the best security reason for closing service ports that are not needed?","keyword":"Fewer exposed services and entry points ➡️ Reduced attack surface","correct_raw":"C. To reduce a system's attack surface","explanation":"Każdy otwarty port może wskazywać na usługę, którą można skanować, atakować lub wykorzystać po wykryciu podatności. Zamknięcie niepotrzebnych portów usuwa zbędne punkty wejścia i zmniejsza attack surface. Może też nieznacznie ograniczyć zużycie zasobów, ale nie jest to główny cel bezpieczeństwa.","options":[{"letter":"A","text":"To mitigate risks associated with unencrypted traffic"},{"letter":"B","text":"To eliminate false positives from a vulnerability scan"},{"letter":"C","text":"To reduce a system's attack surface"},{"letter":"D","text":"To improve a system's resource utilization"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":446,"question":"Which of the following would a security administrator use to comply with a secure baseline during a patch update?","keyword":"Detailed approved steps for patching while preserving the baseline ➡️ SOP","correct_raw":"C. Standard operating procedure","explanation":"SOP zawiera szczegółową, powtarzalną procedurę instalowania, testowania i weryfikowania poprawek zgodnie z bezpiecznym baseline'em. Polityka bezpieczeństwa określa ogólne wymagania, ale nie opisuje krok po kroku sposobu wykonania aktualizacji. Test result report dokumentuje wynik testów, a service-level expectations określają oczekiwany poziom świadczenia usługi.","options":[{"letter":"A","text":"Information security policy"},{"letter":"B","text":"Service-level expectations"},{"letter":"C","text":"Standard operating procedure"},{"letter":"D","text":"Test result report"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":447,"question":"A malicious actor conducted a brute-force attack on a company's web servers and eventually gained access to the company's customer information database. Which of the following is the most effective way to prevent similar attacks?","keyword":"Brute-forced credentials should not be sufficient for access ➡️ MFA","correct_raw":"C. Multifactor authentication","explanation":"Brute force próbuje odgadnąć hasło. MFA wymaga dodatkowego niezależnego składnika, więc samo odgadnięcie hasła nie wystarcza do zalogowania. WAF może ograniczać tempo prób i blokować część automatycznych ataków, ale MFA skuteczniej zapobiega przejęciu konta po poznaniu hasła. Patchowanie nie rozwiązuje słabych poświadczeń, a szyfrowanie danych ogranicza skutki wycieku, lecz nie blokuje logowania.","options":[{"letter":"A","text":"Regular patching of servers"},{"letter":"B","text":"Web application firewalls"},{"letter":"C","text":"Multifactor authentication"},{"letter":"D","text":"Enabling encryption of customer data"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":448,"question":"Which of the following options will provide the lowest RTO and RPO for a database?","keyword":"Fastest service restoration with near-current replicated data ➡️ Hot site","correct_raw":"D. Hot site","explanation":"Hot site jest działającym ośrodkiem zapasowym z przygotowaną infrastrukturą i aktualnymi lub niemal aktualnymi kopiami danych, dlatego zapewnia najkrótszy czas odtworzenia RTO oraz bardzo niski RPO. Journaling rejestruje zmiany i może znacząco obniżyć RPO, ale samo odtworzenie bazy z dziennika wymaga czasu, więc nie zapewnia najniższego RTO. Snapshoty i zwykłe backupy wymagają przywrócenia danych i uruchomienia środowiska.","options":[{"letter":"A","text":"Snapshots"},{"letter":"B","text":"On-site backups"},{"letter":"C","text":"Journaling"},{"letter":"D","text":"Hot site"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":449,"question":"Which of the following is a possible consequence of a VM escape?","keyword":"Escape from a guest VM to the host/hypervisor ➡️ Compromise other VMs","correct_raw":"B. An attacker can access the hypervisor and compromise other VMs.","explanation":"VM escape oznacza wydostanie się z izolowanego systemu gościa do warstwy hosta lub hypervisora. Po uzyskaniu takiego dostępu atakujący może naruszyć izolację i zaatakować inne maszyny wirtualne działające na tym samym hoście. Odpowiedź A bardziej opisuje memory injection lub eskalację uprawnień, a D dotyczy kontroli aplikacji.","options":[{"letter":"A","text":"Malicious instructions can be inserted into memory and give the attacker elevated permissions."},{"letter":"B","text":"An attacker can access the hypervisor and compromise other VMs."},{"letter":"C","text":"Unencrypted data can be read by a user who is in a separate environment."},{"letter":"D","text":"Users can install software that is not on the manufacturer’s approved list."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":450,"question":"A security team at a large, global company needs to reduce the cost of storing data used for performing investigations. Which of the following types of data should have its retention length reduced?","keyword":"Highest-volume investigation data with the greatest storage cost ➡️ Packet capture","correct_raw":"A. Packet capture","explanation":"Pełny packet capture zapisuje zawartość każdego przechwyconego pakietu i bardzo szybko generuje ogromne ilości danych, szczególnie w globalnej sieci. Skrócenie jego retencji przyniesie największą oszczędność miejsca. Endpoint logs i OS security logs są często kluczowe dla długoterminowej korelacji i analizy zdarzeń, a raporty ze skanów podatności są zwykle znacznie mniejsze.","options":[{"letter":"A","text":"Packet capture"},{"letter":"B","text":"Endpoint logs"},{"letter":"C","text":"OS security logs"},{"letter":"D","text":"Vulnerability scan"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":451,"question":"Which of the following is a type of vulnerability that involves inserting scripts into web-based applications in order to take control of the client's web browser?","keyword":"Script injected into a web application and executed in the victim's browser ➡️ XSS","correct_raw":"B. Cross-site scripting","explanation":"Cross-site scripting polega na wstrzyknięciu JavaScriptu lub innego kodu skryptowego do aplikacji webowej. Kod jest następnie wykonywany w przeglądarce ofiary i może przejąć sesję, odczytać dostępne dane, zmienić zawartość strony albo wykonywać działania w imieniu użytkownika. SQL injection atakuje zapytania do bazy danych, zero-day oznacza nieznaną lub niezałataną podatność, a on-path polega na przechwytywaniu komunikacji.","options":[{"letter":"A","text":"SQL injection"},{"letter":"B","text":"Cross-site scripting"},{"letter":"C","text":"Zero-day exploit"},{"letter":"D","text":"On-path attack"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":452,"question":"While investigating a possible incident, a security analyst discovers web logs showing a request to query.php that contains an SQL statement similar to: \"INSERT INTO users VALUES('temp','pass123')\". Which of the following should the analyst do first?","keyword":"SQL injection attempts to create user temp/pass123 ➡️ Verify whether the account was created","correct_raw":"D. Check the users table for new accounts.","explanation":"Log pokazuje próbę SQL injection zawierającą polecenie INSERT INTO users. Analityk powinien najpierw ustalić, czy atak zakończył się sukcesem i czy w tabeli users pojawiło się nowe nieautoryzowane konto. To pozwala określić rzeczywisty wpływ incydentu. Wyłączenie podatnego skryptu i wdrożenie WAF są ważnymi działaniami containment i remediacji, ale najpierw trzeba potwierdzić skutek zaobserwowanego polecenia. Nie jest to brute force, ponieważ napastnik próbuje utworzyć konto, a nie odgadywać hasło.","options":[{"letter":"A","text":"Implement a WAF."},{"letter":"B","text":"Disable the query.php script."},{"letter":"C","text":"Block brute-force attempts on temporary users."},{"letter":"D","text":"Check the users table for new accounts."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":453,"question":"Due to a cyberattack, a company's IT systems were not operational for an extended period of time. The company wants to measure how quickly the systems must be restored in order to minimize business disruption. Which of the following would the company most likely use?","keyword":"Maximum acceptable time to restore service after an outage ➡️ RTO","correct_raw":"D. Recovery time objective","explanation":"Recovery Time Objective określa maksymalny akceptowalny czas, w którym system lub proces biznesowy powinien zostać przywrócony po awarii. RPO określa dopuszczalną utratę danych mierzoną w czasie, np. konieczność odtworzenia danych nie starszych niż 15 minut. Risk appetite i risk tolerance dotyczą akceptowanego poziomu ryzyka, a MTBF opisuje średni czas pomiędzy awariami.","options":[{"letter":"A","text":"Recovery point objective"},{"letter":"B","text":"Risk appetite"},{"letter":"C","text":"Risk tolerance"},{"letter":"D","text":"Recovery time objective"},{"letter":"E","text":"Mean time between failure"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":454,"question":"Which of the following actors attacking an organization is the most likely to be motivated by personal beliefs?","keyword":"Political, social or ideological beliefs motivate the attacker ➡️ Hacktivist","correct_raw":"C. Hacktivist","explanation":"Hacktivista atakuje organizacje w celu promowania przekonań politycznych, społecznych, religijnych lub ideologicznych. Nation-state realizuje przede wszystkim cele państwowe i strategiczne, organized crime jest zwykle motywowany zyskiem, a insider threat opisuje położenie sprawcy wewnątrz organizacji, nie jego konkretną motywację.","options":[{"letter":"A","text":"Nation-state"},{"letter":"B","text":"Organized crime"},{"letter":"C","text":"Hacktivist"},{"letter":"D","text":"Insider threat"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":455,"question":"Which of the following should a security team use to document persistent vulnerabilities with related recommendations?","keyword":"Ongoing unresolved vulnerabilities plus mitigation recommendations ➡️ Risk register","correct_raw":"B. Risk register","explanation":"Risk register jest żywym dokumentem służącym do śledzenia zidentyfikowanych i nadal istniejących ryzyk, w tym podatności. Może zawierać opis podatności, dotknięte aktywa, prawdopodobieństwo, wpływ, priorytet, właściciela ryzyka, zalecane działania i status remediacji. Audit report oraz penetration test mogą ujawnić podatności i zawierać zalecenia, ale są raportami z określonego badania. Risk register służy do ich długoterminowego śledzenia aż do usunięcia lub formalnej akceptacji.","options":[{"letter":"A","text":"Audit report"},{"letter":"B","text":"Risk register"},{"letter":"C","text":"Compliance report"},{"letter":"D","text":"Penetration test"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":456,"question":"An organization purchased a critical business application containing sensitive data. The organization would like to ensure that the application is not exploited by common data exfiltration attacks. Which of the following approaches would best help to fulfill this requirement?","keyword":"Protect a web application from common injection and exfiltration attacks ➡️ WAF","correct_raw":"B. WAF","explanation":"Web Application Firewall analizuje ruch HTTP/HTTPS kierowany do aplikacji i może blokować typowe ataki aplikacyjne, takie jak SQL injection, XSS, path traversal i inne żądania prowadzące do nieautoryzowanego dostępu lub eksfiltracji danych. Reverse proxy pośredniczy w ruchu, ale bez funkcji bezpieczeństwa nie zapewnia takiej ochrony. URL scanning ocenia adresy, a NAC kontroluje dostęp urządzeń do sieci.","options":[{"letter":"A","text":"URL scanning"},{"letter":"B","text":"WAF"},{"letter":"C","text":"Reverse proxy"},{"letter":"D","text":"NAC"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":457,"question":"A company wants to improve the availability of its application with a solution that requires minimal effort in the event a server needs to be replaced or added. Which of the following would be the best solution to meet these objectives?","keyword":"Easily add or replace application servers behind one service endpoint ➡️ Load balancing","correct_raw":"A. Load balancing","explanation":"Load balancer rozdziela ruch pomiędzy pulę serwerów i wykonuje health checks. Nowy serwer można dodać do puli, a niesprawny usunąć lub zastąpić bez zmieniania sposobu, w jaki użytkownicy łączą się z aplikacją. Zapewnia to wysoką dostępność przy niewielkim wysiłku operacyjnym. Fault tolerance jest ogólnym celem architektonicznym, replication kopiuje dane, ale nie rozdziela automatycznie żądań użytkowników, a proxy nie musi zapewniać redundancji.","options":[{"letter":"A","text":"Load balancing"},{"letter":"B","text":"Fault tolerance"},{"letter":"C","text":"Proxy servers"},{"letter":"D","text":"Replication"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":458,"question":"A company is performing a risk assessment on new software the company plans to use. Which of the following should the company assess during this process?","keyword":"Security risk assessment of a new application ➡️ Assess software vulnerabilities","correct_raw":"A. Software vulnerabilities","explanation":"Podczas oceny ryzyka nowego oprogramowania należy ustalić, jakie ma znane podatności, jak często jest aktualizowane, jakie uprawnienia wymaga, jakie dane przetwarza i jakie mogą być skutki jego kompromitacji. Cost-benefit analysis wspiera decyzję biznesową, ongoing monitoring jest późniejszym elementem utrzymania, a zgodność z infrastrukturą sieciową jest ważna wdrożeniowo, ale nie jest najważniejszym przedmiotem security risk assessment.","options":[{"letter":"A","text":"Software vulnerabilities"},{"letter":"B","text":"Cost-benefit analysis"},{"letter":"C","text":"Ongoing monitoring strategies"},{"letter":"D","text":"Network infrastructure compatibility"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":459,"question":"A malicious actor is trying to access sensitive financial information from a company's database by intercepting and reusing log-in credentials. Which of the following attacks is the malicious actor attempting?","keyword":"Intercept credentials while they travel between endpoints ➡️ On-path attack","correct_raw":"B. On-path","explanation":"Atak on-path polega na umieszczeniu się napastnika pomiędzy komunikującymi się stronami, przechwytywaniu ruchu i ewentualnym ponownym użyciu pozyskanych danych logowania lub tokenów. Opis zawiera słowo intercepting, które jest kluczową wskazówką. Brute force polega na masowym zgadywaniu jednego hasła, password spraying na próbowaniu jednego lub kilku popularnych haseł wobec wielu kont, a SQL injection manipuluje zapytaniami do bazy.","options":[{"letter":"A","text":"SQL injection"},{"letter":"B","text":"On-path"},{"letter":"C","text":"Brute-force"},{"letter":"D","text":"Password spraying"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":460,"question":"A new employee accessed an unauthorized website. An investigation found that the employee violated the company's rules. Which of the following did the employee violate?","keyword":"Rules for acceptable use of company internet and systems ➡️ AUP","correct_raw":"B. AUP","explanation":"Acceptable Use Policy określa dozwolone i zabronione sposoby korzystania z firmowych urządzeń, sieci i internetu. Wejście na stronę zakazaną przez organizację narusza AUP. NDA dotyczy poufności informacji, a MOU i MOA opisują porozumienia oraz współpracę pomiędzy stronami lub organizacjami.","options":[{"letter":"A","text":"MOU"},{"letter":"B","text":"AUP"},{"letter":"C","text":"NDA"},{"letter":"D","text":"MOA"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":461,"question":"A systems administrator is reviewing the VPN logs and notices that during non-working hours a user is accessing the company file server and information is being transferred to a suspicious IP address. Which of the following threats is most likely occurring?","keyword":"Company data is transferred to a suspicious external IP ➡️ Data exfiltration","correct_raw":"C. Data exfiltration","explanation":"Data exfiltration oznacza nieautoryzowane wynoszenie lub przesyłanie danych poza organizację. Dostęp do serwera plików poza godzinami pracy i transfer informacji do podejrzanego adresu IP są bezpośrednimi wskaźnikami eksfiltracji. Typosquatting wykorzystuje podobną nazwę domeny, blackmail oznacza szantaż, a odpowiedź B nie opisuje tej aktywności.","options":[{"letter":"A","text":"Typosquatting"},{"letter":"B","text":"Root or trust"},{"letter":"C","text":"Data exfiltration"},{"letter":"D","text":"Blackmail"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":462,"question":"HOTSPOT. A security architect is tasked with designing a highly resilient, business-critical application. The application SLA is 99.999%. Select the network, power, and server components for the appropriate locations to achieve application resiliency. A component should be selected for each location, and components may be selected more than once.","keyword":"99.999% SLA ➡️ Remove single points of failure across Internet, network, servers, and power","correct_raw":"Warstwa sieciowa, od Internetu do serwerów: dwa niezależne ISP; dwa routery pracujące active-active; firewalle active-active; wewnętrzny Layer 3 device; load balancers; Web Server A i Web Server B. Zasilanie: każdy serwer ma Power supply A i Power supply B; zasilacze są rozdzielone pomiędzy UPS A i UPS B; dodatkowym źródłem awaryjnym jest Generator.","explanation":"Najbardziej logiczne przypisanie do pól diagramu jest następujące. Górne centralne pole: Active-active firewalls. Lewa i prawa pozycja w kolejnym rzędzie: Active-active routers. Środkowa pozycja w tym rzędzie: Layer 3 device. Lewa i prawa pozycja bezpośrednio połączona z zewnętrznym Internetem: ISP oraz ISP. Środkowa pozycja nad serwerami: Load balancers. Pod Web Server A: Power supply A i Power supply B. Pod Web Server B: Power supply A i Power supply B. W dolnej części zasilania należy umieścić UPS A, UPS B i Generator tak, aby oba serwery otrzymywały zasilanie dwiema niezależnymi ścieżkami. Taki układ usuwa pojedyncze punkty awarii: utrata jednego operatora, routera, firewalla, load balancera, serwera, zasilacza lub UPS nie powinna wyłączyć aplikacji. Uwaga: układ pól i linii na dostarczonym PBQ jest niejednoznaczny, zwłaszcza w części zasilania. Nieoficjalne klucze dostępne w sieci przypisują niektóre elementy w sposób architektonicznie niespójny, dlatego powyższa odpowiedź opiera się na funkcjach komponentów i przebiegu połączeń na diagramie.","options":[{"letter":"","text":"Dostępne elementy: UPS A, Load balancers, Cloud Service Provider, SONET ring, Layer 3 device, Power supply B, Proxy, Active-passive firewalls, Layer 4 firewall, Active-active firewalls, Generator, Active-standby routers, SAN, ISP, Active-active routers, UPS B, Power supply A."}],"correctLetters":[],"isPBQ":true,"multiSelect":false},{"id":463,"question":"A company discovers suspicious transactions that were entered into the company's database and attached to a user account that was created as a trap for malicious activity. Which of the following is the user account an example of?","keyword":"Fake account or credential created as a decoy ➡️ Honeytoken","correct_raw":"A. Honeytoken","explanation":"Honeytoken jest fałszywym elementem danych, poświadczeniem, kluczem lub kontem utworzonym po to, aby wykryć nieautoryzowane użycie. Ponieważ konto nie powinno być używane w normalnej działalności, transakcje przypisane do niego wskazują na podejrzaną aktywność. Honeypot jest całym systemem-wabikiem, honeynet siecią takich systemów, a honeyfile fałszywym plikiem.","options":[{"letter":"A","text":"Honeytoken"},{"letter":"B","text":"Honeynet"},{"letter":"C","text":"Honeypot"},{"letter":"D","text":"Honeyfile"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":464,"question":"A network engineer is increasing the overall security of network devices and needs to harden the devices. Which of the following will best accomplish this task?","keyword":"Replace cleartext remote administration with encrypted administration ➡️ SSH","correct_raw":"C. Replacing Telnet with SSH","explanation":"Telnet przesyła dane administracyjne, w tym poświadczenia, bez odpowiedniego szyfrowania. SSH zapewnia szyfrowany kanał zdalnego zarządzania, dlatego zastąpienie Telnetu przez SSH bezpośrednio wzmacnia konfigurację urządzeń. Centralne logowanie poprawia monitoring, ale nie zabezpiecza sesji zarządzania. Lokalne konta administratorów utrudniają centralne zarządzanie tożsamością, a zwykły HTTP również nie zapewnia bezpiecznej administracji.","options":[{"letter":"A","text":"Configuring centralized logging"},{"letter":"B","text":"Generating local administrator accounts"},{"letter":"C","text":"Replacing Telnet with SSH"},{"letter":"D","text":"Enabling HTTP administration"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":465,"question":"A company's accounting department receives an urgent payment message from the company's bank domain with instructions to wire transfer funds. The sender requests that the transfer be completed as soon as possible. Which of the following attacks is described?","keyword":"Trusted-looking business email requests an urgent wire transfer ➡️ BEC","correct_raw":"A. Business email compromise","explanation":"Business Email Compromise wykorzystuje przejętą lub podrobioną wiadomość biznesową, aby nakłonić pracownika do pilnego przelewu środków. Kluczowe są: dział księgowości, wiarygodnie wyglądająca domena banku, instrukcja przelewu oraz presja czasu. Vishing odbywa się głosowo. Spear phishing i impersonation opisują elementy techniki, ale BEC jest dokładnym typem oszustwa finansowego przedstawionego w pytaniu.","options":[{"letter":"A","text":"Business email compromise"},{"letter":"B","text":"Vishing"},{"letter":"C","text":"Spear phishing"},{"letter":"D","text":"Impersonation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":466,"question":"A company filed a complaint with its IT service provider after the company discovered the service provider's external audit team had access to some of the company's confidential information. Which of the following is the most likely reason the company filed the complaint?","keyword":"External personnel accessed confidential information without confidentiality agreement ➡️ NDA","correct_raw":"D. A required NDA had not been signed.","explanation":"NDA, czyli Non-Disclosure Agreement, zobowiązuje stronę mającą dostęp do informacji do zachowania ich poufności i określa zasady użycia oraz ujawniania danych. Zewnętrzni audytorzy mający dostęp do poufnych informacji powinni być objęci takim zobowiązaniem. SOW opisuje zakres prac, WO konkretne zlecenie, a MOU ogólne zasady współpracy, ale nie zastępują wymaganego zobowiązania do poufności.","options":[{"letter":"A","text":"The MOU had basic clauses from a template."},{"letter":"B","text":"A SOW had not been agreed to by the client."},{"letter":"C","text":"A WO had not been mutually approved."},{"letter":"D","text":"A required NDA had not been signed."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":467,"question":"Which of the following aspects of the data management life cycle is most directly impacted by local and international regulations?","keyword":"Laws define how long particular records must or may be kept ➡️ Retention","correct_raw":"C. Retention","explanation":"Przepisy lokalne i międzynarodowe często określają minimalny lub maksymalny okres przechowywania konkretnych kategorii danych, np. dokumentów finansowych, danych medycznych lub danych osobowych. Dlatego retencja jest etapem najbardziej bezpośrednio kształtowanym przez regulacje. Po zakończeniu retencji dane mogą podlegać sanitizacji lub zniszczeniu, ale punktem wyjścia jest prawnie wymagany okres.","options":[{"letter":"A","text":"Destruction"},{"letter":"B","text":"Certification"},{"letter":"C","text":"Retention"},{"letter":"D","text":"Sanitization"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":468,"question":"An analyst is reviewing job postings to ensure sensitive company information is not being shared with the general public. Which of the following is the analyst most likely looking for?","keyword":"Job advertisements may reveal the exact technology stack and vulnerable versions ➡️ Software versions","correct_raw":"B. Software versions","explanation":"Ogłoszenia o pracę często zawierają wymagania dotyczące konkretnych produktów i wersji, np. systemu, bazy danych, hypervisora lub aplikacji. Zbyt szczegółowe informacje pomagają napastnikowi rozpoznać technologie organizacji i dobrać znane exploity. Adres biura i lista członków zarządu są często publiczne, a numery identyfikacyjne byłyby oczywiście poufne, lecz nie są typowym elementem ogłoszenia o pracę.","options":[{"letter":"A","text":"Office addresses"},{"letter":"B","text":"Software versions"},{"letter":"C","text":"List of board members"},{"letter":"D","text":"Government identification numbers"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":469,"question":"An engineer has ensured that the switches are using the latest OS, the servers have the latest patches, and the endpoints' definitions are up to date. Which of the following will these actions most effectively prevent?","keyword":"Current patches and signatures address already identified threats ➡️ Known exploits","correct_raw":"D. Known exploits","explanation":"Aktualizacje systemów, poprawki bezpieczeństwa i bieżące sygnatury zabezpieczają przede wszystkim przed znanymi podatnościami oraz rozpoznanym malware. Zero-day z definicji może nie mieć jeszcze poprawki ani sygnatury. Aktualizacje nie eliminują też zagrożeń wewnętrznych i nie zmieniają statusu produktu, który osiągnął koniec wsparcia.","options":[{"letter":"A","text":"Zero-day attacks"},{"letter":"B","text":"Insider threats"},{"letter":"C","text":"End-of-life support"},{"letter":"D","text":"Known exploits"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":470,"question":"Which of the following is most likely a security concern when installing and using low-cost IoT devices in infrastructure environments?","keyword":"Cheap IoT devices may inadequately protect locally stored or cloud-sent data ➡️ Storage of data","correct_raw":"D. Storage of data","explanation":"Urządzenia IoT mogą gromadzić dane operacyjne, obrazy, nagrania, telemetrię, poświadczenia i informacje o infrastrukturze. Tanie urządzenia często mają ograniczone mechanizmy szyfrowania, aktualizacji, kontroli dostępu lub przejrzystości dotyczącej miejsca przechowywania danych, co zwiększa ryzyko ich ujawnienia. Country of origin może być istotnym ryzykiem łańcucha dostaw, dlatego odpowiedź A jest kusząca, ale najbardziej bezpośrednim problemem bezpieczeństwa wynikającym z codziennego używania urządzenia jest ochrona przechowywanych i wysyłanych danych. Device responsiveness dotyczy głównie wydajności lub dostępności, a ease of deployment jest zaletą, nie zagrożeniem.","options":[{"letter":"A","text":"Country of origin"},{"letter":"B","text":"Device responsiveness"},{"letter":"C","text":"Ease of deployment"},{"letter":"D","text":"Storage of data"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":471,"question":"A company captures log-in details and reviews them each week to identify conditions such as excessive log-in attempts and frequent lockouts. Which of the following should a security analyst recommend to improve security compliance monitoring?","keyword":"Weekly review is too slow; anomalies should generate immediate notifications ➡️ Automated alerting","correct_raw":"B. Adding automated alerting when anomalies occur","explanation":"Automatyczne alerty umożliwiają wykrywanie nadmiernych prób logowania i częstych blokad kont w chwili ich wystąpienia, zamiast dopiero podczas cotygodniowego przeglądu. Skraca to czas reakcji i poprawia ciągłe monitorowanie zgodności. Data i nazwisko osoby przeglądającej raport zwiększają rozliczalność, ale nie poprawiają szybkości wykrywania. Oświadczenie o braku wyjątków jest formalnością, a maskowanie nazw użytkowników może utrudnić dochodzenie.","options":[{"letter":"A","text":"Including the date and person who reviewed the information in a report"},{"letter":"B","text":"Adding automated alerting when anomalies occur"},{"letter":"C","text":"Requiring a statement each week that no exceptions were noted"},{"letter":"D","text":"Masking the username in a report to protect privacy"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":472,"question":"A security team is in the process of hardening the network against externally crafted malicious packets. Which of the following is the most secure method to protect the internal network?","keyword":"Inspect and actively block malicious network packets before they reach internal systems ➡️ IPS","correct_raw":"C. Intrusion prevention systems","explanation":"IPS działa inline w torze ruchu, analizuje pakiety i może automatycznie odrzucać ruch odpowiadający sygnaturom, anomaliom lub znanym technikom ataku. Jest więc bezpośrednio przeznaczony do ochrony przed zewnętrznie przygotowanymi złośliwymi pakietami. Host-based firewall chroni pojedynczy host, NAC kontroluje dopuszczanie urządzeń do sieci, a anti-malware skupia się na złośliwym oprogramowaniu. Allow list ogranicza dozwolone połączenia, ale złośliwy ładunek może nadal zostać przesłany przez dozwolony protokół lub port.","options":[{"letter":"A","text":"Anti-malware solutions"},{"letter":"B","text":"Host-based firewalls"},{"letter":"C","text":"Intrusion prevention systems"},{"letter":"D","text":"Network access control"},{"letter":"E","text":"Network allow list"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":473,"question":"Which of the following is the best way to prevent an unauthorized user from plugging a laptop into an employee's phone network port and then using tools to scan for database servers?","keyword":"Block an unapproved endpoint connected to an Ethernet pass-through port ➡️ MAC filtering","correct_raw":"A. MAC filtering","explanation":"Filtrowanie adresów MAC pozwala ograniczyć dostęp przez port do znanych urządzeń, np. firmowego telefonu i zatwierdzonej stacji roboczej. Nieautoryzowany laptop może zostać zablokowany przed uzyskaniem dostępu do sieci. Segmentacja ograniczyłaby zasięg skanowania po połączeniu, ale nie zapobiega samemu podłączeniu obcego urządzenia. W praktyce silniejszym rozwiązaniem byłoby NAC z 802.1X, lecz takiej odpowiedzi nie podano.","options":[{"letter":"A","text":"MAC filtering"},{"letter":"B","text":"Segmentation"},{"letter":"C","text":"Certification"},{"letter":"D","text":"Isolation"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":474,"question":"Which of the following should a systems administrator use to decrease the company's hardware attack surface?","keyword":"Consolidate many workloads onto fewer physical devices ➡️ Virtualization","correct_raw":"D. Virtualization","explanation":"Wirtualizacja pozwala uruchamiać wiele systemów na mniejszej liczbie fizycznych serwerów. Zmniejsza to liczbę urządzeń, interfejsów sprzętowych i fizycznych punktów wymagających ochrony. Replication zwiększa liczbę kopii i komponentów, isolation oddziela zasoby, a centralization jest pojęciem ogólniejszym i nie musi oznaczać redukcji fizycznego sprzętu.","options":[{"letter":"A","text":"Replication"},{"letter":"B","text":"Isolation"},{"letter":"C","text":"Centralization"},{"letter":"D","text":"Virtualization"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":475,"question":"A company wants to add an MFA solution for all employees who access the corporate network remotely. Log-in requirements include something you know, are, and have. The company wants a solution that does not require purchasing third-party applications or specialized hardware. Which of the following MFA solutions would best meet the company's requirements?","keyword":"Existing password + mobile OTP + facial recognition ➡️ D (the question implicitly treats the password as something you know)","correct_raw":"D. Mobile application-generated, one-time passcode with facial recognition","explanation":"Odpowiedź D jest najbardziej prawdopodobnym kluczem egzaminacyjnym. Istniejące hasło do zdalnego logowania stanowi coś, co użytkownik wie. Telefon z aplikacją generującą jednorazowy kod stanowi coś, co użytkownik ma, a rozpoznawanie twarzy stanowi coś, czym użytkownik jest. Nie wymaga to specjalistycznego tokenu sprzętowego; aplikacja może być bezpłatna, wbudowana lub zapewniona przez organizację. Odpowiedź C jest kusząca, lecz voice verification i fingerprint verification są dwoma mechanizmami tej samej kategorii: something you are, natomiast kod SMS stanowi something you have. W samej odpowiedzi C nie ma czynnika something you know. Pytanie pozostaje nieprecyzyjne, ponieważ również odpowiedź D nie wymienia hasła wprost i trzeba założyć, że istniejące logowanie hasłem pozostaje pierwszym czynnikiem.","options":[{"letter":"A","text":"Smart card with PIN and password"},{"letter":"B","text":"Security questions and a one-time passcode sent via email"},{"letter":"C","text":"Voice and fingerprint verification with an SMS one-time passcode"},{"letter":"D","text":"Mobile application-generated, one-time passcode with facial recognition"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":476,"question":"A company is using a legacy FTP server to transfer financial data to a third party. The legacy system does not support SFTP, so a compensating control is needed to protect the sensitive, financial data in transit. Which of the following would be the most appropriate for the company to use?","keyword":"Wrap insecure FTP traffic inside an encrypted tunnel ➡️ SSH tunneling","correct_raw":"B. SSH tunneling","explanation":"SSH tunneling może przenosić ruch starszego protokołu przez zaszyfrowany kanał, zapewniając poufność danych w tranzycie bez modyfikowania samego serwera FTP. Telnet również jest nieszyfrowany. Patch nie doda automatycznie obsługi SFTP, a FDE chroni dane zapisane na dysku, nie transmisję sieciową.","options":[{"letter":"A","text":"Telnet connection"},{"letter":"B","text":"SSH tunneling"},{"letter":"C","text":"Patch installation"},{"letter":"D","text":"Full disk encryption"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":477,"question":"A security manager wants to reduce the number of steps required to identify and contain basic threats. Which of the following will help achieve this goal?","keyword":"Automate investigation and containment playbooks ➡️ SOAR","correct_raw":"A. SOAR","explanation":"SOAR łączy automatyzację, orkiestrację i playbooki reagowania. Może automatycznie wzbogacić alert, sprawdzić reputację adresu, utworzyć zgłoszenie, zablokować IOC albo odizolować endpoint, ograniczając liczbę ręcznych kroków analityka. SIEM zbiera i koreluje zdarzenia, ale samo nie zapewnia tak szerokiej automatyzacji reakcji. NIDS wykrywa ruch, a DMARC chroni domenę pocztową.","options":[{"letter":"A","text":"SOAR"},{"letter":"B","text":"SIEM"},{"letter":"C","text":"DMARC"},{"letter":"D","text":"NIDS"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":478,"question":"The Chief Information Officer (CIO) asked a vendor to provide documentation detailing the specific objectives within the compliance framework that the vendor's services meet. The vendor provided a report and a signed letter stating that the services meet 17 of the 21 objectives. Which of the following did the vendor provide to the CIO?","keyword":"Signed statement asserting which compliance objectives are met ➡️ Attestation of compliance","correct_raw":"C. Attestation of compliance","explanation":"Attestation of compliance jest formalnym, podpisanym oświadczeniem potwierdzającym zakres zgodności z określonymi wymaganiami lub celami. Raport wraz z podpisanym listem wskazującym, że spełniono 17 z 21 celów, odpowiada właśnie atestacji. Penetration test dotyczy podatności technicznych. Self-assessment nie musi zawierać formalnego podpisanego potwierdzenia, a w pytaniu nie wskazano, że dokument przygotował niezależny audytor, więc nie jest to third-party audit report.","options":[{"letter":"A","text":"Penetration test results"},{"letter":"B","text":"Self-assessment findings"},{"letter":"C","text":"Attestation of compliance"},{"letter":"D","text":"Third-party audit report"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":479,"question":"Which of the following describes the most effective way to address OS vulnerabilities after they are identified?","keyword":"Vendor fixes an identified operating-system vulnerability ➡️ Patching","correct_raw":"D. Patching","explanation":"Po zidentyfikowaniu podatności systemu operacyjnego najbardziej bezpośrednim sposobem jej usunięcia jest zainstalowanie poprawki producenta. Endpoint protection może wykrywać część prób wykorzystania, a usunięcie zbędnego oprogramowania i wymuszanie konfiguracji ograniczają powierzchnię ataku, lecz nie naprawiają konkretnego błędu w kodzie systemu.","options":[{"letter":"A","text":"Endpoint protection"},{"letter":"B","text":"Removal of unnecessary software"},{"letter":"C","text":"Configuration enforcement"},{"letter":"D","text":"Patching"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":480,"question":"The management team reports that employees are missing features on company-provided tablets, which is causing productivity issues. The management team directs the IT team to resolve the issue within 48 hours. Which of the following would be the best solution for the IT team to leverage in this scenario?","keyword":"Rapidly push applications, settings, and features to managed tablets ➡️ MDM","correct_raw":"C. MDM","explanation":"Mobile Device Management pozwala centralnie wdrażać aplikacje, profile konfiguracji, aktualizacje i ustawienia na firmowych tabletach. Umożliwia więc szybkie przywrócenie brakujących funkcji na wielu urządzeniach bez ręcznej obsługi każdego z nich. EDR służy do wykrywania zagrożeń, FDE szyfruje dysk, a COPE jest modelem własności i użytkowania urządzeń, nie narzędziem do wdrożenia zmian w ciągu 48 godzin.","options":[{"letter":"A","text":"EDR"},{"letter":"B","text":"COPE"},{"letter":"C","text":"MDM"},{"letter":"D","text":"FDE"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":481,"question":"A company is implementing a policy to allow employees to use their personal equipment for work. However, the company wants to ensure that only company-approved applications can be installed. Which of the following addresses this concern?","keyword":"Personal devices, but only approved applications may be installed ➡️ MDM","correct_raw":"A. MDM","explanation":"Mobile Device Management umożliwia centralne egzekwowanie zasad na urządzeniach mobilnych, w tym wdrażanie zatwierdzonych aplikacji, blokowanie nieautoryzowanych instalacji, stosowanie allowlisty aplikacji i zarządzanie firmowym sklepem aplikacji. Containerization oddziela dane i aplikacje służbowe od prywatnych, ale samo nie musi uniemożliwiać instalowania innych aplikacji na całym urządzeniu. DLP chroni przepływ danych, a FIM monitoruje zmiany plików.","options":[{"letter":"A","text":"MDM"},{"letter":"B","text":"Containerization"},{"letter":"C","text":"DLP"},{"letter":"D","text":"FIM"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":482,"question":"An alert references attacks associated with a zero-day exploit. An analyst places a bastion host in the network to reduce the risk of the exploit. Which of the following types of controls is the analyst implementing?","keyword":"No direct patch exists, so an alternative control reduces the risk ➡️ Compensating","correct_raw":"A. Compensating","explanation":"Zero-day może nie mieć jeszcze dostępnej poprawki ani bezpośredniej kontroli usuwającej podatność. Bastion host ogranicza bezpośredni dostęp do chronionych systemów i stanowi alternatywne zabezpieczenie zmniejszające ryzyko. Jest więc kontrolą kompensującą. Może również pełnić funkcje techniczne i detektywistyczne, ale pytanie dotyczy celu jego wdrożenia jako zastępstwa za niedostępną poprawkę.","options":[{"letter":"A","text":"Compensating"},{"letter":"B","text":"Detective"},{"letter":"C","text":"Operational"},{"letter":"D","text":"Physical"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":483,"question":"A penetration test has demonstrated that domain administrator accounts were vulnerable to pass-the-hash attacks. Which of the following would have been the best strategy to prevent the threat actor from using domain administrator accounts?","keyword":"Protect high-value administrator credentials and eliminate standing privileged access ➡️ PAM","correct_raw":"B. Implement a privileged access management solution.","explanation":"PAM może przechowywać uprzywilejowane poświadczenia w sejfie, rotować hasła, zapewniać dostęp just-in-time, ograniczać czas użycia konta oraz rejestrować sesje administracyjne. Zmniejsza to możliwość przechwycenia i ponownego użycia hasha konta Domain Admin. Cotygodniowy audyt i wygasanie haseł nie zatrzymają atakującego, który już zdobył aktualny hash, a IDS głównie wykrywa i alarmuje zamiast zapobiegać użyciu poświadczeń.","options":[{"letter":"A","text":"Audit each domain administrator account weekly for password compliance."},{"letter":"B","text":"Implement a privileged access management solution."},{"letter":"C","text":"Create IDS policies to monitor domain controller access."},{"letter":"D","text":"Use Group Policy to enforce password expiration."}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":484,"question":"Which of the following is an example of memory injection?","keyword":"Malicious code is placed inside the memory of a running process ➡️ Memory injection","correct_raw":"C. Malicious code is copied to the allocated space of an already running process.","explanation":"Memory injection polega na umieszczeniu złośliwego kodu w przestrzeni pamięci działającego procesu i doprowadzeniu do jego wykonania. Odpowiedź A opisuje race condition, B przypomina buffer overflow, a D oznacza modyfikację pliku wykonywalnego na dysku, nie wstrzyknięcie kodu do działającego procesu.","options":[{"letter":"A","text":"Two processes access the same variable, allowing one to cause a privilege escalation."},{"letter":"B","text":"A process receives an unexpected amount of data, which causes malicious code to be executed."},{"letter":"C","text":"Malicious code is copied to the allocated space of an already running process."},{"letter":"D","text":"An executable is overwritten on the disk, and malicious code runs the next time it is executed."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":485,"question":"A security administrator is implementing encryption on all hard drives in an organization. Which of the following security concepts is the administrator applying?","keyword":"Encryption prevents unauthorized reading of stored data ➡️ Confidentiality","correct_raw":"D. Confidentiality","explanation":"Szyfrowanie dysków chroni dane przed odczytaniem przez osoby nieposiadające właściwego klucza lub poświadczeń, dlatego realizuje poufność. Integrity dotyczy wykrywania nieautoryzowanych zmian, authentication potwierdza tożsamość, a Zero Trust jest modelem architektury i kontroli dostępu.","options":[{"letter":"A","text":"Integrity"},{"letter":"B","text":"Authentication"},{"letter":"C","text":"Zero Trust"},{"letter":"D","text":"Confidentiality"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":486,"question":"An administrator has configured a quarantine subnet for all guest devices that connect to the network. Which of the following would be best for the security team to perform before allowing access to corporate resources?","keyword":"Verify that a quarantined device meets security requirements before granting access ➡️ Compliance attestation","correct_raw":"B. Compliance attestation","explanation":"Compliance attestation potwierdza, że urządzenie spełnia wymagania polityki, np. posiada aktualny system, włączone szyfrowanie, aktywne zabezpieczenia i wymagane ustawienia. Dopiero wtedy może zostać przeniesione z kwarantanny do sieci zapewniającej dostęp do zasobów firmowych. Device fingerprinting identyfikuje typ i właściwości urządzenia, ale samo nie potwierdza zgodności. Test penetracyjny i test podatności aplikacji nie są właściwymi kontrolami wstępnymi dla każdego urządzenia gościa.","options":[{"letter":"A","text":"Device fingerprinting"},{"letter":"B","text":"Compliance attestation"},{"letter":"C","text":"Penetration test"},{"letter":"D","text":"Application vulnerability test"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":487,"question":"A customer has a contract with a CSP and wants to identify which controls should be implemented in the IaaS enclave. Which of the following is most likely to contain this information?","keyword":"Determine whether the CSP or customer implements each IaaS control ➡️ Responsibility matrix","correct_raw":"B. Responsibility matrix","explanation":"Responsibility matrix, często związana z modelem współdzielonej odpowiedzialności, określa, które kontrole wdraża dostawca chmury, które klient, a które są współdzielone. Jest to szczególnie ważne w IaaS, gdzie dostawca zabezpiecza infrastrukturę fizyczną i warstwę wirtualizacji, a klient zwykle odpowiada za systemy operacyjne, konfigurację, aplikacje, dane i część kontroli sieciowych. SLA określa parametry świadczenia usługi, MSA ogólne warunki współpracy, a SOW zakres konkretnych prac.","options":[{"letter":"A","text":"Statement of work"},{"letter":"B","text":"Responsibility matrix"},{"letter":"C","text":"Service-level agreement"},{"letter":"D","text":"Master service agreement"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":488,"question":"A Chief Information Security Officer is developing procedures to guide detective and corrective activities associated with common threats, including phishing, social engineering, and business email compromise. Which of the following documents would be most relevant to revise as part of this process?","keyword":"Detection, containment, remediation, and recovery procedures for security incidents ➡️ IRP","correct_raw":"B. IRP","explanation":"Incident Response Plan opisuje sposób wykrywania, analizowania, ograniczania, usuwania skutków i odtwarzania po incydentach takich jak phishing, socjotechnika czy BEC. BCP dotyczy utrzymania procesów biznesowych podczas zakłóceń, SDLC cyklu tworzenia oprogramowania, a AUP zasad dopuszczalnego korzystania z zasobów przez użytkowników.","options":[{"letter":"A","text":"SDLC"},{"letter":"B","text":"IRP"},{"letter":"C","text":"BCP"},{"letter":"D","text":"AUP"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":489,"question":"Which of the following testing techniques uses both defensive and offensive testing methodologies with developers to securely build key applications and software?","keyword":"Developers using offensive and defensive security practices during software creation ➡️ Yellow team","correct_raw":"B. Yellow","explanation":"W nomenklaturze egzaminacyjnej Yellow Team reprezentuje deweloperów i osoby budujące oprogramowanie. Współpracuje z zespołami ofensywnymi i defensywnymi oraz wykorzystuje ich metody, aby projektować, testować i poprawiać bezpieczeństwo aplikacji już podczas tworzenia. Blue Team skupia się na obronie, Red Team na atakowaniu i testowaniu zabezpieczeń, a Green Team bywa różnie definiowany poza materiałami egzaminacyjnymi. Ze względu na niejednolite użycie nazw kolorów w branży należy w tym pytaniu trzymać się klucza CompTIA: Yellow.","options":[{"letter":"A","text":"Blue"},{"letter":"B","text":"Yellow"},{"letter":"C","text":"Red"},{"letter":"D","text":"Green"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":490,"question":"An administrator wants to automate an account permissions update for a large number of accounts. Which of the following would best accomplish this task?","keyword":"Update permissions for many existing accounts at once ➡️ Security groups","correct_raw":"A. Security groups","explanation":"Security groups pozwalają przypisać uprawnienia grupie zamiast każdemu użytkownikowi osobno. Administrator aktualizuje uprawnienia grupy lub jej członkostwo, a zmiana obejmuje wszystkie należące do niej konta. To najlepiej pasuje do masowej aktualizacji uprawnień istniejących kont. User provisioning automatyzuje szerszy cykl życia tożsamości, np. tworzenie, modyfikowanie i usuwanie kont oraz ról w aplikacjach, ale pytanie dotyczy konkretnie aktualizacji permissions dla dużej liczby kont. Federation zapewnia zaufanie pomiędzy systemami tożsamości, a vertical scaling zwiększa zasoby pojedynczego systemu.","options":[{"letter":"A","text":"Security groups"},{"letter":"B","text":"Federation"},{"letter":"C","text":"User provisioning"},{"letter":"D","text":"Vertical scaling"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":491,"question":"Which of the following is the fastest and most cost-effective way to confirm a third-party supplier's compliance with security obligations?","keyword":"Fast, inexpensive confirmation based on a formal compliance statement ➡️ Attestation report","correct_raw":"A. Attestation report","explanation":"Attestation report jest formalnym potwierdzeniem, że dostawca spełnia określone wymagania lub że jego kontrole zostały ocenione. Przegląd istniejącego raportu jest zwykle szybszy i tańszy niż zlecanie własnego audytu, testu penetracyjnego albo oceny podatności. Third-party audit daje większą niezależność i szczegółowość, ale jest bardziej czasochłonny i kosztowny. Vulnerability assessment oraz penetration testing sprawdzają stan techniczny, lecz nie potwierdzają pełnej zgodności ze wszystkimi zobowiązaniami bezpieczeństwa.","options":[{"letter":"A","text":"Attestation report"},{"letter":"B","text":"Third-party audit"},{"letter":"C","text":"Vulnerability assessment"},{"letter":"D","text":"Penetration testing"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":492,"question":"Various company stakeholders meet to discuss roles and responsibilities in the event of a security breach that would affect offshore offices. Which of the following is this an example of?","keyword":"Stakeholders discuss a hypothetical incident, roles, and deci
