 połączenie jest już rozpoznawane i celowo blokowane na podstawie kategorii URL.","options":[{"letter":"A","text":"Creating a firewall rule to allow HTTPS traffic"},{"letter":"B","text":"Configuring the IPS to allow shopping"},{"letter":"C","text":"Tuning the DLP rule that detects credit card data"},{"letter":"D","text":"Updating the categorization in the content filter"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":170,"question":"Which of the following most impacts an administrator's ability to address CVEs discovered on a server?","keyword":"Ability to address discovered CVEs ➡️ Patch availability","correct_raw":"B. Patch availability","explanation":"Możliwość usunięcia podatności CVE zależy przede wszystkim od tego, czy producent udostępnił odpowiednią łatę lub aktualizację. Wymagania dotyczące ponownego skanowania, wpływ na organizację i tolerancja ryzyka mogą zmieniać priorytet oraz termin wdrożenia, ale nie zastąpią brakującej poprawki bezpieczeństwa.","options":[{"letter":"A","text":"Rescanning requirements"},{"letter":"B","text":"Patch availability"},{"letter":"C","text":"Organizational impact"},{"letter":"D","text":"Risk tolerance"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":171,"question":"Which of the following describes effective change management procedures?","keyword":"Effective change management / Patch failure ➡️ Backout plan","correct_raw":"B. Having a backout plan when a patch fails","explanation":"Skuteczne zarządzanie zmianą wymaga przygotowania planu wycofania (backout plan), który pozwala bezpiecznie cofnąć nieudaną aktualizację i przywrócić system do wcześniejszego, sprawnego stanu. Zmiana powinna być zatwierdzona przed wdrożeniem, a aktualizacje bezpieczeństwa nie powinny automatycznie omijać procesu kontroli zmian.","options":[{"letter":"A","text":"Approving the change after a successful deployment"},{"letter":"B","text":"Having a backout plan when a patch fails"},{"letter":"C","text":"Using a spreadsheet for tracking changes"},{"letter":"D","text":"Using an automatic change control bypass for security updates"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":172,"question":"The CIRT is reviewing an incident that involved a human resources recruiter exfiltrating sensitive company data. The CIRT found that the recruiter was able to use HTTP over port 53 to upload documents to a web server. Which of the following security infrastructure devices could have identified and blocked this activity?","keyword":"HTTP over port 53 / Identify application regardless of port ➡️ NGFW application inspection","correct_raw":"B. NGFW utilizing application inspection","explanation":"Zapora nowej generacji (NGFW) z inspekcją aplikacji rozpoznaje rzeczywisty protokół na podstawie zawartości i zachowania ruchu, a nie wyłącznie numeru portu. Może więc wykryć, że przez port 53, zwykle przeznaczony dla DNS, przesyłany jest ruch HTTP, a następnie go zablokować. WAF chroni głównie aplikacje webowe przed atakami przychodzącymi, a nie przed takim kanałem eksfiltracji.","options":[{"letter":"A","text":"WAF utilizing SSL decryption"},{"letter":"B","text":"NGFW utilizing application inspection"},{"letter":"C","text":"UTM utilizing a threat feed"},{"letter":"D","text":"SD-WAN utilizing IPSec"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":173,"question":"An enterprise is working with a third party and needs to allow access between the internal networks of both parties for a secure file migration. The solution needs to ensure encryption is applied to all traffic that is traversing the networks. Which of the following solutions should most likely be implemented?","keyword":"Encrypt all traffic between two internal networks ➡️ IPSec","correct_raw":"B. IPSec","explanation":"IPSec może utworzyć szyfrowany tunel site-to-site między sieciami obu organizacji i chronić cały ruch IP przesyłany przez niezaufaną sieć. TLS zabezpiecza konkretne połączenia aplikacyjne, natomiast IPSec zapewnia szyfrowanie na poziomie sieci dla całej komunikacji przechodzącej przez tunel.","options":[{"letter":"A","text":"EAP"},{"letter":"B","text":"IPSec"},{"letter":"C","text":"SD-WAN"},{"letter":"D","text":"TLS"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":174,"question":"An administrator has identified and fingerprinted specific files that will generate an alert if an attempt is made to email these files outside of the organization. Which of the following best describes the tool the administrator is using?","keyword":"Fingerprint specific files / Alert on external email ➡️ DLP","correct_raw":"A. DLP","explanation":"Data Loss Prevention (DLP) może tworzyć cyfrowe odciski chronionych dokumentów i porównywać je z treścią wiadomości oraz załączników. Próba wysłania pasującego pliku poza organizację może zostać wykryta, zablokowana lub zgłoszona zgodnie z polityką ochrony danych.","options":[{"letter":"A","text":"DLP"},{"letter":"B","text":"SNMP traps"},{"letter":"C","text":"SCAP"},{"letter":"D","text":"IPS"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":175,"question":"A software developer released a new application and is distributing application files via the developer's website. Which of the following should the developer post on the website to allow users to verify the integrity of the downloaded files?","keyword":"Verify integrity of downloaded files ➡️ Hashes","correct_raw":"A. Hashes","explanation":"Deweloper powinien opublikować kryptograficzne skróty plików, na przykład SHA-256. Użytkownik oblicza hash pobranego pliku i porównuje go z wartością podaną na stronie. Zgodność potwierdza, że plik nie został zmodyfikowany podczas pobierania ani po jego opublikowaniu.","options":[{"letter":"A","text":"Hashes"},{"letter":"B","text":"Certificates"},{"letter":"C","text":"Algorithms"},{"letter":"D","text":"Salting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":176,"question":"An organization wants to limit potential impact to its log-in database in the event of a breach. Which of the following options is the security team most likely to recommend?","keyword":"Protect credentials in a breached log-in database ➡️ Hashing","correct_raw":"B. Hashing","explanation":"Hasła w bazie logowania powinny być przechowywane jako jednokierunkowe skróty kryptograficzne, najlepiej z unikalną solą i funkcją odporną na szybkie zgadywanie. W razie wycieku napastnik nie otrzymuje bezpośrednio haseł w postaci jawnej. Segmentacja ogranicza dostęp do systemu, ale nie zabezpiecza samych haseł po przejęciu bazy.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Obfuscation"},{"letter":"D","text":"Segmentation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":177,"question":"An administrator finds that all user workstations and servers are displaying a message that is associated with files containing an extension of .ryk. Which of the following types of infections is present on the systems?","keyword":"Message displayed / Files changed to a new extension ➡️ Ransomware","correct_raw":"D. Ransomware","explanation":"Ransomware zwykle szyfruje pliki, zmienia ich rozszerzenia i wyświetla komunikat z żądaniem okupu lub instrukcjami odzyskania danych. Jednoczesne wystąpienie takiego komunikatu i nowego rozszerzenia .ryk na wielu stacjach oraz serwerach jest charakterystyczne dla infekcji ransomware.","options":[{"letter":"A","text":"Virus"},{"letter":"B","text":"Trojan"},{"letter":"C","text":"Spyware"},{"letter":"D","text":"Ransomware"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":178,"question":"A systems administrator is advised that an external web server is not functioning properly. The administrator reviews firewall logs containing traffic going to the web server. The logs show many SYN packets sent at the same time from multiple source IP addresses to destination 100.50.20.7 on TCP port 443. Which of the following attacks is likely occurring?","keyword":"Many simultaneous SYN packets / Multiple source IPs / One web server ➡️ DDoS","correct_raw":"A. DDoS","explanation":"Logi pokazują wiele pakietów SYN kierowanych jednocześnie z różnych adresów źródłowych do jednego serwera HTTPS. Jest to charakterystyczne dla rozproszonego ataku odmowy usługi, najprawdopodobniej SYN flood, którego celem jest wyczerpanie zasobów obsługujących połączenia i uniemożliwienie dostępu prawidłowym użytkownikom.","options":[{"letter":"A","text":"DDoS"},{"letter":"B","text":"Directory traversal"},{"letter":"C","text":"Brute-force"},{"letter":"D","text":"HTTPS downgrade"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":179,"question":"An organization would like to calculate the time needed to resolve a hardware issue with a server. Which of the following risk management processes describes this example?","keyword":"Time needed to resolve a hardware issue ➡️ Mean time to repair","correct_raw":"D. Mean time to repair","explanation":"Mean Time to Repair (MTTR) określa średni czas potrzebny na zdiagnozowanie usterki, naprawę sprzętu i przywrócenie go do działania. MTBF opisuje średni czas pomiędzy awariami, RTO dopuszczalny czas niedostępności usługi, a RPO akceptowalny zakres utraty danych wyrażony w czasie.","options":[{"letter":"A","text":"Recovery point objective"},{"letter":"B","text":"Mean time between failures"},{"letter":"C","text":"Recovery time objective"},{"letter":"D","text":"Mean time to repair"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":180,"question":"A security engineer is installing an IPS to block signature-based attacks in the environment. Which of the following modes will best accomplish this task?","keyword":"IPS must block signature-based attacks ➡️ Active mode","correct_raw":"D. Active","explanation":"IPS musi pracować w trybie aktywnym i znajdować się inline na ścieżce ruchu, aby automatycznie odrzucać pakiety lub zrywać połączenia pasujące do znanych sygnatur ataków. Tryb monitorujący lub audytowy jedynie rejestruje i alarmuje, ale nie blokuje ruchu.","options":[{"letter":"A","text":"Monitor"},{"letter":"B","text":"Sensor"},{"letter":"C","text":"Audit"},{"letter":"D","text":"Active"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":181,"question":"An IT manager is increasing the security capabilities of an organization after a data classification initiative determined that sensitive data could be exfiltrated from the environment. Which of the following solutions would mitigate the risk?","keyword":"Sensitive data could be exfiltrated ➡️ DLP","correct_raw":"C. DLP","explanation":"Data Loss Prevention (DLP) identyfikuje dane wrażliwe na podstawie klasyfikacji i monitoruje ich przesyłanie poza organizację. Może ostrzegać o próbach eksfiltracji albo je blokować, na przykład w poczcie elektronicznej, usługach chmurowych i na nośnikach wymiennych. SPF i DMARC chronią domenę pocztową przed podszywaniem się, natomiast XDR służy głównie do korelacji oraz reagowania na zagrożenia.","options":[{"letter":"A","text":"XDR"},{"letter":"B","text":"SPF"},{"letter":"C","text":"DLP"},{"letter":"D","text":"DMARC"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":182,"question":"Which of the following is used to protect a computer from viruses, malware, and Trojans being installed and moving laterally across the network?","keyword":"Protect endpoints from malware and lateral movement ➡️ EDR","correct_raw":"C. EDR","explanation":"Endpoint Detection and Response (EDR) działa bezpośrednio na stacjach roboczych i serwerach. Monitoruje procesy, pliki oraz zachowanie systemu, wykrywa malware i może izolować zainfekowany host, ograniczając dalsze rozprzestrzenianie się zagrożenia w sieci. IDS wykrywa podejrzany ruch, ale zazwyczaj go nie blokuje, a NAC kontroluje dopuszczenie urządzeń do sieci.","options":[{"letter":"A","text":"IDS"},{"letter":"B","text":"ACL"},{"letter":"C","text":"EDR"},{"letter":"D","text":"NAC"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":183,"question":"Client files can only be accessed by employees who need to know the information and have specified roles in the company. Which of the following best describes this security concept?","keyword":"Need-to-know access to client files ➡️ Confidentiality","correct_raw":"B. Confidentiality","explanation":"Poufność (Confidentiality) oznacza, że informacje są dostępne wyłącznie dla uprawnionych osób. Ograniczenie dostępu do plików klientów zgodnie z zasadą need-to-know i rolą pracownika zapobiega nieautoryzowanemu ujawnieniu danych.","options":[{"letter":"A","text":"Availability"},{"letter":"B","text":"Confidentiality"},{"letter":"C","text":"Integrity"},{"letter":"D","text":"Non-repudiation"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":184,"question":"Which of the following describes the category of data that is most impacted when it is lost?","keyword":"Data whose loss has the greatest impact ➡️ Critical","correct_raw":"D. Critical","explanation":"Dane krytyczne (Critical data) są niezbędne do funkcjonowania organizacji, dlatego ich utrata powoduje największy wpływ operacyjny lub biznesowy. Dane poufne i prywatne są klasyfikowane głównie ze względu na skutki nieautoryzowanego ujawnienia, natomiast pytanie dotyczy skutków ich utraty.","options":[{"letter":"A","text":"Confidential"},{"letter":"B","text":"Public"},{"letter":"C","text":"Private"},{"letter":"D","text":"Critical"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":185,"question":"A new employee logs in to the email system for the first time and notices a message from human resources about onboarding. The employee hovers over a few of the links within the email and discovers that the links do not correspond to links associated with the company. Which of the following attack vectors is most likely being used?","keyword":"Fake HR onboarding email / Misleading links ➡️ Social engineering","correct_raw":"B. Social engineering","explanation":"Wiadomość wykorzystuje zaufanie nowego pracownika do działu HR i próbuje nakłonić go do kliknięcia fałszywych odsyłaczy. Jest to atak socjotechniczny, najprawdopodobniej phishing. Sam fakt użycia firmowej poczty nie potwierdza przejęcia konta ani ataku Business Email Compromise.","options":[{"letter":"A","text":"Business email"},{"letter":"B","text":"Social engineering"},{"letter":"C","text":"Unsecured network"},{"letter":"D","text":"Default credentials"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":186,"question":"Which of the following describes the understanding between a company and a client about what will be provided and the accepted time needed to provide the company with the resources?","keyword":"What will be provided / Accepted delivery or response time ➡️ SLA","correct_raw":"A. SLA","explanation":"Service Level Agreement (SLA) określa uzgodniony poziom świadczenia usługi, w tym zakres dostarczanych zasobów, terminy realizacji, dostępność oraz czasy reakcji. MOU i MOA opisują ogólne zasady współpracy, ale zwykle nie definiują mierzalnych parametrów poziomu usługi.","options":[{"letter":"A","text":"SLA"},{"letter":"B","text":"MOU"},{"letter":"C","text":"MOA"},{"letter":"D","text":"BPA"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":187,"question":"A company that is located in an area prone to hurricanes is developing a disaster recovery plan and looking at site considerations that allow the company to immediately continue operations. Which of the following is the best type of site for this company?","keyword":"Immediately continue operations after a disaster ➡️ Hot site","correct_raw":"D. Hot","explanation":"Hot site jest w pełni wyposażonym i działającym centrum zapasowym z aktualnymi systemami, łącznością oraz replikowanymi danymi. Umożliwia niemal natychmiastowe przejęcie operacji po utracie lokalizacji podstawowej. Warm site wymaga dodatkowego przygotowania, a cold site zapewnia głównie miejsce i podstawową infrastrukturę.","options":[{"letter":"A","text":"Cold"},{"letter":"B","text":"Tertiary"},{"letter":"C","text":"Warm"},{"letter":"D","text":"Hot"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":188,"question":"Which of the following security controls is most likely being used when a critical legacy server is segmented into a private network?","keyword":"Legacy server protected through segmentation ➡️ Compensating control","correct_raw":"C. Compensating","explanation":"Serwera legacy często nie można odpowiednio zaktualizować ani wyposażyć w wymagane zabezpieczenia. Umieszczenie go w odseparowanej, prywatnej sieci ogranicza dostęp i zastępuje brakujące mechanizmy ochronne, dlatego jest kontrolą kompensującą.","options":[{"letter":"A","text":"Deterrent"},{"letter":"B","text":"Corrective"},{"letter":"C","text":"Compensating"},{"letter":"D","text":"Preventive"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":189,"question":"Which of the following best describes the practice of researching laws and regulations related to information security operations within a specific industry?","keyword":"Researching applicable laws and regulations ➡️ Due diligence","correct_raw":"C. Due diligence","explanation":"Due diligence oznacza przeprowadzenie należytego i udokumentowanego rozpoznania wymagań, ryzyk oraz obowiązków przed podjęciem działań. W tym przypadku obejmuje ustalenie, jakie przepisy i regulacje bezpieczeństwa dotyczą konkretnej branży. Compliance reporting polega na raportowaniu stanu zgodności, a attestation na formalnym poświadczeniu spełnienia wymagań.","options":[{"letter":"A","text":"Compliance reporting"},{"letter":"B","text":"GDPR"},{"letter":"C","text":"Due diligence"},{"letter":"D","text":"Attestation"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":190,"question":"Which of the following considerations is the most important for an organization to evaluate as it establishes and maintains a data privacy program?","keyword":"Establishing a privacy program / Determine legal responsibilities ➡️ Controller or processor role","correct_raw":"C. Role as controller or processor","explanation":"Najpierw organizacja musi ustalić, czy działa jako administrator danych (controller), który określa cele i sposoby przetwarzania, czy jako podmiot przetwarzający (processor), który działa na polecenie administratora. Ta rola wyznacza podstawowe obowiązki prawne, zakres odpowiedzialności i wymagane procesy całego programu prywatności. Pozostałe elementy są ważne, ale wynikają z wcześniej ustalonej roli organizacji.","options":[{"letter":"A","text":"Reporting structure for the data privacy officer"},{"letter":"B","text":"Request process for data subject access"},{"letter":"C","text":"Role as controller or processor"},{"letter":"D","text":"Physical location of the company"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":191,"question":"A security analyst is investigating a workstation that is suspected of outbound communication to a command-and-control server. During the investigation, the analyst discovered that logs on the endpoint were deleted. Which of the following logs would the analyst most likely look at next?","keyword":"Endpoint logs deleted / Outbound communication to a C2 server ➡️ Firewall logs","correct_raw":"B. Firewall","explanation":"Logi zapory sieciowej rejestrują połączenia wychodzące pomiędzy hostem wewnętrznym a zewnętrznym serwerem command-and-control. Ponieważ lokalne logi punktu końcowego zostały usunięte, firewall stanowi niezależne źródło danych, które może wskazać adres źródłowy, adres docelowy, porty i czas komunikacji. Logi Windows security znajdowałyby się na analizowanym urządzeniu, więc mogły zostać usunięte razem z pozostałymi logami endpointu.","options":[{"letter":"A","text":"IPS"},{"letter":"B","text":"Firewall"},{"letter":"C","text":"ACL"},{"letter":"D","text":"Windows security"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":192,"question":"An IT manager is putting together a documented plan describing how the organization will keep operating in the event of a global incident. Which of the following plans is the IT manager creating?","keyword":"Keep the organization operating during a global incident ➡️ Business continuity plan","correct_raw":"A. Business continuity","explanation":"Business Continuity Plan (BCP) opisuje sposób utrzymania kluczowych procesów biznesowych podczas poważnego zakłócenia. Obejmuje ludzi, procedury, lokalizacje, komunikację i usługi niezbędne do dalszego działania organizacji. Disaster Recovery Plan koncentruje się wężej na odtworzeniu systemów informatycznych i danych po awarii.","options":[{"letter":"A","text":"Business continuity"},{"letter":"B","text":"Physical security"},{"letter":"C","text":"Change management"},{"letter":"D","text":"Disaster recovery"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":193,"question":"A business needs a recovery site but does not require immediate failover. The business also wants to reduce the workload required to recover from an outage. Which of the following recovery sites is the best option?","keyword":"No immediate failover / Less recovery work than a cold site ➡️ Warm site","correct_raw":"C. Warm","explanation":"Warm site jest częściowo wyposażoną lokalizacją zapasową z przygotowaną infrastrukturą, łącznością i częścią wymaganych systemów. Nie zapewnia natychmiastowego przełączenia jak hot site, ale wymaga znacznie mniej pracy przy odtwarzaniu niż cold site, w którym sprzęt i dane trzeba dopiero przygotować.","options":[{"letter":"A","text":"Hot"},{"letter":"B","text":"Cold"},{"letter":"C","text":"Warm"},{"letter":"D","text":"Geographically dispersed"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":194,"question":"A security team is setting up a new environment for hosting the organization's on-premises software application as a cloud-based service. Which of the following should the team ensure is in place in order for the organization to follow security best practices?","keyword":"Host an on-premises application as a cloud service ➡️ Virtualization and resource isolation","correct_raw":"A. Virtualization and isolation of resources","explanation":"Środowisko chmurowe powinno zapewniać logiczne oddzielenie zasobów, obciążeń i klientów korzystających ze wspólnej infrastruktury fizycznej. Wirtualizacja oraz izolacja zasobów ograniczają możliwość wpływania jednej instancji na inne i stanowią podstawę bezpiecznego modelu wielodostępnego. Szyfrowanie i silne uwierzytelnianie również są istotne, ale nie zastępują izolacji środowisk uruchomieniowych.","options":[{"letter":"A","text":"Virtualization and isolation of resources"},{"letter":"B","text":"Network segmentation"},{"letter":"C","text":"Data encryption"},{"letter":"D","text":"Strong authentication policies"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":195,"question":"A manager receives an email that contains a link to receive a refund. After hovering over the link, the manager notices that the domain's URL points to a suspicious link. Which of the following security practices helped the manager to identify the attack?","keyword":"User hovers over a link and recognizes a suspicious URL ➡️ End user training","correct_raw":"A. End user training","explanation":"Szkolenie użytkowników uczy między innymi sprawdzania rzeczywistego adresu odsyłacza przed kliknięciem oraz rozpoznawania domen podszywających się pod zaufane firmy. Menedżer samodzielnie zastosował tę praktykę, najeżdżając kursorem na link i zauważając podejrzany adres. URL scanning byłoby działaniem wykonywanym przez narzędzie techniczne, a nie przez użytkownika.","options":[{"letter":"A","text":"End user training"},{"letter":"B","text":"Policy review"},{"letter":"C","text":"URL scanning"},{"letter":"D","text":"Plain text email"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":196,"question":"A company wants to verify that the software the company is deploying came from the vendor the company purchased the software from. Which of the following is the best way for the company to confirm this information?","keyword":"Verify software came from the stated vendor ➡️ Validate the code signature","correct_raw":"A. Validate the code signature.","explanation":"Podpis cyfrowy kodu potwierdza tożsamość wydawcy oraz integralność oprogramowania od chwili jego podpisania. Firma powinna zweryfikować, czy podpis jest ważny, pochodzi od oczekiwanego dostawcy i opiera się na zaufanym certyfikacie. Samodzielnie wygenerowany hash potwierdzi jedynie aktualny skrót pliku, ale bez zaufanej wartości referencyjnej nie potwierdzi jego pochodzenia.","options":[{"letter":"A","text":"Validate the code signature."},{"letter":"B","text":"Execute the code in a sandbox."},{"letter":"C","text":"Search the executable for ASCII strings."},{"letter":"D","text":"Generate a hash of the files."}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":197,"question":"A systems administrator notices that one of the systems critical for processing customer transactions is running an end-of-life operating system. Which of the following techniques would increase enterprise security?","keyword":"Critical system with an end-of-life OS ➡️ Isolate it in a VLAN","correct_raw":"B. Placing the system in an isolated VLAN","explanation":"System jest krytyczny dla obsługi transakcji, dlatego jego natychmiastowe wycofanie może nie być możliwe. Umieszczenie go w odizolowanym VLAN-ie ogranicza dostęp, ruch boczny oraz zasięg ewentualnego przejęcia. Jest to kontrola kompensująca stosowana do czasu migracji lub wymiany systemu. HIDS zwiększa wykrywalność zagrożeń, ale nie ogranicza komunikacji tak skutecznie jak izolacja sieciowa.","options":[{"letter":"A","text":"Installing HIDS on the system"},{"letter":"B","text":"Placing the system in an isolated VLAN"},{"letter":"C","text":"Decommissioning the system"},{"letter":"D","text":"Encrypting the system's hard drive"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":198,"question":"The Chief Information Security Officer (CISO) at a large company would like to gain an understanding of how the company's security policies compare to the requirements imposed by external regulators. Which of the following should the CISO use?","keyword":"Compare internal security policies with regulatory requirements ➡️ Internal audit","correct_raw":"B. Internal audit","explanation":"Audyt wewnętrzny pozwala organizacji porównać obowiązujące polityki, procedury i mechanizmy kontroli z wymaganiami prawnymi oraz regulacyjnymi. Umożliwia wykrycie luk zgodności przed formalną kontrolą zewnętrzną. Attestation jest oświadczeniem lub poświadczeniem zgodności, a external examination to ocena wykonywana przez podmiot zewnętrzny, na przykład regulatora lub audytora.","options":[{"letter":"A","text":"Penetration test"},{"letter":"B","text":"Internal audit"},{"letter":"C","text":"Attestation"},{"letter":"D","text":"External examination"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":199,"question":"A systems administrator notices that the research and development department is not using the company VPN when accessing various company-related services and systems. Which of the following scenarios describes this activity?","keyword":"Department bypasses the approved company VPN ➡️ Shadow IT","correct_raw":"D. Shadow IT","explanation":"Shadow IT obejmuje korzystanie z niezatwierdzonych technologii, usług lub sposobów dostępu poza kontrolą działu IT. Pomijanie firmowego VPN podczas korzystania z zasobów organizacji oznacza obchodzenie zatwierdzonego mechanizmu bezpiecznego dostępu. Sama treść pytania nie wskazuje na kradzież danych, szpiegostwo ani działanie państwowego aktora.","options":[{"letter":"A","text":"Espionage"},{"letter":"B","text":"Data exfiltration"},{"letter":"C","text":"Nation-state attack"},{"letter":"D","text":"Shadow IT"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":200,"question":"The marketing department set up its own project management software without telling the appropriate departments. Which of the following describes this scenario?","keyword":"Department deploys unapproved software without informing IT ➡️ Shadow IT","correct_raw":"A. Shadow IT","explanation":"Shadow IT to sprzęt, oprogramowanie lub usługi wdrażane i używane bez wiedzy oraz zatwierdzenia właściwych działów, najczęściej IT i bezpieczeństwa. Samodzielne uruchomienie przez marketing narzędzia do zarządzania projektami dokładnie odpowiada tej definicji.","options":[{"letter":"A","text":"Shadow IT"},{"letter":"B","text":"Insider threat"},{"letter":"C","text":"Data exfiltration"},{"letter":"D","text":"Service disruption"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":201,"question":"Which of the following would best explain why a security analyst is running daily vulnerability scans on all corporate endpoints?","keyword":"Daily vulnerability scans on all endpoints ➡️ Track patch installation status","correct_raw":"A. To track the status of patching installations","explanation":"Codzienne skany podatności pozwalają sprawdzać, czy na stacjach roboczych i serwerach nadal występują podatności wynikające z brakujących aktualizacji. Porównując kolejne wyniki, analityk może monitorować postęp wdrażania poprawek i potwierdzać, że podatności zostały usunięte. Skany podatności nie służą przede wszystkim do wykrywania aktywnych napastników ani niezatwierdzonych usług chmurowych.","options":[{"letter":"A","text":"To track the status of patching installations"},{"letter":"B","text":"To find shadow IT cloud deployments"},{"letter":"C","text":"To continuously the monitor hardware inventory"},{"letter":"D","text":"To hunt for active attackers in the network"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":202,"question":"Which of the following is classified as high availability in a cloud environment?","keyword":"High availability in a cloud environment ➡️ Load balancer","correct_raw":"D. Load balancer","explanation":"Load balancer rozdziela żądania pomiędzy wiele instancji aplikacji lub serwerów. Jeżeli jeden węzeł przestanie odpowiadać, ruch może zostać skierowany do pozostałych sprawnych węzłów, co ogranicza przestoje i zwiększa dostępność usługi.","options":[{"letter":"A","text":"Access broker"},{"letter":"B","text":"Cloud HSM"},{"letter":"C","text":"WAF"},{"letter":"D","text":"Load balancer"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":203,"question":"Which of the following security measures is required when using a cloud-based platform for IoT management?","keyword":"Cloud-based IoT management ➡️ Encrypted connection","correct_raw":"A. Encrypted connection","explanation":"Urządzenia IoT i platforma zarządzająca komunikują się przez sieć, często przez internet. Połączenie powinno być szyfrowane, aby chronić przesyłane dane, polecenia administracyjne i poświadczenia przed podsłuchem oraz modyfikacją. Federacja tożsamości i SSO mogą ułatwiać zarządzanie dostępem, ale nie są podstawowym wymogiem dla każdej platformy IoT.","options":[{"letter":"A","text":"Encrypted connection"},{"letter":"B","text":"Federated identity"},{"letter":"C","text":"Firewall"},{"letter":"D","text":"Single sign-on"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":204,"question":"Which of the following threat vectors is most commonly utilized by insider threat actors attempting data exfiltration?","keyword":"Insider data exfiltration ➡️ Removable devices","correct_raw":"A. Unidentified removable devices","explanation":"Osoba mająca legalny dostęp do środowiska może skopiować dane na nieautoryzowany pendrive, dysk USB lub inny nośnik przenośny, a następnie fizycznie wynieść je poza organizację. Pozostałe odpowiedzi są typowymi technikami wykorzystywanymi głównie przez napastników zewnętrznych.","options":[{"letter":"A","text":"Unidentified removable devices"},{"letter":"B","text":"Default network device credentials"},{"letter":"C","text":"Spear phishing emails"},{"letter":"D","text":"Impersonation of business units through typosquatting"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":205,"question":"Which of the following methods to secure credit card data is best to use when a requirement is to see only the last four numbers on a credit card?","keyword":"Display only the last four credit card digits ➡️ Masking","correct_raw":"C. Masking","explanation":"Maskowanie danych ukrywa część wartości podczas jej wyświetlania, na przykład przedstawiając numer karty jako **** **** **** 1234. Oryginalna wartość może nadal istnieć w systemie, lecz użytkownik widzi wyłącznie dozwolony fragment. Hashowanie jest nieodwracalne, a szyfrowanie i tokenizacja służą innym celom ochronnym.","options":[{"letter":"A","text":"Encryption"},{"letter":"B","text":"Hashing"},{"letter":"C","text":"Masking"},{"letter":"D","text":"Tokenization"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":206,"question":"The Chief Information Security Officer (CISO) has determined the company is non-compliant with local data privacy regulations. The CISO needs to justify the budget request for more resources. Which of the following should the CISO present to the board as the direct consequence of non-compliance?","keyword":"Direct consequence of privacy-regulation non-compliance ➡️ Fines","correct_raw":"A. Fines","explanation":"Naruszenie lokalnych przepisów dotyczących prywatności może skutkować bezpośrednimi karami finansowymi nakładanymi przez organ regulacyjny. Utrata reputacji i konsekwencje kontraktowe są możliwymi skutkami pośrednimi, natomiast grzywny stanowią najbardziej bezpośredni i łatwy do przedstawienia zarządowi koszt niezgodności.","options":[{"letter":"A","text":"Fines"},{"letter":"B","text":"Reputational damage"},{"letter":"C","text":"Sanctions"},{"letter":"D","text":"Contractual implications"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":207,"question":"Which of the following alert types is the most likely to be ignored over time?","keyword":"Alerts ignored over time ➡️ False positives","correct_raw":"C. False positive","explanation":"Częste fałszywe alarmy informują o zagrożeniu, którego w rzeczywistości nie ma. Gdy pojawiają się zbyt często, prowadzą do zmęczenia alertami, przez co analitycy zaczynają je ignorować i mogą przeoczyć prawdziwy incydent. True negative i false negative zwykle nie generują widocznego alertu.","options":[{"letter":"A","text":"True positive"},{"letter":"B","text":"True negative"},{"letter":"C","text":"False positive"},{"letter":"D","text":"False negative"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":208,"question":"A security analyst is investigating an application server and discovers that software on the server is behaving abnormally. The software normally runs batch jobs locally and does not generate traffic, but the process is now generating outbound traffic over random high ports. Which of the following vulnerabilities has likely been exploited in this software?","keyword":"Legitimate process suddenly generates abnormal outbound traffic ➡️ Memory injection","correct_raw":"A. Memory injection","explanation":"Memory injection polega na umieszczeniu i uruchomieniu złośliwego kodu w pamięci legalnego procesu. Przejęty proces może wtedy wykonywać działania, których normalnie nie realizuje, na przykład nawiązywać połączenia wychodzące na losowych wysokich portach. Race condition dotyczy kolejności operacji, SQL injection zapytań do bazy, a side loading ładowania nieautoryzowanego komponentu lub biblioteki.","options":[{"letter":"A","text":"Memory injection"},{"letter":"B","text":"Race condition"},{"letter":"C","text":"Side loading"},{"letter":"D","text":"SQL injection"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":209,"question":"An important patch for a critical application has just been released, and a systems administrator is identifying all of the systems requiring the patch. Which of the following must be maintained in order to ensure that all systems requiring the patch are updated?","keyword":"Identify every system requiring a patch ➡️ Asset inventory","correct_raw":"A. Asset inventory","explanation":"Aktualna inwentaryzacja zasobów wskazuje, jakie urządzenia, systemy operacyjne, aplikacje i wersje oprogramowania są używane w organizacji. Dzięki temu administrator może ustalić pełną listę systemów objętych podatnością i sprawdzić, czy każdy z nich otrzymał poprawkę.","options":[{"letter":"A","text":"Asset inventory"},{"letter":"B","text":"Network enumeration"},{"letter":"C","text":"Data certification"},{"letter":"D","text":"Procurement process"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":210,"question":"Which of the following should a security operations center use to improve its incident response procedure?","keyword":"Improve SOC incident response procedure ➡️ Playbooks","correct_raw":"A. Playbooks","explanation":"Playbook zawiera uporządkowane, powtarzalne kroki postępowania dla konkretnego rodzaju incydentu, na przykład phishingu, ransomware lub przejęcia konta. Ujednolica działania analityków, ogranicza pomyłki i skraca czas reakcji. Framework wyznacza ogólne podejście, natomiast playbook przekłada je na praktyczną procedurę operacyjną.","options":[{"letter":"A","text":"Playbooks"},{"letter":"B","text":"Frameworks"},{"letter":"C","text":"Baselines"},{"letter":"D","text":"Benchmarks"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":211,"question":"Which of the following describes an executive team that is meeting in a board room and testing the company's incident response plan?","keyword":"Executive team reviews an incident response plan in a board room ➡️ Tabletop exercise","correct_raw":"C. Tabletop exercise","explanation":"Ćwiczenie typu tabletop polega na wspólnym omawianiu hipotetycznego incydentu i przechodzeniu przez plan reagowania bez wykonywania rzeczywistych działań w systemach produkcyjnych. Uczestnicy analizują role, decyzje, komunikację i kolejne kroki procedury. Spotkanie kierownictwa w sali konferencyjnej dokładnie odpowiada temu modelowi.","options":[{"letter":"A","text":"Continuity of operations"},{"letter":"B","text":"Capacity planning"},{"letter":"C","text":"Tabletop exercise"},{"letter":"D","text":"Parallel processing"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":212,"question":"A healthcare organization wants to provide a web application that allows individuals to digitally report health emergencies. Which of the following is the most important consideration during development?","keyword":"Application used to report health emergencies ➡️ Availability","correct_raw":"B. Availability","explanation":"Aplikacja służąca do zgłaszania zagrożeń zdrowotnych musi być dostępna wtedy, gdy użytkownik jej potrzebuje, ponieważ przerwa w działaniu może opóźnić udzielenie pomocy. Skalowalność wspiera obsługę wzrostu obciążenia, ale najważniejszym wymaganiem bezpieczeństwa i ciągłości działania w tym scenariuszu jest dostępność usługi.","options":[{"letter":"A","text":"Scalability"},{"letter":"B","text":"Availability"},{"letter":"C","text":"Cost"},{"letter":"D","text":"Ease of deployment"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":213,"question":"Which of the following agreement types defines the time frame in which a vendor needs to respond?","keyword":"Vendor response time ➡️ SLA","correct_raw":"B. SLA","explanation":"Service Level Agreement (SLA) określa mierzalne parametry świadczenia usługi, w tym gwarantowany czas reakcji dostawcy, dostępność oraz czas usunięcia problemu. SOW opisuje zakres prac i rezultaty projektu, natomiast MOU i MOA definiują ogólne zasady współpracy.","options":[{"letter":"A","text":"SOW"},{"letter":"B","text":"SLA"},{"letter":"C","text":"MOA"},{"letter":"D","text":"MOU"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":214,"question":"Which of the following is a feature of a next-generation SIEM system?","keyword":"Next-generation SIEM feature ➡️ Automated response actions","correct_raw":"B. Automated response actions","explanation":"Nowoczesne systemy SIEM nie tylko agregują i korelują zdarzenia, lecz także integrują funkcje automatyzacji i orkiestracji reakcji. Mogą automatycznie wykonać działanie po wykryciu określonego zagrożenia, na przykład zablokować adres IP, wyłączyć konto lub odizolować host. Sygnatury antywirusowe, wdrażanie agentów i skanowanie podatności należą do innych klas narzędzi.","options":[{"letter":"A","text":"Virus signatures"},{"letter":"B","text":"Automated response actions"},{"letter":"C","text":"Security agent deployment"},{"letter":"D","text":"Vulnerability scanning"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":215,"question":"To improve the security at a data center, a security administrator implements a CCTV system and posts several signs about the possibility of being filmed. Which of the following best describe these types of controls? (Choose two.)","keyword":"CCTV records activity / Signs discourage intruders ➡️ Detective and deterrent","correct_raw":"B. Deterrent | F. Detective","explanation":"System CCTV jest kontrolą detektywistyczną, ponieważ umożliwia obserwowanie, rejestrowanie i późniejsze wykrywanie nieautoryzowanych działań. Informacyjne tablice ostrzegające o monitoringu pełnią funkcję odstraszającą, ponieważ mają zniechęcić potencjalnego intruza do podjęcia próby naruszenia zabezpieczeń.","options":[{"letter":"A","text":"Preventive"},{"letter":"B","text":"Deterrent"},{"letter":"C","text":"Corrective"},{"letter":"D","text":"Directive"},{"letter":"E","text":"Compensating"},{"letter":"F","text":"Detective"}],"correctLetters":["B","F"],"isPBQ":false,"multiSelect":true},{"id":216,"question":"Which of the following examples would be best mitigated by input sanitization?","keyword":"Embedded JavaScript in user input ➡️ Input sanitization","correct_raw":"A. <script>alert(\"Warning!\");<\/script>","explanation":"Kod umieszczony między znacznikami <script> jest przykładem JavaScriptu, który może zostać wstrzyknięty do strony w ataku XSS. Sanityzacja danych wejściowych usuwa lub neutralizuje niedozwolone znaczniki i konstrukcje, dzięki czemu przeglądarka nie wykona ich jako kodu. Pozostałe odpowiedzi dotyczą skanowania sieci, phishingu oraz problemu z zaufaniem do certyfikatu.","options":[{"letter":"A","text":"<script>alert(\"Warning!\");<\/script>"},{"letter":"B","text":"nmap - 10.11.1.130"},{"letter":"C","text":"Email message: \"Click this link to get your free gift card.\""},{"letter":"D","text":"Browser message: \"Your connection is not private.\""}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":217,"question":"An attacker posing as the Chief Executive Officer calls an employee and instructs the employee to buy gift cards. Which of the following techniques is the attacker using?","keyword":"Attacker poses as the CEO ➡️ Impersonating","correct_raw":"C. Impersonating","explanation":"Atakujący podszywa się pod prezesa, aby wykorzystać jego autorytet i nakłonić pracownika do zakupu kart podarunkowych. Jest to impersonation, czyli podszywanie się pod inną osobę. Połączenie telefoniczne można szerzej zaklasyfikować jako vishing, ale takiej odpowiedzi nie ma. Whaling oznacza atak, którego celem jest osoba na stanowisku kierowniczym, a tutaj prezes jest jedynie przybraną tożsamością napastnika.","options":[{"letter":"A","text":"Smishing"},{"letter":"B","text":"Disinformation"},{"letter":"C","text":"Impersonating"},{"letter":"D","text":"Whaling"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":218,"question":"After conducting a vulnerability scan, a systems administrator notices that one of the identified vulnerabilities is not present on the systems that were scanned. Which of the following describes this example?","keyword":"Scanner reports a vulnerability that is not actually present ➡️ False positive","correct_raw":"A. False positive","explanation":"False positive występuje wtedy, gdy narzędzie zgłasza podatność lub zagrożenie, które w rzeczywistości nie istnieje. False negative oznaczałoby sytuację odwrotną: podatność jest obecna, lecz skaner jej nie wykrył.","options":[{"letter":"A","text":"False positive"},{"letter":"B","text":"False negative"},{"letter":"C","text":"True positive"},{"letter":"D","text":"True negative"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":219,"question":"A recent penetration test identified that an attacker could flood the MAC address table of network switches. Which of the following would best mitigate this type of attack?","keyword":"MAC address table flooding on switches ➡️ Port security","correct_raw":"B. Port security","explanation":"Port security na przełączniku ogranicza liczbę adresów MAC, które mogą zostać nauczone na pojedynczym porcie, oraz może przypisać do niego dozwolone adresy. Utrudnia to przepełnienie tablicy CAM/MAC fałszywymi wpisami. Po przekroczeniu limitu port może odrzucić ruch, zarejestrować naruszenie albo zostać automatycznie wyłączony.","options":[{"letter":"A","text":"Load balancer"},{"letter":"B","text":"Port security"},{"letter":"C","text":"IPS"},{"letter":"D","text":"NGFW"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":220,"question":"A user would like to install software and features that are not available with a smartphone's default software. Which of the following would allow the user to install unauthorized software and enable new features?","keyword":"Remove smartphone operating-system restrictions and enable unsupported features ➡️ Jailbreaking","correct_raw":"C. Jailbreaking","explanation":"Jailbreaking polega na obchodzeniu ograniczeń systemu operacyjnego smartfona i uzyskaniu podwyższonych uprawnień. Pozwala instalować nieautoryzowane oprogramowanie oraz aktywować funkcje niedostępne w standardowej konfiguracji. Sideloading oznacza instalowanie aplikacji spoza oficjalnego sklepu, ale samo w sobie nie musi usuwać zabezpieczeń systemowych ani odblokowywać nowych funkcji systemu.","options":[{"letter":"A","text":"SQLi"},{"letter":"B","text":"Cross-site scripting"},{"letter":"C","text":"Jailbreaking"},{"letter":"D","text":"Side loading"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":221,"question":"Which of the following phases of an incident response involves generating reports?","keyword":"Generating reports after an incident ➡️ Lessons learned","correct_raw":"C. Lessons learned","explanation":"W fazie lessons learned zespół podsumowuje przebieg incydentu, dokumentuje wykonane działania, ustala przyczynę źródłową i przygotowuje raport końcowy. Raport wskazuje również, co zadziałało prawidłowo oraz jakie procedury i zabezpieczenia należy poprawić przed kolejnym incydentem.","options":[{"letter":"A","text":"Recovery"},{"letter":"B","text":"Preparation"},{"letter":"C","text":"Lessons learned"},{"letter":"D","text":"Containment"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":222,"question":"Which of the following methods would most likely be used to identify legacy systems?","keyword":"Identify outdated operating systems and software versions ➡️ Vulnerability scan","correct_raw":"B. Vulnerability scan","explanation":"Skaner podatności identyfikuje system operacyjny, uruchomione usługi i wersje oprogramowania, a następnie porównuje je z bazą znanych podatności oraz informacjami o końcu wsparcia. Dzięki temu może wskazać starsze, niewspierane systemy legacy. Pozostałe metody nie służą do inwentaryzowania całego środowiska pod kątem przestarzałych platform.","options":[{"letter":"A","text":"Bug bounty program"},{"letter":"B","text":"Vulnerability scan"},{"letter":"C","text":"Package monitoring"},{"letter":"D","text":"Dynamic analysis"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":223,"question":"Employees located off-site must have access to company resources in order to complete their assigned tasks. These employees utilize a solution that allows remote access without interception concerns. Which of the following best describes this solution?","keyword":"Secure remote access without interception ➡️ VPN","correct_raw":"C. VPN","explanation":"VPN tworzy szyfrowany tunel pomiędzy zdalnym urządzeniem pracownika a siecią organizacji. Chroni przesyłane dane przed podsłuchem i modyfikacją podczas korzystania z niezaufanej sieci, na przykład domowego lub publicznego połączenia internetowego.","options":[{"letter":"A","text":"Proxy server"},{"letter":"B","text":"NGFW"},{"letter":"C","text":"VPN"},{"letter":"D","text":"Security zone"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":224,"question":"A company allows customers to upload PDF documents to its public e-commerce website. Which of the following would a security analyst most likely recommend?","keyword":"Public users upload PDF files ➡️ Scan uploaded files for malware","correct_raw":"B. Enabling malware detection through a UTM","explanation":"Pliki przesyłane przez użytkowników mogą zawierać złośliwy kod, exploity lub osadzone obiekty. UTM z funkcją wykrywania malware może analizować przesyłane dokumenty i blokować niebezpieczne pliki. IDS przede wszystkim alarmuje, load balancer nie kontroluje zawartości dokumentów, a ochrona przed command injection nie rozwiązuje głównego ryzyka związanego z uploadem plików PDF.","options":[{"letter":"A","text":"Utilizing attack signatures in an IDS"},{"letter":"B","text":"Enabling malware detection through a UTM"},{"letter":"C","text":"Limiting the affected servers with a load balancer"},{"letter":"D","text":"Blocking command injections via a WAF"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":225,"question":"A security analyst developed a script to automate a trivial and repeatable task. Which of the following best describes the benefits of ensuring other team members understand how the script works?","keyword":"Only one person understands an operational script ➡️ Single point of failure","correct_raw":"D. To prevent a single point of failure","explanation":"Jeżeli tylko autor rozumie działanie skryptu, jego nieobecność może uniemożliwić utrzymanie, naprawę lub modyfikację automatyzacji. Przekazanie wiedzy pozostałym członkom zespołu eliminuje zależność od jednej osoby i zapobiega organizacyjnemu pojedynczemu punktowi awarii.","options":[{"letter":"A","text":"To reduce implementation cost"},{"letter":"B","text":"To identify complexity"},{"letter":"C","text":"To remediate technical debt"},{"letter":"D","text":"To prevent a single point of failure"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":226,"question":"A company is decommissioning its physical servers and replacing them with an architecture that will reduce the number of individual operating systems. Which of the following strategies should the company use to achieve this security requirement?","keyword":"Reduce the number of individual operating systems ➡️ Containerization","correct_raw":"B. Containerization","explanation":"Kontenery współdzielą jądro systemu operacyjnego hosta, zamiast wymagać osobnego systemu operacyjnego dla każdego obciążenia. Pozwala to uruchamiać wiele odizolowanych aplikacji przy mniejszej liczbie systemów wymagających instalowania, utwardzania i aktualizowania. Wirtualizacja ogranicza liczbę serwerów fizycznych, ale każda maszyna wirtualna nadal zwykle posiada własny system operacyjny.","options":[{"letter":"A","text":"Microservices"},{"letter":"B","text":"Containerization"},{"letter":"C","text":"Virtualization"},{"letter":"D","text":"Infrastructure as code"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":227,"question":"An administrator needs to perform server hardening before deployment. Which of the following steps should the administrator take? (Choose two.)","keyword":"Server hardening ➡️ Disable default accounts and remove unnecessary services","correct_raw":"A. Disable default accounts. | C. Remove unnecessary services.","explanation":"Hardening polega na zmniejszeniu powierzchni ataku systemu. Wyłączenie niepotrzebnych kont domyślnych ogranicza możliwość wykorzystania znanych nazw kont i poświadczeń, a usunięcie zbędnych usług eliminuje niepotrzebne porty, procesy oraz potencjalne podatności. Inwentaryzacja, centralne logowanie i dołączenie do domeny są wartościowymi działaniami administracyjnymi, lecz nie są dwoma najbardziej bezpośrednimi krokami utwardzania z podanych odpowiedzi.","options":[{"letter":"A","text":"Disable default accounts."},{"letter":"B","text":"Add the server to the asset inventory."},{"letter":"C","text":"Remove unnecessary services."},{"letter":"D","text":"Document default passwords."},{"letter":"E","text":"Send server logs to the SIEM."},{"letter":"F","text":"Join the server to the corporate domain."}],"correctLetters":["A","C"],"isPBQ":false,"multiSelect":true},{"id":228,"question":"A Chief Information Security Officer would like to conduct frequent, detailed reviews of systems and procedures to track compliance objectives. Which of the following will be the best method to achieve this objective?","keyword":"Frequent detailed reviews of systems and procedures for compliance ➡️ Internal auditing","correct_raw":"C. Internal auditing","explanation":"Audyt wewnętrzny umożliwia regularne i szczegółowe sprawdzanie systemów, polityk, procedur oraz dowodów działania mechanizmów kontrolnych względem celów zgodności. Test penetracyjny i skan podatności skupiają się głównie na podatnościach technicznych, a zewnętrzna atestacja jest wykonywana przez niezależny podmiot i zwykle nie stanowi częstego procesu operacyjnego.","options":[{"letter":"A","text":"Third-party attestation"},{"letter":"B","text":"Penetration testing"},{"letter":"C","text":"Internal auditing"},{"letter":"D","text":"Vulnerability scans"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":229,"question":"Which of the following security concepts is accomplished with the installation of a RADIUS server?","keyword":"RADIUS centralizes authentication, authorization, and accounting ➡️ AAA","correct_raw":"B. AAA","explanation":"RADIUS zapewnia scentralizowane uwierzytelnianie użytkowników, autoryzację ich dostępu oraz rozliczalność poprzez rejestrowanie sesji i zdarzeń. Te trzy funkcje tworzą model AAA: Authentication, Authorization and Accounting.","options":[{"letter":"A","text":"CIA"},{"letter":"B","text":"AAA"},{"letter":"C","text":"ACL"},{"letter":"D","text":"PEM"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":230,"question":"After creating a contract for IT contractors, the human resources department changed several clauses. The contract has gone through three revisions. Which of the following processes should the human resources department follow to track revisions?","keyword":"Track multiple document revisions ➡️ Version control","correct_raw":"D. Version control","explanation":"Kontrola wersji zapisuje historię kolejnych rewizji dokumentu, wskazuje wprowadzone zmiany i pozwala ustalić, która wersja jest aktualna. Umożliwia także porównywanie wersji oraz, w razie potrzeby, powrót do wcześniejszego wariantu umowy.","options":[{"letter":"A","text":"Version validation"},{"letter":"B","text":"Version changes"},{"letter":"C","text":"Version updates"},{"letter":"D","text":"Version control"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":231,"question":"The executive management team is mandating the company develop a disaster recovery plan. The cost must be kept to a minimum, and the money to fund additional internet connections is not available. Which of the following would be the best option?","keyword":"Minimum cost / No funding for additional internet connections ➡️ Cold site","correct_raw":"B. Cold site","explanation":"Cold site jest najtańszym wariantem lokalizacji zapasowej. Zapewnia podstawowe pomieszczenie, zasilanie i warunki do odtworzenia infrastruktury, ale nie wymaga utrzymywania działających systemów ani stałych dodatkowych łączy internetowych. W zamian organizacja musi zaakceptować dłuższy czas uruchomienia niż w przypadku warm lub hot site.","options":[{"letter":"A","text":"Hot site"},{"letter":"B","text":"Cold site"},{"letter":"C","text":"Failover site"},{"letter":"D","text":"Warm site"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":232,"question":"An administrator at a small business notices an increase in support calls from employees who receive a blocked page message after trying to navigate to a spoofed website. Which of the following should the administrator do?","keyword":"Employees repeatedly attempt to open spoofed websites ➡️ Security awareness training","correct_raw":"C. Implement security awareness training.","explanation":"Filtr internetowy działa prawidłowo, ponieważ blokuje dostęp do podszywających się witryn. Problemem jest to, że pracownicy nie rozpoznają podejrzanych adresów i próbują je otwierać. Szkolenie security awareness powinno nauczyć ich weryfikowania domen, odsyłaczy i innych oznak phishingu. Obniżenie poziomu filtrowania zwiększyłoby ryzyko, a MFA ogranicza skutki przejęcia hasła, lecz nie rozwiązuje źródła problemu.","options":[{"letter":"A","text":"Deploy multifactor authentication."},{"letter":"B","text":"Decrease the level of the web filter settings."},{"letter":"C","text":"Implement security awareness training."},{"letter":"D","text":"Update the acceptable use policy."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":233,"question":"Which of the following teams is best suited to determine whether a company has systems that can be exploited by a potential, identified vulnerability?","keyword":"Determine whether an identified vulnerability can actually be exploited ➡️ Red team","correct_raw":"C. Red team","explanation":"Red team prowadzi działania ofensywne i próbuje praktycznie wykorzystać podatności w sposób zbliżony do realnego napastnika. Dzięki temu może potwierdzić, czy wykryta luka jest rzeczywiście możliwa do eksploatacji w środowisku organizacji. Blue team koncentruje się na obronie, a purple team wspiera współpracę zespołów ofensywnych i defensywnych.","options":[{"letter":"A","text":"Purple team"},{"letter":"B","text":"Blue team"},{"letter":"C","text":"Red team"},{"letter":"D","text":"White team"}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":234,"question":"A company is reviewing options to enforce user logins after several account takeovers. The following conditions must be met as part of the solution: Allow employees to work remotely or from assigned offices around the world. Provide a seamless login experience. Limit the amount of equipment required. Which of the following best meets these conditions?","keyword":"Location-independent and seamless authentication with minimal extra equipment ➡️ Trusted devices","correct_raw":"A. Trusted devices","explanation":"Mechanizm trusted devices pozwala uzależnić dostęp od wcześniej zarejestrowanego i zweryfikowanego urządzenia. Może działać niezależnie od lokalizacji użytkownika, nie wymaga noszenia dodatkowego sprzętu i zwykle zapewnia płynne logowanie. Smart cards wymagałyby dodatkowych kart oraz czytników, geotagging ograniczałby dostęp według lokalizacji, a logowanie zależne od czasu utrudniałoby pracę osobom w różnych strefach czasowych.","options":[{"letter":"A","text":"Trusted devices"},{"letter":"B","text":"Geotagging"},{"letter":"C","text":"Smart cards"},{"letter":"D","text":"Time-based logins"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":235,"question":"Which of the following methods can be used to detect attackers who have successfully infiltrated a network? (Choose two.)","keyword":"Detect compromised hosts and intruders already inside the network ➡️ Honeypots and DNS sinkhole","correct_raw":"C. Honeypots | E. DNS sinkhole","explanation":"Honeypot jest kontrolowanym systemem-pułapką, którego legalni użytkownicy nie powinni odwiedzać, dlatego każda interakcja może wskazywać obecność napastnika. DNS sinkhole przechwytuje zapytania do znanych złośliwych domen i kieruje je do kontrolowanego adresu, co pozwala identyfikować zainfekowane hosty próbujące komunikować się z infrastrukturą command-and-control.","options":[{"letter":"A","text":"Tokenization"},{"letter":"B","text":"CI/CD"},{"letter":"C","text":"Honeypots"},{"letter":"D","text":"Threat modeling"},{"letter":"E","text":"DNS sinkhole"},{"letter":"F","text":"Data obfuscation"}],"correctLetters":["C","E"],"isPBQ":false,"multiSelect":true},{"id":236,"question":"A company wants to ensure that the software it develops will not be tampered with after the final version is completed. Which of the following should the company most likely use?","keyword":"Detect tampering after the final software version is completed ➡️ Hashing","correct_raw":"A. Hashing","explanation":"Po ukończeniu oprogramowania firma może obliczyć jego kryptograficzny hash i przechowywać go jako wartość referencyjną. Każda późniejsza zmiana pliku spowoduje powstanie innego skrótu, co pozwoli wykryć naruszenie integralności. Szyfrowanie chroni poufność, a tokenizacja zastępuje wrażliwe wartości tokenami.","options":[{"letter":"A","text":"Hashing"},{"letter":"B","text":"Encryption"},{"letter":"C","text":"Baselines"},{"letter":"D","text":"Tokenization"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":237,"question":"An organization completed a project to deploy SSO across all business applications last year. Recently, the finance department selected a new cloud-based accounting software vendor. Which of the following should most likely be configured during the new software deployment?","keyword":"Enterprise SSO integration with a cloud-based application ➡️ SAML","correct_raw":"B. SAML","explanation":"SAML jest powszechnie używany do federacyjnego logowania SSO pomiędzy firmowym dostawcą tożsamości a zewnętrznymi aplikacjami SaaS. Umożliwia przekazywanie podpisanych asercji uwierzytelniających bez tworzenia osobnego hasła w każdej aplikacji. RADIUS i EAP dotyczą głównie dostępu sieciowego, a OpenID jest częściej stosowany w scenariuszach uwierzytelniania konsumenckiego.","options":[{"letter":"A","text":"RADIUS"},{"letter":"B","text":"SAML"},{"letter":"C","text":"EAP"},{"letter":"D","text":"OpenID"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":238,"question":"A user, who is waiting for a flight at an airport, logs in to the airline website using the public Wi-Fi, ignores a security warning and purchases an upgraded seat. When the flight lands, the user finds unauthorized credit card charges. Which of the following attacks most likely occurred?","keyword":"Public Wi-Fi / Ignored certificate warning / Payment data stolen ➡️ On-path attack","correct_raw":"D. On-path attack","explanation":"Napastnik znajdujący się pomiędzy użytkownikiem a witryną mógł przechwycić lub zmodyfikować komunikację. Ostrzeżenie bezpieczeństwa najprawdopodobniej informowało o nieprawidłowym certyfikacie lub niezaufanym połączeniu. Zignorowanie go umożliwiło atakującemu podsłuchanie danych płatniczych w ataku on-path, dawniej określanym jako man-in-the-middle.","options":[{"letter":"A","text":"Replay attack"},{"letter":"B","text":"Memory leak"},{"letter":"C","text":"Buffer overflow attack"},{"letter":"D","text":"On-path attack"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":239,"question":"A network engineer deployed a redundant switch stack to increase system availability. However, the budget can only cover the cost of one ISP connection. Which of the following best describes the potential risk factor?","keyword":"Only one ISP connection despite internal redundancy ➡️ Single point of failure","correct_raw":"D. There is a single point of failure.","explanation":"Stos przełączników zapewnia redundancję wewnątrz sieci, ale pojedyncze łącze do jednego dostawcy pozostaje jedyną drogą dostępu do internetu. Awaria tego łącza lub infrastruktury dostawcy odetnie całą organizację, dlatego połączenie ISP stanowi single point of failure.","options":[{"letter":"A","text":"The equipment MTBF is unknown."},{"letter":"B","text":"The ISP has no SLA."},{"letter":"C","text":"An RPO has not been determined."},{"letter":"D","text":"There is a single point of failure."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":240,"question":"A network team segmented a critical, end-of-life server to a VLAN that can only be reached by specific devices but cannot be reached by the perimeter network. Which of the following best describe the controls the team implemented? (Choose two.)","keyword":"Network segmentation protecting an unpatchable legacy server ➡️ Compensating and technical controls","correct_raw":"E. Compensating | F. Technical","explanation":"Segmentacja VLAN i reguły ograniczające komunikację są wdrażane za pomocą technologii sieciowych, dlatego stanowią kontrolę techniczną. Ponieważ serwer osiągnął koniec życia i prawdopodobnie nie może zostać właściwie zaktualizowany, izolacja zastępuje brakujące zabezpieczenia i pełni funkcję kontroli kompensującej.","options":[{"letter":"A","text":"Managerial"},{"letter":"B","text":"Physical"},{"letter":"C","text":"Corrective"},{"letter":"D","text":"Detective"},{"letter":"E","text":"Compensating"},{"letter":"F","text":"Technical"},{"letter":"G","text":"Deterrent"}],"correctLetters":["E","F"],"isPBQ":false,"multiSelect":true},{"id":241,"question":"A threat actor was able to use a username and password to log in to a stolen company mobile device. Which of the following provides the best solution to increase mobile data security on all employees' company mobile devices?","keyword":"Stolen company mobile devices / Protect data at rest across the entire fleet ➡️ Full disk encryption","correct_raw":"B. Full disk encryption","explanation":"Szyfrowanie całego dysku chroni dane zapisane na urządzeniu, gdy telefon lub tablet zostanie zgubiony albo skradziony. Jest to kontrola wdrażana jednolicie na wszystkich urządzeniach i nie zależy od tego, czy urządzenie pozostaje połączone z siecią. Remote wipe jest działaniem reaktywnym i wymaga możliwości skomunikowania się z urządzeniem. Uwaga praktyczna: jeśli napastnik rzeczywiście zna prawidłowe dane odblokowujące urządzenie, samo FDE nie wystarczy; potrzebne byłyby także silniejsze uwierzytelnianie i zarządzanie urządzeniami.","options":[{"letter":"A","text":"Application management"},{"letter":"B","text":"Full disk encryption"},{"letter":"C","text":"Remote wipe"},{"letter":"D","text":"Containerization"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":242,"question":"Which of the following best describes the risk present after controls and mitigating factors have been applied?","keyword":"Risk remaining after controls and mitigation ➡️ Residual risk","correct_raw":"A. Residual","explanation":"Ryzyko rezydualne, czyli residual risk, to część ryzyka, która pozostaje po wdrożeniu zabezpieczeń i działań mitygujących. Ryzyko inherent oznacza ryzyko pierwotne, oceniane przed zastosowaniem jakichkolwiek kontroli.","options":[{"letter":"A","text":"Residual"},{"letter":"B","text":"Avoided"},{"letter":"C","text":"Inherent"},{"letter":"D","text":"Operational"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":243,"question":"A software development team asked a security administrator to recommend techniques that should be used to reduce the chances of the software being reverse engineered. Which of the following should the security administrator recommend?","keyword":"Make software harder to understand and reverse engineer ➡️ Code obfuscation","correct_raw":"B. Performing code obfuscation","explanation":"Obfuskacja kodu celowo utrudnia jego analizę bez zmiany funkcjonalności programu. Może obejmować zmianę nazw elementów, komplikowanie przepływu sterowania i przekształcanie struktury kodu. Podpis cyfrowy potwierdza pochodzenie i integralność programu, ale nie utrudnia odczytania jego logiki.","options":[{"letter":"A","text":"Digitally signing the software"},{"letter":"B","text":"Performing code obfuscation"},{"letter":"C","text":"Limiting the use of third-party libraries"},{"letter":"D","text":"Using compile flags"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":244,"question":"Which of the following is a possible factor for MFA?","keyword":"Recognized possession factor for MFA ➡️ Something you have","correct_raw":"B. Something you have","explanation":"„Something you have” jest czynnikiem posiadania, takim jak token sprzętowy, karta inteligentna lub telefon generujący kody jednorazowe. Klasyczny podział MFA obejmuje coś, co użytkownik wie, posiada i czym jest. Lokalizacja może być używana jako sygnał kontekstowy w uwierzytelnianiu adaptacyjnym, ale w tym pytaniu najbardziej jednoznacznym czynnikiem MFA jest odpowiedź B.","options":[{"letter":"A","text":"Something you exhibit"},{"letter":"B","text":"Something you have"},{"letter":"C","text":"Somewhere you are"},{"letter":"D","text":"Someone you know"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":245,"question":"Easy-to-guess passwords led to an account compromise. The current password policy requires at least 12 alphanumeric characters, one uppercase character, one lowercase character, a password history of two passwords, a minimum password age of one day, and a maximum password age of 90 days. Which of the following would reduce the risk of this incident from happening again? (Choose two.)","keyword":"Easy-to-guess passwords / Strengthen password policy ➡️ Increase length and require a special character","correct_raw":"A. Increasing the minimum password length to 14 characters. | F. Including a requirement for at least one special character.","explanation":"Zwiększenie minimalnej długości hasła powiększa liczbę możliwych kombinacji, a wymaganie znaku specjalnego zwiększa różnorodność dozwolonych znaków. Zmiana algorytmu przechowywania skrótów chroni bazę haseł po jej wycieku, ale nie sprawia, że użytkownicy wybierają trudniejsze do odgadnięcia hasła. Pozostałe zmiany osłabiają politykę albo wydłużają czas używania tego samego hasła.","options":[{"letter":"A","text":"Increasing the minimum password length to 14 characters."},{"letter":"B","text":"Upgrading the password hashing algorithm from MD5 to SHA-512."},{"letter":"C","text":"Increasing the maximum password age to 120 days."},{"letter":"D","text":"Reducing the minimum password length to ten characters."},{"letter":"E","text":"Reducing the minimum password age to zero days."},{"letter":"F","text":"Including a requirement for at least one special character."}],"correctLetters":["A","F"],"isPBQ":false,"multiSelect":true},{"id":246,"question":"A user downloaded software from an online forum. After the user installed the software, the security team observed external network traffic connecting to the user's computer on an uncommon port. Which of the following is the most likely explanation of this unauthorized connection?","keyword":"Installed untrusted software / External inbound connection on an uncommon port ➡️ Backdoor","correct_raw":"D. The software contained a backdoor.","explanation":"Backdoor tworzy ukryty mechanizm dostępu, który omija normalne uwierzytelnianie i może nasłuchiwać na nietypowym porcie. Pozwala to zewnętrznemu napastnikowi ponownie połączyć się z komputerem po instalacji zainfekowanego programu. Keylogger przechwytuje dane wejściowe, a ransomware koncentruje się na szyfrowaniu plików.","options":[{"letter":"A","text":"The software had a hidden keylogger."},{"letter":"B","text":"The software was ransomware."},{"letter":"C","text":"The user's computer had a fileless virus."},{"letter":"D","text":"The software contained a backdoor."}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":247,"question":"A utility company is designing a new platform that will host all the virtual machines used by business applications. The requirements include: A starting baseline of 50% memory utilization; Storage scalability; Single circuit failure resilience. Which of the following best meets all of these requirements?","keyword":"Scalable compute and storage / Resilience to a power-circuit failure ➡️ IaaS provider","correct_raw":"B. Transitioning the platform to an IaaS provider","explanation":"IaaS umożliwia elastyczne dobieranie pamięci i mocy obliczeniowej, skalowanie przestrzeni dyskowej oraz korzystanie z redundantnej infrastruktury centrum danych. Pozostałe odpowiedzi rozwiązują tylko pojedyncze wymagania: podwójne PDU zwiększa odporność zasilania, load balancing dotyczy ścieżek sieciowych, a NAS przede wszystkim pojemności dyskowej.","options":[{"letter":"A","text":"Connecting dual PDUs to redundant power supplies"},{"letter":"B","text":"Transitioning the platform to an IaaS provider"},{"letter":"C","text":"Configuring network load balancing for multiple paths"},{"letter":"D","text":"Deploying multiple large NAS devices for each host"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":248,"question":"Which of the following best describes a use case for a DNS sinkhole?","keyword":"Redirect requests for known-malicious domains to a controlled destination ➡️ Capture malicious-domain traffic","correct_raw":"C. A DNS sinkhole can be used to capture traffic to known-malicious domains used by attackers.","explanation":"DNS sinkhole przechwytuje zapytania do znanych złośliwych domen i zwraca kontrolowany adres IP zamiast prawdziwego adresu infrastruktury napastnika. Pozwala to blokować komunikację z serwerami command-and-control oraz identyfikować zainfekowane hosty, które próbują się z nimi kontaktować.","options":[{"letter":"A","text":"Attackers can see a DNS sinkhole as a highly valuable resource to identify a company's domain structure."},{"letter":"B","text":"A DNS sinkhole can be used to draw employees away from known-good websites to malicious ones owned by the attacker."},{"letter":"C","text":"A DNS sinkhole can be used to capture traffic to known-malicious domains used by attackers."},{"letter":"D","text":"A DNS sinkhole can be set up to attract potential attackers away from a company's network resources."}],"correctLetters":["C"],"isPBQ":false,"multiSelect":false},{"id":249,"question":"An incident analyst finds several image files on a hard disk. The image files may contain geolocation coordinates. Which of the following best describes the type of information the analyst is trying to extract from the image files?","keyword":"Geolocation coordinates embedded in image files ➡️ Metadata","correct_raw":"B. Metadata","explanation":"Metadane to informacje opisujące plik, które nie stanowią jego głównej widocznej treści. Zdjęcia mogą zawierać dane EXIF, takie jak współrzędne GPS, data i czas wykonania, model urządzenia oraz parametry aparatu.","options":[{"letter":"A","text":"Log data"},{"letter":"B","text":"Metadata"},{"letter":"C","text":"Encrypted data"},{"letter":"D","text":"Sensitive data"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":250,"question":"Which of the following most likely describes why a security engineer would configure all outbound emails to use S/MIME digital signatures?","keyword":"Digitally sign outbound email with S/MIME ➡️ Non-repudiation","correct_raw":"D. To ensure non-repudiation","explanation":"Podpis cyfrowy S/MIME wiąże wiadomość z certyfikatem nadawcy i pozwala odbiorcy zweryfikować jej pochodzenie oraz integralność. Dzięki temu nadawcy znacznie trudniej wiarygodnie zaprzeczyć, że podpisał i wysłał daną wiadomość, co zapewnia niezaprzeczalność.","options":[{"letter":"A","text":"To meet compliance standards"},{"letter":"B","text":"To increase delivery rates"},{"letter":"C","text":"To block phishing attacks"},{"letter":"D","text":"To ensure non-repudiation"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":251,"question":"During a recent company safety stand-down, the cyber-awareness team gave a presentation on the importance of cyber hygiene. One topic the team covered was best practices for printing centers. Which of the following describes an attack method that relates to printing centers?","keyword":"Printing centers / Improper disposal of printed documents ➡️ Dumpster diving","correct_raw":"D. Dumpster diving","explanation":"W centrach druku mogą pozostawać nieodebrane wydruki, kopie robocze i dokumenty wyrzucone do zwykłych koszy. Dumpster diving polega na przeszukiwaniu odpadów w celu zdobycia poufnych informacji. Ochrona obejmuje między innymi bezpieczne niszczenie dokumentów i stosowanie wydruku zabezpieczonego kodem lub kartą.","options":[{"letter":"A","text":"Whaling"},{"letter":"B","text":"Credential harvesting"},{"letter":"C","text":"Prepending"},{"letter":"D","text":"Dumpster diving"}],"correctLetters":["D"],"isPBQ":false,"multiSelect":false},{"id":252,"question":"Which of the following considerations is the most important regarding cryptography used in an IoT device?","keyword":"Cryptography on an IoT device ➡️ Resource constraints","correct_raw":"A. Resource constraints","explanation":"Urządzenia IoT często mają ograniczoną moc procesora, pamięć, pojemność baterii i przestrzeń na oprogramowanie. Algorytmy oraz długości kluczy muszą więc zapewniać odpowiedni poziom bezpieczeństwa bez przeciążania urządzenia. Pozostałe kwestie mogą mieć znaczenie, ale ograniczenia zasobów są najbardziej charakterystycznym i podstawowym problemem kryptografii w IoT.","options":[{"letter":"A","text":"Resource constraints"},{"letter":"B","text":"Available bandwidth"},{"letter":"C","text":"The use of block ciphers"},{"letter":"D","text":"The compatibility of the TLS version"}],"correctLetters":["A"],"isPBQ":false,"multiSelect":false},{"id":253,"question":"A coffee shop owner wants to restrict internet access to only paying customers by prompting them for a receipt number. Which of the following is the best method to use given this requirement?","keyword":"Prompt customers for a receipt number before internet access ➡️ Captive portal","correct_raw":"B. Captive portal","explanation":"Captive portal przekierowuje użytkownika po połączeniu z Wi-Fi do strony logowania lub akceptacji warunków. Właściciel może wymagać na niej podania numeru paragonu i dopiero po jego weryfikacji odblokować internet. WPA3 i PSK zabezpieczają samą sieć bezprzewodową, a 802.1X zwykle wymaga indywidualnych poświadczeń i infrastruktury uwierzytelniającej.","options":[{"letter":"A","text":"WPA3"},{"letter":"B","text":"Captive portal"},{"letter":"C","text":"PSK"},{"letter":"D","text":"IEEE 802.1X"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":254,"question":"While performing digital forensics, which of the following is considered the most volatile and should have the contents collected first?","keyword":"Most volatile forensic evidence ➡️ RAM","correct_raw":"B. RAM","explanation":"Pamięć RAM traci swoją zawartość po wyłączeniu lub restarcie urządzenia. Może zawierać aktywne procesy, połączenia sieciowe, klucze szyfrujące i fragmenty danych, dlatego należy zebrać ją przed analizą trwałych nośników. Dyski HDD i SSD zachowują dane po odłączeniu zasilania.","options":[{"letter":"A","text":"Hard drive"},{"letter":"B","text":"RAM"},{"letter":"C","text":"SSD"},{"letter":"D","text":"Temporary files"}],"correctLetters":["B"],"isPBQ":false,"multiSelect":false},{"id":255,"question":"A hosting provider needs to prove that its security controls have been in place over the last six months and have sufficiently protected customer data. Which of the following would provide the best proof that the hosting provider has met the requirements?","keyw
